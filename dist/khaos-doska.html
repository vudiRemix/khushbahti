'use strict';
/* Враги, белые фигуры-защитники, Пак-Ман, предметы, аирдропы и снаряды. */

const ENEMY_DEF = {
  pawn: { hp: 3, dmg: 2, bounty: 50, xp: 3, hw: 24, top: 36, bot: 34, name: 'Чёрная пешка', piece: 'p' },
  knight: { hp: 5, dmg: 3, bounty: 120, xp: 5, hw: 26, top: 38, bot: 34, name: 'Чёрный конь', piece: 'n' },
  rook: { hp: 9, dmg: 4, bounty: 200, xp: 8, hw: 26, top: 36, bot: 34, name: 'Чёрная ладья', piece: 'r' },
  bishop: { hp: 6, dmg: 3, bounty: 150, xp: 6, hw: 24, top: 40, bot: 34, name: 'Чёрный слон', piece: 'b' },
  zombie: { hp: 5, dmg: 4, bounty: 100, xp: 4, hw: 24, top: 42, bot: 36, name: 'Зомби' },
  cone: { hp: 10, dmg: 4, bounty: 150, xp: 6, hw: 24, top: 64, bot: 36, name: 'Зомби с конусом' },
  freddy: { hp: 6, dmg: 6, bounty: 500, xp: 15, hw: 26, top: 56, bot: 36, name: 'Золотой Фредди' },
  snake: { hp: 15, dmg: 4, bounty: 300, xp: 12, hw: 30, top: 30, bot: 30, name: 'Змейка' },
};

const FX = {
  burst(g, x, y, n, o = {}) {
    for (let i = 0; i < n; i++) {
      const a = o.angle !== undefined ? o.angle + rand(-o.spread, o.spread) : rand(0, TAU);
      const sp = rand((o.speed || 200) * 0.3, o.speed || 200);
      const life = rand((o.life || 0.6) * 0.6, o.life || 0.6);
      g.particles.push({
        x: x + rand(-(o.jitter || 0), o.jitter || 0),
        y: y + rand(-(o.jitter || 0), o.jitter || 0),
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - (o.up || 0),
        grav: o.grav !== undefined ? o.grav : 500,
        life,
        max: life,
        size: rand((o.size || 5) * 0.6, o.size || 5),
        color: Array.isArray(o.colors) ? choice(o.colors) : o.colors || '#fff',
        shape: o.shape || 'sq',
        rot: rand(0, TAU),
        vr: rand(-10, 10),
        drag: o.drag || 0,
      });
    }
    if (g.particles.length > 700) g.particles.splice(0, g.particles.length - 700);
  },
  text(g, x, y, str, o = {}) {
    g.texts.push({
      x, y, str,
      color: o.color || '#fff',
      font: o.font || `bold 18px ${FONT.ui}`,
      life: o.life || 1.1,
      max: o.life || 1.1,
      vy: o.vy !== undefined ? o.vy : -50,
      stroke: o.stroke || '#000',
    });
  },
};

class Enemy {
  constructor(type, x, y) {
    const d = ENEMY_DEF[type];
    this.type = type;
    this.def = d;
    this.x = x;
    this.y = y;
    this.gy = y;
    this.hp = d.hp;
    this.maxHp = d.hp;
    this.flash = 0;
    this.frozen = 0;
    this.dazed = 0; // оглушён (крик футболиста): стоит, над головой кружатся звёзды
    this.age = 0;
    this.dead = false;
    this.remove = false;
    this.deathT = 0;
    this.air = false;
    this.spawnFx = 0.35;
  }
  get alive() {
    return !this.dead && !this.remove;
  }
  get col() {
    return clamp(Math.floor(this.x / T), 0, COLS - 1);
  }
  hit(px, py) {
    const d = this.def;
    return px >= this.x - d.hw && px <= this.x + d.hw && py >= this.y - d.top && py <= this.y + d.bot;
  }
  distTo(px, py) {
    return Math.hypot(px - this.x, py - this.y);
  }
  damage(n, g, src) {
    if (!this.alive) return false;
    this.hp -= n;
    this.flash = 0.09;
    if (this.hp <= 0) {
      this.dead = true;
      this.deathT = 0;
      g.onKill(this, src);
    }
    return true;
  }
  // Общая часть обновления. true — движение в этом кадре пропускается.
  baseUpdate(dt) {
    this.age += dt;
    if (this.spawnFx > 0) this.spawnFx -= dt;
    if (this.flash > 0) this.flash -= dt;
    if (this.dead) {
      this.deathT += dt;
      if (this.deathT > 0.6) this.remove = true;
      return true;
    }
    if (this.frozen > 0) {
      this.frozen -= dt;
      return true;
    }
    if (this.dazed > 0) {
      this.dazed -= dt;
      return true;
    }
    return false;
  }
  beginDraw(ctx) {
    ctx.save();
    if (this.dead) ctx.globalAlpha = Math.max(0, 1 - this.deathT / 0.6);
    if (this.flash > 0) ctx.filter = 'brightness(2.6)';
    if (this.spawnFx > 0) {
      const k = 1 - this.spawnFx / 0.35;
      ctx.globalAlpha *= k;
    }
  }
  endDraw(ctx) {
    ctx.restore();
    if (this.dazed > 0 && !this.dead) {
      const d = this.def, a = this.age * 6;
      for (let i = 0; i < 3; i++) {
        const k = a + (i * TAU) / 3;
        drawStar(ctx, this.x + Math.cos(k) * (d.hw * 0.8), this.y - d.top - 8 + Math.sin(k) * 5, 6, '#ffd54a', '#7a5b00');
      }
    }
    if (this.frozen > 0 && !this.dead) {
      const d = this.def;
      rr(ctx, this.x - d.hw - 4, this.y - d.top - 4, d.hw * 2 + 8, d.top + d.bot + 8, 8);
      ctx.fillStyle = 'rgba(170,225,255,0.45)';
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = 'rgba(255,255,255,0.85)';
      ctx.stroke();
    }
    if (this.alive && this.hp < this.maxHp) {
      const w = 40, x = this.x - w / 2, y = this.y - this.def.top - 12;
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(x - 1, y - 1, w + 2, 6);
      ctx.fillStyle = '#e53935';
      ctx.fillRect(x, y, w * Math.max(0, this.hp / this.maxHp), 4);
    }
  }
}

// Шахматные фигуры ходят по правилам (почти).
class ChessEnemy extends Enemy {
  constructor(type, c, r) {
    super(type, colX(c), rowY(r));
    this.c = c;
    this.r = r;
    this.wait = this.interval() * rand(0.5, 0.9);
    this.mv = null;
    this.dx = Math.random() < 0.5 ? -1 : 1;
  }
  interval() {
    return { pawn: 2.4, knight: 2.6, rook: 3.0, bishop: 2.3 }[this.type];
  }
  update(dt, g) {
    if (this.baseUpdate(dt)) return;
    if (this.mv) {
      const m = this.mv;
      m.t += dt / m.dur;
      const k = Math.min(1, m.t);
      const e = easeInOut(k);
      this.x = lerp(m.fx, m.tx, e);
      this.gy = lerp(m.fy, m.ty, e);
      this.y = this.gy - Math.sin(k * Math.PI) * m.arc;
      this.air = m.arc > 0 && k < 0.9;
      if (k >= 1) {
        this.mv = null;
        this.air = false;
        this.c = m.c;
        this.r = m.r;
        this.land(g, m);
      }
      return;
    }
    this.wait -= dt;
    if (this.wait <= 0) {
      this.wait = this.interval() * rand(0.85, 1.15);
      this.plan(g);
    }
  }
  moveTo(c, r, capture, arc, dur) {
    this.mv = { fx: this.x, fy: this.gy, tx: colX(c), ty: rowY(r), c, r, capture, arc, dur, t: 0 };
  }
  land(g, m) {
    Sound.tok();
    if (m.capture && g.def[m.c]) {
      g.killDefender(m.c, this);
      FX.text(g, this.x, this.y - 40, 'ВЗЯТИЕ!', { color: '#ffd54a' });
    }
    if (this.r >= ROWS - 1) {
      if (this.type === 'pawn') FX.text(g, this.x, this.y - 50, 'ПРЕВРАЩЕНИЕ!', { color: '#ff7aa8' });
      g.enemyReached(this);
      return;
    }
    g.checkTrapAt(this.x, this.gy, this);
  }
  plan(g) {
    const c = this.c, r = this.r;
    if (this.type === 'pawn') {
      const nr = r + 1;
      if (nr === PAWN_ROW && g.def[c]) {
        // пешка не может идти вперёд в занятую клетку — только бить наискосок
        const opts = [c - 1, c + 1].filter((cc) => cc >= 0 && cc < COLS && g.def[cc]);
        if (opts.length) this.moveTo(choice(opts), nr, true, 20, 0.35);
      } else {
        this.moveTo(c, nr, false, 20, 0.35);
      }
    } else if (this.type === 'knight') {
      const opts = [];
      for (const [dr, dc] of [[2, 1], [2, -1], [1, 2], [1, -2]]) {
        const cc = c + dc, rr2 = r + dr;
        if (cc >= 0 && cc < COLS && rr2 <= ROWS - 1) opts.push([cc, rr2]);
      }
      const [cc, rr2] = opts.length ? choice(opts) : [c, r + 1];
      this.moveTo(cc, rr2, rr2 === PAWN_ROW && !!g.def[cc], 46, 0.45);
    } else if (this.type === 'rook') {
      let nr = Math.min(ROWS - 1, r + 2);
      if (r < PAWN_ROW && nr >= PAWN_ROW && g.def[c]) nr = PAWN_ROW;
      this.moveTo(c, nr, nr === PAWN_ROW && !!g.def[c], 0, 0.3);
    } else if (this.type === 'bishop') {
      if (c + this.dx < 0 || c + this.dx >= COLS) this.dx *= -1;
      const cc = c + this.dx, nr = r + 1;
      this.moveTo(cc, nr, nr === PAWN_ROW && !!g.def[cc], 12, 0.35);
    }
  }
  draw(ctx) {
    if (this.air) ell(ctx, this.x, this.gy + 34, 22, 6, 'rgba(0,0,0,0.22)');
    this.beginDraw(ctx);
    if (this.dead) {
      ctx.translate(this.x, this.gy + 34);
      ctx.rotate(Math.min(1, this.deathT / 0.4) * 1.4);
      ctx.translate(-this.x, -(this.gy + 34));
    }
    drawPiece(ctx, this.def.piece, false, this.x, this.y, 70, { shadow: !this.air });
    this.endDraw(ctx);
  }
}

class Zombie extends Enemy {
  constructor(type, c) {
    super(type, colX(c) + rand(-6, 6), rowY(MF.r0) - 10);
    this.speed = type === 'cone' ? 13 : 15;
    this.eating = false;
    this.chompT = 0;
    this.groanT = rand(3, 9);
    this.phase = rand(0, 10);
  }
  damage(n, g, src) {
    const hadCone = this.type === 'cone' && this.hp > 5;
    const r = super.damage(n, g, src);
    if (hadCone && this.hp <= 5 && !this.dead) {
      FX.burst(g, this.x, this.y - 60, 6, { colors: ['#f08a24', '#ffb35c'], size: 8, speed: 180, up: 120 });
      FX.text(g, this.x, this.y - 70, 'конус слетел!', { color: '#ffb35c', font: `bold 14px ${FONT.ui}` });
    }
    return r;
  }
  update(dt, g) {
    if (this.baseUpdate(dt)) return;
    const c = this.col, d = g.def[c];
    const contact = PAWN_ROW * T - 24;
    if (d && this.y >= contact && this.y < PAWN_ROW * T + 30) {
      this.eating = true;
      d.hp -= dt;
      d.hurt = 0.1;
      this.chompT -= dt;
      if (this.chompT <= 0) {
        this.chompT = 0.5;
        Sound.chomp();
      }
      if (d.hp <= 0) g.killDefender(c, this);
    } else {
      this.eating = false;
      this.y += this.speed * dt * (g.bloodMoon ? 1.4 : 1);
    }
    this.gy = this.y;
    this.groanT -= dt;
    if (this.groanT <= 0) {
      this.groanT = rand(7, 15);
      Sound.groan();
    }
    g.checkTrapAt(this.x, this.y, this);
    if (this.y >= ROWS * T - 60) g.enemyReached(this);
  }
  draw(ctx, t) {
    this.beginDraw(ctx);
    if (this.dead) {
      ctx.translate(this.x, this.y + 30);
      ctx.rotate(-Math.min(1, this.deathT / 0.45) * 1.5);
      ctx.translate(-this.x, -(this.y + 30));
    }
    drawZombie(ctx, this.x, this.y, t + this.phase, {
      cone: this.type === 'cone' && this.hp > 5,
      eating: this.eating,
      walking: !this.eating && this.frozen <= 0 && !this.dead,
    });
    this.endDraw(ctx);
  }
}

// Появляется только ночью (с 00:00 до 06:00) и телепортируется к игроку.
class Freddy extends Enemy {
  constructor(c, r) {
    super('freddy', colX(c), rowY(r));
    this.c = c;
    this.r = r;
    this.tp = 1.9;
    this.glitch = 0.4;
    this.spawnFx = 0.6;
    Sound.staticNoise();
  }
  update(dt, g) {
    if (this.baseUpdate(dt)) return;
    if (this.glitch > 0) this.glitch -= dt;
    this.tp -= dt;
    if (this.tp <= 0) {
      this.tp = rand(1.4, 2.0);
      if (this.r + 1 >= PAWN_ROW) {
        g.startJumpscare(this);
        return;
      }
      this.r += 1;
      this.c = clamp(this.c + randi(-1, 1), 0, COLS - 1);
      this.x = colX(this.c);
      this.y = this.gy = rowY(this.r);
      this.glitch = 0.25;
      g.staticFx = 0.15;
      Sound.staticNoise();
    }
  }
  draw(ctx, t) {
    this.beginDraw(ctx);
    ctx.globalAlpha *= 0.82 + Math.sin(t * 23) * 0.12;
    let ox = 0;
    if (this.glitch > 0) ox = rand(-8, 8);
    drawFreddy(ctx, this.x + ox, this.y, t, { glow: true });
    if (this.glitch > 0) {
      ctx.globalAlpha *= 0.4;
      drawFreddy(ctx, this.x - ox * 2, this.y, t, { glow: true });
    }
    this.endDraw(ctx);
  }
}

// Змейка ползёт «змейкой» по рядам, как в старых играх, и ест предметы.
class Snake extends Enemy {
  constructor(fromLeft) {
    super('snake', 0, 0);
    this.dir = fromLeft ? 1 : -1;
    const len = 5;
    this.segs = [];
    for (let i = 0; i < len; i++) this.segs.push({ c: fromLeft ? -1 - i : COLS + i, r: MF.r0 });
    this.prev = this.segs.map((s) => ({ ...s }));
    this.hp = this.maxHp = len * 3;
    this.stepT = 0;
    this.stepDur = 0.26;
    this.k = 1;
    this.mdx = this.dir;
    this.mdy = 0;
    this.spawnFx = 0;
    this.sync();
    Sound.hiss();
  }
  segPos(i) {
    const a = this.prev[i] || this.segs[i], b = this.segs[i];
    return { x: lerp(colX(a.c), colX(b.c), this.k), y: lerp(rowY(a.r), rowY(b.r), this.k) };
  }
  sync() {
    const h = this.segPos(0);
    this.x = h.x;
    this.y = this.gy = h.y;
  }
  hit(px, py) {
    for (let i = 0; i < this.segs.length; i++) {
      const p = this.segPos(i);
      if (dist2(px, py, p.x, p.y) < 34 * 34) return true;
    }
    return false;
  }
  distTo(px, py) {
    let best = Infinity;
    for (let i = 0; i < this.segs.length; i++) {
      const p = this.segPos(i);
      best = Math.min(best, Math.hypot(px - p.x, py - p.y));
    }
    return best;
  }
  inRow(row) {
    return this.segs.some((s) => s.r === row);
  }
  damage(n, g, src) {
    const r = super.damage(n, g, src);
    while (!this.dead && this.segs.length > 2 && this.hp <= 3 * (this.segs.length - 1)) {
      const tail = this.segs.pop();
      this.prev.length = this.segs.length;
      FX.burst(g, colX(tail.c), rowY(tail.r), 10, { colors: ['#4a7cf0', '#27479f', '#9bb8ff'], size: 9, speed: 220 });
    }
    return r;
  }
  update(dt, g) {
    if (this.baseUpdate(dt)) return;
    this.stepT += dt;
    this.k = Math.min(1, this.stepT / this.stepDur);
    if (this.stepT >= this.stepDur) {
      this.stepT -= this.stepDur;
      this.k = 0;
      this.step(g);
    }
    this.sync();
  }
  step(g) {
    this.prev = this.segs.map((s) => ({ ...s }));
    const h = this.segs[0];
    let nc = h.c + this.dir, nr = h.r;
    const inside = h.c >= 0 && h.c < COLS;
    if (inside && (nc < 0 || nc >= COLS)) {
      nc = h.c;
      nr = h.r + 1;
      this.dir *= -1;
    }
    this.mdx = Math.sign(nc - h.c);
    this.mdy = Math.sign(nr - h.r);
    for (let i = this.segs.length - 1; i > 0; i--) this.segs[i] = { ...this.segs[i - 1] };
    this.segs[0] = { c: nc, r: nr };
    if (nr >= PAWN_ROW) {
      if (g.def[nc]) g.killDefender(nc, this);
      g.enemyReached(this);
      return;
    }
    // съедает предметы на пути и растёт
    const hx = colX(nc), hy = rowY(nr);
    for (const it of g.items) {
      if (it.gone || it.falling) continue;
      if (Math.abs(it.x - hx) < T / 2 && Math.abs(it.y - hy) < T / 2) {
        it.gone = true;
        const tail = this.prev[this.prev.length - 1];
        this.segs.push({ ...tail });
        this.prev.push({ ...tail });
        this.hp += 3;
        this.maxHp += 3;
        FX.text(g, hx, hy - 40, 'ням!', { color: '#9bb8ff' });
        Sound.chomp();
      }
    }
    g.checkTrapAt(hx, hy, this);
  }
  draw(ctx, t) {
    const pts = this.segs.map((_, i) => this.segPos(i));
    ctx.save();
    if (this.dead) ctx.globalAlpha = Math.max(0, 1 - this.deathT / 0.6);
    if (this.flash > 0) ctx.filter = 'brightness(1.8)';
    drawSnake(ctx, pts, this.mdx, this.mdy, t, { color: this.frozen > 0 ? '#9fd4ff' : null });
    ctx.restore();
    if (this.alive && this.hp < this.maxHp) {
      const w = 40, x = this.x - w / 2, y = this.y - 46;
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(x - 1, y - 1, w + 2, 6);
      ctx.fillStyle = '#e53935';
      ctx.fillRect(x, y, w * Math.max(0, this.hp / this.maxHp), 4);
    }
  }
}

// ---------- белые фигуры игрока ----------
const DEF_STATS = {
  pawn: { hp: 4, cost: 50, cd: 1.4, name: 'Пешка', piece: 'p', info: 'бьёт наискосок' },
  bishop: { hp: 4, cost: 100, cd: 1.8, name: 'Слон', piece: 'b', info: 'стреляет по диагоналям' },
  rook: { hp: 14, cost: 125, cd: 0, name: 'Ладья', piece: 'r', info: 'крепкая стена' },
};
const PACKETS = ['pawn', 'bishop', 'rook'];

function makeDefender(type) {
  const s = DEF_STATS[type];
  const cd = type === 'sunflower' ? 5 : rand(0, s.cd);
  return { type, hp: s.hp, maxHp: s.hp, cd, lunge: 0, lungeDir: 0, pop: 0, hurt: 0, glow: 0, shoot: 0 };
}

function drawDefender(ctx, d, c, t) {
  const x = colX(c) + d.lungeDir * Math.sin(d.lunge * Math.PI) * 26;
  const y = rowY(PAWN_ROW) - Math.sin(d.lunge * Math.PI) * 18;
  const k = easeOutCubic(Math.min(1, d.pop));
  ctx.save();
  ctx.translate(x, y + 30);
  ctx.scale(k, k);
  ctx.translate(-x, -(y + 30));
  if (d.hurt > 0) ctx.filter = 'brightness(0.7) sepia(1) hue-rotate(-50deg) saturate(4)';
  if (DEF_STATS[d.type].plant) drawPlant(ctx, d.type, x, y, t, { glow: d.glow, shoot: d.shoot });
  else drawPiece(ctx, DEF_STATS[d.type].piece, true, x, y, d.type === 'rook' ? 70 : 66);
  ctx.restore();
  if (d.hp < d.maxHp) {
    const w = 36, bx = colX(c) - w / 2, by = rowY(PAWN_ROW) - 42;
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(bx - 1, by - 1, w + 2, 5);
    ctx.fillStyle = '#7ee03c';
    ctx.fillRect(bx, by, w * Math.max(0, d.hp / d.maxHp), 3);
  }
}

// ---------- Пак-Ман: «газонокосилка» последнего ряда ----------
class PacMan {
  constructor() {
    this.state = 'parked';
    this.x = 40;
    this.row = PAWN_ROW;
    this.y = rowY(PAWN_ROW);
    this.mouth = 0;
    this.cool = 0;
    this.combo = 0;
    this.power = false;
    this.wakaT = 0;
  }
  launch(row, power) {
    if (this.state === 'run') return false;
    this.row = row;
    this.y = rowY(row);
    if (!(this.state === 'parked' && row === PAWN_ROW)) this.x = -50;
    this.state = 'run';
    this.combo = 0;
    this.power = power;
    return true;
  }
  update(dt, g) {
    this.mouth += dt * 14;
    if (this.state === 'run') {
      this.x += 640 * dt;
      this.wakaT -= dt;
      if (this.wakaT <= 0) {
        this.wakaT = 0.13;
        Sound.waka();
      }
      const band = this.row === PAWN_ROW ? 72 : 46;
      for (const e of g.enemies) {
        if (!e.alive) continue;
        let near;
        if (e instanceof Snake) near = e.segs.some((s) => Math.abs(rowY(s.r) - this.y) < band && Math.abs(colX(s.c) - this.x) < 40);
        else near = Math.abs(e.y - this.y) < band && Math.abs(e.x - this.x) < 40;
        if (near) {
          this.combo++;
          const pts = 100 * Math.pow(2, Math.min(4, this.combo));
          e.damage(999, g, 'pac');
          g.addMoney(pts, e.x, e.y - 50, '#7ff');
          Sound.pacEat();
          if (this.combo >= 5) Ach.unlock('waka');
        }
      }
      if (this.x > W + 60) {
        if (this.power) {
          this.state = 'return';
          this.x = -50;
          this.row = PAWN_ROW;
          this.y = rowY(PAWN_ROW);
        } else {
          this.state = 'gone';
          this.cool = 35;
        }
      }
    } else if (this.state === 'gone') {
      this.cool -= dt;
      if (this.cool <= 0) {
        this.state = 'return';
        this.x = -50;
        this.row = PAWN_ROW;
        this.y = rowY(PAWN_ROW);
      }
    } else if (this.state === 'return') {
      this.x += 110 * dt;
      if (this.x >= 40) {
        this.x = 40;
        this.state = 'parked';
        g.say('Пак-Ман вернулся на пост.', '#ffe600');
      }
    }
  }
  draw(ctx, t) {
    if (this.state === 'gone') return;
    const r = this.power ? 34 : 28;
    if (this.state === 'parked') {
      for (const dx of [84, 108]) circ(ctx, dx, this.y, 4, '#ffe9b0');
    }
    drawPac(ctx, this.x, this.y, r, 0, this.state === 'parked' ? this.mouth * 0.4 : this.mouth, this.power ? '#fff04a' : '#ffe600');
  }
}

// ---------- предметы на доске ----------
class Loot {
  constructor(kind, key, x, y, ty, vy) {
    this.kind = kind; // 'sun' | 'item'
    this.key = key;
    this.x = x;
    this.y = y;
    this.ty = ty;
    this.vy = vy;
    this.falling = y < ty;
    this.life = kind === 'sun' ? 12 : 14;
    this.t = rand(0, 5);
    this.gone = false;
  }
  update(dt) {
    this.t += dt;
    if (this.falling) {
      this.y += this.vy * dt;
      if (this.y >= this.ty) {
        this.y = this.ty;
        this.falling = false;
      }
    } else {
      this.life -= dt;
      if (this.life <= 0) this.gone = true;
    }
  }
  draw(ctx) {
    if (this.life < 3 && Math.floor(this.t * 8) % 2 === 0) return;
    if (this.kind === 'sun') {
      drawSun(ctx, this.x, this.y, 20, this.t);
    } else {
      const by = this.y + Math.sin(this.t * 3) * 3;
      circ(ctx, this.x, by, 24, 'rgba(255,255,255,0.35)');
      drawItemIcon(ctx, this.key, this.x, by, 34, this.t);
    }
  }
}

class Airdrop {
  constructor() {
    this.x = rand(260, 1020);
    this.y = -120;
    this.ty = rand(270, 470);
    this.state = 'fall';
    this.t = 0;
    this.life = 16;
    this.smokeT = 0;
    this.gone = false;
  }
  update(dt, g) {
    this.t += dt;
    if (this.state === 'fall') {
      this.y += 48 * dt;
      if (this.y >= this.ty) {
        this.y = this.ty;
        this.state = 'land';
        Sound.thud();
        FX.burst(g, this.x, this.y + 20, 14, { colors: ['#c8b89a', '#a89878'], size: 6, speed: 160, grav: 300 });
      }
    } else {
      this.life -= dt;
      this.smokeT -= dt;
      if (this.smokeT <= 0) {
        this.smokeT = 0.08;
        FX.burst(g, this.x + 26, this.y - 20, 1, { colors: ['rgba(230,60,50,0.55)', 'rgba(255,90,80,0.45)'], size: 22, speed: 30, grav: -60, life: 1.8, shape: 'circle', angle: -Math.PI / 2, spread: 0.6 });
      }
      if (this.life <= 0) this.gone = true;
    }
  }
  hit(px, py) {
    if (Math.abs(px - this.x) < 40 && py > this.y - 34 && py < this.y + 34) return true;
    return this.state === 'fall' && Math.abs(px - this.x) < 96 && py > this.y - 190 && py < this.y - 30;
  }
  draw(ctx) {
    if (this.state === 'land' && this.life < 3 && Math.floor(this.t * 8) % 2 === 0) return;
    drawAirdrop(ctx, this.x, this.y, this.t, this.state === 'land');
  }
}

// Ядро из королевской пушки летит прямо в камеру — его надо сбить.
class Cannonball {
  constructor(tx, ty, sx = 640, sy = 98, kind = 'ball') {
    this.kind = kind;
    this.sx = sx;
    this.sy = sy;
    this.tx = tx;
    this.ty = ty;
    this.t = 0;
    this.dur = 2.8;
    this.gone = false;
  }
  get k() {
    return Math.min(1, this.t / this.dur);
  }
  get pos() {
    const k = this.k;
    return { x: lerp(this.sx, this.tx, k), y: lerp(this.sy, this.ty, k) - Math.sin(k * Math.PI) * 70, s: 0.25 + 2.1 * k * k };
  }
  hit(px, py) {
    const p = this.pos;
    const r = 15 * p.s + 16;
    return dist2(px, py, p.x, p.y) < r * r;
  }
  draw(ctx) {
    const p = this.pos;
    const k = this.k;
    // прицельная метка — куда прилетит
    ctx.save();
    ctx.globalAlpha = 0.4 + k * 0.5;
    ctx.strokeStyle = '#ff2b2b';
    ctx.lineWidth = 3;
    const rr2 = 60 - k * 30;
    ctx.beginPath();
    ctx.arc(this.tx, this.ty, rr2, 0, TAU);
    ctx.stroke();
    line(ctx, this.tx - rr2 - 8, this.ty, this.tx - rr2 + 10, this.ty, '#ff2b2b', 3);
    line(ctx, this.tx + rr2 - 10, this.ty, this.tx + rr2 + 8, this.ty, '#ff2b2b', 3);
    ctx.restore();
    drawProjectile(ctx, this.kind, p.x, p.y, 15 * p.s, this.t);
  }
}

  constructor(c) {

    this.speed = 21;
    this.fuse = -1;
    this.phase = rand(0, 10);
  }
  update(dt, g) {
    if (this.baseUpdate(dt)) return;
    if (this.fuse >= 0) {
      this.fuse += dt;
      if (this.fuse >= 1.5) {
        this.dead = true;
        this.remove = true;
        g.creeperBoom(this);
      }
      return;

    if (this.y >= PAWN_ROW * T - 44) {

      FX.text(g, this.x, this.y - 66, 'ссссс...', { color: '#86d672', font: `bold 18px ${FONT.ui}` });
      return;
    }
    this.y += this.speed * dt;
    this.gy = this.y;
    g.checkTrapAt(this.x, this.y, this);
  }
  draw(ctx, t) {
    this.beginDraw(ctx);
    const sw = this.fuse >= 0 ? this.fuse / 1.5 : 0;
    if (this.dead) {
      ctx.translate(this.x, this.y + 34);
      ctx.rotate(Math.min(1, this.deathT / 0.4) * 1.4);

      swell: sw,
      white: sw > 0 && Math.floor(this.fuse * (5 + sw * 12)) % 2 === 0,
      walking: this.fuse < 0 && this.frozen <= 0 && !this.dead,
    });
    this.endDraw(ctx);
  }
}

class Skibidi extends Enemy {
  constructor(c) {
    super('skibidi', colX(c), rowY(MF.r0));
    this.dashT = rand(0.6, 1.2);
    this.mv = null;
    this.sing = 1.6;
    this.singT = rand(6, 10);
    this.phase = rand(0, 10);
    Sound.skibidi();
  }
  update(dt, g) {
    if (this.baseUpdate(dt)) return;
    if (this.sing > 0) this.sing -= dt;
    this.singT -= dt;
    if (this.singT <= 0) {
      this.singT = rand(6, 10);
      this.sing = 1.6;
      Sound.skibidi();
    }
    if (this.mv) {
      const m = this.mv;
      m.t += dt / m.dur;
      const k = Math.min(1, m.t), e = easeInOut(k);
      this.x = lerp(m.fx, m.tx, e);
      this.y = this.gy = lerp(m.fy, m.ty, e);
      if (k >= 1) {
        this.mv = null;
        g.checkTrapAt(this.x, this.y, this);
        this.afterMove(g);
      }
      return;
    }
    this.dashT -= dt;
    if (this.dashT <= 0) {
      this.dashT = rand(0.7, 1.1);
      const tx = clamp(this.x + rand(-0.6, 0.6) * T, T / 2, W - T / 2);
      this.mv = { fx: this.x, fy: this.y, tx, ty: this.y + T * 0.8, t: 0, dur: 0.28 };
    }
  }
  afterMove(g) {
    const c = this.col;
    if (this.y >= PAWN_ROW * T - 30 && this.y < PAWN_ROW * T + 40 && g.def[c]) {
      g.killDefender(c, this);
      FX.text(g, this.x, this.y - 50, 'СМЫТО!', { color: '#9be7ff', font: `bold 22px ${FONT.gta}` });
      Sound.flush();
    }
    if (this.y >= ROWS * T - 60) g.enemyReached(this);
  }
  draw(ctx, t) {
    this.beginDraw(ctx);
    if (this.dead) {
      ctx.translate(this.x, this.y + 30);
      ctx.rotate(Math.min(1, this.deathT / 0.4) * 1.6);
      ctx.translate(-this.x, -(this.y + 30));
    }
    drawSkibidi(ctx, this.x, this.y, t + this.phase, { singing: this.sing > 0 });
    this.endDraw(ctx);
  }
}

class MegaKnight extends Enemy {
  constructor() {
    super('mega', 640, rowY(MF.r0));
    this.jumpT = 2.5;
    this.mv = null;
    this.spawnFx = 0.6;
  }
  update(dt, g) {
    if (this.baseUpdate(dt)) return;
    if (this.mv) {
      const m = this.mv;
      m.t += dt / m.dur;
      const k = Math.min(1, m.t), e = easeInOut(k);
      this.x = lerp(m.fx, m.tx, e);
      this.gy = lerp(m.fy, m.ty, e);
      this.y = this.gy - Math.sin(k * Math.PI) * 150;
      this.air = k < 0.9;
      if (k >= 1) {
        this.mv = null;
        this.air = false;
        this.y = this.gy;
        this.land(g);
      }
      return;
    }
    this.y += 6 * dt;
    this.gy = this.y;
    this.jumpT -= dt;
    if (this.jumpT <= 0) {
      this.jumpT = 3.2;
      const row = toRow(this.gy);
      let tc = this.col;
      let best = 99;
      for (let c = 1; c < COLS; c++) {
        if (g.def[c] && Math.abs(c - this.col) < best) {
          best = Math.abs(c - this.col);
          tc = c;
        }
      }
      tc = clamp(tc, this.col - 2, this.col + 2);
      const tr = row >= PAWN_ROW ? ROWS - 1 : Math.min(PAWN_ROW, row + 2);
      this.mv = { fx: this.x, fy: this.gy, tx: colX(tc), ty: rowY(tr), t: 0, dur: 0.85 };
      Sound.whoosh();
    }
  }
  land(g) {
    Sound.megaLand();
    g.shake = Math.max(g.shake, 14);
    g.explosions.push({ x: this.x, y: this.y + 30, r: 90, t: 0 });
    FX.burst(g, this.x, this.y + 30, 18, { colors: ['#8d6e63', '#bcaaa4', '#7b4fb0'], size: 8, speed: 300, up: 120 });
    FX.text(g, this.x, this.y - 70, 'МЕГАРЫЦАРЬ!', { color: '#b388ff', font: `22px ${FONT.title}` });
    for (let c = 1; c < COLS; c++) {
      if (g.def[c] && Math.abs(colX(c) - this.x) <= T * 1.3 && Math.abs(rowY(PAWN_ROW) - this.y) <= T * 1.2) g.killDefender(c, this);
    }
    g.checkTrapAt(this.x, this.y, this);
    if (toRow(this.y) >= ROWS - 1) g.enemyReached(this);
  }
  draw(ctx, t) {
    if (this.air) ell(ctx, this.x, this.gy + 44, 34, 8, 'rgba(0,0,0,0.25)');
    this.beginDraw(ctx);
    drawMegaKnight(ctx, this.x, this.y, t, { air: this.air });
    this.endDraw(ctx);
  }
}

// ---------- Марио: «?»-блоки ----------
class QBlock {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.t = 0;
    this.state = 'active';
    this.bumpT = 0;
    this.life = 22;
    this.pop = 0;
    this.gone = false;
  }
  get oy() {
    return this.y + Math.sin(this.t * 2) * 4 - Math.sin(Math.max(0, this.bumpT) / 0.25 * Math.PI) * 14;
  }
  hit(px, py) {
    return this.state === 'active' && this.pop >= 1 && Math.abs(px - this.x) < 30 && Math.abs(py - this.oy) < 30;
  }
  update(dt) {
    this.t += dt;
    this.pop = Math.min(1, this.pop + dt * 3);
    if (this.bumpT > 0) this.bumpT -= dt;
    this.life -= dt;
    if (this.life <= 0) this.gone = true;
  }
  draw(ctx) {
    if (this.state === 'active' && this.life < 3 && Math.floor(this.t * 8) % 2 === 0) return;
    const s = 52 * easeOutCubic(this.pop);
    const x = this.x - s / 2, y = this.oy - s / 2;
    ell(ctx, this.x, this.y + 40, 22, 6, 'rgba(0,0,0,0.25)');
    ctx.save();
    if (this.state === 'empty') ctx.globalAlpha = Math.min(1, this.life);
    ctx.fillStyle = '#5a2a00';
    ctx.fillRect(x - 2, y - 2, s + 4, s + 4);
    ctx.fillStyle = this.state === 'active' ? '#f8b800' : '#9a5a24';
    ctx.fillRect(x, y, s, s);
    ctx.fillStyle = this.state === 'active' ? '#ffe28a' : '#b8743a';
    ctx.fillRect(x, y, s, s * 0.08);
    ctx.fillRect(x, y, s * 0.08, s);
    ctx.fillStyle = '#5a2a00';
    for (const [dx, dy] of [[0.15, 0.15], [0.85, 0.15], [0.15, 0.85], [0.85, 0.85]]) ctx.fillRect(x + s * dx - 2, y + s * dy - 2, 4, 4);
    if (this.state === 'active' && s > 20) {
      text(ctx, '?', this.x + 3, this.oy + s * 0.27 + 3, { font: `bold ${Math.round(s * 0.75)}px ${FONT.title}`, color: '#5a2a00', align: 'center' });
      text(ctx, '?', this.x, this.oy + s * 0.27, { font: `bold ${Math.round(s * 0.75)}px ${FONT.title}`, color: '#fff', align: 'center' });
    }
    ctx.restore();
  }
}

function drawMarioItem(ctx, kind, x, y, s, t) {
  ctx.save();

// ---------- Duck Hunt ----------
class Duck {
  constructor() {
    this.dir = Math.random() < 0.5 ? 1 : -1;
    this.x = this.dir > 0 ? -40 : W + 40;
    this.y = rand(200, 420);
    this.vx = this.dir * rand(200, 260);
    this.vy = rand(-160, 160);
    this.t = 0;
    this.state = 'fly';
    this.life = 6.5;
    this.hitT = 0;
    this.gone = false;
  }
  hit(px, py) {
    return this.state === 'fly' && dist2(px, py, this.x, this.y) < 32 * 32;
  }
  update(dt, g) {
    this.t += dt;
    if (this.state === 'fly') {
      this.x += this.vx * dt;
      this.y += this.vy * dt;
      if ((this.x < 40 && this.vx < 0) || (this.x > W - 40 && this.vx > 0)) {
        if (this.t > 1) this.vx *= -1;
      }
      if (this.y < 170 || this.y > 470) {
        this.vy *= -1;
        this.y = clamp(this.y, 170, 470);
      }
      if (Math.random() < dt * 0.8) this.vy = rand(-180, 180);
      if (this.t % 1.2 < dt) Sound.quack();
      this.life -= dt;
      if (this.life <= 0) {
        this.state = 'escape';
        g.say('Утка улетела... собака над тобой ржёт.', '#d7ccc8');
      }
    } else if (this.state === 'escape') {
      this.y -= 320 * dt;
      this.x += this.vx * 0.3 * dt;
      if (this.y < -60) {
        this.gone = true;
        g.dogLaugh();
      }
    } else if (this.state === 'hit') {
      this.hitT += dt;
      if (this.hitT > 0.45) this.state = 'fall';
    } else if (this.state === 'fall') {
      this.y += 420 * dt;
      if (this.y >= 540) {
        this.gone = true;
        const key = weighted(TILE_LOOT.filter(([k]) => k !== 'sun'));
        g.items.push(new Loot('item', key, this.x, 500, 540, 120));
        Sound.thud();
      }
    }
  }
  draw(ctx) {
    const flap = this.state === 'fly' || this.state === 'escape' ? Math.sin(this.t * 18) : 0;
    ctx.save();
    ctx.translate(this.x, this.y);
    if (this.state === 'fall') ctx.rotate(Math.PI / 2);
    ctx.scale(this.vx < 0 ? -1 : 1, 1);
    // тело
    ell(ctx, 0, 4, 22, 12, '#8d5a2b');
    ell(ctx, 6, 8, 12, 6, '#e8d8b0');
    // крыло
    poly(ctx, [-8, 0, 8, 0, -4, -22 * flap - 4], '#5a3a1a');
    // хвост
    poly(ctx, [-20, 0, -30, -6, -26, 8], '#3e2a14');
    // шея и голова
    ctx.fillStyle = '#fff';
    ctx.fillRect(12, -6, 7, 4);
    circ(ctx, 18, -12, 9, '#1b6b2a');
    poly(ctx, [25, -14, 36, -11, 25, -8], '#ff9800');
    if (this.state === 'hit' || this.state === 'fall') {
      line(ctx, 15, -16, 21, -10, '#fff', 2);
      line(ctx, 21, -16, 15, -10, '#fff', 2);
    } else {
      circ(ctx, 20, -14, 2.5, '#fff');
      circ(ctx, 20.5, -14, 1.2, '#111');
    }
    ctx.restore();
  }
}

function drawDog(ctx, x, y, t) {

function drawPlant(ctx, type, x, y, t, o = {}) {
  const sway = Math.sin(t * 2 + x) * 0.08;
  ctx.save();
  ctx.translate(x, y + 34);
  ctx.rotate(sway);
  ctx.translate(-x, -(y + 34));
  ell(ctx, x, y + 34, 22, 6, 'rgba(0,0,0,0.25)');
  line(ctx, x, y + 34, x, y - 2, '#2e7d32', 5);
  ell(ctx, x - 12, y + 22, 13, 6, '#43a047');
  ell(ctx, x + 12, y + 18, 13, 6, '#43a047');
  if (type === 'sunflower') {
    const hy = y - 10;
    if (o.glow > 0) circ(ctx, x, hy, 34, `rgba(255,230,80,${o.glow * 0.6})`);
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * TAU + t * 0.3;
      ctx.save();
      ctx.translate(x + Math.cos(a) * 17, hy + Math.sin(a) * 17);
      ctx.rotate(a);
      ell(ctx, 0, 0, 9, 5, '#ffd21f');
      ctx.restore();
    }
    circ(ctx, x, hy, 14, '#7a4a18');
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#4e2c0a';
    ctx.stroke();
    ell(ctx, x - 5, hy - 3, 2, 3, '#111');
    ell(ctx, x + 5, hy - 3, 2, 3, '#111');
    ctx.beginPath();
    ctx.arc(x, hy + 2, 6, 0.15 * Math.PI, 0.85 * Math.PI);
    ctx.strokeStyle = '#111';
    ctx.lineWidth = 2;
    ctx.stroke();
  } else {
    const rec = (o.shoot || 0) * 6;
    const hy = y - 8 + rec;
    poly(ctx, [x + 10, hy + 4, x + 26, hy - 2, x + 18, hy + 12], '#2e7d32');
    circ(ctx, x, hy, 18, '#66bb6a');
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#2e7d32';
    ctx.stroke();
    rr(ctx, x - 8, hy - 36, 16, 26, 4);
    ctx.fillStyle = '#66bb6a';
    ctx.fill();
    ctx.stroke();
    ell(ctx, x, hy - 36, 10, 5, '#1b5e20');
    circ(ctx, x - 7, hy - 2, 4, '#111');
    circ(ctx, x - 8, hy - 3, 1.3, '#fff');
  }
  ctx.restore();
}

// Панцирь убитого Купы катится по ряду и сбивает врагов.
class Shell {
  constructor(x, y, dir) {
    this.x = x;
    this.y = y;
    this.vx = dir * 560;
    this.bounces = 1;
    this.hitSet = new Set();
    this.t = 0;
    this.gone = false;
  }
  update(dt, g) {
    this.t += dt;
    this.x += this.vx * dt;
    if ((this.x < 30 && this.vx < 0) || (this.x > W - 30 && this.vx > 0)) {
      if (this.bounces-- > 0) {
        this.vx *= -1;
        this.hitSet.clear();
        Sound.bump();
      } else this.gone = true;
    }
    for (const e of g.enemies) {
      if (!e.alive || this.hitSet.has(e)) continue;
      if (Math.abs(e.y - this.y) < 42 && Math.abs(e.x - this.x) < 34) {
        this.hitSet.add(e);
        e.damage(6, g, 'shell');
        FX.text(g, e.x, e.y - 40, 'БАМ!', { color: '#7ee03c', font: `bold 18px ${FONT.gta}` });
        Sound.kick();
      }
    }
  }
  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y + 14);
    ctx.rotate(this.t * 20);
    ell(ctx, 0, 0, 22, 18, '#2e7d32');
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#f5f5f5';
    ctx.stroke();
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * TAU;
      line(ctx, 0, 0, Math.cos(a) * 18, Math.sin(a) * 14, 'rgba(27,94,32,0.8)', 2);
    }
    ctx.restore();
  }
}

  ctx.fillStyle = '#f3e5f5';

class Enderman extends Zombie {
  constructor(c) {
    super('enderman', c);
    this.speed = 12;
    this.groanT = 999;
    this.lookT = 0;
    this.tpCd = 0;
    this.carry = false;
  }
  update(dt, g) {
    if (this.dead || this.frozen > 0) return super.update(dt, g);
    if (this.tpCd > 0) this.tpCd -= dt;
    // на телефоне «взгляд» считается, только пока палец на экране
    if (g.state === 'play' && (!Input.touch || Input.lmb) && this.hit(Input.x, Input.y)) this.lookT += dt;
    else this.lookT = Math.max(0, this.lookT - dt);
    if (this.lookT >= 0.45 && this.tpCd <= 0) {
      FX.burst(g, this.x, this.y - 30, 16, { colors: ['#e040fb', '#7b1fa2', '#111'], size: 5, speed: 180, grav: 0, life: 0.6 });
      const row = Math.min(6, toRow(this.y) + randi(1, 2));
      this.x = colX(clamp(this.col + randi(-3, 3), 0, COLS - 1));
      this.y = this.gy = rowY(row);
      FX.burst(g, this.x, this.y - 30, 16, { colors: ['#e040fb', '#7b1fa2', '#111'], size: 5, speed: 180, grav: 0, life: 0.6 });
      FX.text(g, this.x, this.y - 100, 'ВЖУХ', { color: '#e040fb', font: `bold 16px ${FONT.ui}` });
      Sound.enderTp();
      this.lookT = 0;
      this.tpCd = 1.6;
    }
    super.update(dt, g);
    if (this.carry || !this.alive) return;
    const m = g.mf.at(this.x, this.y);
    if (m && m.cell.s === FLAG && !m.cell.mine && m.cell.pop >= 1) {
      m.cell.s = HIDDEN;
      this.carry = true;
      FX.text(g, this.x, this.y - 100, 'украл флажок!', { color: '#ce93d8', font: `bold 15px ${FONT.ui}` });
    }
  }
  draw(ctx, t) {
    this.beginDraw(ctx);
    drawEnderman(ctx, this.x, this.y, t + this.phase, { walking: !this.eating && this.frozen <= 0 && !this.dead, shake: this.lookT > 0, carry: this.carry });
    this.endDraw(ctx);
  }
}

// ---------- Коп: встаёт на 6-й ряд и стреляет по фигурам ----------
function drawCop(ctx, x, y, t, o = {}) {
  ctx.save();

  ell(ctx, 0, 38, 22, 6, 'rgba(0,0,0,0.25)');

}

class Cop extends Zombie {
  constructor(c) {
    super('cop', c);
    this.speed = 22;
    this.groanT = 999;
    this.shootT = rand(0.5, 1.2);
    this.flashT = 0;
    this.shooting = false;
  }
  update(dt, g) {
    if (this.dead || this.frozen > 0) return super.update(dt, g);
    if (this.flashT > 0) this.flashT -= dt;
    const targets = [];
    for (let c = 1; c < COLS; c++) if (g.def[c]) targets.push(c);
    if (this.y >= rowY(5) - 10 && targets.length) {
      this.baseUpdate(dt);
      this.shooting = true;
      this.shootT -= dt;
      if (this.shootT <= 0) {
        this.shootT = 1.8;
        const c = targets.reduce((a, b) => (Math.abs(b - this.col) < Math.abs(a - this.col) ? b : a));
        const d = g.def[c];
        d.hp -= 1;
        d.hurt = 0.15;
        this.flashT = 0.08;
        g.tracers.push({ x1: this.x + 20, y1: this.y + 26, x2: colX(c), y2: rowY(PAWN_ROW), t: 0, w: 2 });
        Sound.pistol();
        if (d.hp <= 0) g.killDefender(c, this);
      }
      return;
    }
    this.shooting = false;
    super.update(dt, g);
  }
  draw(ctx, t) {
    this.beginDraw(ctx);
    drawCop(ctx, this.x, this.y, t + this.phase, { walking: !this.shooting && !this.eating && this.frozen <= 0 && !this.dead, flash: this.flashT > 0 });
    this.endDraw(ctx);
  }
}

// ---------- Соник: носится зигзагом, при попадании теряет кольца ----------
function drawSonic(ctx, x, y, t, o = {}) {
  const dir = o.dir || 1;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(dir, 1);
  ell(ctx, 0, 30, 22, 6, 'rgba(0,0,0,0.25)');
  for (let i = 0; i < 3; i++) poly(ctx, [-10, -20 + i * 14, -40 - i * 2, -24 + i * 16, -12, -8 + i * 14], '#1e4fd8');
  circ(ctx, 0, -6, 22, '#2a5ff0');
  ell(ctx, 6, 2, 12, 12, '#f5cfa0');
  ell(ctx, 4, -12, 12, 10, '#fff');
  ell(ctx, 8, -12, 4, 6, '#2e7d32');
  circ(ctx, 18, -2, 3, '#111');
  const run = Math.sin(t * 30) * 6;
  ell(ctx, -6 + run, 22, 10, 6, '#e53935');
  ell(ctx, 6 - run, 24, 10, 6, '#e53935');
  ctx.fillStyle = '#fff';
  ctx.fillRect(-10 + run, 20, 8, 3);
  ctx.restore();
}

class Sonic extends Enemy {
  constructor(c) {
    super('sonic', colX(c), rowY(MF.r0));
    this.vx = choice([-1, 1]) * 240;
    this.vy = 42;
    this.sp = 1;
    this.stun = 0;
    this.phase = rand(0, 10);
  }
  damage(n, g, src) {
    const r = super.damage(n, g, src);
    if (!this.dead && r) {
      g.dropRings(this.x, this.y, 4);
      this.stun = 0.25;
      this.sp *= 1.15;
    }
    return r;
  }
  update(dt, g) {
    if (this.baseUpdate(dt)) return;
    if (this.stun > 0) {
      this.stun -= dt;
      return;
    }
    this.x += this.vx * this.sp * dt;
    this.y += this.vy * dt;
    this.gy = this.y;
    if ((this.x < 40 && this.vx < 0) || (this.x > W - 40 && this.vx > 0)) this.vx *= -1;
    g.checkTrapAt(this.x, this.y, this);
    if (this.y >= ROWS * T - 60) g.enemyReached(this);
  }
  draw(ctx, t) {
    this.beginDraw(ctx);
    if (this.stun > 0) ctx.globalAlpha *= 0.6;
    drawSonic(ctx, this.x, this.y, t + this.phase, { dir: Math.sign(this.vx) });
    this.endDraw(ctx);
  }
}

function drawRing(ctx, x, y, t) {
  const w = Math.abs(Math.cos(t * 6)) * 11 + 2;
  ctx.beginPath();
  ctx.ellipse(x, y, w, 12, 0, 0, TAU);
  ctx.lineWidth = 4;
  ctx.strokeStyle = '#f8b800';
  ctx.stroke();
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = '#fff3b0';
  ctx.stroke();
}

// ---------- Драугр-щитоносец (Skyrim) ----------
// Огромный круглый щит держит пули и горох. Щит опускается, только когда драугр кричит
// «ФУС РО ДА!» — крик оглушает твои фигуры рядом. Взрывы, мины, мяч и AWP щит не держит,
// а после DRAUGR.shield попаданий он раскалывается.
Object.assign(ENEMY_DEF, {
  draugr: { hp: 14, dmg: 5, bounty: 400, xp: 14, hw: 30, top: 76, bot: 36, name: 'Драугр-щитоносец' },
});

const DRAUGR = { shield: 14, speed: 11, shoutEvery: [5, 7.5], shoutTime: 1.6, stun: 2.5, stunR: 2.6 * T };

// Щит отбил пулю: металлический звон.
function draugrClank() {
  const a = Sound.audio();
  if (!a || Sound.muted) return;
  const t = a.ctx.currentTime;
  for (const [f, v] of [[1870, 0.05], [2710, 0.035], [940, 0.04]]) {
    const o = a.ctx.createOscillator(), g = a.ctx.createGain();
    o.type = 'square';
    o.frequency.setValueAtTime(f * rand(0.97, 1.03), t);
    g.gain.setValueAtTime(v, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
    o.connect(g);
    g.connect(a.master);
    o.start(t);
    o.stop(t + 0.2);
  }
}

// «ФУС РО ДА!»: низкий рык с порывом ветра.
function draugrShout() {
  const a = Sound.audio();
  if (!a || Sound.muted) return;
  const { ctx, master, noiseBuf } = a;
  const t = ctx.currentTime;
  [0, 0.28, 0.56].forEach((d, i) => {
    const o = ctx.createOscillator(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime([92, 84, 70][i], t + d);
    o.frequency.exponentialRampToValueAtTime([80, 74, 48][i], t + d + (i === 2 ? 0.7 : 0.24));
    f.type = 'lowpass';
    f.frequency.value = 700;
    g.gain.setValueAtTime(0.0001, t + d);
    g.gain.exponentialRampToValueAtTime(0.22, t + d + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d + (i === 2 ? 0.8 : 0.26));
    o.connect(f);
    f.connect(g);
    g.connect(master);
    o.start(t + d);
    o.stop(t + d + 0.85);
  });
  const src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
  src.buffer = noiseBuf;
  f.type = 'bandpass';
  f.frequency.setValueAtTime(400, t + 0.5);
  f.frequency.exponentialRampToValueAtTime(1800, t + 1.1);
  g.gain.setValueAtTime(0.0001, t + 0.5);
  g.gain.exponentialRampToValueAtTime(0.3, t + 0.65);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 1.3);
  src.connect(f);
  f.connect(g);
  g.connect(master);
  src.start(t + 0.5);
  src.stop(t + 1.35);
}

function drawDraugr(ctx, x, y, t, o = {}) {
  ctx.save();
  ctx.translate(x, y);
  ell(ctx, 0, 32, 30, 7, 'rgba(0,0,0,0.28)');
  const step = o.walking ? Math.sin(t * 6) * 5 : 0;
  const bone = '#d8ccb0', boneD = '#8f846c';
  // ноги в лохмотьях
  line(ctx, -8, 6, -10 + step, 30, bone, 6);
  line(ctx, 8, 6, 10 - step, 30, bone, 6);
  rr(ctx, -15 + step, 26, 12, 7, 3);
  ctx.fillStyle = '#3a3129';
  ctx.fill();
  rr(ctx, 3 - step, 26, 12, 7, 3);
  ctx.fill();
  poly(ctx, [-17, 2, 17, 2, 20, 18, 8, 14, 0, 20, -8, 14, -20, 18], '#3b2f25');
  // ржавая кираса
  poly(ctx, [-17, -38, 17, -38, 14, 6, -14, 6], '#4f4b45');
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#2b2925';
  ctx.stroke();
  for (const [rx, ry] of [[-11, -32], [11, -32], [-9, 0], [9, 0]]) circ(ctx, rx, ry, 1.8, '#a1886a');
  line(ctx, -15, -16, 15, -16, '#3a3732', 2);
  // рука с мечом: машет, когда рубит фигуру
  const sw = o.swing ? Math.sin(t * 9) * 0.9 : 0;
  ctx.save();
  ctx.translate(15, -30);
  ctx.rotate(-0.5 + sw);
  line(ctx, 0, 0, 14, -14, bone, 5);
  line(ctx, 14, -14, 12, -58, '#a9b1b6', 6);
  line(ctx, 14, -14, 13, -56, '#e3e8ea', 2);
  line(ctx, 6, -16, 22, -12, '#6d5a3c', 4);
  ctx.restore();
  // голова: череп в рогатом шлеме, глаза светятся
  const open = o.shout ? 1 : 0;
  ell(ctx, 0, -52, 12, 13, bone);
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = boneD;
  ctx.stroke();
  rr(ctx, -8, -45 + open * 2, 16, 6 + open * 6, 2);
  ctx.fillStyle = open ? '#0d1a22' : '#5c5446';
  ctx.fill();
  for (let i = -6; i <= 6; i += 3) line(ctx, i, -45 + open * 2, i, -42 + open * 2, bone, 1.5);
  ctx.save();
  ctx.shadowColor = '#7fdcff';
  ctx.shadowBlur = 10;
  circ(ctx, -5, -53, 3.2, '#bff0ff');
  circ(ctx, 5, -53, 3.2, '#bff0ff');
  ctx.restore();
  ctx.beginPath();
  ctx.arc(0, -55, 14, Math.PI, 0);
  ctx.closePath();
  ctx.fillStyle = '#5b5f63';
  ctx.fill();
  ctx.stroke();
  line(ctx, 0, -69, 0, -55, '#3d4043', 3);
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(s * 12, -60);
    ctx.quadraticCurveTo(s * 30, -62, s * 28, -80);
    ctx.quadraticCurveTo(s * 22, -68, s * 10, -66);
    ctx.closePath();
    ctx.fillStyle = '#e6dcc3';
    ctx.fill();
    ctx.strokeStyle = '#8f846c';
    ctx.stroke();
  }
  // крик: голубые волны вперёд, к твоим фигурам
  if (o.shout) {
    ctx.save();
    for (let i = 0; i < 3; i++) {
      const k = (t * 1.8 + i / 3) % 1;
      ctx.globalAlpha = (1 - k) * 0.7;
      ctx.beginPath();
      ctx.ellipse(0, -36 + k * 70, 14 + k * 70, 6 + k * 24, 0, 0, Math.PI);
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#9fe3ff';
      ctx.stroke();
    }
    ctx.restore();
  }
  // огромный круглый щит: спереди — держит пули; во время крика отведён в сторону
  if (o.shield) {
    ctx.save();
    if (o.shout) {
      ctx.translate(-30, -4);
      ctx.scale(0.55, 1);
    } else ctx.translate(-2, -12);
    circ(ctx, 0, 0, 30, '#6a4f33');
    ctx.lineWidth = 5;
    ctx.strokeStyle = '#7d8084';
    ctx.stroke();
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = '#c9a66b';
    ctx.beginPath();
    for (let a = 0; a < 5.4 * Math.PI; a += 0.2) {
      const r = 3 + a * 1.4;
      const px = Math.cos(a) * r, py = Math.sin(a) * r;
      if (a === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.stroke();
    for (let i = 0; i < 8; i++) circ(ctx, Math.cos((i * TAU) / 8) * 25, Math.sin((i * TAU) / 8) * 25, 1.8, '#b0b4b8');
    circ(ctx, 0, 0, 5, '#9a9ea3');
    if (o.cracks) {
      ctx.lineWidth = 2;
      ctx.strokeStyle = 'rgba(25,15,8,0.85)';
      ctx.beginPath();
      ctx.moveTo(-20, -14);
      ctx.lineTo(-6, -3);
      ctx.lineTo(-10, 10);
      if (o.cracks > 1) {
        ctx.moveTo(18, -16);
        ctx.lineTo(6, 2);
        ctx.lineTo(16, 18);
      }
      ctx.stroke();
    }
    ctx.restore();
  } else line(ctx, -15, -30, -26, -6, bone, 5);
  ctx.restore();
}

class Draugr extends Enemy {
  constructor(c) {
    super('draugr', colX(clamp(c, 1, COLS - 2)), rowY(MF.r0) - 14);
    this.shield = DRAUGR.shield; // сколько пуль ещё выдержит щит
    this.shoutT = rand(3, DRAUGR.shoutEvery[1]);
    this.shouting = 0; // > 0 — кричит, щит отведён
    this.eating = false;
    this.chompT = 0;
    this.phase = rand(0, 10);
  }
  get guarded() {
    return this.shield > 0 && this.shouting <= 0;
  }
  damage(n, g, src) {
    if (!this.alive) return false;
    if (this.guarded && ((src === 'gun' && g.weapon !== 'awp') || src === 'pea' || src === 'fist')) {
      this.shield--;
      this.shieldHit = true; // для hitFx: искры вместо крови
      FX.burst(g, this.x + rand(-16, 12), this.y - 12 + rand(-16, 16), 6, { colors: ['#fff6c0', '#ffd54a', '#cfd8dc'], size: 4, speed: 280, grav: 500, life: 0.3 });
      draugrClank();
      if (this.shield <= 0) {
        FX.burst(g, this.x - 2, this.y - 12, 16, { colors: ['#6a4f33', '#8d6e4a', '#7d8084'], size: 9, speed: 260, grav: 700, life: 0.8 });
        FX.text(g, this.x, this.y - 92, 'щит расколот!', { color: '#ffcc80', font: `bold 16px ${FONT.ui}` });
        Sound.stone();
      } else if (Math.random() < 0.3) FX.text(g, this.x, this.y - 88, 'БЛОК', { color: '#cfd8dc', font: `bold 14px ${FONT.ui}`, life: 0.6 });
      return false;
    }
    const r = super.damage(n, g, src);
    if (this.dead && this.shouting > 0) Ach.unlock('dovah');
    return r;
  }
  shout(g) {
    this.shouting = DRAUGR.shoutTime;
    this.shoutT = rand(...DRAUGR.shoutEvery);
    FX.text(g, this.x, this.y - 96, 'ФУС РО ДА!', { color: '#9fe3ff', font: `bold 22px ${FONT.title}`, life: 1.6, vy: -30 });
    draugrShout();
    g.shake = Math.max(g.shake, 6);
    // крик оглушает твои фигуры рядом: какое-то время они не бьют
    for (let c = 1; c < COLS; c++) {
      const d = g.def[c];
      if (d && Math.hypot(colX(c) - this.x, rowY(PAWN_ROW) - this.y) < DRAUGR.stunR) {
        d.cd = Math.max(d.cd, DRAUGR.stun);
        d.hurt = 0.3;
        FX.text(g, colX(c), rowY(PAWN_ROW) - 50, 'оглушён', { color: '#9fe3ff', font: `bold 13px ${FONT.ui}`, life: 1.2 });
      }
    }
  }
  update(dt, g) {
    if (this.baseUpdate(dt)) return;
    if (this.shouting > 0) this.shouting -= dt;
    else {
      this.shoutT -= dt;
      if (this.shoutT <= 0) this.shout(g);
    }
    const c = this.col, d = g.def[c];
    if (d && this.y >= PAWN_ROW * T - 26 && this.y < PAWN_ROW * T + 30) {
      this.eating = true;
      d.hp -= dt * 1.5;
      d.hurt = 0.1;
      this.chompT -= dt;
      if (this.chompT <= 0) {
        this.chompT = 0.6;
        Sound.punch();
      }
      if (d.hp <= 0) g.killDefender(c, this);
    } else {
      this.eating = false;
      if (this.shouting <= 0) this.y += DRAUGR.speed * dt * (g.bloodMoon ? 1.4 : 1);
    }
    this.gy = this.y;
    g.checkTrapAt(this.x, this.y, this);
    if (this.y >= ROWS * T - 60) g.enemyReached(this);
  }
  draw(ctx, t) {
    this.beginDraw(ctx);
    if (this.dead) {
      ctx.translate(this.x, this.y + 30);
      ctx.rotate(Math.min(1, this.deathT / 0.45) * 1.5);
      ctx.translate(-this.x, -(this.y + 30));
    }
    const lost = DRAUGR.shield - this.shield;
    drawDraugr(ctx, this.x, this.y, t + this.phase, {
      shield: this.shield > 0,
      cracks: lost >= DRAUGR.shield * 0.66 ? 2 : lost >= DRAUGR.shield * 0.33 ? 1 : 0,
      shout: this.shouting > 0,
      swing: this.eating,
      walking: !this.eating && this.shouting <= 0 && this.frozen <= 0 && !this.dead,
    });
    this.endDraw(ctx);
  }
}

// ---- js/bosses.js ----
'use strict';
/* Боссы уровней: башня короля (Clash Royale), Боузер (Mario), Эндер-дракон (Minecraft),
   полицейский вертолёт (GTA) и Скибиди-Титан. У всех общий интерфейс:
   box — зона попадания, attack() — снаряд в экран, special() — особая атака,
   onRage() — подкрепление на 66% и 33% здоровья. */

class Boss {
  constructor(kind, hp) {
    this.kind = kind;
    this.hp = this.max = hp;
    this.dead = false;
    this.deadT = 0;
    this.boomT = 0;
    this.phase = 0;
    this.hit = 0;
    this.fire = 0;
    this.laugh = 0;
    this.emote = '';
    this.emoteT = 0;
    this.stunT = 0;
    this.t = 0;
    this.attackT = 6;
    this.specialT = 12;
    this.projectile = 'ball';
  }
  get box() {
    return { x: 510, y: 10, w: 260, h: 156 };
  }
  get center() {
    const b = this.box;
    return { x: b.x + b.w / 2, y: b.y + b.h / 2 };
  }
  get muzzle() {
    return { x: 640, y: 98 };
  }
  hitSpecial() {
    return false;
  }
  attackInterval(g) {
    return Math.max(4.0, 8.5 - g.stars * 0.5 - (1 - this.hp / this.max) * 2) * rand(0.85, 1.15);
  }
  specialInterval() {
    return 999;
  }
  move() {}
  update(dt, g) {
    this.t += dt;
    if (this.fire > 0) this.fire -= dt;
    if (this.laugh > 0) this.laugh -= dt;
    if (this.emoteT > 0) this.emoteT -= dt;
    this.move(dt, g);
    if (this.stunT > 0) {
      this.stunT -= dt;
      return;
    }
    this.attackT -= dt;
    if (this.attackT <= 0) {
      this.attackT = this.attackInterval(g);
      this.attack(g);
    }
    this.specialT -= dt;
    if (this.specialT <= 0) {
      this.specialT = this.specialInterval(g);
      this.special(g);
    }
  }
  attack(g) {
    const m = this.muzzle;
    g.cannonballs.push(new Cannonball(rand(220, 1060), rand(230, 560), m.x, m.y, this.projectile));
    this.fire = 0.3;
    Sound.cannon();
    FX.burst(g, m.x, m.y, 8, { colors: ['rgba(80,80,80,0.6)'], size: 20, speed: 80, grav: -30, life: 0.8, shape: 'circle' });
  }
  special() {}
  onRage() {}
}

// ---------- 1. Королевская башня ----------
class TowerBoss extends Boss {
  constructor(hp) {
    super('tower', hp);
    this.name = 'Королевская башня';
    this.speaker = 'Король';
    this.rageText = 'Из башни вышел Мегарыцарь!';
    this.deathText = 'Король повержен';
    this.emotes = ['Хе-хе-хе!', 'Ха-ха!', 'Получай!'];
  }
  onRage(g) {
    g.spawnEnemy('mega');
    for (let i = 0; i < 4; i++) g.spawnEnemy(choice(['pawn', 'zombie', 'cone', 'knight']));
    if (!g.enemies.some((e) => e.alive && e.type === 'snake')) g.spawnEnemy('snake');
  }
  draw(ctx, t) {
    drawTower(ctx, 640, t, { hpRatio: this.hp / this.max, hp: this.hp, hit: Math.max(0, this.hit), rage: this.phase > 0 ? 1 : 0, fire: Math.max(0, this.fire), laugh: this.laugh });
  }
}

// ---------- 2. Боузер ----------
function drawBowser(ctx, x, y, t, o = {}) {
  ctx.save();
  ctx.translate(x, y);
  const breath = o.breath || 0;
  // панцирь со спайками
  for (let i = 0; i < 7; i++) {
    const a = Math.PI + (i / 6) * Math.PI;
    poly(ctx, [Math.cos(a - 0.12) * 50, 4 + Math.sin(a - 0.12) * 44, Math.cos(a) * 70, 4 + Math.sin(a) * 62, Math.cos(a + 0.12) * 50, 4 + Math.sin(a + 0.12) * 44], '#f5f5f5', '#555', 2);
  }
  ell(ctx, 0, 6, 56, 50, '#f5e6b8');
  ell(ctx, 0, 6, 50, 45, '#2e7d32');
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#1b5e20';
  ctx.stroke();
  // ноги
  ell(ctx, -26, 66, 18, 12, '#e9a43a');
  ell(ctx, 26, 66, 18, 12, '#e9a43a');
  // живот
  ell(ctx, 0, 30, 32, 36, '#f6d36b');
  for (let i = 0; i < 4; i++) line(ctx, -26 + i * 2, 12 + i * 14, 26 - i * 2, 12 + i * 14, 'rgba(120,80,20,0.45)', 2);
  // руки с браслетами
  for (const sx of [-1, 1]) {
    ell(ctx, sx * 40, 26, 13, 20, '#e9a43a');
    rr(ctx, sx * 40 - 12, 36, 24, 8, 3);
    ctx.fillStyle = '#111';
    ctx.fill();
    for (let i = 0; i < 3; i++) poly(ctx, [sx * 40 - 8 + i * 8, 36, sx * 40 - 4 + i * 8, 28, sx * 40 + i * 8, 36], '#fff');
  }
  // голова
  const hy = -28;
  poly(ctx, [-34, hy - 8, -48, hy - 30, -26, hy - 18], '#f5e6b8', '#8d6e63', 2);
  poly(ctx, [34, hy - 8, 48, hy - 30, 26, hy - 18], '#f5e6b8', '#8d6e63', 2);
  for (let i = -2; i <= 2; i++) poly(ctx, [i * 9 - 6, hy - 20, i * 9, hy - 40 - Math.abs(i) * -2, i * 9 + 6, hy - 20], '#e53935');
  ell(ctx, 0, hy, 32, 26, '#f0b34a');
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#a5651d';
  ctx.stroke();
  ell(ctx, 0, hy + 12, 22, 13, '#f8d58a');
  circ(ctx, -6, hy + 6, 2.5, '#5a3a10');
  circ(ctx, 6, hy + 6, 2.5, '#5a3a10');
  ell(ctx, -12, hy - 8, 6, 7, '#fff');
  ell(ctx, 12, hy - 8, 6, 7, '#fff');
  circ(ctx, -11, hy - 7, 3, '#c62828');
  circ(ctx, 11, hy - 7, 3, '#c62828');
  line(ctx, -22, hy - 18, -5, hy - 12, '#c62828', 4);
  line(ctx, 22, hy - 18, 5, hy - 12, '#c62828', 4);
  ell(ctx, 0, hy + 20, 16, 4 + breath * 8, '#5a0d0d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(-12, hy + 16, 4, 4);
  ctx.fillRect(8, hy + 16, 4, 4);
  ctx.restore();
}

// ---------- 3. Эндер-дракон ----------
function drawDragon(ctx, x, y, t, o = {}) {
  const f = Math.sin(t * 4);
  ctx.save();
  ctx.translate(x, y);
  // хвост
  for (let i = 0; i < 6; i++) circ(ctx, Math.sin(t * 2 + i * 0.6) * 6 * i, -26 - i * 11, 13 - i * 1.6, '#16161b');
  // крылья
  for (const sx of [-1, 1]) {
    const pts = [sx * 22, -12, sx * 170, -46 - f * 46, sx * 210, -6 - f * 30, sx * 150, 16, sx * 90, 24, sx * 40, 18];
    poly(ctx, pts, '#2b2b33', '#111', 2);
    poly(ctx, pts, '#2b2b33');
    for (const [px, py] of [[170, -46 - f * 46], [210, -6 - f * 30], [150, 16]]) line(ctx, sx * 22, -10, sx * px, py, '#5a5a66', 2);
  }
  // тело
  ell(ctx, 0, 0, 36, 30, '#1c1c22');
  ell(ctx, 0, 8, 22, 16, '#3a3a44');
  for (let i = -2; i <= 2; i++) poly(ctx, [i * 12 - 5, -24, i * 12, -36, i * 12 + 5, -24], '#6e6e7a');
  // шея и голова
  ell(ctx, 0, 34, 13, 16, '#1c1c22');
  rr(ctx, -28, 44, 56, 30, 8);
  ctx.fillStyle = '#1c1c22';
  ctx.fill();
  rr(ctx, -20, 66, 40, 14, 5);
  ctx.fillStyle = o.open ? '#3a0d3a' : '#26262e';
  ctx.fill();
  poly(ctx, [-24, 46, -32, 30, -16, 44], '#6e6e7a');
  poly(ctx, [24, 46, 32, 30, 16, 44], '#6e6e7a');
  ctx.shadowColor = '#e040fb';
  ctx.shadowBlur = 12;
  ctx.fillStyle = '#e040fb';
  ctx.fillRect(-20, 52, 14, 5);
  ctx.fillRect(6, 52, 14, 5);
  ctx.shadowBlur = 0;
  ctx.restore();
}

class DragonBoss extends Boss {

    this.projectile = 'ender';
    this.x = 640;
    this.y = 80;
    this.specialT = 10;
    this.crystals = [380, 640, 900].map((cx) => ({ x: cx, y: 46, hp: 6, alive: true }));
  }
  get box() {
    return { x: this.x - 120, y: this.y - 50, w: 240, h: 130 };
  }
  get muzzle() {
    return { x: this.x, y: this.y + 70 };
  }
  move(dt) {
    this.x = 640 + Math.sin(this.t * 0.45) * 360;
    this.y = 84 + Math.sin(this.t * 1.3) * 22;
    const alive = this.crystals.filter((c) => c.alive).length;
    if (alive && !this.dead) this.hp = Math.min(this.max, this.hp + 2 * alive * dt);
  }
  specialInterval() {
    return rand(9, 12);
  }
  special(g) {
    const c = clamp(toCol(this.x) + randi(-2, 2), 1, COLS - 1);
    g.addHazard('breath', c, 1.4);
    g.bossEmote('РРРАААР!');
  }
  hitSpecial(x, y, g) {
    for (const c of this.crystals) {
      if (!c.alive || Math.abs(x - c.x) > 20 || Math.abs(y - c.y) > 24) continue;
      c.hp--;
      FX.burst(g, c.x, c.y, 6, { colors: ['#ff80ff', '#fff'], size: 4, speed: 160, life: 0.4 });
      if (c.hp <= 0) {
        c.alive = false;
        g.explosions.push({ x: c.x, y: c.y, r: 70, t: 0 });
        Sound.explosion(false);
        const left = this.crystals.filter((k) => k.alive).length;
        g.banner('КРИСТАЛЛ РАЗБИТ!', left ? `Осталось кристаллов: ${left}` : 'Дракон больше не лечится', '#ff80ff');
      }
      return true;
    }
    return false;
  }
  onRage(g) {
    for (let i = 0; i < 3; i++) g.spawnEnemy('enderman');
    g.spawnEnemy('creeper');
  }
  draw(ctx, t) {
    for (const c of this.crystals) {
      ctx.fillStyle = '#1b1026';
      ctx.fillRect(c.x - 16, c.y + 18, 32, 150 - c.y);
      ctx.fillStyle = 'rgba(160,90,220,0.35)';
      for (let i = 0; i < 6; i++) ctx.fillRect(c.x - 12 + ((i * 7) % 24), c.y + 30 + i * 16, 4, 4);
      if (!c.alive) continue;
      line(ctx, c.x, c.y, this.x, this.y, 'rgba(255,128,255,0.35)', 5);
      line(ctx, c.x, c.y, this.x, this.y, 'rgba(255,220,255,0.7)', 1.5);
      ctx.save();
      ctx.translate(c.x, c.y);
      ctx.rotate(t * 2);
      ctx.strokeStyle = 'rgba(255,255,255,0.6)';
      ctx.lineWidth = 2;
      ctx.strokeRect(-16, -16, 32, 32);
      ctx.rotate(-t * 4);
      poly(ctx, [0, -12, 12, 0, 0, 12, -12, 0], '#ff80ff', '#7b1fa2', 2);
      poly(ctx, [0, -12, 12, 0, 0, 12, -12, 0], '#ff80ff');
      ctx.restore();
    }
    ctx.save();
    if (this.hit > 0) ctx.translate(rand(-3, 3), rand(-2, 2));
    drawDragon(ctx, this.x, this.y, t, { open: this.fire > 0 });
    ctx.restore();
  }
}

// ---------- 4. Полицейский вертолёт ----------
function drawHeli(ctx, x, y, t, o = {}) {

  line(ctx, -50, 44, 50, 44, '#222', 4);
  line(ctx, -30, 30, -36, 44, '#222', 3);
  line(ctx, 30, 30, 36, 44, '#222', 3);
  ell(ctx, 0, 0, 72, 34, '#111');
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(0, 0, 72, 34, 0, 0, TAU);
  ctx.clip();
  ctx.fillStyle = '#f5f5f5';
  ctx.fillRect(-72, -34, 144, 30);
  ctx.restore();

  circ(ctx, -22, -34, 5, blink ? '#ff1744' : '#5a0010');

  ctx.fillStyle = '#333';
  ctx.fill();
  ell(ctx, 0, -48, 170, 7, 'rgba(40,40,40,0.35)');

  line(ctx, Math.cos(a) * -170, -48 + Math.sin(a) * 4, Math.cos(a) * 170, -48 - Math.sin(a) * 4, '#222', 4);

}

// ---------- 5. Скибиди-Титан ----------
function drawTitan(ctx, x, y, t, o = {}) {
  ctx.save();
  ctx.translate(x, y);
  // бачок
  rr(ctx, -100, -80, 200, 70, 10);
  ctx.fillStyle = '#eceff1';
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = '#90a4ae';
  ctx.stroke();
  rr(ctx, -20, -92, 40, 14, 4);
  ctx.fillStyle = '#b0bec5';
  ctx.fill();
  // голова
  const sway = Math.sin(t * 3) * 8, bob = Math.abs(Math.sin(t * 6)) * 6;
  const hx = sway, hy = -6 - bob;
  circ(ctx, hx, hy, 52, '#f0c49a');
  ctx.lineWidth = 3;
  ctx.strokeStyle = '#a5754e';
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(hx, hy - 8, 52, Math.PI * 1.05, Math.PI * 1.95);
  ctx.lineWidth = 18;
  ctx.strokeStyle = '#3e2723';
  ctx.stroke();
  const charge = o.charge || 0;
  for (const sx of [-1, 1]) {
    const ex = hx + sx * 20, ey = hy - 4;
    circ(ctx, ex, ey, 13, '#fff');
    if (charge > 0) {
      ctx.shadowColor = '#ff1744';
      ctx.shadowBlur = 20 * charge;
      circ(ctx, ex, ey, 6 + charge * 6, '#ff1744');
      ctx.shadowBlur = 0;
    } else circ(ctx, ex + Math.sin(t * 4) * 3, ey, 6, '#111');
  }
  ell(ctx, hx, hy + 26, 16, 6 + Math.abs(Math.sin(t * 12)) * 10, '#5a1010');
  // чаша
  ell(ctx, 0, 54, 140, 34, '#fafafa');
  ctx.lineWidth = 3;
  ctx.strokeStyle = '#90a4ae';
  ctx.stroke();
  ell(ctx, 0, 42, 120, 16, '#e0e0e0');
  ell(ctx, 0, 42, 92, 10, '#9fd4ff');
  ctx.restore();
}

class TitanBoss extends Boss {
  constructor(hp) {
    super('titan', hp);
    this.name = 'Скибиди-Титан';
    this.speaker = 'Титан';
    this.rageText = 'Скибиди-армия идёт на помощь!';
    this.deathText = 'Титан смыт';
    this.emotes = ['СКИБИДИ ДОП ДОП!', 'ЕС ЕС!', 'Ду-ду-ду!'];
    this.projectile = 'plunger';
    this.specialT = 12;
    this.charge = null;
  }
  get box() {
    return { x: 500, y: 0, w: 280, h: 160 };
  }
  get muzzle() {
    return { x: 640, y: 110 };
  }
  get eyes() {
    const sway = Math.sin(this.t * 3) * 8, bob = Math.abs(Math.sin(this.t * 6)) * 6;
    return [-1, 1].map((sx) => ({ x: 640 + sway + sx * 20, y: 92 - 6 - bob - 4 }));
  }
  move(dt, g) {
    if (this.charge) {
      this.charge.t += dt;
      if (this.charge.t >= this.charge.dur) this.charge = null;
    }
  }
  specialInterval() {
    return rand(11, 14);
  }
  special(g) {
    const h = g.addHazard('laser', PAWN_ROW, 2.0);
    this.charge = { t: 0, dur: 2.0, eyeHp: 6, hazard: h };
    Sound.laserCharge();
    g.say('Титан заряжает лазер! Стреляй ему в глаза!', '#ff5252');
  }
  hitSpecial(x, y, g) {
    if (!this.charge) return false;
    for (const e of this.eyes) {
      if (dist2(x, y, e.x, e.y) > 16 * 16) continue;
      this.charge.eyeHp--;
      FX.burst(g, x, y, 6, { colors: ['#ff1744', '#fff'], size: 4, speed: 160, life: 0.4 });
      Sound.hit();
      if (this.charge.eyeHp <= 0) {
        this.charge.hazard.cancel = true;
        this.charge = null;
        this.stunT = 2.5;
        g.banner('ЛАЗЕР СОРВАН!', 'Титан оглушён', '#7ee03c');
        g.damageTower(40, true);
      }
      return true;
    }
    return false;
  }
  onRage(g) {
    for (let i = 0; i < 3; i++) g.spawnEnemy('skibidi');
    g.spawnEnemy('mega');
  }
  draw(ctx, t) {
    ctx.save();
    if (this.hit > 0 || this.stunT > 0) ctx.translate(rand(-3, 3), rand(-2, 2));
    drawTitan(ctx, 640, 92, t, { charge: this.charge ? Math.min(1, this.charge.t / this.charge.dur) : 0 });
    if (this.stunT > 0) text(ctx, '★ ★ ★', 640, 40, { font: `bold 20px ${FONT.ui}`, color: '#ffd23f', align: 'center', stroke: '#000', lw: 3 });
    ctx.restore();
  }
}

const BOSS_CLASSES = { tower: TowerBoss, bowser: BowserBoss, dragon: DragonBoss, heli: HeliBoss, titan: TitanBoss };

function makeBoss(kind, hp) {
  return new BOSS_CLASSES[kind](hp);
}

// Портрет для выбора уровня и заставки «VS».
function drawBossPortrait(ctx, kind, x, y, s, t) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  if (kind === 'tower') {
    ctx.translate(-640, -85);
    drawTower(ctx, 640, t, { hpRatio: 1, hp: 1000, hit: 0, rage: 0, fire: 0, laugh: 0 });
  } else if (kind === 'bowser') drawBowser(ctx, 0, 10, t, {});
  else if (kind === 'dragon') drawDragon(ctx, 0, -10, t, {});
  else if (kind === 'heli') drawHeli(ctx, 0, 0, t, {});
  else if (kind === 'titan') drawTitan(ctx, 0, 0, t, {});
  ctx.restore();
}

// Снаряды боссов летят в камеру — отрисовка по виду.
function drawProjectile(ctx, kind, x, y, r, t) {
  if (kind === 'fire') {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r * 1.6);
    g.addColorStop(0, '#fff59d');
    g.addColorStop(0.4, '#ff9800');
    g.addColorStop(1, 'rgba(255,60,0,0)');
    circ(ctx, x, y, r * 1.6, g);
    circ(ctx, x, y, r * 0.8, '#ffeb3b');
  } else if (kind === 'ender') {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r * 1.6);
    g.addColorStop(0, '#f3e5f5');
    g.addColorStop(0.4, '#ab47bc');
    g.addColorStop(1, 'rgba(80,0,120,0)');
    circ(ctx, x, y, r * 1.6, g);
    for (let i = 0; i < 5; i++) {
      const a = t * 6 + i * 1.3;
      circ(ctx, x + Math.cos(a) * r * 1.2, y + Math.sin(a) * r * 1.2, r * 0.18, '#e040fb');
    }
  } else if (kind === 'rocket') {
    ctx.save();
    ctx.translate(x, y);
    const g = ctx.createRadialGradient(0, -r, 0, 0, -r, r * 1.6);
    g.addColorStop(0, 'rgba(255,200,80,0.9)');
    g.addColorStop(1, 'rgba(255,80,0,0)');
    circ(ctx, 0, -r * 1.2, r * 1.4, g);
    circ(ctx, 0, 0, r * 0.75, '#9e9e9e');
    ctx.lineWidth = Math.max(1, r * 0.12);
    ctx.strokeStyle = '#424242';
    ctx.stroke();
    circ(ctx, 0, 0, r * 0.3, '#e53935');
    for (let i = 0; i < 4; i++) {
      const a = i * (Math.PI / 2) + 0.4;
      line(ctx, Math.cos(a) * r * 0.75, Math.sin(a) * r * 0.75, Math.cos(a) * r * 1.15, Math.sin(a) * r * 1.15, '#616161', Math.max(1, r * 0.15));
    }
    ctx.restore();
  } else if (kind === 'plunger') {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(t * 8);
    rr(ctx, -r * 0.12, -r * 1.3, r * 0.24, r * 1.3, r * 0.1);
    ctx.fillStyle = '#a1887f';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.75, 0, Math.PI);
    ctx.closePath();
    ctx.fillStyle = '#c62828';
    ctx.fill();
    ctx.restore();
  } else {
    const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.1, x, y, r);
    g.addColorStop(0, '#8a8a96');
    g.addColorStop(0.6, '#2c2c34');
    g.addColorStop(1, '#0d0d10');
    circ(ctx, x, y, r, g);
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(255,120,40,0.6)';
    ctx.stroke();
  }
}

    g.addColorStop(0.55, '#b71c1c');
