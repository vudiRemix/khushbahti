<script>
// ---- js/core.js ----
'use strict';
/* ХАОС-ДОСКА — общие константы, настройки баланса и утилиты.
   Все скрипты подключаются обычными <script> (без модулей), поэтому
   игра работает даже при открытии index.html двойным кликом. */

// Логическое разрешение: доска 16×9 клеток по 80px.
const W = 1280, H = 720, T = 80, COLS = 16, ROWS = 9;
const TAU = Math.PI * 2;

// Поле сапёра: столбцы 2..13, строки 2..6.
const MF = { c0: 2, r0: 2, cols: 12, rows: 5 };
// Ряд белых фигур-защитников.
const PAWN_ROW = 7;

const FONT = {
  gta: "Anton, Impact, 'Arial Black', sans-serif",
  title: "'Russo One', 'Arial Black', Impact, sans-serif",
  pixel: "'Press Start 2P', 'Courier New', monospace",
  ui: "'Segoe UI', Roboto, 'Trebuchet MS', Arial, sans-serif",
};

// Баланс. Меняй здесь, если хочешь сделать игру легче или сложнее.
const CFG = {
  towerHp: 1000,
  playerHp: 20,
  startArmor: 50,
  startSun: 75,
  magSize: 30,
  startReserve: 150,
  maxReserve: 300,
  fireInterval: 0.1, // 600 выстрелов в минуту, как у АК
  reloadTime: 2.0,
  mineDamageToPlayer: 5,
  cannonDamage: 2,
  starEvery: 80, // сек на звезду розыска
  trapDamage: 12,
  mineMissileDamage: 35,
  baseMines: 10,
  maxMines: 16,
  ammoPerTile: 2,
  hungerTick: 9, // сек на одно деление голода
  dayMinutesPerSec: 4, // игровых минут за секунду (час = 15 с)
  sunValue: 25,
  dropEvery: [55, 75],
};

const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const choice = (arr) => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const dist2 = (ax, ay, bx, by) => (ax - bx) * (ax - bx) + (ay - by) * (ay - by);
const easeOutCubic = (t) => 1 - (1 - t) * (1 - t) * (1 - t);
const easeInOut = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
const colX = (c) => c * T + T / 2;
const rowY = (r) => r * T + T / 2;
const toCol = (x) => Math.floor(x / T);
const toRow = (y) => Math.floor(y / T);
const pad = (n, len) => String(Math.max(0, Math.floor(n))).padStart(len, '0');
const inRect = (px, py, r) => px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h;

function weighted(list) {
  let total = 0;
  for (const [, w] of list) total += w;
  let r = Math.random() * total;
  for (const [item, w] of list) {
    r -= w;
    if (r < 0) return item;
  }
  return list[list.length - 1][0];
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// localStorage может быть недоступен (приватный режим, песочница) — не падаем.
const Store = {
  get(key) {
    try { return window.localStorage.getItem(key); } catch (e) { return null; }
  },
  set(key, val) {
    try { window.localStorage.setItem(key, String(val)); } catch (e) { /* без сохранения */ }
  },
};

// Состояние ввода. События кладутся в очередь и разбираются в Game.update.
const Input = {
  x: W / 2,
  y: H / 2,
  lmb: false,
  rmb: false,
  keys: new Set(),
  queue: [],
  touch: false,
};

// Параметры вывода (заполняются в main.js при изменении размера окна).
const View = { k: 1, pw: W, ph: H };

// ---- js/audio.js ----
'use strict';
/* Звук без файлов: всё синтезируется через WebAudio.
   Браузер разрешает звук только после клика/нажатия клавиши — поэтому init()
   вызывается из обработчиков ввода. */

const Sound = (() => {
  let ctx = null;
  let master = null;
  let noiseBuf = null;
  let muted = Store.get('kd_muted') === '1';
  const last = {};

  function init() {
    if (ctx) {
      if (ctx.state === 'suspended') ctx.resume();
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      ctx = new AC();
    } catch (e) {
      ctx = null;
      return;
    }
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14;
    comp.ratio.value = 6;
    master = ctx.createGain();
    master.gain.value = muted ? 0 : 0.5;
    master.connect(comp);
    comp.connect(ctx.destination);
    noiseBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 1.5), ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }

  // Не даём одному и тому же звуку играть слишком часто.
  function ok(name, gap = 0) {
    if (!ctx || muted) return false;
    const t = ctx.currentTime;
    if (gap && last[name] !== undefined && t - last[name] < gap) return false;
    last[name] = t;
    return true;
  }

  function env(g, t, vol, attack, dur) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  }

  function tone(o) {
    const t = ctx.currentTime + (o.delay || 0);
    const osc = ctx.createOscillator();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.f0, t);
    if (o.f1) osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.f1), t + o.dur);
    const g = ctx.createGain();
    env(g, t, o.vol || 0.2, o.attack || 0.005, o.dur);
    osc.connect(g);
    g.connect(master);
    osc.start(t);
    osc.stop(t + o.dur + 0.05);
    return osc;
  }

  function noise(o) {
    const t = ctx.currentTime + (o.delay || 0);
    const src = ctx.createBufferSource();
    src.buffer = noiseBuf;
    src.loop = true;
    const f = ctx.createBiquadFilter();
    f.type = o.filter || 'lowpass';
    f.Q.value = o.q || 1;
    f.frequency.setValueAtTime(o.f0 || 1000, t);
    if (o.f1) f.frequency.exponentialRampToValueAtTime(o.f1, t + o.dur);
    const g = ctx.createGain();
    env(g, t, o.vol || 0.2, o.attack || 0.002, o.dur);
    src.connect(f);
    f.connect(g);
    g.connect(master);
    src.start(t, Math.random());
    src.stop(t + o.dur + 0.05);
  }

  const S = {
    init,
    get muted() { return muted; },
    toggleMute() {
      muted = !muted;
      Store.set('kd_muted', muted ? '1' : '0');
      if (master) master.gain.value = muted ? 0 : 0.5;
      return muted;
    },

    shot() {
      if (!ok('shot')) return;
      const p = rand(0.92, 1.08);
      noise({ dur: 0.11, vol: 0.5, filter: 'bandpass', f0: 1500 * p, f1: 500, q: 0.7 });
      noise({ dur: 0.05, vol: 0.35, filter: 'highpass', f0: 3000 });
      tone({ type: 'triangle', f0: 150 * p, f1: 45, dur: 0.1, vol: 0.45 });
    },
    empty() {
      if (!ok('empty', 0.12)) return;
      tone({ type: 'square', f0: 1800, dur: 0.025, vol: 0.12 });
    },
    reload() {
      if (!ok('reload')) return;
      tone({ type: 'square', f0: 900, dur: 0.03, vol: 0.12, delay: 0.05 });
      noise({ dur: 0.06, vol: 0.2, filter: 'bandpass', f0: 2500, delay: 0.5 });
      tone({ type: 'square', f0: 700, dur: 0.04, vol: 0.14, delay: 1.1 });
      noise({ dur: 0.08, vol: 0.25, filter: 'bandpass', f0: 1800, delay: 1.6 });
      tone({ type: 'square', f0: 1200, dur: 0.03, vol: 0.12, delay: 1.75 });
    },
    hit() {
      if (!ok('hit', 0.04)) return;
      tone({ type: 'square', f0: rand(600, 800), f1: 300, dur: 0.04, vol: 0.06 });
    },
    stone() {
      if (!ok('stone', 0.06)) return;
      noise({ dur: 0.07, vol: 0.18, filter: 'bandpass', f0: 1200, q: 2 });
    },
    explosion(big) {
      if (!ok('boom', 0.05)) return;
      noise({ dur: big ? 1.4 : 0.8, vol: big ? 0.9 : 0.7, filter: 'lowpass', f0: 1400, f1: 60 });
      tone({ type: 'sine', f0: 110, f1: 28, dur: big ? 0.9 : 0.5, vol: 0.7 });
    },
    reveal(n) {
      if (!ok('reveal', 0.03)) return;
      if (n > 6) {
        [660, 880, 1320].forEach((f, i) => tone({ type: 'triangle', f0: f, dur: 0.08, vol: 0.12, delay: i * 0.05 }));
      } else {
        tone({ type: 'triangle', f0: 880, f1: 1200, dur: 0.06, vol: 0.14 });
      }
    },
    flag() {
      if (!ok('flag')) return;
      tone({ type: 'square', f0: 520, f1: 900, dur: 0.07, vol: 0.08 });
    },
    unflag() {
      if (!ok('flag')) return;
      tone({ type: 'square', f0: 900, f1: 500, dur: 0.07, vol: 0.08 });
    },
    hurt() {
      if (!ok('hurt', 0.15)) return;
      // «ой» из кубического мира
      tone({ type: 'sawtooth', f0: 330, f1: 170, dur: 0.18, vol: 0.18 });
      tone({ type: 'square', f0: 220, f1: 120, dur: 0.16, vol: 0.08 });
    },
    coin() {
      if (!ok('coin', 0.05)) return;
      tone({ type: 'square', f0: 1320, dur: 0.06, vol: 0.06 });
      tone({ type: 'square', f0: 1760, dur: 0.12, vol: 0.06, delay: 0.06 });
    },
    sun() {
      if (!ok('sun', 0.05)) return;
      [1046, 1318, 1568, 2093].forEach((f, i) => tone({ f0: f, dur: 0.12, vol: 0.1, delay: i * 0.04 }));
    },
    pickup() {
      if (!ok('pickup', 0.05)) return;
      tone({ type: 'triangle', f0: 600, f1: 1400, dur: 0.1, vol: 0.14 });
    },
    xp() {
      if (!ok('xp', 0.05)) return;
      tone({ f0: rand(1500, 2100), dur: 0.12, vol: 0.06 });
    },
    levelUp() {
      if (!ok('lvl')) return;
      [523, 659, 784, 1046].forEach((f, i) => tone({ type: 'triangle', f0: f, dur: 0.25, vol: 0.14, delay: i * 0.08 }));
    },
    waka() {
      if (!ok('waka', 0.13)) return;
      tone({ type: 'triangle', f0: 260, f1: 520, dur: 0.06, vol: 0.18 });
      tone({ type: 'triangle', f0: 520, f1: 260, dur: 0.06, vol: 0.18, delay: 0.065 });
    },
    pacEat() {
      if (!ok('paceat', 0.05)) return;
      tone({ type: 'square', f0: 200, f1: 1600, dur: 0.18, vol: 0.12 });
    },
    jumpscare() {
      if (!ctx || muted) return;
      const t = ctx.currentTime;
      const osc = ctx.createOscillator();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(900, t);
      const lfo = ctx.createOscillator();
      lfo.frequency.value = 38;
      const lg = ctx.createGain();
      lg.gain.value = 260;
      lfo.connect(lg);
      lg.connect(osc.frequency);
      const g = ctx.createGain();
      env(g, t, 0.55, 0.01, 1.0);
      osc.connect(g);
      g.connect(master);
      osc.start(t);
      lfo.start(t);
      osc.stop(t + 1.05);
      lfo.stop(t + 1.05);
      noise({ dur: 1.0, vol: 0.6, filter: 'highpass', f0: 800 });
    },
    staticNoise() {
      if (!ok('static', 0.2)) return;
      noise({ dur: 0.3, vol: 0.18, filter: 'highpass', f0: 2500 });
    },
    chime6am() {
      if (!ok('chime')) return;
      [784, 659, 523, 392, 523, 659, 784, 1046].forEach((f, i) => {
        tone({ f0: f, dur: 0.6, vol: 0.12, delay: i * 0.22 });
        tone({ f0: f * 2.01, dur: 0.3, vol: 0.04, delay: i * 0.22 });
      });
    },
    midnight() {
      if (!ok('midnight')) return;
      [196, 185, 174].forEach((f, i) => tone({ type: 'sawtooth', f0: f, dur: 0.8, vol: 0.06, delay: i * 0.5 }));
      noise({ dur: 0.5, vol: 0.15, filter: 'highpass', f0: 2000 });
    },
    wasted() {
      if (!ok('wasted')) return;
      noise({ dur: 1.6, vol: 0.4, filter: 'lowpass', f0: 2000, f1: 80 });
      tone({ type: 'sine', f0: 90, f1: 30, dur: 1.4, vol: 0.5 });
      tone({ type: 'sawtooth', f0: 110, f1: 55, dur: 1.2, vol: 0.08, delay: 0.6 });
    },
    win() {
      if (!ok('win')) return;
      [523, 659, 784, 1046, 784, 1046, 1318].forEach((f, i) => {
        tone({ type: 'square', f0: f, dur: 0.22, vol: 0.08, delay: i * 0.13 });
        tone({ type: 'triangle', f0: f / 2, dur: 0.22, vol: 0.1, delay: i * 0.13 });
      });
    },
    cannon() {
      if (!ok('cannon', 0.1)) return;
      noise({ dur: 0.5, vol: 0.45, filter: 'lowpass', f0: 600, f1: 80 });
      tone({ type: 'sine', f0: 80, f1: 35, dur: 0.4, vol: 0.5 });
    },
    whoosh() {
      if (!ok('whoosh', 0.2)) return;
      noise({ dur: 0.5, vol: 0.2, filter: 'bandpass', f0: 300, f1: 2500, q: 3 });
    },
    chomp() {
      if (!ok('chomp', 0.12)) return;
      noise({ dur: 0.09, vol: 0.25, filter: 'lowpass', f0: 900 });
      noise({ dur: 0.07, vol: 0.2, filter: 'lowpass', f0: 700, delay: 0.12 });
    },
    groan() {
      if (!ok('groan', 1.2)) return;
      const o = tone({ type: 'sawtooth', f0: 95, f1: 70, dur: 0.9, vol: 0.07, attack: 0.15 });
      if (o) {
        const lfo = ctx.createOscillator();
        lfo.frequency.value = 6;
        const lg = ctx.createGain();
        lg.gain.value = 8;
        lfo.connect(lg);
        lg.connect(o.frequency);
        lfo.start();
        lfo.stop(ctx.currentTime + 1);
      }
    },
    tok() {
      if (!ok('tok', 0.05)) return;
      tone({ f0: 240, f1: 160, dur: 0.07, vol: 0.2 });
      noise({ dur: 0.02, vol: 0.12, filter: 'bandpass', f0: 3000 });
    },
    capture() {
      if (!ok('capture', 0.08)) return;
      tone({ f0: 300, f1: 120, dur: 0.12, vol: 0.25 });
      noise({ dur: 0.08, vol: 0.2, filter: 'bandpass', f0: 1800 });
    },
    plant() {
      if (!ok('plant')) return;
      tone({ type: 'triangle', f0: 180, f1: 90, dur: 0.12, vol: 0.3 });
      noise({ dur: 0.1, vol: 0.15, filter: 'lowpass', f0: 500 });
    },
    plane() {
      if (!ok('plane')) return;
      const o = tone({ type: 'sawtooth', f0: 70, f1: 60, dur: 3.5, vol: 0.06, attack: 1.2 });
      if (o) noise({ dur: 3.5, vol: 0.06, filter: 'lowpass', f0: 300, attack: 1.2 });
    },
    thud() {
      if (!ok('thud', 0.1)) return;
      tone({ f0: 120, f1: 50, dur: 0.2, vol: 0.4 });
    },
    dice() {
      if (!ok('dice', 0.05)) return;
      for (let i = 0; i < 6; i++) noise({ dur: 0.03, vol: 0.18, filter: 'bandpass', f0: rand(2000, 4000), q: 4, delay: i * 0.12 });
    },
    eat() {
      if (!ok('eat', 0.2)) return;
      for (let i = 0; i < 3; i++) noise({ dur: 0.08, vol: 0.2, filter: 'bandpass', f0: rand(700, 1200), q: 1.5, delay: i * 0.16 });
    },
    drink() {
      if (!ok('drink', 0.2)) return;
      for (let i = 0; i < 4; i++) tone({ f0: rand(300, 500), f1: 200, dur: 0.07, vol: 0.12, delay: i * 0.1 });
    },
    freeze() {
      if (!ok('freeze')) return;
      [2093, 1760, 2637, 2349].forEach((f, i) => tone({ f0: f, dur: 0.3, vol: 0.06, delay: i * 0.05 }));
      noise({ dur: 0.5, vol: 0.12, filter: 'highpass', f0: 5000 });
    },
    zap() {
      if (!ok('zap', 0.08)) return;
      tone({ type: 'sine', f0: 1800, f1: 600, dur: 0.12, vol: 0.08 });
    },
    punch() {
      if (!ok('punch', 0.1)) return;
      noise({ dur: 0.08, vol: 0.35, filter: 'lowpass', f0: 500 });
      tone({ f0: 160, f1: 70, dur: 0.08, vol: 0.3 });
    },
    star() {
      if (!ok('star')) return;
      tone({ type: 'square', f0: 988, dur: 0.12, vol: 0.07 });
      tone({ type: 'square', f0: 1319, dur: 0.2, vol: 0.07, delay: 0.13 });
    },
    totem() {
      if (!ok('totem')) return;
      [392, 523, 659, 784, 1046, 1318].forEach((f, i) => tone({ type: 'triangle', f0: f, dur: 0.4, vol: 0.12, delay: i * 0.06 }));
    },
    missile() {
      if (!ok('missile', 0.08)) return;
      noise({ dur: 0.4, vol: 0.12, filter: 'bandpass', f0: 800, f1: 3000, q: 2 });
    },
    hiss() {
      if (!ok('hiss', 0.8)) return;
      noise({ dur: 0.45, vol: 0.1, filter: 'highpass', f0: 4000, attack: 0.05 });
    },
    cast() {
      if (!ok('cast', 0.05)) return;
      noise({ dur: 0.12, vol: 0.12, filter: 'bandpass', f0: 1500, f1: 4000, q: 2 });
    },
    splash() {
      if (!ok('splash', 0.08)) return;
      noise({ dur: 0.2, vol: 0.1, filter: 'bandpass', f0: 900, q: 1 });
    },
    click() {
      if (!ok('click', 0.04)) return;
      tone({ type: 'square', f0: 1000, dur: 0.03, vol: 0.08 });
    },
  };
  return S;
})();

'use strict';
/* Вся графика рисуется кодом — никаких картинок.
   Здесь функции рисования персонажей, предметов и элементов интерфейса. */

// ---------- базовые примитивы ----------
function rr(ctx, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function ell(ctx, x, y, rx, ry, fill) {
  ctx.beginPath();
  ctx.ellipse(x, y, Math.abs(rx), Math.abs(ry), 0, 0, TAU);
  if (fill) {
    ctx.fillStyle = fill;
    ctx.fill();
  }
}
function circ(ctx, x, y, r, fill) {
  ctx.beginPath();
  ctx.arc(x, y, Math.abs(r), 0, TAU);
  if (fill) {
    ctx.fillStyle = fill;
    ctx.fill();
  }
}
function poly(ctx, pts, fill, stroke, lw) {
  ctx.beginPath();
  ctx.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.closePath();
  if (stroke) {
    ctx.lineWidth = lw || 2;
    ctx.strokeStyle = stroke;
    ctx.stroke();
  }
  if (fill) {
    ctx.fillStyle = fill;
    ctx.fill();
  }
}
function line(ctx, x1, y1, x2, y2, color, lw) {
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.strokeStyle = color;
  ctx.lineWidth = lw || 1;
  ctx.stroke();
}
function text(ctx, str, x, y, o = {}) {
  ctx.font = o.font || `16px ${FONT.ui}`;
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = o.base || 'alphabetic';
  if (o.stroke) {
    ctx.lineJoin = 'round';
    ctx.lineWidth = o.lw || 4;
    ctx.strokeStyle = o.stroke;
    ctx.strokeText(str, x, y);
  }
  if (o.shadow) {
    ctx.fillStyle = o.shadow;
    ctx.fillText(str, x + (o.sx || 2), y + (o.sy || 2));
  }
  ctx.fillStyle = o.color || '#fff';

}

// ---------- пиксель-арт ----------
function compilePixel(rows, pal) {
  const groups = new Map();
  let w = 0;
  rows.forEach((row, y) => {
    w = Math.max(w, row.length);
    for (let x = 0; x < row.length; x++) {
      const col = pal[row[x]];
      if (!col) continue;
      if (!groups.has(col)) groups.set(col, new Path2D());
      groups.get(col).rect(x, y, 1, 1);
    }
  });
  return { w, h: rows.length, layers: [...groups.entries()] };
}
function drawPixel(ctx, art, x, y, s) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  for (const [c, p] of art.layers) {
    ctx.fillStyle = c;
    ctx.fill(p);
  }
  ctx.restore();
}

function drawKing(ctx, x, y, t, o) {
  ctx.save();
  ctx.translate(x, y);
  const bob = Math.sin(t * 2) * 1.5;

  ctx.beginPath();
  ctx.arc(0, 40 + bob, 36, Math.PI, 0);
  ctx.closePath();
  ctx.fillStyle = '#c62828';
  ctx.fill();
  ctx.lineWidth = 4;
  ctx.strokeStyle = '#ffd54f';
  ctx.beginPath();
  ctx.arc(0, 40 + bob, 34, Math.PI * 1.05, Math.PI * 1.95);
  ctx.stroke();
  // голова
  const hy = 6 + bob;
  circ(ctx, 0, hy, 21, '#f4c28f');
  // борода
  ctx.beginPath();
  ctx.moveTo(-20, hy + 2);
  ctx.quadraticCurveTo(-18, hy + 34, 0, hy + 38);
  ctx.quadraticCurveTo(18, hy + 34, 20, hy + 2);
  ctx.quadraticCurveTo(10, hy + 14, 0, hy + 12);
  ctx.quadraticCurveTo(-10, hy + 14, -20, hy + 2);
  ctx.fillStyle = '#7a4a24';
  ctx.fill();
  // усы
  ell(ctx, -7, hy + 9, 8, 3.5, '#5d3518');
  ell(ctx, 7, hy + 9, 8, 3.5, '#5d3518');
  // глаза
  const angry = o.rage > 0.5;
  ell(ctx, -7, hy - 2, 3.2, 4, '#fff');
  ell(ctx, 7, hy - 2, 3.2, 4, '#fff');
  circ(ctx, -6.5, hy - 1, 1.8, '#222');
  circ(ctx, 7.5, hy - 1, 1.8, '#222');
  ctx.lineWidth = 3;
  ctx.strokeStyle = '#5d3518';
  ctx.beginPath();
  ctx.moveTo(-12, hy - (angry ? 9 : 8));
  ctx.lineTo(-3, hy - (angry ? 5 : 8));
  ctx.moveTo(12, hy - (angry ? 9 : 8));
  ctx.lineTo(3, hy - (angry ? 5 : 8));
  ctx.stroke();
  if (o.laugh > 0) {
    ell(ctx, 0, hy + 14, 7, 5 + Math.abs(Math.sin(t * 18)) * 3, '#5a0d0d');
  }
  // корона
  poly(ctx, [-17, hy - 12, -19, hy - 32, -9, hy - 22, 0, hy - 36, 9, hy - 22, 19, hy - 32, 17, hy - 12], '#ffcc33', '#8a5a00', 3);
  poly(ctx, [-17, hy - 12, -19, hy - 32, -9, hy - 22, 0, hy - 36, 9, hy - 22, 19, hy - 32, 17, hy - 12], '#ffcc33');
  circ(ctx, 0, hy - 19, 3.5, '#e53935');

  circ(ctx, -26, 52 + bob, 7, '#f4c28f');

}

function drawTower(ctx, cx, t, o) {

  ctx.fillStyle = g;
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = '#4b4d58';

  ctx.save();
  rr(ctx, -125, 58, 250, 104, 10);
  ctx.clip();
  ctx.strokeStyle = 'rgba(40,40,60,0.35)';
  ctx.lineWidth = 2;
  for (let row = 0; row < 5; row++) {

      line(ctx, xx, yy, xx, yy + 21, 'rgba(40,40,60,0.35)', 2);
    }
  }
  ctx.restore();
  // платформа короля
  rr(ctx, -70, 50, 140, 16, 6);
  ctx.fillStyle = '#5a5d6b';
  ctx.fill();
  drawKing(ctx, 0, 8, t, o);
  // пушка, смотрящая на игрока
  const recoil = o.fire > 0 ? -o.fire * 8 : 0;

  cg.addColorStop(0, '#2a2a2e');
  cg.addColorStop(0.5, '#6b6b74');

  ell(ctx, 0, 98 + recoil, 24, 11, '#3c3c44');
  ell(ctx, 0, 98 + recoil, 16, 7, '#050505');

  rr(ctx, -40, 108, 80, 30, 8);
  ctx.fillStyle = '#273a7a';
  ctx.fill();
  ctx.strokeStyle = '#ffcc33';
  ctx.lineWidth = 3;
  ctx.stroke();
  drawCrown(ctx, 0, 124, 1.3);
  // полоса здоровья в стиле Clash Royale
  const bw = 190;
  rr(ctx, -bw / 2, 142, bw, 16, 5);
  ctx.fillStyle = '#2a1414';
  ctx.fill();
  if (o.hpRatio > 0) {
    rr(ctx, -bw / 2 + 2, 144, (bw - 4) * o.hpRatio, 12, 4);
    ctx.fillStyle = '#e53935';
    ctx.fill();
    rr(ctx, -bw / 2 + 2, 144, (bw - 4) * o.hpRatio, 4, 2);
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fill();
  }
  drawCrown(ctx, -bw / 2 - 6, 150, 0.95);
  text(ctx, String(Math.ceil(o.hp)), 0, 155, { font: `bold 13px ${FONT.ui}`, align: 'center', stroke: '#000', lw: 3 });
  // трещины, когда башня слабеет
  if (o.hpRatio < 0.66) {
    ctx.strokeStyle = 'rgba(30,30,40,0.7)';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(-90, 70);
    ctx.lineTo(-76, 92);
    ctx.lineTo(-84, 110);
    ctx.lineTo(-70, 128);
    if (o.hpRatio < 0.33) {
      ctx.moveTo(80, 64);
      ctx.lineTo(70, 84);
      ctx.lineTo(86, 100);
      ctx.moveTo(-20, 160);
      ctx.lineTo(-8, 144);
    }
    ctx.stroke();
  }
  ctx.restore();
}

// ---------- враги ----------
function drawZombie(ctx, x, y, t, o = {}) {
  const s = o.scale || 0.82;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  const ph = t * 5;
  const step = o.walking ? Math.sin(ph) : 0;
  ell(ctx, 0, 40, 24, 7, 'rgba(0,0,0,0.25)');
  // ноги
  ctx.fillStyle = '#4b3d30';
  rr(ctx, -13, 12 + step * 3, 10, 26, 3);
  ctx.fill();
  rr(ctx, 3, 12 - step * 3, 10, 26, 3);
  ctx.fill();
  ell(ctx, -9, 39 + step * 3, 8, 4, '#1e1a16');
  ell(ctx, 9, 39 - step * 3, 8, 4, '#1e1a16');
  // пиджак
  rr(ctx, -18, -14, 36, 32, 6);
  ctx.fillStyle = '#6d4c2f';
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#3e2a18';
  ctx.stroke();
  poly(ctx, [-7, -14, 7, -14, 0, 6], '#f0ece0');
  poly(ctx, [0, -12, -3, -4, 0, 9, 3, -4], '#c62828');
  // руки вперёд
  const arm = o.eating ? Math.sin(t * 14) * 4 : Math.sin(ph) * 2;
  ctx.fillStyle = '#6d4c2f';
  rr(ctx, -27, -10 + arm, 10, 22, 4);
  ctx.fill();
  rr(ctx, 17, -10 - arm, 10, 22, 4);
  ctx.fill();
  circ(ctx, -22, 14 + arm, 6, '#9fb48a');
  circ(ctx, 22, 14 - arm, 6, '#9fb48a');
  // голова
  const hy = -32 + (o.eating ? Math.abs(Math.sin(t * 14)) * 3 : 0);
  ell(ctx, 0, hy, 16, 17, '#b9c9a5');
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#6f7f60';
  ctx.stroke();
  circ(ctx, -6, hy - 3, 5.5, '#fff');
  circ(ctx, 6, hy - 2, 4.2, '#fff');
  circ(ctx, -5, hy - 2, 1.8, '#111');
  circ(ctx, 7, hy - 1, 1.5, '#111');
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-7, hy + 8);
  ctx.quadraticCurveTo(0, hy + (o.eating ? 13 : 10), 8, hy + 7);
  ctx.stroke();
  ctx.fillStyle = '#f5f5e8';
  ctx.fillRect(1, hy + 8, 3, 3);
  // волоски
  line(ctx, -3, hy - 16, -6, hy - 22, '#333', 1.5);
  line(ctx, 2, hy - 16, 3, hy - 23, '#333', 1.5);
  if (o.cone) {
    ctx.save();

    poly(ctx, [-11, -10, 12, -10, 9, -18, -7, -18], '#ffb35c');
    ell(ctx, 0, 2, 18, 4, '#d9701a');

  }
  ctx.restore();
}

function drawSnake(ctx, pts, dx, dy, t, o = {}) {
  if (!pts.length) return;
  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  const path = () => {
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  };
  if (pts.length > 1) {
    path();
    ctx.strokeStyle = '#27479f';
    ctx.lineWidth = 58;
    ctx.stroke();
    path();
    ctx.strokeStyle = o.color || '#4a7cf0';
    ctx.lineWidth = 50;
    ctx.stroke();
    path();
    ctx.strokeStyle = 'rgba(255,255,255,0.16)';
    ctx.lineWidth = 14;
    ctx.stroke();
  }
  const h = pts[0];
  circ(ctx, h.x, h.y, 31, '#27479f');
  circ(ctx, h.x, h.y, 27, o.color || '#4a7cf0');
  const px = -dy, py = dx;
  for (const sgn of [-1, 1]) {
    const ex = h.x + dx * 8 + px * 12 * sgn, ey = h.y + dy * 8 + py * 12 * sgn;
    circ(ctx, ex, ey, 10, '#fff');
    circ(ctx, ex + dx * 4, ey + dy * 4, 5, '#1d2340');
  }
  if (Math.sin(t * 3) > 0.7) {
    const tx = h.x + dx * 30, ty = h.y + dy * 30;
    line(ctx, tx, ty, tx + dx * 12, ty + dy * 12, '#e53935', 3);
    line(ctx, tx + dx * 12, ty + dy * 12, tx + dx * 16 + px * 5, ty + dy * 16 + py * 5, '#e53935', 2);
    line(ctx, tx + dx * 12, ty + dy * 12, tx + dx * 16 - px * 5, ty + dy * 16 - py * 5, '#e53935', 2);
  }
  ctx.restore();
}

// ---------- предметы ----------
function drawSun(ctx, x, y, r, t) {
  const g = ctx.createRadialGradient(x, y, r * 0.2, x, y, r * 1.9);
  g.addColorStop(0, 'rgba(255,240,120,0.55)');
  g.addColorStop(1, 'rgba(255,220,60,0)');
  ctx.fillStyle = g;
  circ(ctx, x, y, r * 1.9);
  ctx.fill();
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(t * 0.8);
  ctx.fillStyle = '#ffd21f';
  for (let i = 0; i < 12; i++) {
    ctx.rotate(TAU / 12);
    ctx.beginPath();
    ctx.moveTo(r * 0.7, -r * 0.24);
    ctx.lineTo(r * 1.38, 0);
    ctx.lineTo(r * 0.7, r * 0.24);
    ctx.fill();
  }
  ctx.restore();
  const cg = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.1, x, y, r);
  cg.addColorStop(0, '#fffbd0');
  cg.addColorStop(0.5, '#ffd000');
  cg.addColorStop(1, '#f5a800');
  circ(ctx, x, y, r, cg);
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#e09000';
  ctx.stroke();
}

function drawMine(ctx, x, y, r) {
  ctx.save();
  ctx.translate(x, y);
  ctx.strokeStyle = '#000';
  ctx.lineWidth = r * 0.28;
  for (let i = 0; i < 4; i++) {
    const a = (i * Math.PI) / 4;
    line(ctx, Math.cos(a) * r * 1.45, Math.sin(a) * r * 1.45, -Math.cos(a) * r * 1.45, -Math.sin(a) * r * 1.45, '#000', r * 0.28);
  }
  circ(ctx, 0, 0, r, '#000');
  ctx.fillStyle = '#fff';
  ctx.fillRect(-r * 0.5, -r * 0.5, r * 0.36, r * 0.36);
  ctx.restore();
}

function drawFlag(ctx, x, y, s = 1) {
  ctx.fillStyle = '#000';
  ctx.fillRect(x - 2 * s, y - 16 * s, 4 * s, 26 * s);
  ctx.fillRect(x - 13 * s, y + 9 * s, 26 * s, 5 * s);
  ctx.fillRect(x - 7 * s, y + 5 * s, 14 * s, 5 * s);

}

// ---------- аирдроп ----------
function drawAirdrop(ctx, x, y, t, landed) {
  if (!landed) {
    const cy = y - 125;
    const sway = Math.sin(t * 1.6) * 0.06;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(sway);
    ctx.translate(-x, -y);
    // стропы
    ctx.strokeStyle = 'rgba(40,40,40,0.7)';
    ctx.lineWidth = 1.2;
    const pts = [-92, -55, -18, 18, 55, 92];
    for (const p of pts) line(ctx, x + p, cy + 8, x + Math.sign(p) * 24, y - 22, 'rgba(40,40,40,0.7)', 1.2);
    // купол
    ctx.beginPath();
    ctx.ellipse(x, cy, 96, 60, 0, Math.PI, 0);
    for (let i = pts.length - 1; i >= 0; i--) {
      const px = x + pts[i] + (i === pts.length - 1 ? 4 : 0);
      ctx.quadraticCurveTo(px + 19, cy + 18, px, cy + 6);
    }
    ctx.closePath();
    const g = ctx.createLinearGradient(x - 96, cy - 60, x + 96, cy);
    g.addColorStop(0, '#7da447');
    g.addColorStop(1, '#3d5a21');
    ctx.fillStyle = g;
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#2a3d15';
    ctx.stroke();
    ctx.strokeStyle = 'rgba(25,40,10,0.55)';
    ctx.lineWidth = 2;
    for (const p of pts) {
      ctx.beginPath();
      ctx.moveTo(x, cy - 58);
      ctx.quadraticCurveTo(x + p * 0.7, cy - 40, x + p, cy + 6);
      ctx.stroke();
    }
    ctx.restore();
  }
  // ящик
  rr(ctx, x - 32, y - 24, 64, 48, 5);
  ctx.fillStyle = '#b3261e';
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = '#4d0c08';
  ctx.stroke();
  ctx.fillStyle = '#2f62c9';
  ctx.fillRect(x - 32, y - 6, 64, 12);
  ctx.fillStyle = '#e8e8e8';
  ctx.fillRect(x - 5, y - 24, 10, 48);
  text(ctx, 'ГРУЗ', x, y + 4, { font: `bold 10px ${FONT.ui}`, align: 'center', color: '#fff' });
}

// Удочка: рука в левом нижнем углу, кончик и поплавок.
function drawRod(ctx, o) {
  const hx = 96, hy = 712;
  const tipX = o.tipX, tipY = o.tipY;
  // рукав и перчатка
  poly(ctx, [-20, 760, 60, 640, 140, 690, 80, 780], '#46512f');
  // удилище (как палка из Minecraft — сегментами)
  const n = 7;
  for (let i = 0; i < n; i++) {
    const a = i / n, b = (i + 1) / n;
    line(ctx, lerp(hx, tipX, a), lerp(hy, tipY, a), lerp(hx, tipX, b), lerp(hy, tipY, b), i % 2 ? '#7a5230' : '#9a6a3c', 9 - i * 0.8);
  }
  circ(ctx, lerp(hx, tipX, 0.12), lerp(hy, tipY, 0.12), 9, '#555');
  circ(ctx, lerp(hx, tipX, 0.12), lerp(hy, tipY, 0.12), 4, '#999');
  rr(ctx, hx - 26, hy - 26, 52, 40, 16);
  ctx.fillStyle = '#1f1f22';
  ctx.fill();
  // леска и поплавок
  ctx.beginPath();
  ctx.moveTo(tipX, tipY);
  const sag = o.sag || 0;
  ctx.quadraticCurveTo((tipX + o.bx) / 2, Math.max(tipY, o.by) + sag, o.bx, o.by);
  ctx.strokeStyle = 'rgba(230,230,230,0.85)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  circ(ctx, o.bx, o.by, 7, '#fff');
  ctx.beginPath();
  ctx.arc(o.bx, o.by, 7, Math.PI, 0);
  ctx.fillStyle = '#e53935';
  ctx.fill();
  line(ctx, o.bx, o.by - 7, o.bx, o.by - 12, '#333', 1.5);
}

// ---------- интерфейс ----------
const LED_SEG = { 0: 'abcdef', 1: 'bc', 2: 'abged', 3: 'abgcd', 4: 'fgbc', 5: 'afgcd', 6: 'afgedc', 7: 'abc', 8: 'abcdefg', 9: 'abcdfg', '-': 'g' };
function drawLedDigit(ctx, ch, x, y, w, h) {
  const t = w * 0.2;
  const hh = h / 2;
  const segs = {
    a: [x + t, y, w - 2 * t, t],
    b: [x + w - t, y + t, t, hh - t * 1.5],
    c: [x + w - t, y + hh + t * 0.5, t, hh - t * 1.5],
    d: [x + t, y + h - t, w - 2 * t, t],
    e: [x, y + hh + t * 0.5, t, hh - t * 1.5],
    f: [x, y + t, t, hh - t * 1.5],
    g: [x + t, y + hh - t / 2, w - 2 * t, t],
  };
  const on = LED_SEG[ch] || '';
  for (const k in segs) {
    ctx.fillStyle = on.includes(k) ? '#ff1f1f' : '#3a0000';
    const s = segs[k];
    ctx.fillRect(s[0], s[1], s[2], s[3]);
  }
}
function drawLed(ctx, value, x, y) {
  ctx.fillStyle = '#000';
  ctx.fillRect(x, y, 66, 36);
  const str = value < 0 ? '-' + pad(-value, 2) : pad(Math.min(999, value), 3);
  for (let i = 0; i < 3; i++) drawLedDigit(ctx, str[i], x + 4 + i * 21, y + 4, 17, 28);
}
function bevel(ctx, x, y, w, h, raised, k = 3) {
  ctx.fillStyle = '#c0c0c0';
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = raised ? '#ffffff' : '#7b7b7b';
  ctx.fillRect(x, y, w, k);
  ctx.fillRect(x, y, k, h);
  ctx.fillStyle = raised ? '#7b7b7b' : '#ffffff';
  ctx.fillRect(x, y + h - k, w, k);
  ctx.fillRect(x + w - k, y, k, h);
}
function drawSmiley(ctx, x, y, r, state) {
  circ(ctx, x, y, r, '#ffe62e');
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#000';
  ctx.stroke();
  if (state === 'dead') {
    for (const ex of [-5, 5]) {
      line(ctx, x + ex - 2.5, y - 6.5, x + ex + 2.5, y - 1.5, '#000', 1.8);
      line(ctx, x + ex + 2.5, y - 6.5, x + ex - 2.5, y - 1.5, '#000', 1.8);
    }
    ctx.beginPath();
    ctx.arc(x, y + 9, 5, Math.PI * 1.15, Math.PI * 1.85);
    ctx.stroke();
  } else if (state === 'cool') {
    ctx.fillStyle = '#000';
    ctx.fillRect(x - 10, y - 6, 20, 5);
    rr(ctx, x - 10, y - 6, 8, 7, 2);
    ctx.fill();
    rr(ctx, x + 2, y - 6, 8, 7, 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x, y + 2, 6, 0.2 * Math.PI, 0.8 * Math.PI);
    ctx.stroke();
  } else {
    circ(ctx, x - 5, y - 4, 1.8, '#000');
    circ(ctx, x + 5, y - 4, 1.8, '#000');
    if (state === 'o') {
      ctx.beginPath();
      ctx.arc(x, y + 5, 3.5, 0, TAU);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.arc(x, y + 1, 6.5, 0.2 * Math.PI, 0.8 * Math.PI);
      ctx.stroke();
    }
  }
}
function drawStar(ctx, x, y, r, fill, stroke) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + (i * Math.PI) / 5;
    const rad = i % 2 ? r * 0.45 : r;
    ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
  }
  ctx.closePath();
  ctx.lineJoin = 'round';
  ctx.lineWidth = 3;
  ctx.strokeStyle = stroke;
  ctx.stroke();
  ctx.fillStyle = fill;
  ctx.fill();
}

'use strict';
/* Шахматная доска (фон) и логика поля «Сапёра». */

const Board = {
  canvas: null,
  key: '',
  LIGHT: '#eeeed2',
  DARK: '#769656',

  // Фон рисуется один раз в отдельный холст под текущее разрешение экрана.
  get(view) {
    const key = view.pw + 'x' + view.ph;
    if (this.canvas && this.key === key) return this.canvas;
    const c = this.canvas || document.createElement('canvas');
    c.width = view.pw;
    c.height = view.ph;
    const ctx = c.getContext('2d');
    ctx.setTransform(view.k, 0, 0, view.k, 0, 0);
    this.paint(ctx);
    this.canvas = c;
    this.key = key;
    return c;
  },

  paint(ctx) {
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        ctx.fillStyle = (r + c) % 2 === 0 ? this.LIGHT : this.DARK;
        ctx.fillRect(c * T, r * T, T, T);
      }
    }
    // лёгкая виньетка, чтобы края не спорили с интерфейсом
    const g = ctx.createRadialGradient(W / 2, H / 2, 200, W / 2, H / 2, 820);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(0,0,0,0.28)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    // чёрные фигуры — тыл короля
    const back = [[4, 'r'], [5, 'n'], [10, 'b'], [11, 'r']];
    for (const [c, k] of back) drawPiece(ctx, k, false, colX(c), rowY(0) + 2, 68);
    for (const c of [4, 5, 10, 11]) drawPiece(ctx, 'p', false, colX(c), rowY(1), 60);
    // белые фигуры у игрока
    const wb = [[0, 'n'], [1, 'b'], [2, 'r'], [3, 'q'], [12, 'k'], [13, 'r'], [14, 'b'], [15, 'n']];
    for (const [c, k] of wb) drawPiece(ctx, k, true, colX(c), rowY(8) - 4, 64);
    // рамка поля сапёра
    const x = MF.c0 * T, y = MF.r0 * T, w = MF.cols * T, h = MF.rows * T;
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(x - 3, y + h, w + 6, 6);
    ctx.fillStyle = '#7b7b7b';
    ctx.fillRect(x - 4, y - 4, w + 8, 4);
    ctx.fillRect(x - 4, y - 4, 4, h + 8);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(x - 4, y + h, w + 8, 4);
    ctx.fillRect(x + w, y - 4, 4, h + 8);
  },
};

// Состояния клетки
const HIDDEN = 0, OPEN = 1, FLAG = 2, BOOM = 3;

class Minefield {
  constructor(mines) {
    this.reset(mines);
  }

  reset(mines) {
    this.mines = mines;
    this.cells = [];
    for (let i = 0; i < MF.cols * MF.rows; i++) this.cells.push({ mine: false, adj: 0, s: HIDDEN, anim: 1, pop: 0 });
    this.generated = false;
    this.done = false;
    this.time = 0;
  }

  // Анимация «перестройки» поля после зачистки.
  rebuild(mines) {
    this.reset(mines);
    for (let r = 0; r < MF.rows; r++) for (let c = 0; c < MF.cols; c++) this.cell(c, r).pop = -(c + r) * 0.04;
  }

  inside(c, r) {
    return c >= 0 && r >= 0 && c < MF.cols && r < MF.rows;
  }
  cell(c, r) {
    return this.inside(c, r) ? this.cells[r * MF.cols + c] : null;
  }
  at(x, y) {
    const c = toCol(x) - MF.c0, r = toRow(y) - MF.r0;
    return this.inside(c, r) ? { c, r, cell: this.cell(c, r) } : null;
  }
  center(c, r) {
    return { x: colX(c + MF.c0), y: rowY(r + MF.r0) };
  }
  neighbors(c, r) {
    const out = [];
    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {
        if ((dr || dc) && this.inside(c + dc, r + dr)) out.push([c + dc, r + dr]);
      }
    }
    return out;
  }

  // Мины расставляются после первого хода: первая клетка и её соседи всегда безопасны.
  generate(sc, sr) {
    const free = [];
    for (let r = 0; r < MF.rows; r++) {
      for (let c = 0; c < MF.cols; c++) {
        if (Math.abs(c - sc) <= 1 && Math.abs(r - sr) <= 1) continue;
        free.push([c, r]);
      }
    }
    shuffle(free);
    for (let i = 0; i < Math.min(this.mines, free.length); i++) this.cell(free[i][0], free[i][1]).mine = true;
    for (let r = 0; r < MF.rows; r++) {
      for (let c = 0; c < MF.cols; c++) {
        this.cell(c, r).adj = this.neighbors(c, r).filter(([nc, nr]) => this.cell(nc, nr).mine).length;
      }
    }
    this.generated = true;
  }

  // Открыть клетку. Возвращает список открытых клеток и признак мины.
  open(c, r) {
    if (!this.generated) this.generate(c, r);
    const start = this.cell(c, r);
    const res = { opened: [], mine: null };
    if (!start || start.s !== HIDDEN) return res;
    if (start.mine) {
      start.s = BOOM;
      res.mine = { c, r };
      return res;
    }
    const queue = [[c, r]];
    while (queue.length) {
      const [qc, qr] = queue.pop();
      const cell = this.cell(qc, qr);
      if (cell.s !== HIDDEN || cell.mine) continue;
      cell.s = OPEN;
      cell.anim = 0;
      res.opened.push({ c: qc, r: qr });
      if (cell.adj === 0) {
        for (const [nc, nr] of this.neighbors(qc, qr)) if (this.cell(nc, nr).s === HIDDEN) queue.push([nc, nr]);
      }
    }
    return res;
  }

  // «Аккорд»: если вокруг числа стоит столько же флажков, открыть остальных соседей.
  chord(c, r) {
    const cell = this.cell(c, r);
    const res = { opened: [], mines: [] };
    if (!cell || cell.s !== OPEN || cell.adj === 0) return res;
    const nb = this.neighbors(c, r);
    const marked = nb.filter(([nc, nr]) => {
      const s = this.cell(nc, nr).s;
      return s === FLAG || s === BOOM;
    }).length;
    if (marked !== cell.adj) return res;
    for (const [nc, nr] of nb) {
      if (this.cell(nc, nr).s !== HIDDEN) continue;
      const o = this.open(nc, nr);
      res.opened.push(...o.opened);
      if (o.mine) res.mines.push(o.mine);
    }
    return res;
  }

  toggleFlag(c, r) {
    const cell = this.cell(c, r);
    if (!cell) return null;
    if (cell.s === HIDDEN) cell.s = FLAG;
    else if (cell.s === FLAG) cell.s = HIDDEN;
    else return null;
    return cell.s;
  }

  detonate(c, r) {
    const cell = this.cell(c, r);
    if (cell) cell.s = BOOM;
  }

  count(fn) {
    let n = 0;
    for (const cell of this.cells) if (fn(cell)) n++;
    return n;
  }
  get flags() {
    return this.count((c) => c.s === FLAG);
  }
  get booms() {
    return this.count((c) => c.s === BOOM);
  }
  get minesLeft() {
    return this.mines - this.flags - this.booms;
  }
  liveMines() {
    const out = [];
    for (let r = 0; r < MF.rows; r++) for (let c = 0; c < MF.cols; c++) {
      const cell = this.cell(c, r);
      if (cell.mine && cell.s !== BOOM) out.push({ c, r });
    }
    return out;
  }
  isCleared() {
    return this.generated && this.count((c) => !c.mine && c.s !== OPEN) === 0;
  }

  update(dt) {
    if (this.generated && !this.done) this.time += dt;
    for (const cell of this.cells) {
      if (cell.anim < 1) cell.anim = Math.min(1, cell.anim + dt * 5);
      if (cell.pop < 1) cell.pop = Math.min(1, cell.pop + dt * 2.5);
    }
  }

  draw(ctx, hover, t) {
    const x0 = MF.c0 * T, y0 = MF.r0 * T;
    for (let r = 0; r < MF.rows; r++) {
      for (let c = 0; c < MF.cols; c++) {
        const cell = this.cell(c, r);
        const x = x0 + c * T, y = y0 + r * T;
        const pop = Math.max(0, cell.pop);
        if (pop < 1) {
          // поле собирается заново — клетки «вырастают»
          if (pop <= 0) continue;
          ctx.save();
          ctx.translate(x + T / 2, y + T / 2);
          ctx.scale(easeOutCubic(pop), easeOutCubic(pop));
          ctx.translate(-T / 2, -T / 2);
          this.drawHidden(ctx, 0, 0, false);
          ctx.restore();
          continue;
        }
        if (cell.s === OPEN || cell.s === BOOM) {
          ctx.fillStyle = cell.s === BOOM ? '#e86a5a' : '#d9d9d9';
          ctx.fillRect(x, y, T, T);
          ctx.strokeStyle = '#9e9e9e';
          ctx.lineWidth = 2;
          ctx.strokeRect(x + 1, y + 1, T - 2, T - 2);
          if (cell.s === BOOM) {
            circ(ctx, x + T / 2, y + T / 2, 30, 'rgba(40,20,10,0.35)');
            drawMine(ctx, x + T / 2, y + T / 2, 15);
          } else if (cell.adj > 0) {
            drawMsDigit(ctx, cell.adj, x + T / 2, y + T / 2, 5);
          }
          if (cell.anim < 1) {
            // исчезающая крышка клетки
            const k = cell.anim;
            ctx.save();
            ctx.globalAlpha = 1 - k;
            ctx.translate(x + T / 2, y + T / 2);
            ctx.scale(1 - k * 0.4, 1 - k * 0.4);
            ctx.translate(-T / 2, -T / 2);
            this.drawHidden(ctx, 0, 0, false);
            ctx.restore();
          }
        } else {
          const hov = hover && hover.c === c && hover.r === r;
          this.drawHidden(ctx, x, y, hov);
          if (cell.s === FLAG) drawFlag(ctx, x + T / 2 + 2, y + T / 2 - 2, 1.5);
        }
      }
    }
  }

  // Закрытая клетка в стиле классического «Сапёра» (выпуклая).
  drawHidden(ctx, x, y, hover) {
    ctx.fillStyle = hover ? '#d8d8d8' : '#c3c3c3';
    ctx.fillRect(x, y, T, T);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(x, y, T, 6);
    ctx.fillRect(x, y, 6, T);
    ctx.fillStyle = '#7b7b7b';
    ctx.fillRect(x, y + T - 6, T, 6);
    ctx.fillRect(x + T - 6, y, 6, T);
    ctx.fillStyle = '#a8a8a8';
    ctx.fillRect(x + T - 6, y, 6, 6);
    ctx.fillRect(x, y + T - 6, 6, 6);
  }
}

'use strict';
/* Враги, белые фигуры-защитники, Пак-Ман, предметы, аирдропы и снаряды. */

const ENEMY_DEF = {
  pawn: { hp: 3, dmg: 2, bounty: 50, xp: 3, hw: 24, top: 36, bot: 34, name: 'Чёрная пешка', piece: 'p' },
  knight: { hp: 5, dmg: 3, bounty: 120, xp: 5, hw: 26, top: 38, bot: 34, name: 'Чёрный конь', piece: 'n' },
  rook: { hp: 9, dmg: 4, bounty: 200, xp: 8, hw: 26, top: 36, bot: 34, name: 'Чёрная ладья', piece: 'r' },
  bishop: { hp: 6, dmg: 3, bounty: 150, xp: 6, hw: 24, top: 40, bot: 34, name: 'Чёрный слон', piece: 'b' },
  zombie: { hp: 5, dmg: 4, bounty: 100, xp: 4, hw: 24, top: 42, bot: 36, name: 'Зомби' },
  cone: { hp: 10, dmg: 4, bounty: 150, xp: 6, hw: 24, top: 64, bot: 36, name: 'Зомби с конусом' },
  freddy: { hp: 6, dmg: 6, bounty: 500, xp: 15, hw: 26, top: 56, bot: 36, name: 'Золотой Фредди' },
  snake: { hp: 15, dmg: 4, bounty: 300, xp: 12, hw: 30, top: 30, bot: 30, name: 'Змейка' },
};

const FX = {
  burst(g, x, y, n, o = {}) {
    for (let i = 0; i < n; i++) {
      const a = o.angle !== undefined ? o.angle + rand(-o.spread, o.spread) : rand(0, TAU);
      const sp = rand((o.speed || 200) * 0.3, o.speed || 200);
      const life = rand((o.life || 0.6) * 0.6, o.life || 0.6);
      g.particles.push({
        x: x + rand(-(o.jitter || 0), o.jitter || 0),
        y: y + rand(-(o.jitter || 0), o.jitter || 0),
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - (o.up || 0),
        grav: o.grav !== undefined ? o.grav : 500,
        life,
        max: life,
        size: rand((o.size || 5) * 0.6, o.size || 5),
        color: Array.isArray(o.colors) ? choice(o.colors) : o.colors || '#fff',
        shape: o.shape || 'sq',
        rot: rand(0, TAU),
        vr: rand(-10, 10),
        drag: o.drag || 0,
      });
    }
    if (g.particles.length > 700) g.particles.splice(0, g.particles.length - 700);
  },
  text(g, x, y, str, o = {}) {
    g.texts.push({
      x, y, str,
      color: o.color || '#fff',
      font: o.font || `bold 18px ${FONT.ui}`,
      life: o.life || 1.1,
      max: o.life || 1.1,
      vy: o.vy !== undefined ? o.vy : -50,
      stroke: o.stroke || '#000',
    });
  },
};

class Enemy {
  constructor(type, x, y) {
    const d = ENEMY_DEF[type];
    this.type = type;
    this.def = d;
    this.x = x;
    this.y = y;
    this.gy = y;
    this.hp = d.hp;
    this.maxHp = d.hp;
    this.flash = 0;
    this.frozen = 0;
    this.age = 0;
    this.dead = false;
    this.remove = false;
    this.deathT = 0;
    this.air = false;
    this.spawnFx = 0.35;
  }
  get alive() {
    return !this.dead && !this.remove;
  }
  get col() {
    return clamp(Math.floor(this.x / T), 0, COLS - 1);
  }
  hit(px, py) {
    const d = this.def;
    return px >= this.x - d.hw && px <= this.x + d.hw && py >= this.y - d.top && py <= this.y + d.bot;
  }
  distTo(px, py) {
    return Math.hypot(px - this.x, py - this.y);
  }
  damage(n, g, src) {
    if (!this.alive) return false;
    this.hp -= n;
    this.flash = 0.09;
    if (this.hp <= 0) {
      this.dead = true;
      this.deathT = 0;
      g.onKill(this, src);
    }
    return true;
  }
  // Общая часть обновления. true — движение в этом кадре пропускается.
  baseUpdate(dt) {
    this.age += dt;
    if (this.spawnFx > 0) this.spawnFx -= dt;
    if (this.flash > 0) this.flash -= dt;
    if (this.dead) {
      this.deathT += dt;
      if (this.deathT > 0.6) this.remove = true;
      return true;
    }
    if (this.frozen > 0) {
      this.frozen -= dt;
      return true;
    }
    return false;
  }
  beginDraw(ctx) {
    ctx.save();
    if (this.dead) ctx.globalAlpha = Math.max(0, 1 - this.deathT / 0.6);
    if (this.flash > 0) ctx.filter = 'brightness(2.6)';
    if (this.spawnFx > 0) {
      const k = 1 - this.spawnFx / 0.35;
      ctx.globalAlpha *= k;
    }
  }
  endDraw(ctx) {
    ctx.restore();
    if (this.frozen > 0 && !this.dead) {
      const d = this.def;
      rr(ctx, this.x - d.hw - 4, this.y - d.top - 4, d.hw * 2 + 8, d.top + d.bot + 8, 8);
      ctx.fillStyle = 'rgba(170,225,255,0.45)';
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = 'rgba(255,255,255,0.85)';
      ctx.stroke();
    }
    if (this.alive && this.hp < this.maxHp) {
      const w = 40, x = this.x - w / 2, y = this.y - this.def.top - 12;
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(x - 1, y - 1, w + 2, 6);
      ctx.fillStyle = '#e53935';
      ctx.fillRect(x, y, w * Math.max(0, this.hp / this.maxHp), 4);
    }
  }
}

// Шахматные фигуры ходят по правилам (почти).
class ChessEnemy extends Enemy {
  constructor(type, c, r) {
    super(type, colX(c), rowY(r));
    this.c = c;
    this.r = r;
    this.wait = this.interval() * rand(0.5, 0.9);
    this.mv = null;
    this.dx = Math.random() < 0.5 ? -1 : 1;
  }
  interval() {
    return { pawn: 2.4, knight: 2.6, rook: 3.0, bishop: 2.3 }[this.type];
  }
  update(dt, g) {
    if (this.baseUpdate(dt)) return;
    if (this.mv) {
      const m = this.mv;
      m.t += dt / m.dur;
      const k = Math.min(1, m.t);
      const e = easeInOut(k);
      this.x = lerp(m.fx, m.tx, e);
      this.gy = lerp(m.fy, m.ty, e);
      this.y = this.gy - Math.sin(k * Math.PI) * m.arc;
      this.air = m.arc > 0 && k < 0.9;
      if (k >= 1) {
        this.mv = null;
        this.air = false;
        this.c = m.c;
        this.r = m.r;
        this.land(g, m);
      }
      return;
    }
    this.wait -= dt;
    if (this.wait <= 0) {
      this.wait = this.interval() * rand(0.85, 1.15);
      this.plan(g);
    }
  }
  moveTo(c, r, capture, arc, dur) {
    this.mv = { fx: this.x, fy: this.gy, tx: colX(c), ty: rowY(r), c, r, capture, arc, dur, t: 0 };
  }
  land(g, m) {
    Sound.tok();
    if (m.capture && g.def[m.c]) {
      g.killDefender(m.c, this);
      FX.text(g, this.x, this.y - 40, 'ВЗЯТИЕ!', { color: '#ffd54a' });
    }
    if (this.r >= ROWS - 1) {
      if (this.type === 'pawn') FX.text(g, this.x, this.y - 50, 'ПРЕВРАЩЕНИЕ!', { color: '#ff7aa8' });
      g.enemyReached(this);
      return;
    }
    g.checkTrapAt(this.x, this.gy, this);
  }
  plan(g) {
    const c = this.c, r = this.r;
    if (this.type === 'pawn') {
      const nr = r + 1;
      if (nr === PAWN_ROW && g.def[c]) {
        // пешка не может идти вперёд в занятую клетку — только бить наискосок
        const opts = [c - 1, c + 1].filter((cc) => cc >= 0 && cc < COLS && g.def[cc]);
        if (opts.length) this.moveTo(choice(opts), nr, true, 20, 0.35);
      } else {
        this.moveTo(c, nr, false, 20, 0.35);
      }
    } else if (this.type === 'knight') {
      const opts = [];
      for (const [dr, dc] of [[2, 1], [2, -1], [1, 2], [1, -2]]) {
        const cc = c + dc, rr2 = r + dr;
        if (cc >= 0 && cc < COLS && rr2 <= ROWS - 1) opts.push([cc, rr2]);
      }
      const [cc, rr2] = opts.length ? choice(opts) : [c, r + 1];
      this.moveTo(cc, rr2, rr2 === PAWN_ROW && !!g.def[cc], 46, 0.45);
    } else if (this.type === 'rook') {
      let nr = Math.min(ROWS - 1, r + 2);
      if (r < PAWN_ROW && nr >= PAWN_ROW && g.def[c]) nr = PAWN_ROW;
      this.moveTo(c, nr, nr === PAWN_ROW && !!g.def[c], 0, 0.3);
    } else if (this.type === 'bishop') {
      if (c + this.dx < 0 || c + this.dx >= COLS) this.dx *= -1;
      const cc = c + this.dx, nr = r + 1;
      this.moveTo(cc, nr, nr === PAWN_ROW && !!g.def[cc], 12, 0.35);
    }
  }
  draw(ctx) {
    if (this.air) ell(ctx, this.x, this.gy + 34, 22, 6, 'rgba(0,0,0,0.22)');
    this.beginDraw(ctx);
    if (this.dead) {
      ctx.translate(this.x, this.gy + 34);
      ctx.rotate(Math.min(1, this.deathT / 0.4) * 1.4);
      ctx.translate(-this.x, -(this.gy + 34));
    }
    drawPiece(ctx, this.def.piece, false, this.x, this.y, 70, { shadow: !this.air });
    this.endDraw(ctx);
  }
}

class Zombie extends Enemy {
  constructor(type, c) {
    super(type, colX(c) + rand(-6, 6), rowY(MF.r0) - 10);
    this.speed = type === 'cone' ? 13 : 15;
    this.eating = false;
    this.chompT = 0;
    this.groanT = rand(3, 9);
    this.phase = rand(0, 10);
  }
  damage(n, g, src) {
    const hadCone = this.type === 'cone' && this.hp > 5;
    const r = super.damage(n, g, src);
    if (hadCone && this.hp <= 5 && !this.dead) {
      FX.burst(g, this.x, this.y - 60, 6, { colors: ['#f08a24', '#ffb35c'], size: 8, speed: 180, up: 120 });
      FX.text(g, this.x, this.y - 70, 'конус слетел!', { color: '#ffb35c', font: `bold 14px ${FONT.ui}` });
    }
    return r;
  }
  update(dt, g) {
    if (this.baseUpdate(dt)) return;
    const c = this.col, d = g.def[c];
    const contact = PAWN_ROW * T - 24;
    if (d && this.y >= contact && this.y < PAWN_ROW * T + 30) {
      this.eating = true;
      d.hp -= dt;
      d.hurt = 0.1;
      this.chompT -= dt;
      if (this.chompT <= 0) {
        this.chompT = 0.5;
        Sound.chomp();
      }
      if (d.hp <= 0) g.killDefender(c, this);
    } else {
      this.eating = false;
      this.y += this.speed * dt;
    }
    this.gy = this.y;
    this.groanT -= dt;
    if (this.groanT <= 0) {
      this.groanT = rand(7, 15);
      Sound.groan();
    }
    g.checkTrapAt(this.x, this.y, this);
    if (this.y >= ROWS * T - 60) g.enemyReached(this);
  }
  draw(ctx, t) {
    this.beginDraw(ctx);
    if (this.dead) {
      ctx.translate(this.x, this.y + 30);
      ctx.rotate(-Math.min(1, this.deathT / 0.45) * 1.5);
      ctx.translate(-this.x, -(this.y + 30));
    }
    drawZombie(ctx, this.x, this.y, t + this.phase, {
      cone: this.type === 'cone' && this.hp > 5,
      eating: this.eating,
      walking: !this.eating && this.frozen <= 0 && !this.dead,
    });
    this.endDraw(ctx);
  }
}

// Появляется только ночью (с 00:00 до 06:00) и телепортируется к игроку.
class Freddy extends Enemy {
  constructor(c, r) {
    super('freddy', colX(c), rowY(r));
    this.c = c;
    this.r = r;
    this.tp = 1.9;
    this.glitch = 0.4;
    this.spawnFx = 0.6;
    Sound.staticNoise();
  }
  update(dt, g) {
    if (this.baseUpdate(dt)) return;
    if (this.glitch > 0) this.glitch -= dt;
    this.tp -= dt;
    if (this.tp <= 0) {
      this.tp = rand(1.4, 2.0);
      if (this.r + 1 >= PAWN_ROW) {
        g.startJumpscare(this);
        return;
      }
      this.r += 1;
      this.c = clamp(this.c + randi(-1, 1), 0, COLS - 1);
      this.x = colX(this.c);
      this.y = this.gy = rowY(this.r);
      this.glitch = 0.25;
      g.staticFx = 0.15;
      Sound.staticNoise();
    }
  }
  draw(ctx, t) {
    this.beginDraw(ctx);
    ctx.globalAlpha *= 0.82 + Math.sin(t * 23) * 0.12;
    let ox = 0;
    if (this.glitch > 0) ox = rand(-8, 8);
    drawFreddy(ctx, this.x + ox, this.y, t, { glow: true });
    if (this.glitch > 0) {
      ctx.globalAlpha *= 0.4;
      drawFreddy(ctx, this.x - ox * 2, this.y, t, { glow: true });
    }
    this.endDraw(ctx);
  }
}

// Змейка ползёт «змейкой» по рядам, как в старых играх, и ест предметы.
class Snake extends Enemy {
  constructor(fromLeft) {
    super('snake', 0, 0);
    this.dir = fromLeft ? 1 : -1;
    const len = 5;
    this.segs = [];
    for (let i = 0; i < len; i++) this.segs.push({ c: fromLeft ? -1 - i : COLS + i, r: MF.r0 });
    this.prev = this.segs.map((s) => ({ ...s }));
    this.hp = this.maxHp = len * 3;
    this.stepT = 0;
    this.stepDur = 0.26;
    this.k = 1;
    this.mdx = this.dir;
    this.mdy = 0;
    this.spawnFx = 0;
    this.sync();
    Sound.hiss();
  }
  segPos(i) {
    const a = this.prev[i] || this.segs[i], b = this.segs[i];
    return { x: lerp(colX(a.c), colX(b.c), this.k), y: lerp(rowY(a.r), rowY(b.r), this.k) };
  }
  sync() {
    const h = this.segPos(0);
    this.x = h.x;
    this.y = this.gy = h.y;
  }
  hit(px, py) {
    for (let i = 0; i < this.segs.length; i++) {
      const p = this.segPos(i);
      if (dist2(px, py, p.x, p.y) < 34 * 34) return true;
    }
    return false;
  }
  distTo(px, py) {
    let best = Infinity;
    for (let i = 0; i < this.segs.length; i++) {
      const p = this.segPos(i);
      best = Math.min(best, Math.hypot(px - p.x, py - p.y));
    }
    return best;
  }
  inRow(row) {
    return this.segs.some((s) => s.r === row);
  }
  damage(n, g, src) {
    const r = super.damage(n, g, src);
    while (!this.dead && this.segs.length > 2 && this.hp <= 3 * (this.segs.length - 1)) {
      const tail = this.segs.pop();
      this.prev.length = this.segs.length;
      FX.burst(g, colX(tail.c), rowY(tail.r), 10, { colors: ['#4a7cf0', '#27479f', '#9bb8ff'], size: 9, speed: 220 });
    }
    return r;
  }
  update(dt, g) {
    if (this.baseUpdate(dt)) return;
    this.stepT += dt;
    this.k = Math.min(1, this.stepT / this.stepDur);
    if (this.stepT >= this.stepDur) {
      this.stepT -= this.stepDur;
      this.k = 0;
      this.step(g);
    }
    this.sync();
  }
  step(g) {
    this.prev = this.segs.map((s) => ({ ...s }));
    const h = this.segs[0];
    let nc = h.c + this.dir, nr = h.r;
    const inside = h.c >= 0 && h.c < COLS;
    if (inside && (nc < 0 || nc >= COLS)) {
      nc = h.c;
      nr = h.r + 1;
      this.dir *= -1;
    }
    this.mdx = Math.sign(nc - h.c);
    this.mdy = Math.sign(nr - h.r);
    for (let i = this.segs.length - 1; i > 0; i--) this.segs[i] = { ...this.segs[i - 1] };
    this.segs[0] = { c: nc, r: nr };
    if (nr >= PAWN_ROW) {
      if (g.def[nc]) g.killDefender(nc, this);
      g.enemyReached(this);
      return;
    }
    // съедает предметы на пути и растёт
    const hx = colX(nc), hy = rowY(nr);
    for (const it of g.items) {
      if (it.gone || it.falling) continue;
      if (Math.abs(it.x - hx) < T / 2 && Math.abs(it.y - hy) < T / 2) {
        it.gone = true;
        const tail = this.prev[this.prev.length - 1];
        this.segs.push({ ...tail });
        this.prev.push({ ...tail });
        this.hp += 3;
        this.maxHp += 3;
        FX.text(g, hx, hy - 40, 'ням!', { color: '#9bb8ff' });
        Sound.chomp();
      }
    }
    g.checkTrapAt(hx, hy, this);
  }
  draw(ctx, t) {
    const pts = this.segs.map((_, i) => this.segPos(i));
    ctx.save();
    if (this.dead) ctx.globalAlpha = Math.max(0, 1 - this.deathT / 0.6);
    if (this.flash > 0) ctx.filter = 'brightness(1.8)';
    drawSnake(ctx, pts, this.mdx, this.mdy, t, { color: this.frozen > 0 ? '#9fd4ff' : null });
    ctx.restore();
    if (this.alive && this.hp < this.maxHp) {
      const w = 40, x = this.x - w / 2, y = this.y - 46;
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(x - 1, y - 1, w + 2, 6);
      ctx.fillStyle = '#e53935';
      ctx.fillRect(x, y, w * Math.max(0, this.hp / this.maxHp), 4);
    }
  }
}

// ---------- белые фигуры игрока ----------
const DEF_STATS = {
  pawn: { hp: 4, cost: 50, cd: 1.4, name: 'Пешка', piece: 'p', info: 'бьёт наискосок' },
  bishop: { hp: 4, cost: 100, cd: 1.8, name: 'Слон', piece: 'b', info: 'стреляет по диагоналям' },
  rook: { hp: 14, cost: 125, cd: 0, name: 'Ладья', piece: 'r', info: 'крепкая стена' },
};
const PACKETS = ['pawn', 'bishop', 'rook'];

function makeDefender(type) {
  const s = DEF_STATS[type];
  return { type, hp: s.hp, maxHp: s.hp, cd: rand(0, s.cd), lunge: 0, lungeDir: 0, pop: 0, hurt: 0 };
}

function drawDefender(ctx, d, c, t) {
  const x = colX(c) + d.lungeDir * Math.sin(d.lunge * Math.PI) * 26;
  const y = rowY(PAWN_ROW) - Math.sin(d.lunge * Math.PI) * 18;
  const k = easeOutCubic(Math.min(1, d.pop));
  ctx.save();
  ctx.translate(x, y + 30);
  ctx.scale(k, k);
  ctx.translate(-x, -(y + 30));
  if (d.hurt > 0) ctx.filter = 'brightness(0.7) sepia(1) hue-rotate(-50deg) saturate(4)';
  drawPiece(ctx, DEF_STATS[d.type].piece, true, x, y, d.type === 'rook' ? 70 : 66);
  ctx.restore();
  if (d.hp < d.maxHp) {
    const w = 36, bx = colX(c) - w / 2, by = rowY(PAWN_ROW) - 42;
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(bx - 1, by - 1, w + 2, 5);
    ctx.fillStyle = '#7ee03c';
    ctx.fillRect(bx, by, w * Math.max(0, d.hp / d.maxHp), 3);
  }
}

// ---------- Пак-Ман: «газонокосилка» последнего ряда ----------
class PacMan {
  constructor() {
    this.state = 'parked';
    this.x = 40;
    this.row = PAWN_ROW;
    this.y = rowY(PAWN_ROW);
    this.mouth = 0;
    this.cool = 0;
    this.combo = 0;
    this.power = false;
    this.wakaT = 0;
  }
  launch(row, power) {
    if (this.state === 'run') return false;
    this.row = row;
    this.y = rowY(row);
    if (!(this.state === 'parked' && row === PAWN_ROW)) this.x = -50;
    this.state = 'run';
    this.combo = 0;
    this.power = power;
    return true;
  }
  update(dt, g) {
    this.mouth += dt * 14;
    if (this.state === 'run') {
      this.x += 640 * dt;
      this.wakaT -= dt;
      if (this.wakaT <= 0) {
        this.wakaT = 0.13;
        Sound.waka();
      }
      const band = this.row === PAWN_ROW ? 72 : 46;
      for (const e of g.enemies) {
        if (!e.alive) continue;
        let near;
        if (e instanceof Snake) near = e.segs.some((s) => Math.abs(rowY(s.r) - this.y) < band && Math.abs(colX(s.c) - this.x) < 40);
        else near = Math.abs(e.y - this.y) < band && Math.abs(e.x - this.x) < 40;
        if (near) {
          this.combo++;
          const pts = 100 * Math.pow(2, Math.min(4, this.combo));
          e.damage(999, g, 'pac');
          g.addMoney(pts, e.x, e.y - 50, '#7ff');
          Sound.pacEat();
        }
      }
      if (this.x > W + 60) {
        if (this.power) {
          this.state = 'return';
          this.x = -50;
          this.row = PAWN_ROW;
          this.y = rowY(PAWN_ROW);
        } else {
          this.state = 'gone';
          this.cool = 35;
        }
      }
    } else if (this.state === 'gone') {
      this.cool -= dt;
      if (this.cool <= 0) {
        this.state = 'return';
        this.x = -50;
        this.row = PAWN_ROW;
        this.y = rowY(PAWN_ROW);
      }
    } else if (this.state === 'return') {
      this.x += 110 * dt;
      if (this.x >= 40) {
        this.x = 40;
        this.state = 'parked';
        g.say('Пак-Ман вернулся на пост.', '#ffe600');
      }
    }
  }
  draw(ctx, t) {
    if (this.state === 'gone') return;
    const r = this.power ? 34 : 28;
    if (this.state === 'parked') {
      for (const dx of [84, 108]) circ(ctx, dx, this.y, 4, '#ffe9b0');
    }
    drawPac(ctx, this.x, this.y, r, 0, this.state === 'parked' ? this.mouth * 0.4 : this.mouth, this.power ? '#fff04a' : '#ffe600');
  }
}

// ---------- предметы на доске ----------
class Loot {
  constructor(kind, key, x, y, ty, vy) {
    this.kind = kind; // 'sun' | 'item'
    this.key = key;
    this.x = x;
    this.y = y;
    this.ty = ty;
    this.vy = vy;
    this.falling = y < ty;
    this.life = kind === 'sun' ? 12 : 14;
    this.t = rand(0, 5);
    this.gone = false;
  }
  update(dt) {
    this.t += dt;
    if (this.falling) {
      this.y += this.vy * dt;
      if (this.y >= this.ty) {
        this.y = this.ty;
        this.falling = false;
      }
    } else {
      this.life -= dt;
      if (this.life <= 0) this.gone = true;
    }
  }
  draw(ctx) {
    if (this.life < 3 && Math.floor(this.t * 8) % 2 === 0) return;
    if (this.kind === 'sun') {
      drawSun(ctx, this.x, this.y, 20, this.t);
    } else {
      const by = this.y + Math.sin(this.t * 3) * 3;
      circ(ctx, this.x, by, 24, 'rgba(255,255,255,0.35)');
      drawItemIcon(ctx, this.key, this.x, by, 34, this.t);
    }
  }
}

class Airdrop {
  constructor() {
    this.x = rand(260, 1020);
    this.y = -120;
    this.ty = rand(270, 470);
    this.state = 'fall';
    this.t = 0;
    this.life = 16;
    this.smokeT = 0;
    this.gone = false;
  }
  update(dt, g) {
    this.t += dt;
    if (this.state === 'fall') {
      this.y += 48 * dt;
      if (this.y >= this.ty) {
        this.y = this.ty;
        this.state = 'land';
        Sound.thud();
        FX.burst(g, this.x, this.y + 20, 14, { colors: ['#c8b89a', '#a89878'], size: 6, speed: 160, grav: 300 });
      }
    } else {
      this.life -= dt;
      this.smokeT -= dt;
      if (this.smokeT <= 0) {
        this.smokeT = 0.08;
        FX.burst(g, this.x + 26, this.y - 20, 1, { colors: ['rgba(230,60,50,0.55)', 'rgba(255,90,80,0.45)'], size: 22, speed: 30, grav: -60, life: 1.8, shape: 'circle', angle: -Math.PI / 2, spread: 0.6 });
      }
      if (this.life <= 0) this.gone = true;
    }
  }
  hit(px, py) {
    if (Math.abs(px - this.x) < 40 && py > this.y - 34 && py < this.y + 34) return true;
    return this.state === 'fall' && Math.abs(px - this.x) < 96 && py > this.y - 190 && py < this.y - 30;
  }
  draw(ctx) {
    if (this.state === 'land' && this.life < 3 && Math.floor(this.t * 8) % 2 === 0) return;
    drawAirdrop(ctx, this.x, this.y, this.t, this.state === 'land');
  }
}

// Ядро из королевской пушки летит прямо в камеру — его надо сбить.
class Cannonball {
  constructor(tx, ty) {
    this.sx = 640;
    this.sy = 98;
    this.tx = tx;
    this.ty = ty;
    this.t = 0;
    this.dur = 2.8;
    this.gone = false;
  }
  get k() {
    return Math.min(1, this.t / this.dur);
  }
  get pos() {
    const k = this.k;
    return { x: lerp(this.sx, this.tx, k), y: lerp(this.sy, this.ty, k) - Math.sin(k * Math.PI) * 70, s: 0.25 + 2.1 * k * k };
  }
  hit(px, py) {
    const p = this.pos;
    const r = 15 * p.s + 16;
    return dist2(px, py, p.x, p.y) < r * r;
  }
  draw(ctx) {
    const p = this.pos;
    const k = this.k;
    // прицельная метка — куда прилетит
    ctx.save();
    ctx.globalAlpha = 0.4 + k * 0.5;
    ctx.strokeStyle = '#ff2b2b';
    ctx.lineWidth = 3;
    const rr2 = 60 - k * 30;
    ctx.beginPath();
    ctx.arc(this.tx, this.ty, rr2, 0, TAU);
    ctx.stroke();
    line(ctx, this.tx - rr2 - 8, this.ty, this.tx - rr2 + 10, this.ty, '#ff2b2b', 3);
    line(ctx, this.tx + rr2 - 10, this.ty, this.tx + rr2 + 8, this.ty, '#ff2b2b', 3);
    ctx.restore();
    const r = 15 * p.s;
    const g = ctx.createRadialGradient(p.x - r * 0.35, p.y - r * 0.35, r * 0.1, p.x, p.y, r);
    g.addColorStop(0, '#8a8a96');
    g.addColorStop(0.6, '#2c2c34');
    g.addColorStop(1, '#0d0d10');
    circ(ctx, p.x, p.y, r, g);
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(255,120,40,0.6)';
    ctx.stroke();
  }
}
