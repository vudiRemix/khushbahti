          opened.push(...this.mf.open(c, r).opened);
        }
      }
    }
    this.rewardTiles(opened);
    this.checkCleared();
  }

  updateMissiles(dt) {
    for (const m of this.missiles) {
      m.t += dt;
      if (m.t < 0) continue;
      if (!m.launched) {
        m.launched = true;
        Sound.missile();
        if (m.c !== undefined) this.mf.detonate(m.c, m.r);
      }
      if (m.toBoss) {
        const bc = this.tower.center;
        m.x1 = bc.x + m.ox;
        m.y1 = bc.y + m.oy;
      }
      const k = Math.min(1, m.t / m.dur);
      const px = m.x, py = m.y;
      m.x = lerp(m.x0, m.x1, k);
      m.y = lerp(m.y0, m.y1, k) - Math.sin(k * Math.PI) * (m.bomb ? 0 : 160);
      m.ang = Math.atan2(m.y - py, m.x - px);
      FX.burst(this, m.x, m.y, 1, { colors: ['rgba(200,200,200,0.6)'], size: 12, speed: 20, grav: -30, life: 0.5, shape: 'circle' });
      if (k >= 1) {
        m.gone = true;
        this.explosions.push({ x: m.x1, y: m.y1, r: 60, t: 0 });
        FX.burst(this, m.x1, m.y1, 14, { colors: ['#ffef8a', '#ff6d00', '#9a9dab'], size: 8, speed: 300, life: 0.6 });
        Sound.explosion(false);
        this.damageTower(m.dmg, true);
      }
    }
  }

  openAirdrop(a) {
    a.gone = true;
    const got = [];
    for (let i = 0; i < 3; i++) {
      let k = weighted(DROP_LOOT);
      if (k === 'totem' && this.inv.totem >= 2) k = 'gapple';
      got.push(k);
      this.giveItem(k, 1, a.x + (i - 1) * 30, a.y);
    }
    this.say('Аирдроп: ' + got.map((k) => ITEM_INFO[k].name).join(', '), '#9ccc65');
    FX.burst(this, a.x, a.y, 20, { colors: ['#b3261e', '#e8e8e8', '#2f62c9'], size: 8, speed: 260, up: 150 });
  }

  // ---------- игрок ----------
  updateBoost(realDt) {
    const p = this.player;
    const want = Input.keys.has('ShiftLeft') || Input.keys.has('ShiftRight');
    if (want && !this.boostLock && p.boost > 0 && !this.jumpscare) {
      if (!this.slowmo) Sound.whoosh();
      this.slowmo = true;
      p.boost = Math.max(0, p.boost - 28 * realDt);
      if (p.boost <= 0) this.boostLock = true;
      this.boostIdle = 0;
    } else {
      this.slowmo = false;
      this.boostIdle += realDt;
      if (this.boostIdle > 1) p.boost = Math.min(100, p.boost + 6 * realDt);
      if (!want) this.boostLock = false;
    }
    this.timeScale = lerp(this.timeScale, this.slowmo ? 0.35 : 1, Math.min(1, realDt * 10));
  }

  updatePlayer(dt) {
    const p = this.player;
    p.hungerT += dt;
    if (p.hungerT >= CFG.hungerTick) {
      p.hungerT = 0;
      p.hunger = Math.max(0, p.hunger - 1);
      if (p.hunger === 6) this.say('Ты проголодался. Съешь стейк (1).', '#ffcc80');
    }
    if (p.hunger >= 16 && p.hp < p.maxHp) {
      p.regenT += dt;
      if (p.regenT >= 4) {
        p.regenT = 0;
        p.hp = Math.min(p.maxHp, p.hp + 1);
        p.hunger = Math.max(0, p.hunger - 0.5);
      }
    } else p.regenT = 0;
    if (p.hunger <= 0) {
      p.starveT += dt;
      if (p.starveT >= 4) {
        p.starveT = 0;
        if (p.hp > 1) {
          p.hp -= 1;
          this.hurtFlash = 0.3;
          Sound.hurt();
        }
      }
    } else p.starveT = 0;
  }

  takeDamage(d, src) {
    if (this.state !== 'play') return;
    if (this.starT > 0) {
      FX.text(this, 640, 600, 'НЕУЯЗВИМ!', { color: '#ffd23f', font: `22px ${FONT.gta}` });
      return;
    }
    const p = this.player;
    const absorb = Math.min(d * 0.5, p.armor / 5);
    p.armor -= absorb * 5;
    p.hp -= d - absorb;
    this.hurtFlash = 0.5;
    this.heartShake = 0.5;
    this.shake = Math.max(this.shake, 10);
    Sound.hurt();
    if (Math.random() < 0.4) this.bossEmote(choice(this.tower.emotes));
    if (p.hp <= 0) {
      if (this.inv.totem > 0) {
        this.inv.totem--;
        p.hp = 10;
        this.totemFx = 1.8;
        Sound.totem();
        this.banner('ТОТЕМ БЕССМЕРТИЯ!', 'Ты спасён. Враги у ворот сметены', '#f2c230');
        for (const e of this.enemies) if (e.alive && e.y > 5 * T) e.damage(999, this, 'totem');
        FX.burst(this, 640, 400, 60, { colors: ['#f2c230', '#2fa84f', '#fff6a8'], size: 7, speed: 420, grav: 100, life: 1.4 });
      } else {
        this.die(src);
      }
    }
  }

  die(src) {
    this.state = 'dead';
    this.deadT = 0;
    this.deathCause = src;
    this.smiley = 'dead';
    Input.lmb = false;
    Sound.wasted();
    Ach.unlock('wasted');
    this.saveBest();
    Top.record(this);
  }

  win() {
    this.state = 'win';
    this.winT = 0;
    this.player.money += 10000;
    this.player.earned += 10000;
    Input.lmb = false;
    Sound.win();
    Ach.unlock('boss_' + this.tower.kind);
    if (this.levelIdx >= LEVELS.length - 1) Ach.unlock('campaign');
    if (this.levelIdx + 1 > this.unlocked && this.levelIdx + 1 < LEVELS.length) {
      this.unlocked = this.levelIdx + 1;
      Store.set('kd_unlocked', this.unlocked);
    }
    this.saveBest();
    Top.record(this);
  }

  addMoney(n, x, y, color = '#7ee05a') {
    this.player.money += n;
    this.player.earned += n;
    if (x !== undefined) FX.text(this, x, y, `+$${n}`, { color, font: `22px ${FONT.gta}` });
    Sound.coin();
  }

  xpNeed() {
    return 10 + this.player.level * 6;
  }

  addXp(n) {
    const p = this.player;
    p.xp += n;
    while (p.xp >= this.xpNeed()) {
      p.xp -= this.xpNeed();
      p.level++;
      Sound.levelUp();
      this.heal(2);
      this.say(`Новый уровень: ${p.level}! Скорострельность +3%`, '#80ff20');
    }
  }

  onKill(e, src) {
    this.kills++;
    if (this.duel) Duel.countKill(this);
    Ach.unlock('first');
    if (src === 'shell' && ++this.shellKills >= 3) Ach.unlock('shell');
    if (src !== 'pac') this.addMoney(e.def.bounty * (this.bloodMoon ? 2 : 1), e.x, e.y - 50);
    if (e.type === 'koopa') {
      let left = 0, right = 0;
      for (const o of this.enemies) if (o.alive && Math.abs(o.y - e.y) < 50) o.x < e.x ? left++ : right++;
      this.shells.push(new Shell(e.x, e.y, left > right ? -1 : 1));
      Sound.kick();
    }
    this.addXp(e.def.xp);
    Sound.xp();
    FX.burst(this, e.x, e.y, 5, { colors: ['#b6ff3c', '#7ee03c'], size: 5, speed: 160, grav: -200, life: 0.8, shape: 'circle' });
    if (e instanceof Snake) {
      for (const s of e.segs) FX.burst(this, colX(s.c), rowY(s.r), 8, { colors: ['#4a7cf0', '#27479f', '#9bb8ff'], size: 9, speed: 240 });
    } else if (e.type === 'freddy') {
      this.staticFx = 0.3;
      Sound.staticNoise();
      this.say('Золотой Фредди растворился в помехах...', '#ffd54a');
    } else {
      const colors = {
        zombie: ['#7fa35c', '#6d4c2f', '#b9c9a5'],
        cone: ['#7fa35c', '#6d4c2f', '#f08a24'],
        creeper: ['#5cb84a', '#86d672', '#0b0b0b'],
        skibidi: ['#f2f2f2', '#9fd4ff', '#f0c49a'],
        mega: ['#3b3f4a', '#7b4fb0', '#c0c4cf'],
        goomba: ['#8d4b1a', '#f2c79a'],
        koopa: ['#2e7d32', '#ffd54f', '#fff'],
        enderman: ['#111', '#e040fb', '#7b1fa2'],
        cop: ['#1e3a8a', '#e0ac69', '#111'],
        sonic: ['#2a5ff0', '#f5cfa0', '#e53935'],
      }[e.type] || ['#222', '#444', '#777'];
      FX.burst(this, e.x, e.y, e.type === 'mega' ? 40 : 12, { colors, size: 7, speed: 240, up: 100 });
    }
    if (e.type === 'mega') this.banner('МЕГАРЫЦАРЬ ПОВЕРЖЕН!', `+$${e.def.bounty}`, '#b388ff');
    if (e.type === 'creeper' && Math.random() < 0.35) this.items.push(new Loot('item', 'tnt', e.x, e.y - 30, e.y, 120));
    if (e.type === 'cop' && Math.random() < 0.3) this.items.push(new Loot('item', 'ammo', e.x, e.y - 30, e.y, 120));
    if (e.type === 'sonic') this.dropRings(e.x, e.y, 10);
    if ((e.type === 'zombie' || e.type === 'cone') && Math.random() < 0.3) this.items.push(new Loot('sun', null, e.x, e.y - 30, e.y, 120));
    else if (Math.random() < 0.06) this.items.push(new Loot('item', weighted(TILE_LOOT.filter(([k]) => k !== 'sun')), e.x, e.y - 30, e.y, 120));
  }

  // ---------- защитники ----------
  plant(c) {
    const type = this.packet, cost = DEF_STATS[type].cost;
    if (this.sun < cost) {
      FX.text(this, colX(c), rowY(PAWN_ROW) - 46, `Нужно ${cost} ☀`, { color: '#ffd54a', font: `bold 16px ${FONT.ui}` });
      Sound.empty();
      return;
    }
    this.sun -= cost;
    this.def[c] = makeDefender(type);
    if (DEF_STATS[type].plant && ++this.plantsPlanted >= 10) Ach.unlock('garden');
    Sound.plant();
    FX.burst(this, colX(c), rowY(PAWN_ROW) + 30, 10, { colors: ['#8d6e63', '#5d4037', '#a5d6a7'], size: 5, speed: 160, up: 120, life: 0.5 });
  }

  killDefender(c, by) {
    const d = this.def[c];
    if (!d) return;
    this.def[c] = null;
    FX.burst(this, colX(c), rowY(PAWN_ROW), 14, { colors: ['#fff', '#ddd', '#999'], size: 7, speed: 240, up: 120 });
    Sound.capture();
    if (Math.random() < 0.35) this.say(`Потеряна фигура «${DEF_STATS[d.type].name}». ПКМ по пустой клетке — посадить новую.`, '#e0e0e0');
  }

  updateDefenders(dt) {
    for (let c = 1; c < COLS; c++) {
      const d = this.def[c];
      if (!d) continue;
      d.pop = Math.min(1, d.pop + dt * 3);
      d.lunge = Math.max(0, d.lunge - dt * 4);
      if (d.hurt > 0) d.hurt -= dt;
      if (d.glow > 0) d.glow -= dt;
      if (d.shoot > 0) d.shoot = Math.max(0, d.shoot - dt * 5);
      if (d.type === 'rook') continue;
      d.cd -= dt;
      if (d.cd > 0) continue;
      if (d.type === 'pawn') {
        const target = this.enemies.find((e) => e.alive && Math.abs(e.col - c) === 1 && e.y > 6 * T + 10 && e.y < 8 * T + 10);
        if (target) {
          d.cd = DEF_STATS.pawn.cd;
          d.lunge = 1;
          d.lungeDir = Math.sign(target.x - colX(c));
          target.damage(2, this, 'pawn');
          Sound.tok();
        } else d.cd = 0.15;
      } else if (d.type === 'bishop') {
        let best = null, bdy = 99;
        for (const e of this.enemies) {
          if (!e.alive) continue;
          const dy = (rowY(PAWN_ROW) - e.y) / T;
          if (dy < 0.3 || dy > 5.5) continue;
          const dx = Math.abs(e.x - colX(c)) / T;
          if (Math.abs(dx - dy) < 0.5 && dy < bdy) {
            best = e;
            bdy = dy;
          }
        }
        if (best) {
          d.cd = DEF_STATS.bishop.cd;
          best.damage(2, this, 'bishop');
          this.beams.push({ x1: colX(c), y1: rowY(PAWN_ROW) - 30, x2: best.x, y2: best.y, t: 0 });
          Sound.zap();
        } else d.cd = 0.15;
      } else if (d.type === 'sunflower') {
        d.cd = DEF_STATS.sunflower.cd;
        d.glow = 1;
        this.items.push(new Loot('sun', null, colX(c) + rand(-24, 24), rowY(PAWN_ROW) - 74, rowY(PAWN_ROW) - 36, 90));
      } else if (d.type === 'peashooter') {
        const inCol = this.enemies.some((e) => e.alive && Math.abs(e.x - colX(c)) < 34 && e.y < rowY(PAWN_ROW) - 10 && e.y > 0);
        if (inCol) {
          d.cd = DEF_STATS.peashooter.cd;
          d.shoot = 1;
          this.peas.push({ x: colX(c), y: rowY(PAWN_ROW) - 52, gone: false });
          Sound.pea();
        } else d.cd = 0.2;
      }
    }
  }

  enemyReached(e) {
    if (!e.alive) return;
    e.remove = true;
    const dmg = e.def.dmg + (e.type === 'pawn' ? 1 : 0);
    FX.text(this, clamp(e.x, 60, W - 60), 610, `−${dmg} HP`, { color: '#ff5252', font: `bold 24px ${FONT.gta}` });
    this.say(`${e.def.name} прорвался и ударил тебя!`, '#ff8a80');
    this.takeDamage(dmg, e.def.name);
  }

  startJumpscare(f) {
    f.remove = true;
    if (this.jumpscare || this.state !== 'play') return;
    this.jumpscare = { t: 0 };
    Sound.jumpscare();
    Ach.unlock('scare');
  }

  // ---------- волны врагов ----------
  updateDirector(dt) {
    const target = clamp(1 + Math.floor((this.t - this.starOffset) / CFG.starEvery) + this.bonusStars, 1, 6);
    if (target > this.stars) {
      this.stars = target;
      this.starFlash = 2.5;
      Sound.star();
      this.say(`Уровень розыска: ${'★'.repeat(this.stars)}`, '#ffd23f');
    }
    const alive = this.enemies.filter((e) => e.alive).length;
    this.spawnT -= dt;
    if (this.spawnT <= 0) {
      const interval = Math.max(1.9, 4.6 - 0.5 * (this.stars - 1)) * (this.tower.hp < this.tower.max * 0.5 ? 0.9 : 1) * (this.bloodMoon ? 0.65 : 1);
      this.spawnT = interval * rand(0.75, 1.25);
      if (alive < 4 + this.stars * 2 && !this.tower.dead) this.spawnEnemy(this.pickEnemy());
    }
    if (this.isFnafTime) {
      this.freddyT -= dt;
      if (this.freddyT <= 0) {
        this.freddyT = rand(9, 15);
        const n = this.enemies.filter((e) => e.alive && e.type === 'freddy').length;
        if (n < (this.stars >= 5 ? 2 : 1)) this.spawnEnemy('freddy');
      }
    }
    if (!this.isNight) {
      this.sunT -= dt;
      if (this.sunT <= 0) {
        this.sunT = rand(7, 11);
        this.items.push(new Loot('sun', null, rand(140, 1140), -30, rand(220, 540), 60));
      }
    }
    this.dropT -= dt;
    if (this.dropT <= 0) {
      this.dropT = rand(CFG.dropEvery[0], CFG.dropEvery[1]);
      this.airdrops.push(new Airdrop());
      Sound.plane();
      this.say('Сброс груза! Подцепи ящик удочкой (ПКМ).', '#9ccc65');
    }
    this.qT -= dt;
    if (this.qT <= 0) {
      this.qT = rand(30, 45);
      this.spawnQBlock();
    }
    this.duckT -= dt;
    if (this.duckT <= 0) {
      this.duckT = rand(35, 55);
      this.ducks.push(new Duck());
      this.say('Утка! Подстрели её, пока не улетела.', '#a5d6a7');
    }
    this.meetingT -= dt;
    if (this.meetingT <= 0) {
      this.meetingT = rand(130, 190);
      if (this.enemies.filter((e) => e.alive && e.type !== 'mega').length >= 3) this.startMeeting();
    }
    // футболист №7: гол в башню босса и «СИУУУ!»
    if (!this.duel && !this.footballer) {
      this.siuT -= dt;
      if (this.siuT <= 0) {
        this.siuT = rand(...SIU.every);
        this.footballer = new Footballer();
        this.say('На поле выбегает футболист №7!', '#ff8a80');
      }
    }
  }

  pickEnemy() {
    const s = this.stars;
    const snakeAlive = this.enemies.some((e) => e.alive && e.type === 'snake');
    const list = this.level.pool.filter(([t, , m]) => s >= m && !(t === 'snake' && snakeAlive)).map(([t, w]) => [t, w]);
    return weighted(list);
  }

  spawnEnemy(type) {
    const c = randi(0, COLS - 1);
    let e;
    switch (type) {
      case 'pawn':
      case 'knight':
      case 'rook':
      case 'bishop':
        e = new ChessEnemy(type, c, MF.r0);
        break;
      case 'zombie':
      case 'cone':
        e = new Zombie(type, c);
        break;
      case 'freddy':
        e = new Freddy(randi(1, COLS - 2), randi(MF.r0, MF.r0 + 1));
        break;
      case 'creeper':
        e = new Creeper(c);
        break;
      case 'skibidi':
        e = new Skibidi(c);
        break;
      case 'goomba':
        e = new Goomba(c);
        break;
      case 'koopa':
        e = new Koopa(c);
        break;
      case 'enderman':
        e = new Enderman(c);
        break;
      case 'cop':
        e = new Cop(c);
        break;
      case 'sonic':
        e = new Sonic(c);
        this.say('Соник! Стреляй — из него сыплются кольца, собирай их прицелом.', '#64b5f6');
        break;
      case 'mega':
        e = new MegaKnight();
        Sound.megaLand();
        break;
      case 'draugr':
        e = new Draugr(c);
        if (!this.toldDraugr) {
          this.toldDraugr = true;
          this.say('Драугр-щитоносец! Щит держит пули — стреляй, когда он кричит, или взрывай.', '#9fe3ff');
        }
        break;
      case 'snake':
        e = new Snake(Math.random() < 0.5);
        this.say('Змейка выползла на доску! Она ест предметы и растёт.', '#9bb8ff');
        break;
      default:
        return null;
    }
    this.enemies.push(e);
    if (type !== 'snake') FX.burst(this, e.x, e.y + 20, 8, { colors: ['rgba(60,60,60,0.55)'], size: 18, speed: 60, grav: -20, life: 0.8, shape: 'circle' });
    return e;
  }

  // ---------- босс уровня ----------
  updateTower(dt) {
    const tw = this.tower;
    if (tw.dead) {
      tw.deadT += dt;
      tw.boomT -= dt;
      const b = tw.box;
      if (tw.boomT <= 0 && tw.deadT < 2) {
        tw.boomT = 0.16;
        const x = b.x + rand(0, b.w), y = b.y + rand(0, b.h);
        this.explosions.push({ x, y, r: 70, t: 0 });
        FX.burst(this, x, y, 12, { colors: ['#ffef8a', '#ff6d00', '#9a9dab', '#555'], size: 9, speed: 320, life: 0.8 });
        Sound.explosion(false);
        this.shake = Math.max(this.shake, 8);
      }
      if (tw.deadT > 2.4) this.win();
      return;
    }
    if (tw.hit > 0) tw.hit -= dt;
    tw.update(dt, this);
  }

  damageTower(n, big) {
    const tw = this.tower;
    if (tw.dead) return;
    tw.hp = Math.max(0, tw.hp - n);
    tw.hit = big ? 0.3 : 0.06;
    const c = tw.center;
    if (big) FX.text(this, c.x + rand(-60, 60), c.y, `−${Math.round(n)}`, { color: '#ff5252', font: `30px ${FONT.gta}` });
    const ratio = tw.hp / tw.max;
    if (tw.phase === 0 && ratio <= 0.66) {
      tw.phase = 1;
      this.towerRage();
    } else if (tw.phase === 1 && ratio <= 0.33) {
      tw.phase = 2;
      this.towerRage();
    }
    if (tw.hp <= 0) {
      tw.dead = true;
      tw.deadT = 0;
      this.banner('ПОБЕДА!', tw.deathText, '#ffd54a');
      Sound.explosion(true);
      for (const cb of this.cannonballs) cb.gone = true;
      for (const h of this.hazards) h.cancel = true;
      for (const e of this.enemies) if (e.alive) e.damage(999, this, 'tower');
    }
  }

  towerRage() {
    const tw = this.tower;
    this.banner(`${tw.speaker.toUpperCase()} В ЯРОСТИ!`, tw.rageText, '#ff5252');
    this.bossEmote(choice(tw.emotes));
    this.bonusStars++;
    Sound.roar();
    tw.onRage(this);
    if (this.duel) Duel.send('stars', this);
    else if (this.state === 'play') {
      // через пару секунд — партия в дурака с боссом
      this.durakT = 3;
      this.say(`<${tw.speaker}> Сыграем в дурака? Проиграешь — колпак твой!`, '#ff8a65');
    }
  }

  bossEmote(str) {
    const tw = this.tower;
    if (tw.dead) return;
    tw.emote = str;
    tw.emoteT = 2.2;
    tw.laugh = 1.2;
    this.say(`<${tw.speaker}> ${str}`, '#ff8a65');
  }

  // ---------- опасные зоны боссов ----------
  // Столбец (огонь Боузера, дыхание дракона, очередь вертолёта) или ряд фигур (лазер Титана).
  addHazard(kind, idx, warn = 1.4) {
    const h = { kind, idx, t: 0, warn, dur: 0.7, done: false, cancel: false, gone: false };
    this.hazards.push(h);
    Sound.warn();
    return h;
  }

  updateHazards(dt) {
    for (const h of this.hazards) {
      h.t += dt;
      if (!h.done && !h.cancel && h.t >= h.warn) {
        h.done = true;
        this.applyHazard(h);
      }
      if (h.cancel || h.t >= h.warn + h.dur) h.gone = true;
    }
    this.hazards = this.hazards.filter((h) => !h.gone);
  }

  applyHazard(h) {
    if (h.kind === 'laser') {
      Sound.laser();
      this.shake = Math.max(this.shake, 14);
      for (let c = 1; c < COLS; c++) {
        const d = this.def[c];
        if (!d) continue;
        d.hp -= 3;
        d.hurt = 0.3;
        if (d.hp <= 0) this.killDefender(c, null);
      }
      for (const e of this.enemies) if (e.alive && Math.abs(e.y - rowY(PAWN_ROW)) < 60) e.damage(10, this, 'laser');
      this.takeDamage(2, 'лазер Скибиди-Титана');
      return;
    }
    const x = colX(h.idx);
    if (h.kind === 'fire') Sound.fireBreath();
    else if (h.kind === 'strafe') Sound.strafe();
    else Sound.dragonBreath();
    if (this.def[h.idx]) this.killDefender(h.idx, null);
    for (const e of this.enemies) if (e.alive && Math.abs(e.x - x) < 42) e.damage(6, this, 'hazard');
    const colors = { fire: ['#ffeb3b', '#ff9800', '#f4511e'], breath: ['#e040fb', '#7b1fa2', '#ce93d8'], strafe: ['#ffd54f', '#9e9e9e', '#fff'] }[h.kind];
    for (let y = 2 * T; y < 8 * T; y += 60) FX.burst(this, x, y, 4, { colors, size: 8, speed: 160, grav: -40, life: 0.6 });
  }

  // ---------- кольца Соника ----------
  dropRings(x, y, n) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, TAU), sp = rand(120, 260);
      this.rings.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 7, t: rand(0, 3) });
    }
    Sound.ringLoss();
  }

  updateRings(dt) {
    for (const r of this.rings) {
      r.t += dt;
      r.life -= dt;
      r.x += r.vx * dt;
      r.y += r.vy * dt;
      const damp = Math.pow(0.15, dt);
      r.vx *= damp;
      r.vy *= damp;
      if (r.x < 20 || r.x > W - 20) r.vx *= -1;
      if (r.y < 2 * T || r.y > 8 * T) r.vy *= -1;
      r.x = clamp(r.x, 20, W - 20);
      r.y = clamp(r.y, 2 * T, 8 * T);
      if (dist2(r.x, r.y, Input.x, Input.y) < 36 * 36) {
        r.life = 0;
        this.ringsGot++;
        this.player.money += 25;
        this.player.earned += 25;
        Sound.ring();
        FX.text(this, r.x, r.y - 20, '+$25', { color: '#ffd54a', font: `bold 15px ${FONT.ui}`, life: 0.7 });
        if (this.ringsGot >= 20) Ach.unlock('rings');
      }
    }
    this.rings = this.rings.filter((r) => r.life > 0);
  }

  updateCannonballs(dt) {
    for (const cb of this.cannonballs) {
      if (cb.gone) continue;
      cb.t += dt;
      if (cb.t >= cb.dur) {
        cb.gone = true;
        this.cracks.push(makeCrack(cb.tx, cb.ty));
        this.shake = 16;
        Sound.explosion(false);
        FX.burst(this, cb.tx, cb.ty, 18, { colors: ['#e0f7fa', '#b2ebf2', '#fff'], size: 6, speed: 360, grav: 600, life: 0.6 });
        this.takeDamage(CFG.cannonDamage, `снаряд: ${this.tower.name}`);
      }
    }
  }

  // ---------- время суток ----------
  get hours() {
    return (this.clock / 60) % 24;
  }
  get isNight() {
    const h = this.hours;
    return h >= 21 || h < 6;
  }
  get isFnafTime() {
    return this.hours < 6;
  }
  get darkness() {
    const h = this.hours;
    if (h >= 21) return ((h - 21) / 3) * 0.78;
    if (h < 5) return 0.78;
    if (h < 6) return (6 - h) * 0.78;
    return 0;
  }

  updateClock(dt) {
    const prev = this.hours;
    this.clock += dt * CFG.dayMinutesPerSec;
    const h = this.hours;
    if (prev > 23 && h < 1) {
      this.nights++;
      this.banner('12 AM', `Ночь ${this.nights}. Золотой Фредди проснулся...`, '#ffffff');
      Sound.midnight();
      this.staticFx = 0.6;
      this.freddyT = 3;
      if (Math.random() < (this.levelIdx >= 2 ? 0.5 : 0.3)) {
        this.bloodMoon = true;
        this.banner('КРОВАВАЯ ЛУНА', 'Враги быстрее и злее, награды ×2', '#ff1744');
      }
    }
    if (prev < 6 && h >= 6) {
      this.banner('6 AM', 'Ты пережил ночь! +$2000', '#7ee03c');
      Sound.chime6am();
      this.addMoney(2000);
      Ach.unlock('night');
      if (this.bloodMoon) Ach.unlock('blood');
      this.bloodMoon = false;
      for (const e of this.enemies) if (e.alive && e.type === 'freddy') e.remove = true;
    }
    if (prev < 21 && h >= 21) this.say('Темнеет. В полночь просыпается кое-кто золотой...', '#b39ddb');
  }

  // ---------- чит-коды GTA ----------
  // Буквы копятся в буфер. Пока набирается чит, игровые действия этих клавиш не срабатывают.
  handleCheatKey(code) {
    if (this.duel) return false; // в дуэли читы выключены
    const m = /^Key([A-Z])$/.exec(code);
    if (!m) {
      if (!/^Shift/.test(code)) this.typed = '';
      return false;
    }
    this.typed = (this.typed + m[1]).slice(-12);
    for (const name in CHEATS) {
      if (this.typed.endsWith(name)) {
        this.typed = '';
        this.activateCheat(name);
        return true;
      }
    }
    for (const name in CHEATS) {
      for (let k = Math.min(name.length - 1, this.typed.length); k >= 2; k--) {
        if (this.typed.endsWith(name.slice(0, k))) return true;
      }
    }
    return false;
  }

  activateCheat(name) {
    const p = this.player;
    this.cheated = true;
    switch (name) {
      case 'HESOYAM':
        p.hp = p.maxHp;
        p.armor = 100;
        p.hunger = 20;
        p.money += 250000;
        break;
      case 'AEZAKMI':
        this.starOffset = this.t;
        this.bonusStars = 0;
        this.stars = 1;
        break;
      case 'FULLCLIP':
        this.infAmmo = true;
        this.gun.reload = 0;
        break;
      case 'LXGIWYL':
        for (const k of WEAPON_ORDER) {
          const a = this.arsenal[k];
          a.owned = true;
          a.mag = WEAPONS[k].mag;
          a.reserve = WEAPONS[k].reserveMax;
        }
        this.grenades = Math.min(5, this.grenades + 3);
        break;
      case 'OSRBLHH':
        this.bonusStars += 2;
        break;
      case 'SKIBIDI':
        for (let i = 0; i < 3; i++) this.spawnEnemy('skibidi');
        break;
      case 'SANS':
        this.utT = 0.05;
        break;
      case 'SIUUU':
        this.siuT = 0;
        break;
      case 'DURAK':
        this.durakT = 0.05;
        break;
    }
    Sound.cheat();
    Ach.unlock('cheat');
    this.cheatMsg = { name, text: CHEATS[name], t: 0 };
    this.say(`Чит ${name}: ${CHEATS[name]}. Рекорд в этой игре не засчитается.`, '#ffffff');
  }

  // ---------- Крипер ----------
  creeperBoom(e) {
    this.explode(e.x, e.y, T * 1.7, 14, 'creeper');
    this.blastField(e.x, e.y);
    for (let c = 1; c < COLS; c++) {
      if (this.def[c] && Math.abs(colX(c) - e.x) <= T * 1.3 && Math.abs(rowY(PAWN_ROW) - e.y) <= T * 1.7) this.killDefender(c, e);
    }
    this.say('Крипер взорвался. Ссссс... БУМ.', '#86d672');
    this.takeDamage(2, 'Крипер');
  }

  // ---------- Марио ----------
  spawnQBlock() {
    const c = randi(MF.c0, MF.c0 + MF.cols - 1), r = randi(MF.r0, MF.r0 + MF.rows - 2);
    this.qblocks.push(new QBlock(colX(c), rowY(r) - 6));
    Sound.bump();
    this.say('Появился «?»-блок. Стрельни по нему!', '#ffd23f');
  }

  hitQBlock(q) {
    q.state = 'empty';
    q.bumpT = 0.25;
    q.life = 1.4;
    Sound.bump();
    const kind = weighted([['coins', 40], ['mushroom', 25], ['star', 20], ['oneup', 12]]);
    const x = q.x, y = q.y - 44;
    if (kind === 'coins') {
      for (let i = 0; i < 5; i++) this.popups.push({ kind: 'coin', x: x + (i - 2) * 16, y, t: -i * 0.08 });
      this.addMoney(500, x, y - 40, '#ffd23f');
      Sound.marioCoin();
    } else if (kind === 'mushroom') {
      this.popups.push({ kind: 'mushroom', x, y, t: 0 });
      this.player.hp = this.player.maxHp;
      this.player.armor = Math.min(100, this.player.armor + 25);
      Sound.powerUp();
      FX.text(this, x, y - 40, 'СУПЕРГРИБ! Здоровье полное', { color: '#ff8a80', font: `bold 18px ${FONT.ui}` });
    } else if (kind === 'star') {
      this.popups.push({ kind: 'star', x, y, t: 0 });
      this.starT = 9;
      Ach.unlock('star');
      if (this.duel) Duel.send('skibidi', this);
      Sound.starMusic(9);
      this.banner('ЗВЕЗДА!', 'Неуязвимость и двойной урон на 9 секунд', '#ffd23f');
    } else {
      this.popups.push({ kind: 'oneup', x, y, t: 0 });
      this.inv.totem++;
      Sound.oneUp();
      FX.text(this, x, y - 40, '1-UP! +1 тотем', { color: '#7ee03c', font: `bold 20px ${FONT.ui}` });
    }
  }

  // ---------- Duck Hunt ----------
  shootDuck(d) {
    d.state = 'hit';
    d.hitT = 0;
    this.ducksShot++;
    if (this.duel) Duel.send('creeper', this);
    if (this.ducksShot >= 5) Ach.unlock('ducks');
    this.addMoney(500, d.x, d.y - 36, '#a5d6a7');
    Sound.quack();
    FX.burst(this, d.x, d.y, 10, { colors: ['#8d5a2b', '#1b6b2a', '#fff'], size: 5, speed: 160, life: 0.6 });
  }

  dogLaugh() {
    this.dogT = 2.4;
    Sound.dogLaugh();
  }

  // ---------- PvZ: горох ----------
  updatePeas(dt) {
    for (const p of this.peas) {
      p.y -= 540 * dt;
      for (const e of this.enemies) {
        if (e.alive && e.hit(p.x, p.y)) {
          e.damage(this.starT > 0 ? 2 : 1, this, 'pea');
          p.gone = true;
          break;
        }
      }
      // горох разбивается о каменную кладку башни, не нанося урона
      if (!p.gone && p.y < 170) p.gone = true;
      if (p.gone) {
        FX.burst(this, p.x, p.y, 5, { colors: ['#7ee03c', '#2e7d32'], size: 4, speed: 120, life: 0.3 });
        Sound.splat();
      } else if (p.y < -20) p.gone = true;
    }
    this.peas = this.peas.filter((p) => !p.gone);
  }

  // ---------- Among Us ----------
  startMeeting() {
    const alive = this.enemies.filter((e) => e.alive && e.type !== 'mega');
    if (!alive.length || this.jumpscare) return;
    const target = alive.reduce((a, b) => (b.hp > a.hp ? b : a));
    const colors = ['#e53935', '#1e88e5', '#43a047', '#fdd835', '#8e24aa', '#fb8c00', '#ec407a', '#00acc1'];
    this.meeting = { t: 0, target, name: target.def.name, color: choice(colors), ejected: false };
    Input.lmb = false;
    Sound.meeting();
  }

  updateMeeting(dt) {
    const m = this.meeting;
    m.t += dt;
    if (!m.ejected && m.t >= 2.2) {
      m.ejected = true;
      Sound.eject();
      if (m.target.alive) {
        m.target.damage(9999, this, 'meeting');
        m.target.remove = true;
      }
    }
    if (m.t >= 5.2) {
      this.meeting = null;
      this.suppressFire = true;
      this.say(`${m.name} был предателем. Голосование окончено.`, '#ff8a80');
      Ach.unlock('meeting');
    }
  }

  // ---------- сообщения ----------
  say(str, color = '#fff') {
    this.chat.push({ text: str, color, t: 0 });
    if (this.chat.length > 5) this.chat.shift();
  }
  banner(title, sub, color = '#ffd54a') {
    this.bannerObj = { title, sub, color, t: 0, dur: 2.8 };
  }
}

function makeCrack(x, y) {
  const lines = [];
  const n = randi(7, 11);
  for (let i = 0; i < n; i++) {
    let a = (i / n) * TAU + rand(-0.2, 0.2);
    let px = x, py = y;
    const pts = [[px, py]];
    const segs = randi(3, 5);
    for (let s = 0; s < segs; s++) {
      a += rand(-0.4, 0.4);
      const len = rand(25, 70);
      px += Math.cos(a) * len;
      py += Math.sin(a) * len;
      pts.push([px, py]);
    }
    lines.push(pts);
  }
  return { x, y, lines, t: 0 };
}

// ---- js/render.js ----
'use strict';
/* Отрисовка кадра: мир → ночь → руки → эффекты → интерфейс → экраны. */

const nightCanvas = document.createElement('canvas');
let nightCtx = null;

function render(ctx, g) {
  const now = performance.now() / 1000;
  const menu = g.state === 'title' || g.state === 'levels' || g.state === 'achievements' || g.state === 'intro' || g.state === 'duel' || g.state === 'top';
  const wt = menu ? g.titleT + g.introT : g.t;
  ctx.setTransform(View.k, 0, 0, View.k, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.filter = 'none';
  ctx.fillStyle = '#0d1208';
  ctx.fillRect(0, 0, W, H);
  if (g.state === 'arena' || (g.state === 'duelover' && Arena.on)) return renderArena(ctx, g, now);
  if (g.state === 'durak') {
    // партия с боссом идёт прямо на его доске — она просвечивает за столом
    if (Durak.mode === 'boss') {
      ctx.save();
      drawWorld(ctx, g, g.t, now);
      ctx.restore();
    }
    renderDurak(ctx, g, now);
    Ach.draw(ctx);
    if (!Input.touch) drawPointer(ctx);
    return;
  }
  if (g.state === 'ut') {
    renderBattle(ctx, g, now);
    Ach.draw(ctx);
    if (!Input.touch && Battle.phase !== 'attack') drawPointer(ctx);
    return;
  }

  ctx.save();
  if (g.shake > 0 && !menu) ctx.translate(rand(-1, 1) * g.shake, rand(-1, 1) * g.shake);
  drawWorld(ctx, g, wt, now);
  drawNight(ctx, g);
  if (!menu) drawHands(ctx, g, now);
  ctx.restore();

  if (!menu) {
    drawScreenFx(ctx, g, now);
    drawHUD(ctx, g, now);
  }
  g.buttons = [];
  if (g.state === 'title') drawTitle(ctx, g, now);
  else if (g.state === 'levels') drawLevels(ctx, g, now);
  else if (g.state === 'achievements') drawAchievements(ctx, g, now);
  else if (g.state === 'top') drawTopScreen(ctx, g, now);
  else if (g.state === 'intro') drawIntro(ctx, g, now);
  else if (g.state === 'duel') drawDuelLobby(ctx, g, now);
  else if (g.state === 'duelover') drawDuelOver(ctx, g, now);
  else if (g.state === 'pause') drawPause(ctx, g, now);
  else if (g.state === 'cheats') drawCheats(ctx, g, now);
  else if (g.state === 'buy') drawBuy(ctx, g, now);
  else if (g.state === 'dead') drawDead(ctx, g, now);
  else if (g.state === 'win') drawWin(ctx, g, now);
  if (g.meeting) drawMeeting(ctx, g, now);
  if (g.jumpscare) drawJumpscare(ctx, g, now);
  Ach.draw(ctx);
  if (g.state === 'play' && !g.jumpscare && !g.meeting) drawCrosshair(ctx, g, now);
  else if (!g.jumpscare && !g.meeting && !Input.touch) drawPointer(ctx);
}

// ---------- мир ----------
function drawWorld(ctx, g, t, now) {
  ctx.drawImage(Board.get(View, g.state === 'title' ? 'classic' : g.level.theme), 0, 0, W, H);
  const hover = g.state === 'play' ? g.mf.at(Input.x, Input.y) : null;
  g.mf.draw(ctx, hover, t);

  for (const d of g.decals) {
    ctx.globalAlpha = Math.min(1, d.life);
    circ(ctx, d.x, d.y, 4.5, 'rgba(60,50,40,0.5)');
    circ(ctx, d.x, d.y, 2.5, 'rgba(10,10,10,0.85)');
  }
  ctx.globalAlpha = 1;

  if (g.state === 'title') drawTitleCast(ctx, t);

  for (const it of g.items) if (!it.falling) it.draw(ctx);
  for (const r of g.rings) {
    if (r.life < 2 && Math.floor(r.t * 10) % 2 === 0) continue;
    drawRing(ctx, r.x, r.y, r.t);
  }
  for (let c = 1; c < COLS; c++) if (g.def[c]) drawDefender(ctx, g.def[c], c, t);
  for (const sh of g.shells) sh.draw(ctx);
  for (const p of g.peas) {
    circ(ctx, p.x, p.y, 7, '#7ee03c');
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#2e7d32';
    ctx.stroke();
  }
  g.pac.draw(ctx, t);
  for (const a of g.airdrops) if (a.state === 'land') a.draw(ctx);

  const es = g.enemies.slice().sort((a, b) => a.y - b.y);
  for (const e of es) e.draw(ctx, t);
  if (g.footballer) g.footballer.draw(ctx, t);

  for (const q of g.qblocks) q.draw(ctx);
  for (const p of g.popups) {
    if (p.t < 0) continue;
    ctx.globalAlpha = Math.min(1, (1.2 - p.t) * 3);
    drawMarioItem(ctx, p.kind, p.x, p.y - Math.min(p.t, 0.5) * 90, 1.2, now);
  }
  ctx.globalAlpha = 1;

  drawHazards(ctx, g, t);
  drawTowerState(ctx, g, t);

  for (const b of g.beams) {
    const a = 1 - b.t / 0.22;
    line(ctx, b.x1, b.y1, b.x2, b.y2, `rgba(255,248,200,${a * 0.5})`, 12);
    line(ctx, b.x1, b.y1, b.x2, b.y2, `rgba(255,255,255,${a})`, 4);
  }
  for (const it of g.items) if (it.falling) it.draw(ctx);
  for (const a of g.airdrops) if (a.state === 'fall') a.draw(ctx);
  for (const d of g.ducks) d.draw(ctx);

  for (const tn of g.tnts) {
    const k = tn.state === 'fly' ? tn.t : 1;
    const x = lerp(tn.x0, tn.x1, k), y = lerp(tn.y0, tn.y1, k) - Math.sin(k * Math.PI) * 220;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(tn.state === 'fly' ? k * 9 : 0);
    if (tn.kind === 'he') drawGrenade(ctx, 0, 0, 1.3);
    else drawTNT(ctx, 0, 0, 36);
    if (tn.state === 'fuse' && Math.floor(tn.fuse * 12) % 2 === 0) {
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.fillRect(-18, -18, 36, 36);
    }
    ctx.restore();
  }

  for (const m of g.missiles) {
    if (m.t < 0) continue;
    if (m.bomb) {
      ctx.save();
      ctx.translate(m.x, m.y);
      ctx.rotate((m.ang || 0) - Math.PI / 2);
      ell(ctx, 0, 0, 9, 16, '#263238');
      poly(ctx, [-9, -12, 9, -12, 0, -22], '#455a64');
      ctx.restore();
    } else {
      circ(ctx, m.x, m.y, 18, 'rgba(255,140,40,0.35)');
      drawMine(ctx, m.x, m.y, 12);
    }
  }

  for (const ex of g.explosions) {
    const k = ex.t / 0.55;
    const r = ex.r * (0.35 + k * 0.75);
    const gr = ctx.createRadialGradient(ex.x, ex.y, 0, ex.x, ex.y, r);
    gr.addColorStop(0, `rgba(255,250,210,${1 - k})`);
    gr.addColorStop(0.4, `rgba(255,170,30,${0.9 * (1 - k)})`);
    gr.addColorStop(1, 'rgba(200,60,0,0)');
    circ(ctx, ex.x, ex.y, r, gr);
    ctx.beginPath();
    ctx.arc(ex.x, ex.y, ex.r * k * 1.25, 0, TAU);
    ctx.strokeStyle = `rgba(255,255,255,${0.6 * (1 - k)})`;
    ctx.lineWidth = 4;
    ctx.stroke();
  }

  for (const p of g.particles) {
    ctx.globalAlpha = Math.min(1, (p.life / p.max) * 1.6);
    ctx.fillStyle = p.color;
    if (p.shape === 'circle') {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * (1.4 - (p.life / p.max) * 0.4), 0, TAU);
      ctx.fill();
    } else {
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
  }
  ctx.globalAlpha = 1;

  for (const cb of g.cannonballs) cb.draw(ctx);

  for (const tx of g.texts) {
    ctx.globalAlpha = Math.min(1, (tx.life / tx.max) * 2);
    text(ctx, tx.str, tx.x, tx.y, { font: tx.font, color: tx.color, stroke: tx.stroke, lw: 4, align: 'center' });
  }
  ctx.globalAlpha = 1;
}

function drawTowerState(ctx, g, t) {
  const tw = g.tower;
  if (!tw.dead || tw.deadT < 1.6) {
    ctx.save();
    if (tw.dead) {
      ctx.globalAlpha = Math.max(0, 1 - tw.deadT / 1.6);
      ctx.translate(0, tw.deadT * 30);
    }
    tw.draw(ctx, t, g);
    ctx.restore();
  }
  if (tw.dead && tw.kind === 'tower') {
    // руины
    const k = Math.min(1, tw.deadT / 1.2);
    ctx.globalAlpha = k;
    for (let i = 0; i < 14; i++) {
      const x = 640 - 120 + ((i * 53) % 240), y = 120 + ((i * 37) % 40);
      ell(ctx, x, y, 22 + (i % 3) * 6, 14 + (i % 2) * 5, i % 2 ? '#8e919f' : '#6f7282');
    }
    drawCrown(ctx, 700, 140, 1.6);
    ctx.globalAlpha = 1;
  }
  if (!tw.dead && tw.kind !== 'tower' && g.state !== 'title') drawBossBar(ctx, tw);
  if (tw.emoteT > 0 && !tw.dead && g.state !== 'title') {
    const b = tw.box;
    const bx = clamp(b.x + b.w - 10, 320, 940 - 200), by = Math.max(26, b.y + 10);
    const a = Math.min(1, tw.emoteT * 3);
    ctx.globalAlpha = a;
    ctx.font = `bold 17px ${FONT.ui}`;
    const w = ctx.measureText(tw.emote).width + 24;
    const x = Math.min(bx, 944 - w);
    rr(ctx, x, by, w, 36, 12);
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#1b2b5a';
    ctx.stroke();
    poly(ctx, [x + 4, by + 24, x - 16, by + 40, x + 18, by + 30], '#fff');
    text(ctx, tw.emote, x + w / 2, by + 24, { font: `bold 17px ${FONT.ui}`, color: '#1b2b5a', align: 'center' });
    ctx.globalAlpha = 1;
  }
}

function drawBossBar(ctx, tw) {
  const w = 400, x = 640 - w / 2, y = 3;
  rr(ctx, x, y, w, 20, 6);
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fill();
  const ratio = clamp(tw.hp / tw.max, 0, 1);
  if (ratio > 0) {
    rr(ctx, x + 2, y + 2, (w - 4) * ratio, 16, 5);
    const g = ctx.createLinearGradient(0, y, 0, y + 20);
    g.addColorStop(0, '#ff6f60');
    g.addColorStop(1, '#b71c1c');
    ctx.fillStyle = g;
    ctx.fill();
  }
  text(ctx, `${tw.name} · ${Math.ceil(tw.hp)}`, 640, y + 15, { font: `bold 13px ${FONT.ui}`, color: '#fff', align: 'center', stroke: '#000', lw: 3 });
}

// Предупреждение и удар: столбец (огонь, дыхание, очередь) или ряд фигур (лазер).
function drawHazards(ctx, g, t) {
  for (const h of g.hazards) {
    const warn = h.t < h.warn;
    if (h.kind === 'laser') {
      const y = rowY(h.idx);
      if (warn) {
        const k = h.t / h.warn;
        ctx.globalAlpha = 0.4 + 0.5 * Math.abs(Math.sin(t * (6 + k * 20)));
        line(ctx, 0, y, W, y, '#ff1744', 2 + k * 4);
        ctx.globalAlpha = 1;
      } else {
        const a = 1 - (h.t - h.warn) / h.dur;
        line(ctx, 0, y, W, y, `rgba(255,23,68,${a * 0.6})`, 50);
        line(ctx, 0, y, W, y, `rgba(255,255,255,${a})`, 14);
      }
      continue;
    }
    const x = colX(h.idx) - T / 2;
    if (warn) {
      ctx.fillStyle = `rgba(255,30,30,${0.12 + 0.18 * Math.abs(Math.sin(t * 10))})`;
      ctx.fillRect(x, 2 * T, T, 6 * T);
      ctx.strokeStyle = 'rgba(255,60,60,0.8)';
      ctx.lineWidth = 2;
      ctx.strokeRect(x + 1, 2 * T, T - 2, 6 * T);
      text(ctx, '!', x + T / 2, 2 * T + 40, { font: `bold 34px ${FONT.title}`, color: '#ff1744', align: 'center', stroke: '#fff', lw: 4 });
      continue;
    }
    const a = 1 - (h.t - h.warn) / h.dur;
    const cols = { fire: ['255,152,0', '255,235,59'], breath: ['171,71,188', '234,128,252'], strafe: ['255,213,79', '255,255,255'] }[h.kind];
    const gr = ctx.createLinearGradient(x, 0, x + T, 0);
    gr.addColorStop(0, `rgba(${cols[0]},0)`);
    gr.addColorStop(0.5, `rgba(${cols[1]},${a})`);
    gr.addColorStop(1, `rgba(${cols[0]},0)`);
    ctx.fillStyle = gr;
    ctx.fillRect(x - 10, 160, T + 20, 6 * T);
    if (h.kind === 'strafe') {
      for (let i = 0; i < 8; i++) circ(ctx, x + rand(10, T - 10), rand(2 * T, 8 * T), 4, `rgba(60,60,60,${a})`);
    }
  }
}

// Персонажи на заставке, как на той самой картинке.
function drawTitleCast(ctx, t) {
  drawFreddy(ctx, 870, 285, t, { glow: true });
  drawZombie(ctx, 1020, 330, t, { cone: true, walking: true });
  drawSnake(ctx, [{ x: 1180, y: 440 }, { x: 1180, y: 520 }, { x: 1100, y: 520 }, { x: 1020, y: 520 }], 0, -1, t);
  drawAirdrop(ctx, 190, 300 + Math.sin(t) * 10, t, false);
  drawSun(ctx, 470, 470, 22, t);
  drawDice(ctx, 260, 470, 42, 5, -0.3);
  drawCreeper(ctx, 90, 450, t, { walking: true });
  drawSkibidi(ctx, 1170, 250, t, { singing: true });
}

function lightAt(n, x, y, r, a) {
  const g = n.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(0,0,0,${a})`);
  g.addColorStop(0.6, `rgba(0,0,0,${a * 0.6})`);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  n.fillStyle = g;
  n.fillRect(x - r, y - r, r * 2, r * 2);
}

// Ночь: темнота с «фонариком» вокруг прицела.
function drawNight(ctx, g) {
  const dark = g.state === 'title' ? 0 : g.darkness;
  if (dark <= 0.01) return;
  if (nightCanvas.width !== View.pw || nightCanvas.height !== View.ph || !nightCtx) {
    nightCanvas.width = View.pw;
    nightCanvas.height = View.ph;
    nightCtx = nightCanvas.getContext('2d');
  }
  const n = nightCtx;
  n.setTransform(View.k, 0, 0, View.k, 0, 0);
  n.globalCompositeOperation = 'source-over';
  n.clearRect(0, 0, W, H);
  const a = Math.max(0, dark - (g.gun.flash > 0 ? 0.2 : 0));
  n.fillStyle = g.bloodMoon ? `rgba(40,0,6,${a})` : `rgba(6,8,26,${a})`;
  n.fillRect(0, 0, W, H);
  n.globalCompositeOperation = 'destination-out';
  lightAt(n, Input.x, Input.y, 190, 1);
  const bc = g.tower.center;
  lightAt(n, bc.x, bc.y, 150, 0.6);
  for (const ex of g.explosions) lightAt(n, ex.x, ex.y, ex.r * 2.2, 1 - ex.t / 0.55);
  for (const it of g.items) if (it.kind === 'sun') lightAt(n, it.x, it.y, 70, 0.9);
  for (const cb of g.cannonballs) {
    const p = cb.pos;
    lightAt(n, p.x, p.y, 40 + p.s * 30, 0.8);
  }
  n.globalCompositeOperation = 'source-over';
  if (g.bloodMoon) {
    const mg = n.createRadialGradient(150, 250, 10, 150, 250, 90);
    mg.addColorStop(0, 'rgba(255,40,40,0.95)');
    mg.addColorStop(0.45, 'rgba(200,0,0,0.85)');
    mg.addColorStop(1, 'rgba(120,0,0,0)');
    n.fillStyle = mg;
    n.fillRect(60, 160, 180, 180);
  }
  ctx.drawImage(nightCanvas, 0, 0, W, H);
}

// ---------- руки: удочка и АК ----------
function drawHands(ctx, g, now) {
  const rod = g.rod;
  const tip = g.rodTip();
  let bx, by, sag = 0;
  if (rod.state === 'idle') {
    bx = tip.x + Math.sin(now * 1.7) * 5;
    by = tip.y + 110 + Math.sin(now * 2.3) * 4;
  } else if (rod.state === 'out') {
    const k = rod.t;
    bx = lerp(tip.x, rod.tx, k);
    by = lerp(tip.y, rod.ty, k) - Math.sin(k * Math.PI) * 80;
  } else {
    const k = easeInOut(rod.t);
    bx = lerp(rod.tx, tip.x, k);
    by = lerp(rod.ty, tip.y + 110, k);
    sag = 25;
  }
  drawRod(ctx, { tipX: tip.x, tipY: tip.y, bx, by, sag });
  if (rod.carry && rod.state === 'back') {
    if (rod.carry === 'crate') {
      ctx.save();
      ctx.translate(bx, by + 18);
      ctx.scale(0.5, 0.5);
      drawAirdrop(ctx, 0, 0, 0, true);
      ctx.restore();
    } else drawItemIcon(ctx, rod.carry, bx, by + 16, 30, now);
  }

  for (const tr of g.tracers) {
    line(ctx, tr.x1, tr.y1, tr.x2, tr.y2, `rgba(255,230,150,${0.8 * (1 - tr.t / 0.07)})`, tr.w || 2);
  }
  const pose = g.gunPose();
  ctx.save();
  ctx.globalAlpha = g.gunAlpha;
  ctx.translate(pose.px, pose.py);
  ctx.rotate(pose.rot);
  ctx.scale(pose.s, pose.s);
  drawWeapon(ctx, g.weapon, g.gun.flash);
  ctx.restore();
  if (g.gun.punch > 0) {
    const k = g.gun.punch / 0.4;
    drawFist(ctx, Input.x + 10, Input.y + 20 + k * 50, 2.2 - k * 0.8, '#1f1f22');
  }
}

// ---------- экранные эффекты ----------
function vignette(ctx, color, alpha, inner = 260) {
  const g = ctx.createRadialGradient(W / 2, H / 2, inner, W / 2, H / 2, 780);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, color.replace('A', alpha));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function drawScreenFx(ctx, g, now) {
  if (g.timeScale < 0.95) {
    const k = (1 - g.timeScale) / 0.65;
    ctx.fillStyle = `rgba(70,130,255,${0.1 * k})`;
    ctx.fillRect(0, 0, W, H);
    vignette(ctx, 'rgba(10,20,70,A)', 0.55 * k);
  }
  if (g.frostFx > 0) vignette(ctx, 'rgba(200,240,255,A)', 0.8 * g.frostFx, 200);
  if (g.starT > 0) {
    const hue = (now * 600) % 360;
    const a = Math.min(1, g.starT) * 0.5;
    const gr = ctx.createRadialGradient(W / 2, H / 2, 300, W / 2, H / 2, 760);
    gr.addColorStop(0, 'rgba(0,0,0,0)');
    gr.addColorStop(1, `hsla(${hue},100%,60%,${a})`);
    ctx.fillStyle = gr;
    ctx.fillRect(0, 0, W, H);
  }
  if (g.dogT > 0) {
    const k = g.dogT > 2 ? (2.4 - g.dogT) / 0.4 : g.dogT < 0.4 ? g.dogT / 0.4 : 1;
    drawDog(ctx, 640, 720 - easeOutCubic(clamp(k, 0, 1)) * 150, now);
  }
  if (g.hurtFlash > 0) vignette(ctx, 'rgba(220,0,0,A)', Math.min(0.8, g.hurtFlash * 1.6), 160);
  for (const c of g.cracks) {
    const a = Math.min(1, (2.6 - c.t) / 0.8);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.lineJoin = 'round';
    for (const pts of c.lines) {
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (const [x, y] of pts) ctx.lineTo(x, y);
      ctx.strokeStyle = 'rgba(0,0,0,0.45)';
      ctx.lineWidth = 4;
      ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.9)';
      ctx.lineWidth = 1.6;
      ctx.stroke();
    }
    circ(ctx, c.x, c.y, 14, 'rgba(255,255,255,0.25)');
    ctx.restore();
  }
  if (g.staticFx > 0) {
    ctx.save();
    ctx.globalAlpha = Math.min(0.6, g.staticFx * 2);
    for (let i = 0; i < 70; i++) {
      const v = Math.floor(rand(60, 255));
      ctx.fillStyle = `rgb(${v},${v},${v})`;
      ctx.fillRect(0, rand(0, H), W, rand(1, 4));
    }
    ctx.restore();
  }
  if (g.totemFx > 0) {
    const k = 1 - g.totemFx / 1.8;
    ctx.save();
    ctx.globalAlpha = Math.min(1, g.totemFx);
    const s = 8 + k * 10;
    drawPixel(ctx, PIX.totem, 640 - 6 * s, 340 - 6 * s - k * 80, s);
    ctx.restore();
  }
}

// ---------- интерфейс ----------
function drawHUD(ctx, g, now) {
  drawGtaHud(ctx, g, now);
  // проиграл боссу в дурака — колпак поверх значка оружия
  if (g.foolCapT > 0) {
    drawFoolCap(ctx, 48, 30 + Math.sin(now * 4) * 2, 0.55);
    text(ctx, `ДУРАК ${Math.ceil(g.foolCapT)}`, 48, 104, { font: `bold 13px ${FONT.ui}`, color: '#ffd54a', stroke: '#000', lw: 4, align: 'center' });
  }
  drawPvzBank(ctx, g, now);
  drawMinesPanel(ctx, g);
  drawMinecraftHud(ctx, g, now);
  drawPubgBars(ctx, g);
  drawCsAmmo(ctx, g);
  if (g.duel) drawOpponentPanel(ctx, g);
  drawChat(ctx, g);
  drawBanner(ctx, g);
  if (g.cheatMsg) {
    const a = Math.min(1, (4 - g.cheatMsg.t) * 2);
    ctx.globalAlpha = a;
    rr(ctx, 10, 166, 300, 46, 4);
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fill();
    text(ctx, 'Чит-код активирован', 22, 186, { font: `bold 15px ${FONT.ui}`, color: '#fff' });
    text(ctx, `${g.cheatMsg.name}: ${g.cheatMsg.text}`, 22, 204, { font: `13px ${FONT.ui}`, color: '#cfd8dc' });
    ctx.globalAlpha = 1;
  }
  if (g.weaponNameT > 0 && g.arsenal[g.weapon]) {
    ctx.globalAlpha = Math.min(1, g.weaponNameT * 2);
    text(ctx, WEAPONS[g.weapon].name, 1270, 630, { font: `30px ${FONT.gta}`, color: '#ffd54a', align: 'right', stroke: '#000', lw: 5 });
    ctx.globalAlpha = 1;
  }
  if (g.pendingThrow) {
    const name = g.pendingThrow === 'he' ? 'гранату' : 'динамит';
    rr(ctx, 440, 176, 400, 40, 20);
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fill();
    text(ctx, `Коснись доски — бросить ${name}`, 640, 202, { font: `bold 18px ${FONT.ui}`, color: '#ffd54a', align: 'center' });
  }
  if (g.starT > 0) text(ctx, `★ ЗВЕЗДА ${Math.ceil(g.starT)}`, 640, 640, { font: `bold 16px ${FONT.ui}`, color: `hsl(${(now * 600) % 360},100%,70%)`, align: 'center', stroke: '#000', lw: 4 });
  if (g.dice) {
    const d = g.dice;
    const rot = d.t < d.dur ? d.t * 14 : 0;
    const sc = d.t < d.dur ? 1 : 1 + Math.sin(Math.min(1, (d.t - d.dur) * 4) * Math.PI) * 0.25;
    ell(ctx, 640, 455, 50, 10, 'rgba(0,0,0,0.3)');
    drawDice(ctx, 640, 400, 90 * sc, d.shown, rot);
  }
  for (const f of g.flyers) {
    const k = easeInOut(Math.min(1, f.t));
    drawItemIcon(ctx, f.key, lerp(f.x0, f.x1, k), lerp(f.y0, f.y1, k) - Math.sin(k * Math.PI) * 90, 30, now);
  }
}

function drawGtaHud(ctx, g, now) {
  const p = g.player;
  rr(ctx, 10, 10, 76, 76, 12);
  const wg = ctx.createRadialGradient(48, 44, 5, 48, 48, 50);
  wg.addColorStop(0, '#ffffff');
  wg.addColorStop(1, '#cfcfcf');
  ctx.fillStyle = wg;
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = '#111';
  ctx.stroke();
  const a = g.cur;

function drawMinecraftHud(ctx, g, now) {
  const p = g.player;
  const hb = LAYOUT.hotbar;
  const S = hb.slot;
  const x0 = hb.x;
  const ps = 2.5;
  const low = p.hp <= 4;
  for (let i = 0; i < 10; i++) {
    let hx = x0 + i * 19, hy = 649;
    if (g.heartShake > 0 || low) hy += Math.round(rand(-1.5, 1.5));
    drawPixel(ctx, PIX.heartEmpty, hx, hy, ps);
    if (p.hp >= (i + 1) * 2) drawPixel(ctx, PIX.heart, hx, hy, ps);
    else if (p.hp >= i * 2 + 1) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(hx, hy, 3.5 * ps, 8 * ps);
      ctx.clip();
      drawPixel(ctx, PIX.heart, hx, hy, ps);
      ctx.restore();
    }
  }
  for (let i = 0; i < 10; i++) {
    const fx = x0 + 9 * S - (i + 1) * 19 + 1, fy = 649;
    drawPixel(ctx, PIX.foodEmpty, fx, fy, ps);
    if (p.hunger >= (i + 1) * 2) drawPixel(ctx, PIX.food, fx, fy, ps);
    else if (p.hunger >= i * 2 + 1) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(fx + 3.5 * ps, fy, 4 * ps, 8 * ps);
      ctx.clip();
      drawPixel(ctx, PIX.food, fx, fy, ps);
      ctx.restore();
    }
  }
  ctx.fillStyle = '#111';
  ctx.fillRect(x0, 668, 9 * S, 5);
  ctx.fillStyle = '#7ee03c';
  ctx.fillRect(x0, 668, 9 * S * clamp(p.xp / g.xpNeed(), 0, 1), 5);
  if (p.level > 0) text(ctx, String(p.level), 640, 668, { font: `11px ${FONT.pixel}`, color: '#80ff20', stroke: '#000', lw: 4, align: 'center' });
  ctx.fillStyle = 'rgba(15,15,15,0.65)';
  ctx.fillRect(x0 - 3, hb.y - 3, 9 * S + 6, S + 6);
  HOTBAR.forEach((key, i) => {
    const r = hotbarSlotRect(i);
    ctx.fillStyle = 'rgba(139,139,139,0.35)';
    ctx.fillRect(r.x + 2, r.y + 2, S - 4, S - 4);
    ctx.strokeStyle = '#5a5a5a';
    ctx.lineWidth = 2;
    ctx.strokeRect(r.x + 1, r.y + 1, S - 2, S - 2);
    const n = g.inv[key] || 0;
    ctx.save();
    if (!n) ctx.globalAlpha = 0.25;
    drawItemIcon(ctx, key, r.x + S / 2, r.y + S / 2, 32, now);
    ctx.restore();
    if (n > 1) text(ctx, String(n), r.x + S - 3, r.y + S - 3, { font: `11px ${FONT.pixel}`, color: '#fff', align: 'right', shadow: '#3f3f3f', sx: 2, sy: 2 });
    text(ctx, String(i + 1), r.x + 4, r.y + 12, { font: `bold 10px ${FONT.ui}`, color: 'rgba(255,255,255,0.75)' });
    if (g.slotFlash[i] > 0) {
      ctx.fillStyle = `rgba(255,255,255,${g.slotFlash[i]})`;
      ctx.fillRect(r.x + 2, r.y + 2, S - 4, S - 4);
    }
  });
  const sr = hotbarSlotRect(g.sel);
  ctx.lineWidth = 4;
  ctx.strokeStyle = '#000';
  ctx.strokeRect(sr.x - 2, sr.y - 2, S + 4, S + 4);
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#ffffff';
  ctx.strokeRect(sr.x - 2, sr.y - 2, S + 4, S + 4);
  // название предмета под курсором мыши
  for (let i = 0; i < 9; i++) {
    if (inRect(Input.x, Input.y, hotbarSlotRect(i))) {
      const info = ITEM_INFO[HOTBAR[i]];
      const str = `${info.name} — ${info.desc}`;
      ctx.font = `bold 14px ${FONT.ui}`;
      const w = ctx.measureText(str).width + 16;
      const tx = clamp(Input.x - w / 2, 4, W - w - 4);

      ctx.fillStyle = 'rgba(16,0,16,0.92)';
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#2b0b5c';
      ctx.stroke();
      text(ctx, str, tx + 8, 637, { font: `bold 14px ${FONT.ui}`, color: '#fff' });
    }
  }
}

function drawCrosshair(ctx, g) {
  const gun = g.gun;
  const x = Input.x, y = Input.y;
  if (Input.touch && (Input.mode !== 'shoot' || g.pendingThrow)) {
    // на телефоне вместо прицела — значок режима касания
    ctx.beginPath();
    ctx.arc(x, y, 22, 0, TAU);
    ctx.strokeStyle = 'rgba(255,255,255,0.8)';
    ctx.lineWidth = 2;
    ctx.stroke();
    const icon = g.pendingThrow ? (g.pendingThrow === 'he' ? '💣' : '🧨') : Input.mode === 'rod' ? '🎣' : '🚩';
    text(ctx, icon, x, y + 8, { font: `22px ${FONT.ui}`, align: 'center' });
    return;
  }
  if (g.weapon === 'awp') {
    ctx.beginPath();
    ctx.arc(x, y, 30, 0, TAU);
    ctx.strokeStyle = 'rgba(0,0,0,0.85)';
    ctx.lineWidth = 3;
    ctx.stroke();
    line(ctx, x - 44, y, x - 6, y, '#000', 2);
    line(ctx, x + 6, y, x + 44, y, '#000', 2);
    line(ctx, x, y - 44, x, y - 6, '#000', 2);
    line(ctx, x, y + 6, x, y + 44, '#000', 2);
    circ(ctx, x, y, 2.5, '#ff1744');
  } else if (g.weapon === 'nova') {
    ctx.beginPath();
    ctx.arc(x, y, WEAPONS.nova.spread, 0, TAU);
    ctx.strokeStyle = 'rgba(57,255,20,0.55)';
    ctx.lineWidth = 2;
    ctx.stroke();
    circ(ctx, x, y, 3, '#39ff14');
  }
  if (g.weapon !== 'ak') {
    if (gun.reload > 0) {
      const p = 1 - gun.reload / g.wdef.reload;
      ctx.beginPath();
      ctx.arc(x, y, 24, -Math.PI / 2, -Math.PI / 2 + p * TAU);
      ctx.strokeStyle = 'rgba(255,255,255,0.85)';
      ctx.lineWidth = 3;
      ctx.stroke();
    } else if (gun.cd > 0) {
      ctx.beginPath();
      ctx.arc(x, y, 36, -Math.PI / 2, -Math.PI / 2 + (1 - gun.cd / g.wdef.interval) * TAU);
      ctx.strokeStyle = 'rgba(255,255,255,0.4)';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    return;
  }
  const gap = 5 + gun.heat * 22, len = 9;
  const segs = [[x - gap - len, y, x - gap, y], [x + gap, y, x + gap + len, y], [x, y - gap - len, x, y - gap], [x, y + gap, x, y + gap + len]];
  for (const s of segs) line(ctx, s[0], s[1], s[2], s[3], 'rgba(0,0,0,0.7)', 4);
  for (const s of segs) line(ctx, s[0], s[1], s[2], s[3], '#39ff14', 2);
  if (gun.reload > 0) {
    const p = 1 - gun.reload / g.wdef.reload;
    ctx.beginPath();
    ctx.arc(x, y, 24, -Math.PI / 2, -Math.PI / 2 + p * TAU);
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.lineWidth = 3;
    ctx.stroke();
  }
}

function mcButton(ctx, g, label, x, y, w, h, action, o = {}) {
  const hov = inRect(Input.x, Input.y, { x, y, w, h });
  ctx.fillStyle = '#000';
  ctx.fillRect(x - 2, y - 2, w + 4, h + 4);
  ctx.fillStyle = hov ? '#8592c9' : o.fill || '#7a7a7a';
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = hov ? '#b9c4f0' : '#a8a8a8';
  ctx.fillRect(x, y, w, 3);
  ctx.fillRect(x, y, 3, h);
  ctx.fillStyle = hov ? '#4f5d99' : '#4a4a4a';
  ctx.fillRect(x, y + h - 4, w, 4);
  ctx.fillRect(x + w - 3, y, 3, h);
  const fs = o.size || 14;
  text(ctx, label, x + w / 2, y + h / 2 + fs * 0.45, { font: `${fs}px ${FONT.pixel}`, color: hov ? '#ffffa0' : '#fff', align: 'center', shadow: '#3f3f3f', sx: 2, sy: 2 });
  g.buttons.push({ x, y, w, h, action });
}

function toggleFullscreen() {
  if (Input.touch && window.goFullscreen) return window.goFullscreen();
  try {
    const el = document.documentElement;
    if (!document.fullscreenElement) {
      const p = el.requestFullscreen && el.requestFullscreen();
      if (p && p.catch) p.catch(() => {});
    } else if (document.exitFullscreen) {
      document.exitFullscreen();
    }
  } catch (e) {
    /* полноэкранный режим недоступен */
  }
}

function drawDead(ctx, g, now) {
  const k = Math.min(1, g.deadT / 1.2);
  ctx.save();
  ctx.globalCompositeOperation = 'saturation';
  ctx.globalAlpha = k;
  ctx.fillStyle = 'hsl(0,0%,50%)';
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
  ctx.fillStyle = `rgba(0,0,0,${0.35 * k})`;
  ctx.fillRect(0, 0, W, H);
  if (g.deadT > 0.7) {
    const a = Math.min(1, (g.deadT - 0.7) * 3);
    const sc = 1 + Math.max(0, 1 - (g.deadT - 0.7) * 4) * 0.6;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(0, 150, W, 120);
    ctx.translate(640, 245);
    ctx.scale(sc, sc);
    text(ctx, 'WASTED', 0, 0, { font: `112px ${FONT.gta}`, color: '#c62828', stroke: '#000', lw: 8, align: 'center' });
    ctx.restore();
  }
  if (g.deadT > 1.5) {
    text(ctx, `Причина: ${g.deathCause}`, 640, 300, { font: `bold 18px ${FONT.ui}`, color: '#ffcdd2', stroke: '#000', lw: 4, align: 'center' });
    drawStats(ctx, g, 318);
    if (g.duel) drawDuelButtons(ctx, g, 560 + (g.newRecord || g.cheated ? 20 : 0));

      mcButton(ctx, g, 'ЕЩЁ РАЗ', 640 - 250, 560 + (g.newRecord || g.cheated ? 20 : 0), 240, 46, () => g.retry());
      mcButton(ctx, g, 'В МЕНЮ', 640 + 10, 560 + (g.newRecord || g.cheated ? 20 : 0), 240, 46, () => g.toTitle());

}

function drawWin(ctx, g, now) {
  ctx.fillStyle = `rgba(0,0,0,${Math.min(0.55, g.winT * 0.6)})`;
  ctx.fillRect(0, 0, W, H);
  const a = Math.min(1, g.winT * 2);
  ctx.globalAlpha = a;
  const final = g.levelIdx >= LEVELS.length - 1;
  text(ctx, final ? 'ХАОС ПОБЕЖДЁН!' : 'MISSION PASSED!', 640, 130, { font: `${final ? 76 : 88}px ${final ? FONT.title : FONT.gta}`, color: '#f2c230', stroke: '#000', lw: 9, align: 'center' });
  text(ctx, 'RESPECT +', 640, 182, { font: `40px ${FONT.gta}`, color: '#fff', stroke: '#000', lw: 6, align: 'center' });
  for (let i = 0; i < 3; i++) {
    const k = clamp((g.winT - 0.5 - i * 0.35) * 3, 0, 1);
    if (k <= 0) continue;
    const s = 3.2 * (k < 1 ? easeOutCubic(k) * 1.25 : 1) + Math.sin(now * 3 + i) * 0.1;
    drawCrown(ctx, 540 + i * 100, 238, s);
  }
  ctx.globalAlpha = 1;
  if (g.winT > 1.5) {
    const line1 = final ? 'Все 5 боссов повержены. Ты прошёл Хаос-Доску! · #1 VICTORY ROYALE' : `${g.tower.deathText}. +$10000 · уровень ${g.levelIdx + 2} открыт`;

    drawStats(ctx, g, 318);
    const by = 560 + (g.newRecord || g.cheated ? 20 : 0);
    if (g.duel) drawDuelButtons(ctx, g, by);
    else {
      drawTopPanel(ctx, g, now);
      if (final) mcButton(ctx, g, 'С НАЧАЛА', 640 - 250, by, 240, 46, () => g.startCampaign(0));
      else mcButton(ctx, g, 'ДАЛЬШЕ ▶', 640 - 250, by, 240, 46, () => g.nextLevel());
      mcButton(ctx, g, 'В МЕНЮ', 640 + 10, by, 240, 46, () => g.toTitle());
    }
  }
}

// ---------- экстренное собрание (Among Us) ----------
function drawMeeting(ctx, g, now) {
  const m = g.meeting;
  if (m.t < 2.2) {
    const k = Math.min(1, m.t * 4);
    ctx.fillStyle = `rgba(70,0,0,${0.8 * k})`;
    ctx.fillRect(0, 0, W, H);
    ['#e53935', '#1e88e5', '#43a047', '#fdd835', '#f5f5f5'].forEach((c, i) => {
      drawCrewmate(ctx, 340 + i * 150, 480 + Math.sin(now * 4 + i) * 5, 1.3, c);
    });
    const sc = 1 + Math.max(0, 0.3 - m.t) * 2;
    ctx.save();
    ctx.translate(640, 230);
    ctx.scale(sc, sc);
    text(ctx, 'ЭКСТРЕННОЕ', 0, -40, { font: `78px ${FONT.title}`, color: '#ff1744', stroke: '#fff', lw: 10, align: 'center' });
    text(ctx, 'СОБРАНИЕ', 0, 46, { font: `78px ${FONT.title}`, color: '#ff1744', stroke: '#fff', lw: 10, align: 'center' });
    ctx.restore();
    text(ctx, 'Среди врагов кто-то очень подозрительный...', 640, 352, { font: `bold 22px ${FONT.ui}`, color: '#fff', stroke: '#000', lw: 5, align: 'center' });
    return;
  }
  ctx.fillStyle = '#05050f';
  ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 140; i++) {
    const sx = (((i * 137.5) % W) - (m.t - 2.2) * (20 + (i % 5) * 15) + W) % W;
    const sy = (i * 71.3) % H;
    ctx.fillStyle = `rgba(255,255,255,${0.3 + (i % 4) * 0.18})`;
    ctx.fillRect(sx, sy, 2, 2);
  }
  const k = (m.t - 2.2) / 3;
  ctx.save();
  ctx.translate(lerp(-90, W + 90, k), 320 + Math.sin(k * 6) * 30);
  ctx.rotate(k * 12);
  drawCrewmate(ctx, 0, 0, 1.2, m.color);
  ctx.restore();
  const full = `${m.name} был предателем.`;
  const n = Math.floor(clamp((m.t - 2.6) * 22, 0, full.length));
  text(ctx, full.slice(0, n), 640, 470, { font: `bold 34px ${FONT.ui}`, color: '#fff', align: 'center' });
  if (m.t > 4) text(ctx, 'Осталось предателей: 0', 640, 515, { font: `22px ${FONT.ui}`, color: '#bdbdbd', align: 'center' });
}

// ---------- кампания: заставка уровня, выбор уровня, достижения ----------
const PORTRAIT_SCALE = { tower: 0.7, bowser: 1.0, dragon: 0.45, heli: 0.55, titan: 0.62 };

function wrapText(ctx, str, x, y, maxW, lineH, o) {
  ctx.font = o.font;
  const words = str.split(' ');
  let lineStr = '', yy = y;
  for (const w of words) {
    const test = lineStr ? lineStr + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && lineStr) {
      text(ctx, lineStr, x, yy, o);
      lineStr = w;
      yy += lineH;
    } else lineStr = test;
  }
  if (lineStr) text(ctx, lineStr, x, yy, o);
  return yy + lineH;
}

function drawIntro(ctx, g, now) {
  const L = g.level;
  const k = easeOutCubic(Math.min(1, g.introT * 2.5));
  ctx.fillStyle = 'rgba(6,6,10,0.78)';
  ctx.fillRect(0, 0, W, H);
  // косые полосы как в файтингах
  ctx.save();
  ctx.globalAlpha = 0.5 * k;
  ctx.fillStyle = '#b71c1c';
  ctx.beginPath();
  ctx.moveTo(760, 0);
  ctx.lineTo(W, 0);
  ctx.lineTo(W, H);
  ctx.lineTo(600, H);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
  const lx = 80 - (1 - k) * 300;
  text(ctx, `УРОВЕНЬ ${g.levelIdx + 1} / ${LEVELS.length}`, lx, 170, { font: `16px ${FONT.pixel}`, color: '#ffd54a' });
  text(ctx, L.name.toUpperCase(), lx, 240, { font: `58px ${FONT.title}`, color: '#fff', stroke: '#000', lw: 8 });
  text(ctx, `по мотивам: ${L.ref}`, lx, 276, { font: `bold 18px ${FONT.ui}`, color: '#b0bec5' });
  let y = wrapText(ctx, L.tip, lx, 330, 540, 28, { font: `20px ${FONT.ui}`, color: '#eef3e6' });
  const names = [...new Set(L.pool.map(([t]) => ENEMY_DEF[t].name))];
  text(ctx, 'Враги уровня:', lx, y + 14, { font: `bold 16px ${FONT.ui}`, color: '#ff8a65' });
  wrapText(ctx, names.join(', '), lx, y + 40, 540, 24, { font: `16px ${FONT.ui}`, color: '#cfd8dc' });
  // портрет босса
  const px = 960 + (1 - k) * 400;
  const glow = ctx.createRadialGradient(px, 330, 10, px, 330, 260);
  glow.addColorStop(0, 'rgba(255,220,120,0.35)');
  glow.addColorStop(1, 'rgba(255,220,120,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(px - 260, 70, 520, 520);
  drawBossPortrait(ctx, L.boss, px, 330, PORTRAIT_SCALE[L.boss] * 1.7, now);
  text(ctx, g.tower.name.toUpperCase(), px, 560, { font: `30px ${FONT.title}`, color: '#ffd54a', stroke: '#000', lw: 6, align: 'center' });
  text(ctx, 'VS', 700, 360, { font: `110px ${FONT.gta}`, color: '#ff1744', stroke: '#fff', lw: 8, align: 'center' });
  if (Math.floor(now * 2) % 2 === 0) text(ctx, 'Клик или Enter — в бой!', 640, 670, { font: `bold 22px ${FONT.ui}`, color: '#fff', stroke: '#000', lw: 5, align: 'center' });
}

function drawLevels(ctx, g, now) {
  ctx.fillStyle = 'rgba(6,10,6,0.85)';
  ctx.fillRect(0, 0, W, H);
  text(ctx, 'ВЫБОР УРОВНЯ', 640, 92, { font: `52px ${FONT.title}`, color: '#ffd54a', stroke: '#000', lw: 8, align: 'center' });
  LEVELS.forEach((L, i) => {
    const r = { x: 58 + i * 236, y: 140, w: 220, h: 420 };
    const locked = i > g.unlocked;
    const hov = !locked && inRect(Input.x, Input.y, r);
    const th = THEMES[L.theme];
    rr(ctx, r.x, r.y, r.w, r.h, 14);
    const bg = ctx.createLinearGradient(0, r.y, 0, r.y + r.h);
    bg.addColorStop(0, th.dark);
    bg.addColorStop(1, '#111');
    ctx.fillStyle = bg;
    ctx.fill();
    ctx.lineWidth = hov ? 5 : 2;
    ctx.strokeStyle = hov ? '#ffd54a' : 'rgba(255,255,255,0.3)';
    ctx.stroke();
    ctx.save();
    rr(ctx, r.x, r.y, r.w, r.h, 14);
    ctx.clip();
    drawBossPortrait(ctx, L.boss, r.x + r.w / 2, r.y + 130, PORTRAIT_SCALE[L.boss], now);
    ctx.restore();
    text(ctx, `УРОВЕНЬ ${i + 1}`, r.x + r.w / 2, r.y + 270, { font: `13px ${FONT.pixel}`, color: '#ffd54a', align: 'center' });
    wrapText(ctx, L.name, r.x + r.w / 2, r.y + 306, r.w - 24, 28, { font: `24px ${FONT.title}`, color: '#fff', align: 'center', stroke: '#000', lw: 5 });
    text(ctx, L.ref, r.x + r.w / 2, r.y + 390, { font: `bold 15px ${FONT.ui}`, color: '#b0bec5', align: 'center' });
    if (locked) {
      rr(ctx, r.x, r.y, r.w, r.h, 14);
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fill();
      rr(ctx, r.x + r.w / 2 - 24, r.y + 160, 48, 40, 6);
      ctx.fillStyle = '#9e9e9e';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(r.x + r.w / 2, r.y + 160, 16, Math.PI, 0);
      ctx.lineWidth = 7;
      ctx.strokeStyle = '#9e9e9e';
      ctx.stroke();
      text(ctx, `Пройди уровень ${i}`, r.x + r.w / 2, r.y + 236, { font: `bold 15px ${FONT.ui}`, color: '#eee', align: 'center' });
    } else {
      g.buttons.push({ x: r.x, y: r.y, w: r.w, h: r.h, action: () => g.startCampaign(i) });

'use strict';
/* Запуск: холст, масштабирование под окно, мышь, клавиатура, касания и игровой цикл. */

(function boot() {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const game = new Game();
  window.__game = game; // для отладки из консоли

  // Телефон или планшет: показываем сенсорные кнопки по краям экрана.
  const mq = (q) => !!(window.matchMedia && matchMedia(q).matches);
  const isTouch = mq('(pointer: coarse)') || (navigator.maxTouchPoints > 0 && !mq('(pointer: fine)'));
  if (isTouch) {
    document.body.classList.add('touch');
    Input.touch = true;
  }

  function resize() {
    const vw = window.innerWidth, vh = window.innerHeight;
    const side = isTouch ? Math.round(clamp(vw * 0.085, 58, 96)) : 0;
    document.documentElement.style.setProperty('--side', side + 'px');
    const dpr = Math.min(window.devicePixelRatio || 1, isTouch ? 1.75 : 2);
    const scale = Math.max(0.1, Math.min((vw - side * 2) / W, vh / H));
    canvas.style.width = Math.floor(W * scale) + 'px';
    canvas.style.height = Math.floor(H * scale) + 'px';
    canvas.width = Math.max(1, Math.round(W * scale * dpr));
    canvas.height = Math.max(1, Math.round(H * scale * dpr));
    View.k = scale * dpr;
    View.pw = canvas.width;
    View.ph = canvas.height;
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 200));
  resize();

  function toLogical(clientX, clientY) {
    const r = canvas.getBoundingClientRect();
    return { x: ((clientX - r.left) / r.width) * W, y: ((clientY - r.top) / r.height) * H };
  }

  // ---------- мышь и клавиатура ----------
  window.addEventListener('mousemove', (e) => {
    if (Input.touch && e.sourceCapabilities && e.sourceCapabilities.firesTouchEvents) return;
    const p = toLogical(e.clientX, e.clientY);
    Input.x = clamp(p.x, 0, W);
    Input.y = clamp(p.y, 0, H);
  });
  canvas.addEventListener('mousedown', (e) => {
    e.preventDefault();
    Sound.init();
    const p = toLogical(e.clientX, e.clientY);
    Input.x = p.x;
    Input.y = p.y;
    if (e.button === 0) Input.lmb = true;
    if (e.button === 2) Input.rmb = true;
    Input.queue.push({ type: 'down', button: e.button, x: p.x, y: p.y });
  });
  window.addEventListener('mouseup', (e) => {
    if (e.button === 0) Input.lmb = false;
    if (e.button === 2) Input.rmb = false;
    Input.queue.push({ type: 'up', button: e.button });
  });
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  canvas.addEventListener('auxclick', (e) => e.preventDefault());
  canvas.addEventListener(
    'wheel',
    (e) => {
      e.preventDefault();
      if (e.deltaY) Input.queue.push({ type: 'wheel', dy: Math.sign(e.deltaY) });
    },
    { passive: false }
  );
  window.addEventListener('keydown', (e) => {
    if (e.target instanceof Element && e.target.closest('#nick')) return; // печатают ник
    if (['Space', 'Tab', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
    Sound.init();
    Input.keys.add(e.code);
    if (!e.repeat) Input.queue.push({ type: 'key', code: e.code });
  });
  window.addEventListener('keyup', (e) => Input.keys.delete(e.code));
  window.addEventListener('blur', () => {
    Input.keys.clear();
    game.onBlur();
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) game.onBlur();
  });

  // ---------- касания по доске ----------
  // Один палец целится: в режиме «огонь» касание стреляет (держи — очередь),
  // в режимах «удочка» и «флажок» касание делает это действие в точке.
  // На арене левая часть экрана — джойстик бега, правая — прицел и огонь.
  let aimTouch = null;
  function arenaTouchStart(e) {
    for (const t of e.changedTouches) {
      const p = toLogical(t.clientX, t.clientY);
      if (Arena.menu) {
        Input.x = p.x;
        Input.y = p.y;
        Input.queue.push({ type: 'down', button: 0, x: p.x, y: p.y });
      } else if (p.x < W * 0.42 && Input.stick.id === null) {
        Object.assign(Input.stick, { id: t.identifier, ox: p.x, oy: p.y, x: p.x, y: p.y });
      } else if (aimTouch === null) {
        aimTouch = t.identifier;
        Input.x = p.x;
        Input.y = p.y;
        Input.lmb = true;
      }
    }
  }
  canvas.addEventListener(
    'touchstart',
    (e) => {
      e.preventDefault();
      Sound.init();
      Input.touch = true;
      if (game.state === 'arena') return arenaTouchStart(e);
      if (game.state === 'ut') {
        // бой «как в Undertale»: касание — это и «ок», и джойстик для души
        for (const t of e.changedTouches) {
          const p = toLogical(t.clientX, t.clientY);
          Input.x = p.x;
          Input.y = p.y;
          Input.queue.push({ type: 'down', button: 0, x: p.x, y: p.y });
          if (Input.stick.id === null) Object.assign(Input.stick, { id: t.identifier, ox: p.x, oy: p.y, x: p.x, y: p.y });
        }
        return;
      }
      if (aimTouch !== null) return;
      const t = e.changedTouches[0];
      aimTouch = t.identifier;
      const p = toLogical(t.clientX, t.clientY);
      Input.x = p.x;
      Input.y = p.y;
      if (game.state !== 'play' || game.pendingThrow || game.isUiPoint(p.x, p.y)) {
        Input.queue.push({ type: 'down', button: 0, x: p.x, y: p.y });
        return;
      }
      if (Input.mode === 'rod') Input.queue.push({ type: 'down', button: 2, x: p.x, y: p.y });
      else if (Input.mode === 'flag') Input.queue.push({ type: 'down', button: 1, x: p.x, y: p.y });
      else {
        Input.lmb = true;
        Input.queue.push({ type: 'down', button: 0, x: p.x, y: p.y });
      }
    },
    { passive: false }
  );
  canvas.addEventListener(
    'touchmove',
    (e) => {
      e.preventDefault();
      for (const t of e.changedTouches) {
        if (t.identifier === Input.stick.id) {
          const p = toLogical(t.clientX, t.clientY);
          Input.stick.x = p.x;
          Input.stick.y = p.y;
          continue;
        }
        if (t.identifier !== aimTouch) continue;
        const p = toLogical(t.clientX, t.clientY);
        Input.x = clamp(p.x, 0, W);
        Input.y = clamp(p.y, 0, H);
      }
    },
    { passive: false }
  );
  function endTouch(e) {
    e.preventDefault();
    Sound.init();
    for (const t of e.changedTouches) {
      if (t.identifier === Input.stick.id) Input.stick.id = null;
      if (t.identifier !== aimTouch) continue;
      aimTouch = null;
      Input.lmb = false;
      Input.queue.push({ type: 'up', button: 0 });
    }
  }
  canvas.addEventListener('touchend', endTouch, { passive: false });
  canvas.addEventListener('touchcancel', endTouch, { passive: false });

  // ---------- сенсорные кнопки ----------
  const modeButtons = [...document.querySelectorAll('[data-mode]')];
  function setMode(mode) {
    Input.mode = mode;
    for (const b of modeButtons) b.classList.toggle('on', b.dataset.mode === mode);
  }
  setMode('shoot');
  const actions = {
    pause: () => Input.queue.push({ type: 'key', code: 'Escape' }),
    buy: () => Input.queue.push({ type: 'key', code: 'KeyB' }),
    reload: () => Input.queue.push({ type: 'key', code: 'KeyR' }),
    weapon: () => Input.queue.push({ type: 'key', code: 'KeyX' }),
    grenade: () => (game.state === 'arena' ? Input.queue.push({ type: 'key', code: 'KeyG' }) : game.armThrow('he')),
    super: () => Input.queue.push({ type: 'key', code: 'KeyE' }),
    fullscreen: () => goFullscreen(),
  };
  for (const b of document.querySelectorAll('.tbar button')) {
    b.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      Sound.init();
      if (b.dataset.mode) setMode(b.dataset.mode);
      else if (b.dataset.act) actions[b.dataset.act]();
      else if (b.dataset.hold) {
        Input.keys.add('ShiftLeft');
        b.classList.add('held');
      }
    });
    const release = () => {
      if (!b.dataset.hold) return;
      Input.keys.delete('ShiftLeft');
      b.classList.remove('held');
    };
    b.addEventListener('pointerup', release);
    b.addEventListener('pointercancel', release);
    b.addEventListener('pointerleave', release);
    b.addEventListener('contextmenu', (e) => e.preventDefault());
  }

  // Полный экран и альбомная ориентация (работает на Android; на iPhone — через «На экран Домой»).
  function goFullscreen() {
    try {
      const el = document.documentElement;
      const req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (!document.fullscreenElement && req) {
        const p = req.call(el);
        const lock = () => {
          if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {});
        };
        if (p && p.then) p.then(lock).catch(() => {});
        else lock();
      } else if (document.exitFullscreen) {
        document.exitFullscreen();
      }
    } catch (err) {
      /* полноэкранный режим недоступен */
    }
  }
  window.goFullscreen = goFullscreen;

  // Офлайн-режим и установка на главный экран (только когда игра открыта с сайта).
  // Вышла новая версия — перезагружаемся в неё сами, но только в меню, не посреди боя.
  let updateReady = false;
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && document.querySelector('link[rel="manifest"]')) {
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      // новый sw.js к этому моменту уже сложил файлы в свой кэш: кэш новее нашей версии — страница устарела
      caches.keys().then((keys) => {
        if (keys.some((k) => Number(k.split('-v')[1]) > GAME_VERSION)) updateReady = true;
      }).catch(() => {});
    });
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then((reg) => {
        // ярлык на телефоне сам не перезагружается — проверяем обновление, когда игру снова открыли
        document.addEventListener('visibilitychange', () => {
          if (!document.hidden) reg.update().catch(() => {});
        });
      }).catch(() => {});
    });
  }

  // какая музыка нужна сейчас
  function musicTrack(g) {
    const s = g.state;
    if (s === 'ut') return 'battle';
    if (s === 'durak') return Durak.mode === 'boss' ? 'hunt' : 'neon';
    if (s === 'arena') return 'hunt';
    if (s === 'dead' || g.jumpscare) return '';
    if (s === 'play' || s === 'pause' || s === 'buy' || s === 'cheats' || s === 'intro') return 'drive';
    return 'neon';
  }

  // заряд «супера» на кнопке
  const superBtn = document.querySelector('[data-act=super]');
  let superShown = -1;
  function updateSuperButton() {
    const k = Arena.me ? Math.floor(Arena.me.su * 10) : 0;
    if (!superBtn || k === superShown) return;
    superShown = k;
    superBtn.classList.toggle('on', k >= 10);
    superBtn.querySelector('small').textContent = k >= 10 ? 'СУПЕР!' : `супер ${k * 10}%`;
  }

  let last = performance.now();
  let uiState = '';
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now;
    try {
      game.update(dt);
      render(ctx, game);
      const playing = ['play', 'buy', 'pause', 'cheats'].includes(game.state);
      const arena = game.state === 'arena';
      const st = arena ? 'arena' : playing ? 'play' : 'menu';
      if (st !== uiState) {
        uiState = st;
        document.body.classList.toggle('ui-play', playing || arena);
        document.body.classList.toggle('ui-arena', arena);
        if (!playing) Input.keys.delete('ShiftLeft');
        if (!arena && game.state !== 'ut') Input.stick.id = null;
      }
      if (arena) updateSuperButton();
      Music.update(musicTrack(game));
      if (updateReady && ['title', 'levels', 'achievements'].includes(game.state)) {
        updateReady = false;
        location.reload();
      }
    } catch (err) {
      console.error(err);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

</script>
</body>
</html>
