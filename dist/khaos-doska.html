  text(ctx, String(Math.max(0, Math.ceil(me.hp))), 222, 668, { font: `bold 16px ${FONT.ui}`, color: '#fff' });
  ctx.fillStyle = '#0d2530';
  ctx.fillRect(52, 676, 160, 8);
  ctx.fillStyle = '#40c4ff';
  ctx.fillRect(52, 676, 160 * clamp(me.ar / 100, 0, 1), 8);
  text(ctx, String(Math.ceil(me.ar)), 222, 685, { font: `12px ${FONT.ui}`, color: '#b3e5fc' });
  const ready = me.su >= 1;
  ctx.fillStyle = '#3e2f00';
  ctx.fillRect(52, 690, 160, 10);
  ctx.fillStyle = ready && Math.floor(t * 4) % 2 ? '#fff176' : '#ffca28';
  ctx.fillRect(52, 690, 160 * me.su, 10);
  text(ctx, ready ? (Input.touch ? 'СУПЕР!' : 'E — СУПЕР!') : 'супер', 222, 700, { font: `bold 11px ${FONT.ui}`, color: ready ? '#ffd54a' : '#9e9e9e' });
  if (me.nades > 0) {
    drawGrenade(ctx, 278, 662, 0.75);
    text(ctx, `×${me.nades}`, 284, 690, { font: `bold 12px ${FONT.ui}`, color: '#fff' });
  }

  // оружие и патроны
  const st = me.guns[me.w] || { mag: 0, res: 0 };
  rr(ctx, 1008, 646, 260, 62, 10);
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fill();
  if (me.w === 'crowbar') {
    ctx.save();
    ctx.translate(1035, 682);
    ctx.rotate(-0.35);
    drawCrowbar(ctx, 1.1);
    ctx.restore();
    text(ctx, 'монтировка', 1196, 686, { font: `bold 16px ${FONT.ui}`, color: '#ffab91', align: 'right' });
  } else {
    drawWeaponIcon(ctx, me.w, 1060, 677);
    text(ctx, `${st.mag}`, 1196, 686, { font: `30px ${FONT.title}`, color: st.mag ? '#fff' : '#ff5252', align: 'right' });
    text(ctx, `/ ${st.res}`, 1204, 686, { font: `16px ${FONT.ui}`, color: '#b0bec5' });
  }
  const own = ARENA_GUN_ORDER.filter((w) => me.guns[w]);
  text(ctx, own.map((w) => (w === me.w ? `[${ARENA_GUN_ORDER.indexOf(w) + 1}]` : `${ARENA_GUN_ORDER.indexOf(w) + 1}`)).join(' '), 1138, 702, { font: `11px ${FONT.ui}`, color: '#90a4ae', align: 'center' });
  if (me.reloadT > 0) {
    const k = 1 - me.reloadT / ARENA_GUNS[me.w].reload;
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.fillRect(1020, 650, 236, 4);
    ctx.fillStyle = '#ffd54a';
    ctx.fillRect(1020, 650, 236 * k, 4);
  }
  // стихия Глаза Бога
  if (me.elT > 0 && me.el) {
    const c = ELEMENTS[me.el].color;
    circ(ctx, 980, 677, 22, 'rgba(0,0,0,0.55)');
    ctx.beginPath();
    ctx.arc(980, 677, 20, -Math.PI / 2, -Math.PI / 2 + TAU * (me.elT / ARENA.visionTime));
    ctx.strokeStyle = c;
    ctx.lineWidth = 4;
    ctx.stroke();
    text(ctx, ELEMENTS[me.el].name, 980, 682, { font: `bold 11px ${FONT.ui}`, color: c, align: 'center' });
  }

  // подсказка в начале
  if (t < 9) {
    ctx.globalAlpha = Math.min(1, (9 - t) / 1.5);
    const hint = Input.touch
      ? 'Левый палец — бег, правый — прицел и огонь. Сбоку: граната, оружие (есть монтировка), СУПЕР, перезарядка'
      : 'WASD — бег · мышь — огонь · R — перезарядка · 1–4 — оружие (4 — монтировка) · E — супер · G — граната · Esc — меню';
    wrapText(ctx, hint, 640, 618, 720, 18, { font: `bold 14px ${FONT.ui}`, color: '#fff', stroke: '#000', lw: 4, align: 'center' });
    ctx.globalAlpha = 1;
  }

  // большие надписи
  const m = A.bigMsg;
  if (m) {
    const k = Math.min(1, m.t * 4, (m.life - m.t) * 3);
    ctx.globalAlpha = clamp(k, 0, 1);
    if (m.wasted) {
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillRect(0, 300, W, 120);
      text(ctx, 'WASTED', 640, 380, { font: `84px ${FONT.gta}`, color: '#d32f2f', stroke: '#000', lw: 8, align: 'center' });
      const sub = m.out ? 'Жизни кончились' : `Возрождение через ${Math.max(1, Math.ceil(me.respawnT))}…`;
      text(ctx, sub, 640, 412, { font: `bold 18px ${FONT.ui}`, color: '#fff', stroke: '#000', lw: 4, align: 'center' });
    } else {
      text(ctx, m.str, 640, 300, { font: `64px ${FONT.title}`, color: m.color, stroke: '#000', lw: 9, align: 'center' });
      if (m.sub) text(ctx, m.sub, 640, 340, { font: `bold 22px ${FONT.ui}`, color: '#fff', stroke: '#000', lw: 5, align: 'center' });
    }
    ctx.globalAlpha = 1;
  }

  // джойстик на телефоне
  const sk = Input.stick;
  if (Input.touch && sk && sk.id !== null) {
    ctx.beginPath();
    ctx.arc(sk.ox, sk.oy, 70, 0, TAU);
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 3;
    ctx.stroke();
    const dx = sk.x - sk.ox, dy = sk.y - sk.oy, d = Math.hypot(dx, dy), k = d > 70 ? 70 / d : 1;
    circ(ctx, sk.ox + dx * k, sk.oy + dy * k, 28, 'rgba(255,255,255,0.45)');
  } else if (Input.touch && t < 12) {
    ctx.globalAlpha = 0.5;
    ctx.beginPath();
    ctx.arc(170, 520, 60, 0, TAU);
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 3;
    ctx.setLineDash([8, 8]);
    ctx.stroke();
    ctx.setLineDash([]);
    text(ctx, 'бег', 170, 526, { font: `bold 16px ${FONT.ui}`, color: '#fff', align: 'center' });
    ctx.globalAlpha = 1;
  }

  // меню
  g.buttons = [];
  if (A.menu) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);
    text(ctx, 'МЕНЮ', 640, 250, { font: `56px ${FONT.title}`, color: '#fff', stroke: '#000', lw: 8, align: 'center' });
    const note = A.solo ? 'Игра не на паузе — босс продолжает!' : 'Игра не на паузе — соперник продолжает!';
    text(ctx, note, 640, 290, { font: `bold 18px ${FONT.ui}`, color: '#ffab91', align: 'center' });
    mcButton(ctx, g, 'ПРОДОЛЖИТЬ', 640 - 160, 330, 320, 52, () => {
      A.menu = false;
      A.suppress = true;
    });
    mcButton(ctx, g, A.solo ? 'ВЫЙТИ' : 'СДАТЬСЯ И ВЫЙТИ', 640 - 160, 398, 320, 52, () => Duel.close(g), { fill: '#8a3a3a' });
  }
}

function drawArenaCrosshair(ctx) {
  const A = Arena;
  if (A.menu || A.me.dead) return;
  const x = Input.x, y = Input.y;
  if (Input.touch && !Input.lmb) return;
  const gap = A.me.w === 'nova' ? 14 : 7;
  const color = A.me.elT > 0 && A.me.el ? ELEMENTS[A.me.el].color : '#7ee03c';
  ctx.lineWidth = 2;
  for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
    line(ctx, x + dx * gap, y + dy * gap, x + dx * (gap + 10), y + dy * (gap + 10), '#000', 4);
    line(ctx, x + dx * gap, y + dy * gap, x + dx * (gap + 10), y + dy * (gap + 10), color, 2);
  }
  if (A.hitMarkT > 0) {
    for (const [dx, dy] of [[1, 1], [-1, 1], [1, -1], [-1, -1]]) line(ctx, x + dx * 6, y + dy * 6, x + dx * 14, y + dy * 14, '#fff', 3);
  }
}

// Весь кадр в режиме арены (и экран итога поверх неё).
function renderArena(ctx, g, now) {
  drawArena(ctx, g, now);
  if (g.state === 'duelover') {
    g.buttons = [];
    drawDuelOver(ctx, g, now);
  }
  Ach.draw(ctx);
  if (g.state === 'arena' && !Arena.menu) drawArenaCrosshair(ctx);
  else if (!Input.touch) drawPointer(ctx);
}

// ---- js/raid.js ----
'use strict';
/* Босс-рейд: бой с боссом пешком на арене — одному или вдвоём с другом.
   Босс сидит в логове наверху и бьёт залпами, кольцом снарядов, метками на земле и
   ударной волной (если подойти вплотную), а ещё зовёт миньонов: свою свиту, слаймов
   из Genshin и хедкрабов из Half-Life.
   Мозг босса и миньоны живут у хозяина комнаты: он решает, когда босс атакует, и двигает
   миньонов, а второй игрок получает это через «присутствие». Урон по себе каждый считает
   сам, урон по боссу — тот, кто стрелял; здоровье босса = максимум − урон обоих. */

const RAID = {
  hpSolo: 4500,
  hpDuo: 7500,
  time: 300,
  lives: 3,
  respawn: 4,
  near: 280, // «вплотную» — ближе этого к боссу урон выше
  nearBonus: 1.4,
  projSpeed: 330,
  projDmg: 12,
  ringDmg: 10,
  markDmg: 26,
  markR: 85,
  markDelay: 1.3,
  waveDmg: 18,
  waveR: 330,
  waveTime: 0.7,
  contactDmg: 10,
  maxMinions: 8,
  minionR: 22,
};

const RAID_MINIONS = {
  pawn: { hp: 40, speed: 85 },
  knight: { hp: 60, speed: 115 },
  goomba: { hp: 35, speed: 95 },
  koopa: { hp: 60, speed: 80 },
  enderman: { hp: 70, speed: 120 },
  cop: { hp: 60, speed: 95 },
  skibidi: { hp: 80, speed: 80 },
  slime: { hp: 45, speed: 95 },
  headcrab: { hp: 25, speed: 115 },
};
const RAID_THEMED = { tower: ['pawn', 'knight'], bowser: ['goomba', 'koopa'], dragon: ['enderman'], heli: ['cop'], titan: ['skibidi'] };

// Слайм из Genshin: прыгучая капля своей стихии.
function drawSlime(ctx, x, y, t, el) {
  const c = ELEMENTS[el] ? ELEMENTS[el].color : '#7ee03c';
  const b = Math.abs(Math.sin(t * 5));
  ell(ctx, x, y + 18, 20 - b * 4, 5, 'rgba(0,0,0,0.25)');
  ctx.save();
  ctx.translate(x, y + 16 - b * 16);
  ctx.scale(1 + (1 - b) * 0.12, 1 - (1 - b) * 0.12);
  ctx.beginPath();
  ctx.arc(0, -14, 20, Math.PI, 0);
  ctx.lineTo(20, 0);
  ctx.quadraticCurveTo(0, 6, -20, 0);
  ctx.closePath();
  ctx.fillStyle = c;
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.35)';
  ctx.lineWidth = 2;
  ctx.stroke();
  circ(ctx, -8, -24, 5, 'rgba(255,255,255,0.55)');
  circ(ctx, -6, -10, 3, '#1a1a1a');
  circ(ctx, 6, -10, 3, '#1a1a1a');
  ctx.restore();
}

// Хедкраб из Half-Life: плоский, на четырёх парах ног, прыгает в лицо.
function drawHeadcrab(ctx, x, y, t, leaping) {
  const lift = leaping ? 16 : 0;
  ell(ctx, x, y + 16, 22, 6, 'rgba(0,0,0,0.3)');
  ctx.save();
  ctx.translate(x, y + 8 - lift);
  for (let i = 0; i < 4; i++) {
    const s = Math.sin(t * 14 + i) * 3;
    for (const sx of [-1, 1]) {
      line(ctx, sx * (6 + i * 3), -2, sx * (18 + i * 2), 8 + s * sx, '#8d6e63', 3);
    }
  }
  ell(ctx, 0, -4, 20, 12, '#d7b98a');
  ell(ctx, 0, -8, 15, 7, '#a1887f');
  circ(ctx, 0, 4, 6, '#ef9a9a');
  circ(ctx, 0, 4, 3, '#b71c1c');
  ctx.restore();
}

function drawRaidMinion(ctx, m, x, y, t) {
  const ph = t + m.id * 0.37;
  switch (m.type) {
    case 'pawn': drawPiece(ctx, 'p', false, x, y - 10, 54); break;
    case 'knight': drawPiece(ctx, 'n', false, x, y - 12, 60); break;
    case 'goomba': drawGoomba(ctx, x, y - 14, ph, { walking: true }); break;
    case 'koopa': drawKoopa(ctx, x, y - 14, ph, { walking: true }); break;
    case 'enderman': drawEnderman(ctx, x, y - 18, ph, { walking: true }); break;
    case 'cop': drawCop(ctx, x, y - 18, ph, { walking: true }); break;
    case 'skibidi': drawSkibidi(ctx, x, y - 18, ph, { singing: true }); break;
    case 'slime': drawSlime(ctx, x, y, ph, m.el); break;
    case 'headcrab': drawHeadcrab(ctx, x, y, ph, m.leapT > 0); break;
  }
  const max = RAID_MINIONS[m.type].hp;
  if (m.hp < max) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(x - 21, y - 52, 42, 6);
    ctx.fillStyle = '#ff7043';
    ctx.fillRect(x - 20, y - 51, 40 * clamp(m.hp / max, 0, 1), 4);
  }
}

const Raid = {
  on: false,
  kind: 'tower',
  boss: null,
  host: true,
  solo: false,
  max: 1,
  bd: 0, // твой урон по боссу
  oppBd: 0, // урон друга
  kills: 0,
  oppKills: 0,
  minions: new Map(),
  nextId: 1,
  events: [],
  evSeq: 0,
  seenEv: 0,
  mh: [],
  mhSeq: 0,
  seenMh: 0,
  projs: [],
  marks: [],
  waves: [],
  timers: null,
  ragePhase: 0,
  hitT: 0,
  fireT: 0,
  deadT: 0,
  // заглушка «игры» для методов боссов кампании (нам нужны только их движение и рисунок)
  stub: { banner() {}, say() {}, bossEmote() {}, spawnEnemy() {}, addHazard() { return {}; }, def: [], darkness: 0 },

  start(kind, host, solo) {
    this.on = true;
    this.kind = RAID_THEMED[kind] ? kind : 'tower';
    this.host = host;
    this.solo = solo;
    this.boss = makeBoss(this.kind, 1000);
    if (this.boss.crystals) for (const c of this.boss.crystals) c.alive = false;
    this.max = solo ? RAID.hpSolo : RAID.hpDuo;
    if (this.kind !== 'bowser') this.boss.max = this.max;
    this.bd = this.oppBd = 0;
    this.kills = this.oppKills = 0;
    this.minions = new Map();
    this.nextId = 1;
    this.events = [];
    this.evSeq = this.seenEv = 0;
    this.mh = [];
    this.mhSeq = this.seenMh = 0;
    this.projs = [];
    this.marks = [];
    this.waves = [];
    this.timers = { volley: 3, ring: 9, mark: 6, summon: 3, wave: 0 };
    this.ragePhase = 0;
    this.hitT = this.fireT = this.deadT = 0;
    this.boomed = false;
  },

  stop() {
    this.on = false;
    this.minions = new Map();
    this.projs = [];
    this.marks = [];
    this.waves = [];
  },

  hp() {
    return Math.max(0, this.max - this.bd - this.oppBd);
  },

  dead() {
    return this.on && this.hp() <= 0;
  },

  // Живые игроки, по которым может бить босс.
  targets() {
    const out = [];
    const me = Arena.me;
    if (!me.dead) out.push({ x: me.x, y: me.y });
    if (!Arena.solo) {
      const op = Arena.oppNow();
      if (op && !Arena.op.dead) out.push({ x: op.x, y: op.y });
    }
    return out;
  },

  minionPos(m) {
    if (this.host) return m;
    return interpBuf(m.buf, ARENA.lag) || m;
  },

  update(dt) {
    const b = this.boss;
    b.t = Arena.t;
    if (this.dead()) this.deadT += dt;
    else b.move(dt, this.stub);
    // полоска на башне показывает здоровье рейда; у Боузера держим полное — иначе всплывёт «топор» из кампании
    b.hp = this.kind === 'bowser' ? b.max : Math.max(1, this.hp());
    if (this.hitT > 0) this.hitT -= dt;
    if (this.fireT > 0) this.fireT -= dt;
    b.hit = Math.max(0, this.hitT);
    b.fire = Math.max(0, this.fireT);
    if (this.host && !this.dead()) {
      this.ai(dt);
      this.moveMinions(dt);
    }
    this.updateShots(dt);
  },

  // Мозг босса (только у хозяина комнаты).
  ai(dt) {
    const tg = this.targets();
    if (!tg.length) return;
    const rage = 1 - this.hp() / this.max;
    const sp = 1 + rage * 0.7;
    const tm = this.timers;
    tm.volley -= dt * sp;
    tm.ring -= dt * sp;
    tm.mark -= dt * sp;
    tm.summon -= dt * sp;
    tm.wave -= dt;
    if (tm.volley <= 0) {
      tm.volley = rand(1.8, 2.6);
      const p = choice(tg);
      this.emit({ k: 'v', tx: Math.round(p.x), ty: Math.round(p.y) });
    }
    if (tm.ring <= 0) {
      tm.ring = rand(8, 10);
      this.emit({ k: 'r', o: Math.round(rand(0, 100)) / 100 });
    }
    if (tm.mark <= 0) {
      tm.mark = rand(6, 8);
      this.emit({ k: 'm', p: tg.map((p) => [Math.round(p.x + rand(-25, 25)), Math.round(p.y + rand(-25, 25))]) });
    }
    const c = this.boss.center;
    if (tm.wave <= 0 && tg.some((p) => dist(p.x, p.y, c.x, c.y) < RAID.near)) {
      tm.wave = 4.5;
      this.emit({ k: 'w' });
    }
    if (tm.summon <= 0) {
      tm.summon = rand(10, 13);
      this.summon(2);
    }
    const phase = rage >= 0.67 ? 2 : rage >= 0.34 ? 1 : 0;
    if (phase > this.ragePhase) {
      this.ragePhase = phase;
      this.summon(3);
      this.emit({ k: 'e', s: this.boss.rageText || 'Босс в ярости!' });
    }
  },

  summon(n) {
    const themed = RAID_THEMED[this.kind];
    const list = [];
    for (let i = 0; i < n; i++) list.push(choice(themed));
    list.push(Math.random() < 0.5 ? 'slime' : 'headcrab');
    for (const type of list) {
      if (this.minions.size >= RAID.maxMinions) break;
      const m = { id: this.nextId++, type, x: rand(220, W - 220), y: 2 * T + 30, hp: RAID_MINIONS[type].hp, el: type === 'slime' ? choice(EL_KEYS) : '', leapT: 0, leapCd: rand(0.5, 2), buf: [] };
      Arena.collide(m, RAID.minionR);
      this.minions.set(m.id, m);
    }
    Sound.groan();
  },

  moveMinions(dt) {
    const tg = this.targets();
    for (const m of this.minions.values()) {
      if (m.leapT > 0) m.leapT -= dt;
      if (m.leapCd > 0) m.leapCd -= dt;
      if (!tg.length) continue;
      let best = tg[0], bd = Infinity;
      for (const p of tg) {
        const d = dist(m.x, m.y, p.x, p.y);
        if (d < bd) {
          bd = d;
          best = p;
        }
      }
      if (m.type === 'headcrab' && bd < 200 && m.leapCd <= 0) {
        m.leapT = 0.35;
        m.leapCd = 2.2;
        Sound.hiss();
      }
      const sp = RAID_MINIONS[m.type].speed * (m.leapT > 0 ? 3.2 : 1);
      if (bd > 26) {
        m.x += ((best.x - m.x) / bd) * sp * dt;
        m.y += ((best.y - m.y) / bd) * sp * dt;
      }
      Arena.collide(m, RAID.minionR);
    }
  },

  // Событие босса: хозяин создаёт, оба проигрывают одинаково.
  emit(e) {
    e.i = ++this.evSeq;
    this.events.push(e);
    if (this.events.length > 6) this.events.shift();
    this.apply(e);
  },

  apply(e) {
    const b = this.boss, mz = b.muzzle, c = b.center;
    const kind = b.projectile;
    if (e.k === 'v') {
      const base = Math.atan2(num(e.ty) - mz.y, num(e.tx) - mz.x);
      for (const off of [-0.16, 0, 0.16]) this.proj(mz.x, mz.y, base + off, RAID.projSpeed, RAID.projDmg, kind);
      this.fireT = 0.3;
      Sound.cannon();
    } else if (e.k === 'r') {
      const n = 12;
      for (let i = 0; i < n; i++) this.proj(c.x, c.y + 30, Math.PI * (0.1 + (0.8 * (i + num(e.o) * 0.5)) / n), 250, RAID.ringDmg, kind);
      this.fireT = 0.4;
      Sound.roar();
    } else if (e.k === 'm') {
      for (const p of Array.isArray(e.p) ? e.p.slice(0, 3) : []) {
        if (Array.isArray(p)) this.marks.push({ x: clamp(num(p[0]), 0, W), y: clamp(num(p[1]), 2 * T, H), t: 0 });
      }
      Sound.warn();
    } else if (e.k === 'w') {
      this.waves.push({ x: c.x, y: c.y, t: 0, hit: false });
      Sound.thud();
      Arena.shake = Math.max(Arena.shake, 6);
    } else if (e.k === 'e') {
      Arena.bigMsg = { str: 'ЯРОСТЬ!', sub: String(e.s || '').slice(0, 60), t: 0, life: 2.4, color: '#ff5252' };
      Sound.roar();
    }
  },

  proj(x, y, ang, speed, dmg, kind) {
    this.projs.push({ x, y, vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed, dmg, kind, r: 13 });
  },

  // Снаряды, метки, волны и миньоны бьют по тебе — урон считаешь ты сам.
  updateShots(dt) {
    const me = Arena.me;
    for (const p of this.projs) {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (p.x < -30 || p.x > W + 30 || p.y > H + 30 || p.y < -30) {
        p.dead = true;
        continue;
      }
      if (p.y > 2 * T && Arena.blocks.some((b) => p.x > b.x && p.x < b.x + T && p.y > b.y && p.y < b.y + T)) {
        p.dead = true;
        FX.burst(Arena.fx, p.x, p.y, 5, { colors: ['#bdbdbd', '#ffcc80'], size: 4, speed: 140, grav: 0, life: 0.3 });
        continue;
      }
      if (!me.dead && dist(p.x, p.y, me.x, me.y - 8) < ARENA.r + p.r) {
        p.dead = true;
        Arena.hurt(p.dmg, 'boss');
      }
    }
    this.projs = this.projs.filter((p) => !p.dead);
    for (const mk of this.marks) {
      mk.t += dt;
      if (mk.t >= RAID.markDelay && !mk.done) {
        mk.done = true;
        Arena.boom(mk.x, mk.y, RAID.markR);
        if (!me.dead && dist(me.x, me.y, mk.x, mk.y) < RAID.markR) Arena.hurt(RAID.markDmg, 'boss');
      }
    }
    this.marks = this.marks.filter((mk) => !mk.done);
    for (const w of this.waves) {
      const r0 = (w.t / RAID.waveTime) * RAID.waveR;
      w.t += dt;
      const r1 = (w.t / RAID.waveTime) * RAID.waveR;
      if (!me.dead && !w.hit) {
        const d = dist(me.x, me.y, w.x, w.y);
        if (d > r0 - 20 && d <= r1 + 20 && d <= RAID.waveR) {
          w.hit = true;
          Arena.hurt(RAID.waveDmg, 'boss');
        }
      }
    }
    this.waves = this.waves.filter((w) => w.t < RAID.waveTime);
    if (!me.dead && me.contactCd <= 0) {
      for (const m of this.minions.values()) {
        if (m.dying) continue;
        const p = this.minionPos(m);
        if (dist(p.x, p.y, me.x, me.y) > 40) continue;
        me.contactCd = 0.7;
        const d = RAID.contactDmg * (m.type === 'headcrab' && m.leapT > 0 ? 1.5 : 1);
        if (m.el) Arena.hurtHit({ d, el: m.el }, 'minion');
        else Arena.hurt(d, 'minion');
        break;
      }
    }
  },

  // ---------- игроки бьют босса и миньонов ----------
  ray(x, y, dx, dy, tMax) {
    let best = null;
    if (!this.dead()) {
      const b = this.boss.box;
      const tb = rayRect(x, y, dx, dy, b.x, b.y, b.w, b.h);
      if (tb < tMax) {
        tMax = tb;
        best = { t: tb, target: 'boss' };
      }
    }
    for (const m of this.minions.values()) {
      if (m.dying) continue;
      const p = this.minionPos(m);
      const tc = rayCircle(x, y, dx, dy, p.x, p.y - 10, RAID.minionR + 4);
      if (tc < tMax) {
        tMax = tc;
        best = { t: tc, target: m };
      }
    }
    return best;
  },

  near(x, y) {
    const c = this.boss.center;
    return dist(x, y, c.x, c.y) < RAID.near;
  },

  hitBoss(d, el) {
    if (this.dead()) return 0;
    const me = Arena.me;
    if (this.near(me.x, me.y)) d *= RAID.nearBonus;
    d = Math.round(d);
    this.bd += d;
    this.hitT = 0.12;
    const c = this.boss.center;
    FX.text(Arena.fx, c.x + rand(-70, 70), c.y + rand(0, 40), `-${d}`, { color: el ? ELEMENTS[el].color : '#ffeb3b', font: `bold 18px ${FONT.ui}`, life: 0.7 });
    if (this.dead()) this.onBossDead();
    return d;
  },

  hitMinion(m, d) {
    if (m.dying) return 0;
    d = Math.round(d);
    const p = this.minionPos(m);
    FX.burst(Arena.fx, p.x, p.y - 10, 6, { colors: m.el ? [ELEMENTS[m.el].color, '#fff'] : ['#8d6e63', '#3e2723'], size: 5, speed: 160, grav: 300, life: 0.4 });
    FX.text(Arena.fx, p.x + rand(-8, 8), p.y - 50, `-${d}`, { color: '#ffeb3b', font: `bold 15px ${FONT.ui}`, life: 0.6 });
    m.hp -= d;
    if (this.host) {
      if (m.hp <= 0) this.killMinion(m, true);
    } else {
      this.mh.push({ i: ++this.mhSeq, id: m.id, d });
      if (this.mh.length > 16) this.mh.shift();
      if (m.hp <= 0) {
        m.dying = true;
        this.kills++;
        Sound.splat();
      }
    }
    return d;
  },

  killMinion(m, mine) {
    this.minions.delete(m.id);
    if (mine) this.kills++;
    FX.burst(Arena.fx, m.x, m.y, 14, { colors: m.el ? [ELEMENTS[m.el].color, '#fff'] : ['#8d6e63', '#3e2723', '#fff'], size: 6, speed: 220, grav: 300, life: 0.6 });
    Sound.splat();
  },

  // Монтировка: босс — если стоишь у самого логова, миньоны — в дуге удара.
  melee(me, gun, inArc, el) {
    let total = 0;
    if (!this.dead()) {
      const b = this.boss.box;
      const cx = clamp(me.x, b.x, b.x + b.w), cy = clamp(me.y, b.y, b.y + b.h);
      if (dist(me.x, me.y, cx, cy) <= gun.range + 10) total += this.hitBoss(gun.dmg, el);
    }
    for (const m of [...this.minions.values()]) {
      if (m.dying) continue;
      const p = this.minionPos(m);
      if (inArc(p.x, p.y - 8, RAID.minionR)) total += this.hitMinion(m, gun.dmg);
    }
    return total;
  },

  // Взрыв твоей гранаты.
  blast(x, y, r, dmg) {
    let total = 0;
    if (!this.dead()) {
      const b = this.boss.box;
      const cx = clamp(x, b.x, b.x + b.w), cy = clamp(y, b.y, b.y + b.h);
      const d = dist(x, y, cx, cy);
      if (d < r) total += this.hitBoss(dmg * (1 - d / r) * 1.5, null);
    }
    for (const m of [...this.minions.values()]) {
      if (m.dying) continue;
      const p = this.minionPos(m);
      const d = dist(x, y, p.x, p.y);
      if (d < r) total += this.hitMinion(m, dmg * (1 - d / r) + 10);
    }
    return total;
  },

  onBossDead() {
    if (this.boomed) return;
    this.boomed = true;
    const c = this.boss.center;
    for (let i = 0; i < 5; i++) Arena.booms.push({ x: c.x + rand(-100, 100), y: c.y + rand(-50, 50), r: 90 + i * 20, t: 0 });
    Arena.shake = 14;
    Sound.explosion(true);
  },

  check() {
    if (this.dead()) {
      if (Arena.solo) return { win: true, reason: 'Босс повержен!' };
      if (Math.round(this.bd) === Math.round(this.oppBd)) return { win: true, reason: 'Босс повержен! Урон поровну' };
      return { win: true, reason: `Босс повержен! MVP — ${this.bd > this.oppBd ? Duel.name : Duel.oppName || 'друг'}` };
    }
    if (Arena.solo && Arena.me.lives <= 0 && Arena.me.dead) return { win: false, reason: 'Жизни кончились — босс победил' };
    if (Arena.t >= RAID.time) return { win: false, reason: 'Время вышло — босс победил' };
    return null;
  },

  // ---------- сеть ----------
  netState() {
    const s = { bd: Math.round(this.bd), mk: this.kills };
    if (this.host) {
      s.be = this.events;
      s.mo = [...this.minions.values()].slice(0, 10).map((m) => [m.id, m.type, Math.round(m.x), Math.round(m.y), Math.max(0, Math.ceil(m.hp)), m.el || '', m.leapT > 0 ? 1 : 0]);
    } else s.mh = this.mh;
    return s;
  },

  remote(st) {
    if (!this.on) return;
    this.oppBd = Math.max(0, num(st.bd));
    this.oppKills = Math.max(0, num(st.mk));
    if (this.dead()) this.onBossDead();
    const list = (v, n) => (Array.isArray(v) ? v.filter((e) => e && typeof e === 'object' && Number.isFinite(e.i)).slice(-n) : []);
    if (this.host) {
      // попадания друга по миньонам
      for (const h of list(st.mh, 16)) {
        if (h.i <= this.seenMh) continue;
        this.seenMh = h.i;
        const m = this.minions.get(num(h.id));
        if (!m) continue;
        m.hp -= clamp(num(h.d), 0, 300);
        if (m.hp <= 0) this.killMinion(m, false);
      }
      return;
    }
    // гость: атаки босса и миньоны от хозяина
    for (const e of list(st.be, 8)) {
      if (e.i <= this.seenEv) continue;
      this.seenEv = e.i;
      this.apply(e);
    }
    if (Array.isArray(st.mo)) {
      const now = performance.now();
      const seen = new Set();
      for (const row of st.mo.slice(0, 12)) {
        if (!Array.isArray(row)) continue;
        const [id, type, x, y, hp, el, leap] = row;
        if (!RAID_MINIONS[type] || !Number.isFinite(id)) continue;
        seen.add(id);
        let m = this.minions.get(id);
        if (!m) {
          m = { id, type, x: num(x), y: num(y), hp: num(hp), el: ELEMENTS[el] ? el : '', buf: [], leapT: 0 };
          this.minions.set(id, m);
        }
        m.hp = Math.min(m.hp, num(hp));
        m.leapT = leap ? 0.2 : 0;
        m.buf.push({ t: now, x: clamp(num(x), 0, W), y: clamp(num(y), 0, H) });
        if (m.buf.length > 20) m.buf.shift();
      }
      for (const id of [...this.minions.keys()]) if (!seen.has(id)) this.minions.delete(id);
    }
  },

  // ---------- отрисовка ----------
  drawBoss(ctx, t) {
    const b = this.boss;
    ctx.save();
    if (this.dead()) {
      ctx.globalAlpha = Math.max(0, 1 - this.deadT / 1.5);
      ctx.translate(0, this.deadT * 30);
    }
    if (ctx.globalAlpha > 0) b.draw(ctx, t, this.stub);
    ctx.restore();
    if (this.dead()) return;
    // зона «вплотную»
    const c = b.center, me = Arena.me;
    const near = !me.dead && this.near(me.x, me.y);
    ctx.beginPath();
    ctx.arc(c.x, c.y, RAID.near, Math.PI * 0.08, Math.PI * 0.92);
    ctx.setLineDash([10, 10]);
    ctx.strokeStyle = near ? 'rgba(255,213,74,0.7)' : 'rgba(255,82,82,0.35)';
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.setLineDash([]);
    if (near) text(ctx, 'ВПЛОТНУЮ ×1.4', me.x, me.y + 46, { font: `bold 12px ${FONT.ui}`, color: '#ffd54a', stroke: '#000', lw: 3, align: 'center' });
  },

  addMinions(list, ctx, t) {
    for (const m of this.minions.values()) {
      if (m.dying) continue;
      const p = this.minionPos(m);
      list.push({ y: p.y + 20, draw: () => drawRaidMinion(ctx, m, p.x, p.y, t) });
    }
  },

  drawShots(ctx, t) {
    for (const mk of this.marks) {
      const k = mk.t / RAID.markDelay;
      ctx.beginPath();
      ctx.arc(mk.x, mk.y, RAID.markR, 0, TAU);
      ctx.fillStyle = `rgba(255,23,68,${0.12 + k * 0.2})`;
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,23,68,0.85)';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(mk.x, mk.y, RAID.markR * k, 0, TAU);
      ctx.strokeStyle = 'rgba(255,255,255,0.7)';
      ctx.lineWidth = 2;
      ctx.stroke();
      text(ctx, '!', mk.x, mk.y + 12, { font: `bold 34px ${FONT.ui}`, color: '#fff', stroke: '#b71c1c', lw: 5, align: 'center' });
    }
    for (const w of this.waves) {
      const r = (w.t / RAID.waveTime) * RAID.waveR;
      ctx.beginPath();
      ctx.arc(w.x, w.y, r, 0, Math.PI);
      ctx.strokeStyle = `rgba(255,213,74,${1 - w.t / RAID.waveTime})`;
      ctx.lineWidth = 14;
      ctx.stroke();
    }
    for (const p of this.projs) drawProjectile(ctx, p.kind, p.x, p.y, p.r, t);
  },

  drawHud(ctx, t) {
    rr(ctx, 12, 8, 400, 76, 10);
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fill();
    text(ctx, this.boss.name, 26, 32, { font: `bold 17px ${FONT.ui}`, color: '#ffab91' });
    const left = Math.max(0, Math.ceil(RAID.time - Arena.t));
    text(ctx, `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`, 398, 32, { font: `bold 16px ${FONT.ui}`, color: left <= 30 ? '#ff8a80' : '#b0bec5', align: 'right' });
    const k = this.hp() / this.max;
    ctx.fillStyle = '#3a1010';
    ctx.fillRect(26, 42, 372, 14);
    ctx.fillStyle = k > 0.33 ? '#e53935' : '#ff1744';
    ctx.fillRect(26, 42, 372 * k, 14);
    text(ctx, `${Math.ceil(this.hp())} / ${this.max}`, 212, 54, { font: `bold 11px ${FONT.ui}`, color: '#fff', align: 'center' });
    let sub;
    if (Arena.solo) sub = `Жизни: ${'❤'.repeat(Math.max(0, Arena.me.lives))}${'♡'.repeat(Math.max(0, RAID.lives - Arena.me.lives))}`;
    else sub = `Урон: ты ${Math.round(this.bd)} · ${Duel.oppName || 'друг'} ${Math.round(this.oppBd)}`;
    text(ctx, sub, 26, 76, { font: `bold 13px ${FONT.ui}`, color: '#eceff1' });
  },
};

'use strict';
/* Футболист №7 — с новой версии мема: иногда выбегает на доску, ведёт мяч, пробивает через
   врагов прямо в ворота — башню босса — и празднует гол прыжком с разворотом: «СИУУУ!».
   От крика все враги на доске на пару секунд оглушены. Чит-код SIUUU зовёт его сразу. */

const SIU = {
  first: [60, 110], // через сколько секунд уровня он выбежит в первый раз
  every: [140, 220], // и потом
  ballDmg: 4,
  ballTime: 2.2, // сколько мяч мечется по доске, прежде чем полететь в ворота
  ballSpeed: 760,
  goal: 120, // урон башне от гола
  stun: 2.5,
  money: 700,
};

// «СИУУУ!»: шипение «С», голос из пилы через две форманты — «И» плавно переходит в «У», — и рёв трибун.
function playSiu() {
  const a = Sound.audio();
  if (!a || Sound.muted) return;
  const { ctx, master, noiseBuf } = a;
  const t = ctx.currentTime + 0.02;
  const out = ctx.createGain();
  out.gain.value = 0.9;
  out.connect(master);
  const noise = (type, f, q, at, peak, rise, end) => {
    const src = ctx.createBufferSource(), fl = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = noiseBuf;
    src.loop = true;
    fl.type = type;
    fl.frequency.value = f;
    fl.Q.value = q;
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(peak, at + rise);
    g.gain.exponentialRampToValueAtTime(0.0001, end);
    src.connect(fl);
    fl.connect(g);
    g.connect(out);
    src.start(at);
    src.stop(end + 0.05);
  };
  noise('highpass', 4200, 0.7, t, 0.22, 0.03, t + 0.17);
  const v = t + 0.13, end = v + 1.5;
  const src = ctx.createOscillator();
  src.type = 'sawtooth';
  src.frequency.setValueAtTime(185, v);
  src.frequency.linearRampToValueAtTime(265, v + 0.25);
  src.frequency.linearRampToValueAtTime(245, v + 1.1);
  src.frequency.linearRampToValueAtTime(205, end);
  const vib = ctx.createOscillator(), vg = ctx.createGain();
  vib.frequency.value = 6;
  vg.gain.value = 7;
  vib.connect(vg);
  vg.connect(src.frequency);
  const voice = ctx.createGain();
  voice.gain.setValueAtTime(0.0001, v);
  voice.gain.exponentialRampToValueAtTime(0.55, v + 0.08);
  voice.gain.setValueAtTime(0.55, end - 0.35);
  voice.gain.exponentialRampToValueAtTime(0.0001, end);
  voice.connect(out);
  const formant = (f0, f1, q, gain) => {
    const fl = ctx.createBiquadFilter(), g = ctx.createGain();
    fl.type = 'bandpass';
    fl.Q.value = q;
    fl.frequency.setValueAtTime(f0, v);
    fl.frequency.setValueAtTime(f0, v + 0.3);
    fl.frequency.exponentialRampToValueAtTime(f1, v + 0.55);
    g.gain.value = gain;
    src.connect(fl);
    fl.connect(g);
    g.connect(voice);
  };
  formant(290, 330, 5, 1.6); // первая форманта: у «И» и «У» низкая
  formant(2250, 820, 7, 1.2); // вторая: высоко у «И», низко у «У»
  formant(3000, 2400, 9, 0.35);
  src.start(v);
  vib.start(v);
  src.stop(end + 0.05);
  vib.stop(end + 0.05);
  noise('bandpass', 900, 0.6, v + 0.2, 0.16, 0.6, v + 2.6); // трибуны
}

function drawSoccerBall(ctx, x, y, r, spin) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(spin);
  circ(ctx, 0, 0, r, '#fafafa');
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = '#333';
  ctx.stroke();
  const pent = (cx, cy, s) => {
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = -Math.PI / 2 + (i * TAU) / 5;
      ctx.lineTo(cx + Math.cos(a) * s, cy + Math.sin(a) * s);
    }
    ctx.closePath();
    ctx.fillStyle = '#222';
    ctx.fill();
  };
  pent(0, 0, r * 0.38);
  for (let i = 0; i < 5; i++) {
    const a = -Math.PI / 2 + (i * TAU) / 5;
    pent(Math.cos(a) * r * 0.86, Math.sin(a) * r * 0.86, r * 0.22);
  }
  ctx.restore();
}

// Футболист: красная футболка с семёркой, тёмно-зелёные шорты, причёска с коком.
// (x, y) — точка между ступнями; pose: run | kick | jump | siu.
function drawFootballer(ctx, x, y, t, o = {}) {
  const skin = '#d9a074', red = '#c8102e', shorts = '#14532d', sock = '#c8102e';
  ctx.save();
  ctx.translate(x, y);
  ell(ctx, 0, 2, 24, 6, 'rgba(0,0,0,0.3)');
  ctx.translate(0, -(o.jump || 0));
  if (o.spin !== undefined) ctx.scale(Math.cos(o.spin) || 0.02, 1);
  if (o.dir < 0) ctx.scale(-1, 1);
  const pose = o.pose || 'run';
  const sw = Math.sin(t * 14);
  // углы ног и рук от вертикали
  let legL = 0, legR = 0, armL = 0.3, armR = -0.3, bendL = 0, bendR = 0;
  if (pose === 'run') {
    legL = sw * 0.6;
    legR = -sw * 0.6;
    armL = -sw * 0.7 + 0.2;
    armR = sw * 0.7 - 0.2;
  } else if (pose === 'kick') {
    legL = -0.15;
    legR = -1.25;
    armL = 0.9;
    armR = -1.1;
  } else if (pose === 'jump') {
    legL = 0.5;
    legR = -0.5;
    bendL = bendR = 1.3;
    armL = 2.6;
    armR = -2.6;
  } else if (pose === 'siu') {
    legL = 0.42;
    legR = -0.42;
    armL = 1.15;
    armR = -1.15;
  }
  const leg = (hx, ang, bend) => {
    const kx = hx - Math.sin(ang) * 20, ky = -40 + Math.cos(ang) * 20;
    const fa = ang - bend;
    const fx = kx - Math.sin(fa) * 20, fy = ky + Math.cos(fa) * 20;
    line(ctx, hx, -42, kx, ky, skin, 9);
    line(ctx, kx, ky, fx, fy, sock, 9);
    ell(ctx, fx + 4, fy + 2, 8, 4, '#111');
    line(ctx, fx - 2, fy + 1, fx + 8, fy + 1, '#f5f5f5', 1.5);
  };
  leg(-7, legL, bendL);
  leg(7, legR, bendR);
  rr(ctx, -14, -50, 28, 14, 3);
  ctx.fillStyle = shorts;
  ctx.fill();
  // руки (за туловищем — ближняя рисуется после)
  const arm = (sx, ang) => {
    const ex = sx + Math.sin(ang) * 30, ey = -76 + Math.cos(ang) * 30;
    line(ctx, sx, -76, sx + Math.sin(ang) * 10, -76 + Math.cos(ang) * 10, red, 9);
    line(ctx, sx + Math.sin(ang) * 9, -76 + Math.cos(ang) * 9, ex, ey, skin, 7);
    circ(ctx, ex, ey, 4, skin);
  };
  arm(-15, -armL);
  rr(ctx, -16, -82, 32, 36, 7);
  ctx.fillStyle = red;
  ctx.fill();
  line(ctx, -16, -64, 16, -64, 'rgba(0,0,0,0.12)', 2);
  poly(ctx, [-6, -82, 6, -82, 0, -75], '#14532d');
  ctx.save();
  ctx.translate(6, -55);
  if (o.dir < 0) ctx.scale(-1, 1); // цифра не должна отражаться
  text(ctx, '7', 0, 0, { font: `bold 15px ${FONT.ui}`, color: '#ffd54a', align: 'center' });
  ctx.restore();
  arm(15, -armR);
  // голова
  line(ctx, 0, -84, 0, -88, skin, 6);
  const tilt = pose === 'siu' ? -0.25 : 0;
  ctx.save();
  ctx.translate(0, -96);
  ctx.rotate(tilt);
  ell(ctx, 0, 0, 11, 13, skin);
  // кок
  ctx.beginPath();
  ctx.moveTo(-11, -2);
  ctx.quadraticCurveTo(-12, -16, -2, -17);
  ctx.quadraticCurveTo(10, -20, 12, -8);
  ctx.quadraticCurveTo(11, -2, 10, 0);
  ctx.quadraticCurveTo(4, -9, -11, -2);
  ctx.fillStyle = '#21160f';
  ctx.fill();
  line(ctx, -7, -3, -2, -4, '#21160f', 2);
  line(ctx, 3, -4, 8, -3, '#21160f', 2);
  circ(ctx, -4, 0, 1.6, '#111');
  circ(ctx, 5, 0, 1.6, '#111');
  if (pose === 'siu' || pose === 'jump') {
    ell(ctx, 1, 7, 4.5, 4, '#5a1010');
  } else line(ctx, -3, 7, 4, 7, '#7a3b2a', 1.5);
  ctx.restore();
  ctx.restore();
}

class Footballer {
  constructor() {
    this.phase = 'run'; // run | kick | ball | goal | jump | siu | leave
    this.t = 0;
    this.time = 0;
    this.dir = Math.random() < 0.5 ? 1 : -1;
    this.x = this.dir > 0 ? -60 : W + 60;
    this.y = rowY(6) + 38;
    this.kickX = 640 + rand(-220, 220);
    this.ball = { x: this.x, y: this.y - 8, vx: 0, vy: 0, spin: 0 };
    this.hitAt = new Map(); // враг → когда его последний раз задело мячом
    this.goalText = 0;
    this.gone = false;
  }

  setPhase(p) {
    this.phase = p;
    this.t = 0;
  }

  update(dt, g) {
    this.t += dt;
    this.time += dt;
    const b = this.ball;
    if (this.goalText > 0) this.goalText -= dt;
    if (this.phase === 'run') {
      this.x += this.dir * 330 * dt;
      b.x = this.x + this.dir * 24;
      b.y = this.y - 8 - Math.abs(Math.sin(this.time * 11)) * 10;
      b.spin += dt * 14 * this.dir;
      if ((this.x - this.kickX) * this.dir >= 0) this.setPhase('kick');
    } else if (this.phase === 'kick') {
      b.x = this.x + this.dir * 24;
      if (this.t > 0.22) {
        const ang = -Math.PI / 2 + rand(-0.55, 0.55);
        b.vx = Math.cos(ang) * SIU.ballSpeed;
        b.vy = Math.sin(ang) * SIU.ballSpeed;
        Sound.kick();
        this.setPhase('ball');
      }
    } else if (this.phase === 'ball') {
      this.moveBall(dt, g);
      if (this.t > SIU.ballTime) {
        if (g.tower.dead) this.setPhase('jump');
        else {
          this.setPhase('goal');
          Sound.kick();
        }
      }
    } else if (this.phase === 'goal') {
      // мяч летит в ворота — в башню босса
      const c = g.tower.center;
      const dx = c.x - b.x, dy = c.y - b.y, d = Math.hypot(dx, dy) || 1;
      b.vx = (dx / d) * 1000;
      b.vy = (dy / d) * 1000;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.spin += dt * 30;
      if (d < 40 || this.t > 1.5) {
        if (!g.tower.dead) g.damageTower(SIU.goal, true);
        FX.burst(g, c.x, c.y, 30, { colors: ['#fff', '#ffd54a', '#c8102e', '#14532d'], size: 8, speed: 420, grav: 300, life: 1 });
        Sound.explosion(false);
        this.goalText = 1.6;
        this.goalAt = { x: c.x, y: c.y };
        this.setPhase('jump');
      }
    } else if (this.phase === 'jump') {
      if (this.t >= 0.75) {
        this.setPhase('siu');
        this.siu(g);
      }
    } else if (this.phase === 'siu') {
      if (this.t >= 1.8) this.setPhase('leave');
    } else if (this.phase === 'leave') {
      this.x += this.dir * 360 * dt;
      if (this.x < -80 || this.x > W + 80) this.gone = true;
    }
  }

  // мяч мечется по доске, отскакивает от краёв и от врагов
  moveBall(dt, g) {
    const b = this.ball;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.spin += dt * 22;
    const top = 2 * T + 12, bottom = PAWN_ROW * T - 14;
    if (b.x < 24 || b.x > W - 24) {
      b.vx = -b.vx;
      b.x = clamp(b.x, 24, W - 24);
    }
    if (b.y < top || b.y > bottom) {
      b.vy = -b.vy;
      b.y = clamp(b.y, top, bottom);
    }
    for (const e of g.enemies) {
      if (!e.alive || e.air) continue;
      const d = e.def;
      if (Math.abs(b.x - e.x) > d.hw + 10 || b.y < e.y - d.top - 10 || b.y > e.y + d.bot + 10) continue;
      if (this.time - (this.hitAt.get(e) || -9) < 0.45) continue;
      this.hitAt.set(e, this.time);
      e.damage(SIU.ballDmg, g, 'ball');
      FX.burst(g, b.x, b.y, 8, { colors: ['#fff', '#ddd', '#ffd54a'], size: 5, speed: 240, grav: 400, life: 0.4 });
      Sound.kick();
      // отскок от врага: отражаем скорость от направления «центр врага → мяч»
      const cy = e.y - d.top / 2;
      let nx = b.x - e.x, ny = b.y - cy;
      const n = Math.hypot(nx, ny) || 1;
      nx /= n;
      ny /= n;
      const dot = b.vx * nx + b.vy * ny;
      if (dot < 0) {
        b.vx -= 2 * dot * nx;
        b.vy -= 2 * dot * ny;
      }
    }
  }

  siu(g) {
    playSiu();
    g.shake = Math.max(g.shake, 10);
    for (const e of g.enemies) if (e.alive) e.dazed = Math.max(e.dazed || 0, SIU.stun);
    g.addMoney(SIU.money, this.x, this.y - 140, '#ffd54a');
    g.say('Футболист №7: «СИУУУ!» — враги оглушены', '#ffd54a');
    Ach.unlock('siu');
  }

  draw(ctx, now) {
    const b = this.ball;
    let pose = 'run', jump = 0, spin, dir = this.dir, t = this.time;
    if (this.phase === 'kick' || (this.phase === 'ball' && this.t < 0.3)) pose = 'kick';
    else if (this.phase === 'ball' || this.phase === 'goal') t = 0; // стоит и следит за мячом
    else if (this.phase === 'jump') {
      const k = clamp(this.t / 0.75, 0, 1);
      pose = 'jump';
      jump = Math.sin(k * Math.PI) * 95;
      spin = k * TAU;
      dir = 1;
    } else if (this.phase === 'siu') {
      pose = 'siu';
      dir = 1;
    }
    drawFootballer(ctx, this.x, this.y, t, { pose, jump, spin, dir });
    if (this.phase === 'run' || this.phase === 'kick' || this.phase === 'ball' || this.phase === 'goal') {
      drawSoccerBall(ctx, b.x, b.y, 11, b.spin);
    }
    if (this.goalText > 0 && this.goalAt) {
      const k = 1.6 - this.goalText;
      ctx.save();
      ctx.globalAlpha = Math.min(1, this.goalText * 2);
      ctx.translate(this.goalAt.x, this.goalAt.y + 30);
      ctx.scale(1 + Math.min(1, k * 4) * 0.3, 1 + Math.min(1, k * 4) * 0.3);
      text(ctx, 'ГОООЛ!', 0, 0, { font: `52px ${FONT.gta}`, color: '#ffd54a', stroke: '#000', lw: 8, align: 'center' });
      ctx.restore();
    }
    if (this.phase === 'siu') {
      const k = this.t;
      // волна крика
      ctx.save();
      ctx.globalAlpha = Math.max(0, 1 - k / 0.9) * 0.7;
      circ(ctx, this.x, this.y - 60, 40 + k * 1100);
      ctx.lineWidth = 10;
      ctx.strokeStyle = '#ffd54a';
      ctx.stroke();
      ctx.restore();
      ctx.save();
      ctx.translate(this.x + rand(-2, 2), this.y - 150);
      const s = Math.min(1, k * 6) * (1 + Math.sin(now * 20) * 0.03);
      ctx.scale(s, s);
      ctx.rotate(-0.06);
      text(ctx, 'СИУУУ!', 0, 0, { font: `64px ${FONT.title}`, color: '#ffd54a', stroke: '#7a0010', lw: 10, align: 'center' });
      ctx.restore();
    }
  }
}

function drawSoul(ctx, x, y, s = 1, color = '#ff1a1a') {
  ctx.save();

  ctx.scale(s, s);
  ctx.beginPath();
  ctx.moveTo(0, 7);
  ctx.bezierCurveTo(-9, 0, -10, -6, -5, -8);
  ctx.bezierCurveTo(-2, -9, 0, -6, 0, -4);
  ctx.bezierCurveTo(0, -6, 2, -9, 5, -8);
  ctx.bezierCurveTo(10, -6, 9, 0, 0, 7);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
  ctx.restore();
}

// Скелет в голубой худи, шортах и розовых тапках.
function drawSans(ctx, x, y, t, o = {}) {
  const bob = o.still ? 0 : Math.sin(t * 2) * 2;
  ctx.save();
  ctx.translate(x + (o.dx || 0), y + bob);
  ctx.globalAlpha *= o.alpha === undefined ? 1 : o.alpha;
  // ноги и тапки
  ctx.fillStyle = '#fff';
  ctx.fillRect(-24, 64, 8, 24);
  ctx.fillRect(16, 64, 8, 24);
  ell(ctx, -22, 92, 16, 7, '#f48fb1');
  ell(ctx, 22, 92, 16, 7, '#f48fb1');
  // шорты с лампасами
  rr(ctx, -36, 38, 72, 32, 6);
  ctx.fillStyle = '#1b1b1b';
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.fillRect(-34, 44, 4, 24);
  ctx.fillRect(30, 44, 4, 24);
  // рукава и кисти
  for (const sx of [-1, 1]) {
    rr(ctx, sx > 0 ? 40 : -62, -16, 22, 58, 9);
    ctx.fillStyle = '#3b7dc4';
    ctx.fill();
    ctx.strokeStyle = '#0d2a4a';
    ctx.lineWidth = 2;
    ctx.stroke();
    circ(ctx, sx * 51, 46, 8, '#fff');
  }
  // худи
  rr(ctx, -50, -24, 100, 68, 16);
  ctx.fillStyle = '#3b7dc4';
  ctx.fill();
  ctx.strokeStyle = '#0d2a4a';
  ctx.lineWidth = 3;
  ctx.stroke();
  line(ctx, 0, -14, 0, 40, '#0d2a4a', 2);
  rr(ctx, -40, 18, 26, 16, 4);
  ctx.strokeStyle = '#2a5d96';
  ctx.stroke();
  rr(ctx, 14, 18, 26, 16, 4);
  ctx.stroke();
  // мех капюшона
  ell(ctx, 0, -24, 50, 13, '#e3ecf5');
  for (let i = -4; i <= 4; i++) circ(ctx, i * 11, -20 + Math.abs(i) * 0.6, 6, '#eef3f8');
  // череп
  ctx.beginPath();
  ctx.ellipse(0, -64, 40, 35, 0, 0, TAU);
  ctx.fillStyle = '#fff';
  ctx.fill();
  ctx.strokeStyle = '#222';
  ctx.lineWidth = 3;
  ctx.stroke();
  ell(ctx, -15, -70, 10, 9, '#000');
  ell(ctx, 15, -70, 10, 9, '#000');
  if (o.eye) {
    const gr = ctx.createRadialGradient(-15, -70, 1, -15, -70, 16);
    gr.addColorStop(0, '#ffffff');
    gr.addColorStop(0.35, o.eye);
    gr.addColorStop(1, 'rgba(0,0,0,0)');
    circ(ctx, -15, -70, 16, gr);
  } else if (!o.closed) {
    circ(ctx, -15, -70, 3.2, '#fff');
    circ(ctx, 15, -70, 3.2, '#fff');
  }
  poly(ctx, [0, -60, -4, -53, 4, -53], '#111');
  // улыбка
  ctx.beginPath();
  ctx.moveTo(-26, -46);
  ctx.quadraticCurveTo(0, -30, 26, -46);
  ctx.strokeStyle = '#111';
  ctx.lineWidth = 3;
  ctx.stroke();
  for (let i = -3; i <= 3; i++) line(ctx, i * 6, -44 + Math.abs(i) * 0.4, i * 6, -38 + Math.abs(i) * 0.9, '#111', 2);
  if (o.tired) {
    ctx.beginPath();
    ctx.moveTo(32, -86);
    ctx.quadraticCurveTo(40, -74, 32, -70);
    ctx.quadraticCurveTo(24, -74, 32, -86);
    ctx.fillStyle = '#81d4fa';
    ctx.fill();
  }
  ctx.restore();
}

function drawBone(ctx, x, y, w, h, color) {
  ctx.fillStyle = color;
  if (h >= w) {
    ctx.fillRect(x + w * 0.25, y + w * 0.4, w * 0.5, Math.max(0, h - w * 0.8));
    circ(ctx, x + w * 0.3, y + w * 0.35, w * 0.32, color);
    circ(ctx, x + w * 0.7, y + w * 0.35, w * 0.32, color);
    circ(ctx, x + w * 0.3, y + h - w * 0.35, w * 0.32, color);
    circ(ctx, x + w * 0.7, y + h - w * 0.35, w * 0.32, color);
  } else {
    ctx.fillRect(x + h * 0.4, y + h * 0.25, Math.max(0, w - h * 0.8), h * 0.5);
    circ(ctx, x + h * 0.35, y + h * 0.3, h * 0.32, color);
    circ(ctx, x + h * 0.35, y + h * 0.7, h * 0.32, color);
    circ(ctx, x + w - h * 0.35, y + h * 0.3, h * 0.32, color);
    circ(ctx, x + w - h * 0.35, y + h * 0.7, h * 0.32, color);
  }
}

// Череп-бластер: смотрит вдоль ang, при выстреле открывает пасть.
function drawBlaster(ctx, x, y, ang, open) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang - Math.PI / 2);
  ctx.beginPath();
  ctx.moveTo(-26, -30);
  ctx.quadraticCurveTo(0, -46, 26, -30);
  ctx.lineTo(22, 10);
  ctx.lineTo(-22, 10);
  ctx.closePath();
  ctx.fillStyle = '#fff';
  ctx.fill();
  ell(ctx, -11, -14, 7, 6, '#000');
  ell(ctx, 11, -14, 7, 6, '#000');
  if (open) {
    circ(ctx, -11, -14, 3, '#40c4ff');
    circ(ctx, 11, -14, 3, '#40c4ff');
  }
  const jaw = 10 + open * 12;
  ctx.fillStyle = '#fff';
  ctx.fillRect(-18, jaw, 36, 10);
  ctx.fillStyle = '#000';
  for (let i = -2; i <= 2; i++) ctx.fillRect(i * 7 - 1, 8, 2, 4);
  ctx.restore();
}

const Battle = {
  phase: 'off', // intro | menu | sub | text | fight | slash | bubble | attack | dust | gameover | out
  g: null,
  t: 0,
  pt: 0, // время в текущей фазе
  sel: 0,
  subSel: 0,
  subKind: '',
  hp: UT.hp,
  mercy: 0,
  turn: 0,
  dodged: false,
  items: [],
  hotdog: 1,
  msg: '',
  shown: 0,
  next: null,
  bubble: '',
  box: { ...UT.text },
  soul: { x: 640, y: 395, invT: 0, moved: false },
  bullets: [],
  blasters: [],
  spawnT: 0,
  spawnT2: 0,
  pattern: 'bones',
  bar: { x: 0, stop: false },
  slash: null,
  shake: 0,
  blueHint: false,
  outcome: '',

  start(g) {
    this.g = g;
    this.phase = 'intro';
    this.t = 0;
    this.pt = 0;
    this.sel = 0;
    this.hp = UT.hp;
    this.mercy = 0;
    this.turn = 0;
    this.dodged = false;
    this.items = [{ name: 'Ириска', heal: 8 }, { name: 'Пирог', heal: 99 }];
    this.hotdog = 1;
    this.box = { ...UT.text };
    this.bullets = [];
    this.blasters = [];
    this.slash = null;
    this.bubble = '';
    this.outcome = '';
    g.state = 'ut';
    Input.lmb = false;
    Sound.warn();
  },

  spareable() {
    return this.mercy >= 2 || this.turn >= 5;
  },

  // ---------- текст ----------
  say(str, next) {
    this.phase = 'text';
    this.pt = 0;
    this.msg = str;
    this.shown = 0;
    this.next = next;
  },

  toMenu() {
    this.phase = 'menu';
    this.pt = 0;
    this.msg = this.spareable() ? '* Санс выглядит уставшим. Может, пощадить?' : UT_FLAVOR[this.turn % UT_FLAVOR.length];
    this.shown = 0;
    this.next = null;
  },

  typed() {
    return this.shown >= this.msg.length;
  },

  // ---------- ввод ----------
  confirm() {
    const ph = this.phase;
    if (ph === 'text' || ph === 'out') {
      if (!this.typed()) this.shown = this.msg.length;
      else if (this.next) {
        const n = this.next;
        this.next = null;
        n();
      }
    } else if (ph === 'menu') this.choose(this.sel);
    else if (ph === 'sub') this.pickSub(this.subSel);
    else if (ph === 'fight') this.strike();
    else if (ph === 'bubble' && this.pt > 0.4) this.startAttack();
  },

  cancel() {
    if (this.phase === 'sub') {
      this.phase = 'menu';
      this.shown = this.msg.length;
    }
  },

  onKey(code) {
    if (code === 'Enter' || code === 'KeyZ' || code === 'Space') return this.confirm();
    if (code === 'KeyX' || code === 'Escape' || code === 'ShiftLeft' || code === 'Backspace') return this.cancel();
    const dx = code === 'ArrowLeft' || code === 'KeyA' ? -1 : code === 'ArrowRight' || code === 'KeyD' ? 1 : 0;
    const dy = code === 'ArrowUp' || code === 'KeyW' ? -1 : code === 'ArrowDown' || code === 'KeyS' ? 1 : 0;
    if (!dx && !dy) return;
    if (this.phase === 'menu' && dx) {
      this.sel = (this.sel + dx + 4) % 4;
      Sound.click();
    } else if (this.phase === 'sub') {
      const n = this.subList().length;
      this.subSel = clamp(this.subSel + dx + dy * 2, 0, n - 1);
      Sound.click();
    }
  },

  subList() {
    if (this.subKind === 'act') return UT_ACTS.map((a) => ({ label: a }));
    if (this.subKind === 'item') return this.items.map((it) => ({ label: it.name }));
    return [{ label: 'Пощадить', yellow: this.spareable() }, { label: 'Сбежать' }];
  },

  choose(i) {
    this.sel = i;
    const key = UT_BUTTONS[i].key;
    Sound.click();
    if (key === 'fight') {
      this.phase = 'fight';
      this.pt = 0;
      this.bar = { x: UT.text.x + 12, stop: false };
    } else if (key === 'item' && !this.items.length) {
      this.say('* У тебя не осталось вещей.', () => this.toMenu());
    } else {
      this.subKind = key;
      this.subSel = 0;
      this.phase = 'sub';
    }
  },

  pickSub(i) {
    const p = this.g.player;
    Sound.click();
    if (this.subKind === 'act') {
      const a = UT_ACTS[i];
      if (a === 'Проверить') this.say('* САНС — АТК 1, ЗАЩ 1.\n* Самый лёгкий враг. Может нанести всего 1 урон.\n* ...но это не точно.', () => this.enemyTurn());
      else if (a === 'Пошутить') {
        this.mercy++;
        this.say('* Ты рассказал анекдот про шахматного коня.\n* Санс хихикнул. Кажется, ты ему нравишься.', () => this.enemyTurn());
      } else if (a === 'Подмигнуть') this.say('* Ты подмигнул.\n* Санс подмигнул в ответ. Он, кажется, всегда так.', () => this.enemyTurn());
      else if (this.hotdog > 0) {
        this.hotdog--;
        this.mercy++;
        this.say('* Ты угостил Санса хот-догом.\n* Он положил его себе на голову. Зачем?..', () => this.enemyTurn());
      } else this.say('* Хот-доги кончились. Санс разочарован.', () => this.enemyTurn());
    } else if (this.subKind === 'item') {
      const it = this.items.splice(i, 1)[0];
      const before = p.hp;
      p.hp = Math.min(p.maxHp, p.hp + it.heal);
      Sound.eat();
      const healed = Math.round(p.hp - before);
      this.say(`* Ты съел ${it.name.toLowerCase()}.\n* ${p.hp >= p.maxHp ? 'Здоровье восстановлено полностью' : `Восстановлено ${healed} ОЗ`}.`, () => this.enemyTurn());
    } else if (i === 0) {
      if (this.spareable()) {
        this.outcome = 'spare';
        this.say('* Ты пощадил Санса.\n* Ты получил 0 опыта, $500 и немного решимости.', () => this.exit());
      } else this.say('* Санс пока не хочет пощады.', () => this.enemyTurn());
    } else if (Math.random() < 0.6) {
      this.outcome = 'flee';
      this.say('* Ты сбежал...\n* Санс машет тебе вслед.', () => this.exit());
    } else this.say('* Санс телепортировался и перекрыл выход. Хе-хе.', () => this.enemyTurn());
  },

  // Полоска удара остановлена.
  strike() {
    if (this.bar.stop) return;
    this.bar.stop = true;
    const c = UT.text.x + UT.text.w / 2;
    const acc = clamp(1 - Math.abs(this.bar.x - c) / (UT.text.w / 2), 0, 1);
    let dmg = Math.round(4 + acc * 22);
    if (acc > 0.93) dmg = Math.round(dmg * 1.4);
    const miss = !this.dodged;
    if (miss) this.dodged = true;
    this.slash = { t: 0, dmg, miss };
    this.phase = 'slash';
    this.pt = 0;
    Sound.whoosh();
  },

  enemyTurn() {
    this.phase = 'bubble';
    this.pt = 0;
    this.bubble = this.spareable() ? 'я устал. может, разойдёмся миром?' : UT_TALK[Math.min(this.turn, UT_TALK.length - 1)];
  },

  startAttack() {
    this.phase = 'attack';
    this.pt = 0;
    this.pattern = UT_PATTERNS[this.turn % UT_PATTERNS.length];
    this.bullets = [];
    this.blasters = [];
    this.spawnT = 0.3;
    this.spawnT2 = 0.5;
    const a = UT.arena;
    this.soul.x = a.x + a.w / 2;
    this.soul.y = a.y + a.h / 2;
    this.soul.invT = 0;
    if (this.pattern === 'blue' && !this.blueHint) this.blueHint = true;
  },

  exit() {
    const g = this.g, p = g.player;
    if (this.outcome === 'spare') {
      p.money += 500;
      p.hp = p.maxHp;
      g.starT = 6;
      Ach.unlock('ut_spare');
    } else if (this.outcome === 'kill') {
      p.money += 1000;
      Ach.unlock('ut_kill');
    }
    this.phase = 'out';
    this.pt = 0;
    this.msg = '';
    this.next = null;
  },

  // ---------- кадр ----------
  update(dt) {
    const g = this.g;
    this.t += dt;
    this.pt += dt;
    if (this.shake > 0) this.shake = Math.max(0, this.shake - dt * 30);
    // рамка плавно меняет размер
    const target = this.phase === 'attack' ? UT.arena : UT.text;
    for (const k of ['x', 'y', 'w', 'h']) this.box[k] = lerp(this.box[k], target[k], Math.min(1, dt * 12));
    if ((this.phase === 'text' || this.phase === 'menu' || this.phase === 'out') && this.shown < this.msg.length) {
      const before = Math.floor(this.shown);
      this.shown = Math.min(this.msg.length, this.shown + dt * 40);
      if (Math.floor(this.shown) !== before && Math.floor(this.shown) % 2 === 0 && this.msg[Math.floor(this.shown)] !== ' ') Sound.click();
    }
    const ph = this.phase;
    if (ph === 'intro' && this.pt > 1.0) this.toMenu();
    else if (ph === 'fight' && !this.bar.stop) {
      this.bar.x += dt * (UT.text.w / 1.3);
      if (this.bar.x >= UT.text.x + UT.text.w - 12) {
        this.bar.stop = true;
        this.slash = { t: 0, dmg: 0, miss: true, none: true };
        this.phase = 'slash';
        this.pt = 0;
      }
    } else if (ph === 'slash') {
      this.slash.t += dt;
      if (this.pt > 0.25 && !this.slash.applied) {
        this.slash.applied = true;
        if (!this.slash.miss) {
          this.hp = Math.max(0, this.hp - this.slash.dmg);
          this.shake = 8;
          Sound.hit();
        }
      }
      if (this.pt > 1.3) {
        if (this.hp <= 0) {
          this.phase = 'dust';
          this.pt = 0;
          Sound.explosion(false);
        } else this.enemyTurn();
      }
    } else if (ph === 'dust' && this.pt > 1.6) {
      this.outcome = 'kill';
      this.say('* Санс рассыпался в пыль.\n* Ты получил $1000.\n* ...оно того стоило?', () => this.exit());
    } else if (ph === 'bubble' && this.pt > 2.4) this.startAttack();
    else if (ph === 'attack') this.updateAttack(dt);
    else if (ph === 'gameover' && this.pt > 4.2) this.finishGameOver();
    else if (ph === 'out' && this.pt > 0.5) {
      this.phase = 'off';
      g.state = 'play';
      g.suppressFire = true;
    }
  },

  updateAttack(dt) {
    const a = UT.arena, s = this.soul, k = 1 + this.turn * 0.08;
    // душа
    const kk = Input.keys;
    let mx = 0, my = 0;
    if (kk.has('ArrowLeft') || kk.has('KeyA')) mx -= 1;
    if (kk.has('ArrowRight') || kk.has('KeyD')) mx += 1;
    if (kk.has('ArrowUp') || kk.has('KeyW')) my -= 1;
    if (kk.has('ArrowDown') || kk.has('KeyS')) my += 1;
    const st = Input.stick;
    if (st && st.id !== null) {
      const dx = st.x - st.ox, dy = st.y - st.oy, d = Math.hypot(dx, dy);
      if (d > 8) {
        const p = Math.min(1, d / 50);
        mx = (dx / d) * p;
        my = (dy / d) * p;
      }
    }
    const len = Math.hypot(mx, my);
    if (len > 1) {
      mx /= len;
      my /= len;
    }
    s.moved = len > 0.05;
    s.x = clamp(s.x + mx * UT.soulSpeed * dt, a.x + 10, a.x + a.w - 10);
    s.y = clamp(s.y + my * UT.soulSpeed * dt, a.y + 10, a.y + a.h - 10);
    if (s.invT > 0) s.invT -= dt;

    // появление снарядов
    const pat = this.pattern;
    this.spawnT -= dt;
    this.spawnT2 -= dt;
    const left = a.x, right = a.x + a.w, top = a.y, bottom = a.y + a.h;
    const bone = (blue) => {
      const fromLeft = Math.random() < 0.5, floor = Math.random() < 0.5;
      const h = blue ? a.h - 40 : rand(40, a.h - 80);
      this.bullets.push({ kind: 'bone', x: fromLeft ? left - 16 : right, y: floor ? bottom - h : top, w: 14, h, vx: (fromLeft ? 1 : -1) * 170 * k, vy: 0, blue });
    };
    if (this.pt < UT.turnTime - 0.8) {
      if ((pat === 'bones' || pat === 'mix') && this.spawnT <= 0) {
        this.spawnT = (pat === 'mix' ? 0.9 : 0.55) / k;
        bone(false);
      }
      if (pat === 'blue' && this.spawnT <= 0) {
        this.spawnT = 0.7 / k;
        bone(true);
      }
      if ((pat === 'rain' || pat === 'mix' || pat === 'storm') && this.spawnT2 <= 0) {
        this.spawnT2 = (pat === 'rain' ? 0.09 : 0.2) / k;
        this.bullets.push({ kind: 'pellet', x: rand(left + 6, right - 6), y: top + 4, r: 5, vx: rand(-20, 20), vy: rand(150, 210) * k });
      }
      if ((pat === 'blasters' || pat === 'storm') && this.spawnT <= 0) {
        this.spawnT = (pat === 'storm' ? 1.4 : 1.1) / k;
        const r = Math.random();
        if (r < 0.4) this.blasters.push({ x: left - 70, y: clamp(s.y + rand(-10, 10), top + 10, bottom - 10), ang: 0, t: 0 });
        else if (r < 0.8) this.blasters.push({ x: right + 70, y: clamp(s.y + rand(-10, 10), top + 10, bottom - 10), ang: Math.PI, t: 0 });
        else this.blasters.push({ x: clamp(s.x + rand(-10, 10), left + 10, right - 10), y: top - 70, ang: Math.PI / 2, t: 0 });
        Sound.laserCharge();
      }
    }
    // движение и попадания
    const hit = () => {
      if (s.invT > 0) return;
      s.invT = UT.iframes;
      this.g.player.hp -= UT.dmg;
      this.shake = 6;
      Sound.hurt();
      if (this.g.player.hp <= 0) {
        this.g.player.hp = 0;
        this.phase = 'gameover';
        this.pt = 0;
        Sound.wasted();
      }
    };
    for (const b of this.bullets) {
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      if (b.kind === 'bone') {
        const cx = clamp(s.x, b.x, b.x + b.w), cy = clamp(s.y, b.y, b.y + b.h);
        if (Math.hypot(s.x - cx, s.y - cy) < UT.soulR && (!b.blue || s.moved)) hit();
        if (b.x < left - 40 || b.x > right + 40) b.dead = true;
      } else {
        if (Math.hypot(s.x - b.x, s.y - b.y) < b.r + UT.soulR - 2) {
          hit();
          b.dead = true;
        }
        if (b.y > bottom + 10) b.dead = true;
      }
    }
    this.bullets = this.bullets.filter((b) => !b.dead);
    for (const bl of this.blasters) {
      const was = bl.t;
      bl.t += dt;
      if (was < 0.7 && bl.t >= 0.7) {
        Sound.laser();
        this.shake = 4;
      }
      if (bl.t >= 0.7 && bl.t < 1.15) {
        // луч — полоса шириной 36 вдоль направления черепа
        const dx = Math.cos(bl.ang), dy = Math.sin(bl.ang);
        const px = s.x - bl.x, py = s.y - bl.y;
        const along = px * dx + py * dy, across = Math.abs(-px * dy + py * dx);
        if (along > 0 && across < 18 + UT.soulR - 3) hit();
      }
    }
    this.blasters = this.blasters.filter((bl) => bl.t < 1.3);
    if (this.phase === 'attack' && this.pt >= UT.turnTime) {
      this.turn++;
      this.bullets = [];
      this.blasters = [];
      this.toMenu();
    }
  },

  finishGameOver() {
    const g = this.g;
    this.phase = 'off';
    g.state = 'play';
    g.suppressFire = true;
    g.player.hp = 0.5;
    g.starT = 0; // неуязвимость от прошлой пощады тут не спасает
    g.takeDamage(999, 'Санс');
  },
};

// ---------- отрисовка ----------
function drawUtText(ctx, str, x, y, max) {
  const lines = str.slice(0, max).split('\n');
  lines.forEach((ln, i) => text(ctx, ln, x, y + i * 34, { font: `18px ${FONT.pixel}`, color: '#fff' }));
}

function renderBattle(ctx, g, now) {
  const B = Battle, t = B.t;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  g.buttons = [];
  ctx.save();
  if (B.shake > 0) ctx.translate(rand(-1, 1) * B.shake, rand(-1, 1) * B.shake);

  if (B.phase === 'intro') {
    // как в Undertale: душа мигает, потом бой
    if (Math.floor(B.pt * 8) % 2 === 0) drawSoul(ctx, 640, 360, 3);
    ctx.restore();
    return;
  }
  if (B.phase === 'gameover') {
    ctx.restore();
    drawUtGameOver(ctx, B);
    return;
  }

  // Санс
  const sl = B.slash;
  let dx = 0;
  if (B.phase === 'slash' && sl && sl.miss && !sl.none) dx = -Math.sin(Math.min(1, sl.t / 0.9) * Math.PI) * 90;
  const dust = B.phase === 'dust' ? Math.min(1, B.pt / 1.4) : 0;
  if (B.phase !== 'out' || B.outcome !== 'kill') {
    if (dust < 1) {
      drawSans(ctx, UT.sansX, UT.sansY, t, {
        dx,
        alpha: 1 - dust,
        eye: B.phase === 'attack' && B.pattern !== 'rain' ? (Math.floor(t * 6) % 2 ? '#40c4ff' : '#ffeb3b') : null,
        closed: B.phase === 'slash' && sl && !sl.miss,
        tired: B.spareable(),
        still: dust > 0,
      });
    }
    if (dust > 0) {
      for (let i = 0; i < 40; i++) {
        const px = UT.sansX + Math.sin(i * 12.9) * 50, py = UT.sansY - 90 + ((i * 37) % 180) - dust * 60 * ((i % 5) + 1) * 0.3;
        ctx.fillStyle = `rgba(255,255,255,${1 - dust})`;
        ctx.fillRect(px, py, 4, 4);
      }
    }
  }
  // реплика
  if (B.phase === 'bubble') {
    ctx.font = `bold 18px ${FONT.ui}`;
    const w = Math.max(220, ctx.measureText(B.bubble).width + 36);
    rr(ctx, 720, 78, w, 56, 10);
    ctx.fillStyle = '#fff';
    ctx.fill();
    poly(ctx, [722, 100, 704, 110, 722, 116], '#fff');
    text(ctx, B.bubble.slice(0, Math.floor(B.pt * 40)), 738, 112, { font: `bold 18px ${FONT.ui}`, color: '#000' });
  }
  // удар
  if (B.phase === 'slash' && sl) {
    const k = Math.min(1, sl.t / 0.3);
    if (!sl.none) {
      for (let i = 0; i < 3; i++) line(ctx, UT.sansX - 50 + i * 30, UT.sansY - 90, UT.sansX - 50 + i * 30 + 60 * k, UT.sansY - 90 + 120 * k, '#ff1744', 5);
    }
    if (sl.t > 0.25) {
      const yy = UT.sansY - 40 - Math.min(20, (sl.t - 0.25) * 60);
      text(ctx, sl.miss ? 'MISS' : String(sl.dmg), UT.sansX + 130, yy, { font: `28px ${FONT.pixel}`, color: sl.miss ? '#bdbdbd' : '#ff1744', stroke: '#000', lw: 4, align: 'center' });
      if (!sl.miss) {
        ctx.fillStyle = '#8b0000';
        ctx.fillRect(UT.sansX - 60, UT.sansY + 108, 120, 12);
        ctx.fillStyle = '#7ee03c';
        ctx.fillRect(UT.sansX - 60, UT.sansY + 108, 120 * (B.hp / UT.hp), 12);
      }
    }
  }

  // рамка
  const bx = B.box;
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 5;
  ctx.strokeRect(bx.x, bx.y, bx.w, bx.h);

  if (B.phase === 'menu' || B.phase === 'text' || B.phase === 'out') {
    drawUtText(ctx, B.msg, UT.text.x + 30, UT.text.y + 46, Math.floor(B.shown));
    if (B.phase !== 'menu') g.buttons.push({ x: 0, y: 0, w: W, h: H, action: () => B.confirm() });
  } else if (B.phase === 'sub') {
    B.subList().forEach((it, i) => {
      const x = UT.text.x + 60 + (i % 2) * 460, y = UT.text.y + 50 + Math.floor(i / 2) * 50;
      if (i === B.subSel) drawSoul(ctx, x - 22, y - 7, 1.4);
      text(ctx, `* ${it.label}`, x, y, { font: `18px ${FONT.pixel}`, color: it.yellow ? '#ffff00' : '#fff' });
      g.buttons.push({ x: x - 40, y: y - 30, w: 440, h: 44, action: () => B.pickSub(i) });
    });
    text(ctx, '◄ назад', UT.text.x + UT.text.w - 30, UT.text.y + UT.text.h - 18, { font: `12px ${FONT.pixel}`, color: '#9e9e9e', align: 'right' });
    g.buttons.push({ x: UT.text.x + UT.text.w - 200, y: UT.text.y + UT.text.h - 44, w: 190, h: 40, action: () => B.cancel() });
  } else if (B.phase === 'fight' || (B.phase === 'slash' && sl && !sl.none)) {
    // мишень и бегущая полоска
    const tx = UT.text.x + 10, ty = UT.text.y + 12, tw = UT.text.w - 20, th = UT.text.h - 24;
    for (let i = 0; i < 6; i++) {
      const k = i / 6;
      ctx.beginPath();
      ctx.ellipse(tx + tw / 2, ty + th / 2, (tw / 2) * (1 - k), (th / 2) * (1 - k * 0.6), 0, 0, TAU);
      ctx.fillStyle = i % 2 ? '#0b3d0b' : '#145a14';
      ctx.fill();
    }
    line(ctx, tx + tw / 2, ty, tx + tw / 2, ty + th, '#fff', 3);
    const blink = B.bar.stop && Math.floor(B.pt * 12) % 2;
    ctx.fillStyle = blink ? '#000' : '#fff';
    ctx.fillRect(B.bar.x - 6, ty - 4, 12, th + 8);
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.strokeRect(B.bar.x - 6, ty - 4, 12, th + 8);
    if (B.phase === 'fight') g.buttons.push({ x: 0, y: 0, w: W, h: H, action: () => B.confirm() });
  } else if (B.phase === 'bubble') {
    g.buttons.push({ x: 0, y: 0, w: W, h: H, action: () => B.confirm() });
  } else if (B.phase === 'attack') {
    ctx.save();
    ctx.beginPath();
    ctx.rect(bx.x + 3, bx.y + 3, bx.w - 6, bx.h - 6);
    ctx.clip();
    for (const b of B.bullets) {
      if (b.kind === 'bone') drawBone(ctx, b.x, b.y, b.w, b.h, b.blue ? '#29b6f6' : '#fff');
      else circ(ctx, b.x, b.y, b.r, '#fff');
    }
    ctx.restore();
    for (const bl of B.blasters) {
      const open = bl.t >= 0.7 ? 1 : 0;
      if (bl.t >= 0.7 && bl.t < 1.15) {
        ctx.save();
        ctx.translate(bl.x, bl.y);
        ctx.rotate(bl.ang);
        const wv = 36 * (1 - Math.max(0, bl.t - 1.0) / 0.15) + Math.sin(t * 60) * 2;
        ctx.fillStyle = '#fff';
        ctx.fillRect(20, -wv / 2, 1400, wv);
        ctx.restore();
      }
      drawBlaster(ctx, bl.x, bl.y, bl.ang, open);
    }
    if (!(B.soul.invT > 0 && Math.floor(B.soul.invT * 14) % 2)) drawSoul(ctx, B.soul.x, B.soul.y, 1.6);
    if (B.pattern === 'blue') text(ctx, 'Синие кости ранят, только если двигаешься!', 640, 278, { font: `bold 16px ${FONT.ui}`, color: '#29b6f6', align: 'center' });
  }

  // имя, уровень и здоровье
  const p = g.player;
  text(ctx, `ХАОС   LV ${p.level + 1}`, 150, UT.btnY - 30, { font: `16px ${FONT.pixel}`, color: '#fff' });
  text(ctx, 'HP', 500, UT.btnY - 30, { font: `14px ${FONT.pixel}`, color: '#fff' });
  ctx.fillStyle = '#c00';
  ctx.fillRect(540, UT.btnY - 48, p.maxHp * 6, 22);
  ctx.fillStyle = '#ffff00';
  ctx.fillRect(540, UT.btnY - 48, Math.max(0, p.hp) * 6, 22);
  text(ctx, `${Math.max(0, Math.ceil(p.hp))} / ${p.maxHp}`, 560 + p.maxHp * 6, UT.btnY - 30, { font: `16px ${FONT.pixel}`, color: '#fff' });

  // кнопки
  UT_BUTTONS.forEach((b, i) => {
    const x = 150 + i * 260, y = UT.btnY, w = 220, h = 56;
    const on = (B.phase === 'menu' || B.phase === 'sub') && B.sel === i;
    const c = on ? '#ffff00' : '#ff9f1a';
    ctx.strokeStyle = c;
    ctx.lineWidth = 3;
    ctx.strokeRect(x, y, w, h);
    if (on) drawSoul(ctx, x + 30, y + h / 2, 1.6);
    else drawUtIcon(ctx, b.key, x + 30, y + h / 2, c);
    text(ctx, b.label, x + 58, y + 37, { font: `18px ${FONT.pixel}`, color: c });
    if (B.phase === 'menu' || B.phase === 'sub') g.buttons.push({ x, y, w, h, action: () => B.choose(i) });
  });
  if (B.phase === 'menu') g.buttons.push({ x: 0, y: 0, w: W, h: H, action: () => B.typed() || (B.shown = B.msg.length) });
  ctx.restore();

  if (B.phase === 'out') {
    ctx.fillStyle = `rgba(0,0,0,${Math.min(1, B.pt / 0.5)})`;
    ctx.fillRect(0, 0, W, H);
  }
  if (Input.touch && B.phase === 'attack' && B.pt < 3) {
    text(ctx, 'Води пальцем по экрану — душа двигается', 640, 690, { font: `bold 15px ${FONT.ui}`, color: '#9e9e9e', align: 'center' });
  } else if (!Input.touch && B.phase === 'menu') {
    text(ctx, '← → выбор · Z / Enter — ок · X — назад', 640, 690, { font: `13px ${FONT.ui}`, color: '#616161', align: 'center' });
  }
}

function drawUtIcon(ctx, key, x, y, c) {
  ctx.strokeStyle = c;
  ctx.fillStyle = c;
  ctx.lineWidth = 3;
  if (key === 'fight') {
    line(ctx, x - 9, y + 9, x + 9, y - 9, c, 3);
    line(ctx, x - 9, y + 2, x - 2, y + 9, c, 3);
  } else if (key === 'act') {
    ctx.beginPath();
    ctx.arc(x, y - 1, 9, 0, TAU);
    ctx.stroke();
    poly(ctx, [x - 4, y + 7, x - 9, y + 12, x + 1, y + 8], c);
  } else if (key === 'item') {
    ctx.strokeRect(x - 8, y - 5, 16, 14);
    ctx.beginPath();
    ctx.arc(x, y - 5, 5, Math.PI, 0);
    ctx.stroke();
  } else {
    line(ctx, x - 8, y - 8, x + 8, y + 8, c, 3);
    line(ctx, x + 8, y - 8, x - 8, y + 8, c, 3);
  }
}

function drawUtGameOver(ctx, B) {
  const pt = B.pt;
  if (pt < 0.5) {
    drawSoul(ctx, B.soul.x, B.soul.y, 1.6);
    if (pt > 0.25) line(ctx, B.soul.x - 2, B.soul.y - 8, B.soul.x + 3, B.soul.y + 8, '#000', 3);
  } else if (pt < 1.4) {
    const k = (pt - 0.5) / 0.9;
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * TAU + 0.4;
      ctx.fillStyle = '#ff1a1a';
      ctx.fillRect(B.soul.x + Math.cos(a) * k * 90, B.soul.y + Math.sin(a) * k * 90 + k * k * 120, 5, 5);
    }
  } else {
    const k = Math.min(1, (pt - 1.4) / 0.8);
    ctx.globalAlpha = k;
    text(ctx, 'GAME', 640, 260, { font: `90px ${FONT.title}`, color: '#fff', align: 'center' });
    text(ctx, 'OVER', 640, 360, { font: `90px ${FONT.title}`, color: '#fff', align: 'center' });
    const msg = '* Не теряй решимость!';
    text(ctx, msg.slice(0, Math.floor(Math.max(0, pt - 2.2) * 25)), 640, 470, { font: `20px ${FONT.pixel}`, color: '#fff', align: 'center' });
    ctx.globalAlpha = 1;
  }
}

// ---- js/top.js ----
'use strict';
/* Зал славы — как на старых игровых автоматах: закончил забег, вписал ник — попал в топ.
   Топ этого устройства хранится в браузере. Общий топ — на тех же бесплатных MQTT-серверах,
   что и дуэль: у каждого ника одно «закреплённое» (retained) сообщение с его лучшим забегом,
   и каждый, кто открывает зал славы, получает их все. Ни регистрации, ни базы данных —
   и никакой защиты: топ держится на честном слове игроков. Свои рекорды игра помнит и
   при каждом заходе в зал славы досылает их, если сервер их потерял. */

const TOP_TOPIC = NET_PREFIX + '/top';
const TOP_LOCAL = 10; // строк в топе устройства
const TOP_MAX = 100; // строк в общем топе
const TOP_ROWS = 10; // строк на странице

// Ключ ника: регистр и «ё» не важны. Два разных 32-битных хеша — чтобы ники почти не совпадали.
function topKey(nick) {
  const s = cleanNick(nick).toLowerCase().replace(/ё/g, 'е');
  let a = 0x811c9dc5, b = 0x9747b28c;
  for (const ch of s) {
    const c = ch.codePointAt(0);
    a = Math.imul(a ^ c, 16777619) >>> 0;
    b = Math.imul(b ^ c, 0x5bd1e995) >>> 0;
    b = (b ^ (b >>> 15)) >>> 0;
  }
  return a.toString(16).padStart(8, '0') + b.toString(16).padStart(8, '0');
}

// Запись из сети — чужие данные: проверяем и обрезаем.
function cleanTopEntry(o) {
  if (!o || typeof o !== 'object') return null;
  const n = cleanNick(o.n);
  const s = Math.floor(Number(o.s));
  if (!n || !Number.isFinite(s) || s <= 0 || s > 1e9) return null;
  const int = (v, max) => clamp(Math.floor(Number(v)) || 0, 0, max);
  return { n, s, l: int(o.l, 9), w: o.w ? 1 : 0, k: int(o.k, 1e6), t: int(o.t, 1e6), d: int(o.d, 4e12) };
}

function loadJson(key, def) {
  try {
    const v = JSON.parse(Store.get(key) || 'null');
    return v && typeof v === 'object' ? v : def;
  } catch (e) {
    return def;
  }
}

const fmtScore = (s) => '$' + String(s).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');

// Одна короткая сессия с сервером: забрать все записи топа и дослать свои, если их там нет.
function topSession(url, mine) {
  return new Promise((resolve) => {
    const got = new Map();
    let client = null, done = false, idle = null;
    const finish = (ok) => {
      if (done) return;
      done = true;
      clearTimeout(idle);
      clearTimeout(hard);
      if (client) client.end(true);
      resolve(ok ? got : null);
    };
    const hard = setTimeout(() => finish(got.size > 0), 12000);
    const publishMine = () => {
      const send = mine.filter((e) => !(got.has(topKey(e.n)) && got.get(topKey(e.n)).s >= e.s));
      if (!send.length) return finish(true);
      let left = send.length;
      for (const e of send) {
        client.publish(`${TOP_TOPIC}/${topKey(e.n)}`, JSON.stringify(e), { qos: 1, retain: true }, (err) => {
          if (!err) got.set(topKey(e.n), e);
          if (--left === 0) finish(true);
        });
      }
    };
    // закреплённые сообщения приходят сразу после подписки — ждём, пока поток стихнет
    const wait = () => {
      clearTimeout(idle);
      idle = setTimeout(publishMine, 1300);
    };
    connectMqtt(url, 'kdt_' + Math.random().toString(36).slice(2, 10)).then((c) => {
      if (!c) return finish(false);
      if (done) return c.end(true);
      client = c;
      c.on('message', (topic, payload) => {
        const key = String(topic).split('/').pop();
        if (got.size >= 500 || !/^[0-9a-f]{16}$/.test(key)) return;
        let e = null;
        try {
          e = cleanTopEntry(JSON.parse(String(payload)));
        } catch (err) {
          /* мусор пропускаем */
        }
        if (e && topKey(e.n) === key) got.set(key, e);
        wait();
      });
      c.subscribe(TOP_TOPIC + '/+', { qos: 0 }, (err) => (err ? finish(false) : wait()));
    });
  });
}

const Top = {
  local: loadJson('kd_top', []).map(cleanTopEntry).filter(Boolean).slice(0, TOP_LOCAL),
  localIds: loadJson('kd_top_ids', []),
  mine: loadJson('kd_top_mine', {}), // лучший забег каждого своего ника — его досылаем серверу
  auto: Store.get('kd_top_auto') === '1', // уже записывался — дальше записываем сам
  global: [],
  status: 'idle', // idle | loading | ready | offline
  error: '',
  loadedAt: 0,
  syncing: null,
  run: null, // { id, entry, sent }
  tab: 'all', // all | local
  page: 0,
  back: 'title',

  available() {
    return /^https?:$/.test(location.protocol) || !!window.KD_MQTT_BROKERS;
  },

  saveLocal() {
    Store.set('kd_top', JSON.stringify(this.local));
    Store.set('kd_top_ids', JSON.stringify(this.localIds));
  },

  // Конец забега (смерть или победа над боссом): обновить запись этого забега.
  record(g) {
    if (g.duel || g.cheated) return;
    const s = Math.floor(g.player.earned);
    if (s <= 0) return;
    if (!this.run || this.run.id !== g.runId) this.run = { id: g.runId, entry: null, sent: false };
    const final = g.state === 'win' && g.levelIdx >= LEVELS.length - 1;
    this.run.entry = { n: Duel.name, s, l: g.levelIdx + 1, w: final ? 1 : 0, k: g.kills, t: Math.round(g.runT), d: Date.now() };
    this.putLocal(this.run);
    if (this.auto || this.run.sent) this.submit();
    else if (Date.now() - this.loadedAt > 15000) this.sync();
  },

  // Топ устройства: одна строка на забег.
  putLocal(run) {
    const i = this.localIds.indexOf(run.id);
    if (i >= 0) {
      this.local.splice(i, 1);
      this.localIds.splice(i, 1);
    }
    const at = this.local.findIndex((e) => e.s < run.entry.s);
    const pos = at < 0 ? this.local.length : at;
    this.local.splice(pos, 0, { ...run.entry });
    this.localIds.splice(pos, 0, run.id);
    this.local.length = Math.min(this.local.length, TOP_LOCAL);
    this.localIds.length = this.local.length;
    this.saveLocal();
  },

  // Записать забег в общий топ под текущим ником.
  submit() {
    const r = this.run;
    if (!r || !r.entry) return;
    r.entry.n = Duel.name;
    r.sent = true;
    this.putLocal(r);
    const key = topKey(r.entry.n);
    if (!this.mine[key] || this.mine[key].s < r.entry.s) {
      this.mine[key] = { ...r.entry };
      Store.set('kd_top_mine', JSON.stringify(this.mine));
    }
    if (!this.auto) {
      this.auto = true;
      Store.set('kd_top_auto', '1');
    }
    // своя запись видна в таблице сразу, не дожидаясь сервера
    this.merge(new Map([[key, this.mine[key]]]));
    this.sync(true);
  },

  merge(map) {
    const all = new Map(this.global.map((e) => [topKey(e.n), e]));
    for (const [k, e] of map) if (!all.has(k) || all.get(k).s < e.s) all.set(k, e);
    this.global = [...all.values()].sort((a, b) => b.s - a.s || a.d - b.d).slice(0, TOP_MAX);
  },

  // Забрать общий топ со всех серверов (и дослать свои записи).
  sync(again) {
    if (this.syncing) {
      if (again) this.syncAgain = true;
      return this.syncing;
    }
    if (!this.available()) {
      this.status = 'offline';
      this.error = 'Общий топ работает, когда игра открыта с сайта.';
      return Promise.resolve();
    }
    this.status = 'loading';
    this.syncing = (async () => {
      if (!(await loadMqttLib())) {
        this.status = 'offline';
        this.error = 'Нет интернета — не загрузилась библиотека связи.';
        return;
      }
      const mine = Object.values(this.mine);
      const res = await Promise.all(MQTT_BROKERS.map((u) => topSession(u, mine)));
      const ok = res.filter(Boolean);
      if (!ok.length) {
        this.status = 'offline';
        this.error = 'Нет связи с сервером. Твои рекорды сохранены — отправлю, когда появится связь.';
        return;
      }
      this.global = [];
      for (const m of ok) this.merge(m);
      this.merge(new Map(mine.map((e) => [topKey(e.n), e])));
      this.status = 'ready';
      this.error = '';
      this.loadedAt = Date.now();
    })().finally(() => {
      this.syncing = null;
      if (this.syncAgain) {
        this.syncAgain = false;
        this.sync();
      }
    });
    return this.syncing;
  },

  open(g) {
    if (g.state !== 'top') this.back = g.state === 'dead' || g.state === 'win' ? g.state : 'title';
    g.state = 'top';
    this.page = 0;
    if (this.status !== 'loading' && Date.now() - this.loadedAt > 15000) this.sync();
  },

  close(g) {
    if (this.back === 'title') g.toTitle();
    else g.state = this.back;
  },

  list() {
    return this.tab === 'local' ? this.local : this.global;
  },

  pages() {
    return Math.max(1, Math.ceil(this.list().length / TOP_ROWS));
  },

  flip(d) {
    this.page = clamp(this.page + d, 0, this.pages() - 1);
  },

  // Место забега в общем топе (1 — первое).
  rank(entry) {
    const key = topKey(entry.n);
    return 1 + this.global.filter((e) => e.s > entry.s && topKey(e.n) !== key).length;
  },

  editNick(then) {

function neonText(ctx, str, x, y, font, color, blur = 18) {

// Фон в духе 80-х: закат с полосами и сетка до горизонта.
function drawSynthBackdrop(ctx, now) {
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#07020f');
  sky.addColorStop(0.55, '#1f0633');
  sky.addColorStop(0.56, '#090212');
  sky.addColorStop(1, '#030106');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);
  const hy = 400;
  ctx.save();
  ctx.globalAlpha = 0.5;
  const sun = ctx.createLinearGradient(0, hy - 230, 0, hy);
  sun.addColorStop(0, '#ffe36e');
  sun.addColorStop(1, '#ff2a8a');
  ctx.beginPath();
  ctx.arc(640, hy, 230, Math.PI, 0);
  ctx.fillStyle = sun;
  ctx.fill();
  ctx.fillStyle = '#1f0633';
  for (let i = 0; i < 7; i++) ctx.fillRect(400, hy - 20 - i * 26, 480, 3 + i * 1.6);
  ctx.restore();
  ctx.save();
  ctx.strokeStyle = 'rgba(255,42,138,0.45)';
  ctx.lineWidth = 1.5;
  for (let i = -16; i <= 16; i++) {
    ctx.beginPath();
    ctx.moveTo(640 + i * 14, hy);
    ctx.lineTo(640 + i * 120, H);
    ctx.stroke();
  }
  const off = (now * 0.6) % 1;
  for (let i = 0; i < 9; i++) {
    const k = (i + off) / 9;
    const y = hy + (H - hy) * k * k;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }
  ctx.restore();
}
