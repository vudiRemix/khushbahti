    this.totemFx = 0;
    this.slowmo = false;
    this.boostLock = false;
    this.boostIdle = 0;
    this.timeScale = 1;
    this.kills = 0;
    this.tilesOpened = 0;
    this.chat = [];
    this.bannerObj = null;
    this.jumpscare = null;
    this.dice = null;
    this.smiley = 'normal';
    this.smileyT = 0;
    this.hintIdx = 0;
    this.deadT = 0;
    this.winT = 0;
    this.deathCause = '';
    this.newRecord = false;
    this.suppressFire = false;
    this.gunAlpha = 1;
  }

  // ---------- состояния экрана ----------
  start() {
    Sound.init();
    this.reset();
    this.state = 'play';
    this.suppressFire = true;
    this.say('Цель: разрушь башню короля. Удачи, сапёр!', '#ffd54a');
  }
  pause() {
    if (this.state === 'play') this.state = 'pause';
  }
  resume() {
    if (this.state === 'pause') {
      this.state = 'play';
      this.suppressFire = true;
    }
  }
  toTitle() {
    this.state = 'title';
    this.titleT = 0;
  }
  onBlur() {
    Input.lmb = false;
    Input.rmb = false;
    this.pause();
  }
  endT() {
    return this.state === 'dead' ? this.deadT : this.winT;
  }
  saveBest() {
    if (this.player.money > this.best) {
      this.best = this.player.money;
      Store.set('kd_best', this.best);
      this.newRecord = true;
    }
  }

  // ---------- главный цикл ----------
  update(realDt) {
    realDt = Math.min(realDt, 0.05);
    this.processInput();
    if (this.state === 'title') {
      this.titleT += realDt;
      this.pac.mouth += realDt * 10;
      return;
    }
    if (this.state === 'pause') return;
    if (this.state === 'dead') {
      this.deadT += realDt;
      this.updateFx(realDt * 0.3, realDt);
      return;
    }
    if (this.state === 'win') {
      this.winT += realDt;
      if (Math.random() < 0.15) {
        FX.burst(this, rand(100, 1180), rand(80, 400), 18, { colors: ['#ffd54a', '#ff5252', '#7ee03c', '#40c4ff', '#fff'], size: 6, speed: 260, grav: 150, life: 1.2 });
      }
      this.updateFx(realDt, realDt);
      return;
    }

    // --- игра ---
    this.updateBoost(realDt);
    this.updateGun(realDt);
    this.updateRod(realDt);
    if (this.smileyT > 0) {
      this.smileyT -= realDt;
      if (this.smileyT <= 0) this.smiley = 'normal';
    }
    for (let i = 0; i < 9; i++) if (this.slotFlash[i] > 0) this.slotFlash[i] -= realDt;
    if (this.dice) this.updateDice(realDt);

    if (this.jumpscare) {
      this.jumpscare.t += realDt;
      if (this.jumpscare.t >= 0.95) {
        this.jumpscare = null;
        this.takeDamage(6, 'Золотой Фредди');
        this.say("<Золотой Фредди> IT'S ME", '#ffd54a');
      }
      this.updateFx(realDt * 0.2, realDt);
      return;
    }

    const dt = realDt * this.timeScale;
    this.t += dt;
    while (this.hintIdx < HINTS.length && this.t >= HINTS[this.hintIdx][0]) {
      this.say('[Подсказка] ' + HINTS[this.hintIdx][1], '#9be7ff');
      this.hintIdx++;
    }
    this.updateClock(dt);
    this.updatePlayer(dt);
    this.updateDirector(dt);
    this.updateTower(dt);
    this.mf.update(dt);
    if (this.rebuildT > 0) {
      this.rebuildT -= dt;
      if (this.rebuildT <= 0) {
        const mines = Math.min(CFG.maxMines, CFG.baseMines + this.fieldsCleared);
        this.mf.rebuild(mines);
        this.say(`Новое поле сапёра: ${mines} мин. Король нервничает.`, '#e0e0e0');
      }
    }

    for (const e of this.enemies) e.update(dt, this);
    if (this.pac.state === 'parked') {
      const close = this.enemies.find((e) => e.alive && e.type !== 'freddy' && e.y >= PAWN_ROW * T - 26);
      if (close && this.pac.launch(PAWN_ROW, false)) this.say('Пак-Ман выкатился на защиту последнего ряда!', '#ffe600');
    }
    this.pac.update(dt, this);
    this.updateDefenders(dt);
    for (const it of this.items) it.update(dt);
    for (const a of this.airdrops) a.update(dt, this);
    this.updateCannonballs(dt);
    this.updateMissiles(dt);
    this.updateTNT(dt);
    this.updateFx(dt, realDt);

    this.enemies = this.enemies.filter((e) => !e.remove);
    this.items = this.items.filter((i) => !i.gone);
    this.airdrops = this.airdrops.filter((a) => !a.gone);
    this.cannonballs = this.cannonballs.filter((c) => !c.gone);
    this.missiles = this.missiles.filter((m) => !m.gone);
    this.tnts = this.tnts.filter((t) => !t.gone);
  }

  updateFx(dt, realDt) {
    for (const p of this.particles) {
      p.life -= dt;
      p.vy += p.grav * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += p.vr * dt;
    }
    this.particles = this.particles.filter((p) => p.life > 0);
    for (const tx of this.texts) {
      tx.life -= realDt;
      tx.y += tx.vy * realDt;
    }
    this.texts = this.texts.filter((tx) => tx.life > 0);
    for (const d of this.decals) d.life -= dt;
    this.decals = this.decals.filter((d) => d.life > 0);
    for (const ex of this.explosions) ex.t += dt;
    this.explosions = this.explosions.filter((ex) => ex.t < 0.55);
    for (const b of this.beams) b.t += dt;
    this.beams = this.beams.filter((b) => b.t < 0.22);
    for (const tr of this.tracers) tr.t += realDt;
    this.tracers = this.tracers.filter((tr) => tr.t < 0.07);
    for (const c of this.cracks) c.t += realDt;
    this.cracks = this.cracks.filter((c) => c.t < 2.6);
    for (const f of this.flyers) f.t += realDt * 2.2;
    this.flyers = this.flyers.filter((f) => f.t < 1);
    for (const m of this.chat) m.t += realDt;
    this.chat = this.chat.filter((m) => m.t < 8);
    if (this.bannerObj) {
      this.bannerObj.t += realDt;
      if (this.bannerObj.t > this.bannerObj.dur) this.bannerObj = null;
    }
    this.shake = Math.max(0, this.shake - realDt * 40);
    this.hurtFlash = Math.max(0, this.hurtFlash - realDt);
    this.heartShake = Math.max(0, this.heartShake - realDt);
    this.staticFx = Math.max(0, this.staticFx - realDt);
    this.frostFx = Math.max(0, this.frostFx - realDt * 0.6);
    this.totemFx = Math.max(0, this.totemFx - realDt);
    this.starFlash = Math.max(0, this.starFlash - realDt);
    const tw = this.tower;
    if (tw.hit > 0) tw.hit -= realDt;
  }

  // ---------- ввод ----------
  processInput() {
    const q = Input.queue;
    Input.queue = [];
    for (const ev of q) {
      if (ev.type === 'key') this.onKey(ev.code);
      else if (ev.type === 'down') this.onMouseDown(ev.button, ev.x, ev.y);
      else if (ev.type === 'up' && ev.button === 0) this.suppressFire = false;
      else if (ev.type === 'wheel' && this.state === 'play') {
        this.sel = (this.sel + ev.dy + 9) % 9;
        Sound.click();
      }
    }
  }

  onKey(code) {
    if (code === 'KeyM') {
      Sound.toggleMute();
      this.say(Sound.muted ? 'Звук выключен (M)' : 'Звук включён (M)', '#e0e0e0');
      return;
    }
    if (this.state === 'title') {
      if (code === 'Enter' || code === 'Space') this.start();
      return;
    }
    if (this.state === 'pause') {
      if (code === 'Escape' || code === 'KeyP' || code === 'Enter') this.resume();
      else if (code === 'KeyN') this.start();
      return;
    }
    if (this.state === 'dead' || this.state === 'win') {
      if ((code === 'Enter' || code === 'Space') && this.endT() > 1.5) this.start();
      else if (code === 'Escape') this.toTitle();
      return;
    }
    if (code === 'Escape' || code === 'KeyP') {
      this.pause();
      return;
    }
    if (this.jumpscare) return;
    if (code === 'KeyR') this.reload();
    else if (code === 'KeyF' || code === 'Space') this.flagAt(Input.x, Input.y);
    else if (code === 'KeyQ') this.cyclePacket();
    else if (code === 'KeyE') this.useItem(this.sel);
    else {
      const m = /^(Digit|Numpad)([1-9])$/.exec(code);
      if (m) this.useItem(Number(m[2]) - 1);
    }
  }

  onMouseDown(btn, x, y) {
    if (this.state !== 'play') {
      if (btn === 0) this.clickButtons(x, y);
      return;
    }
    if (this.jumpscare) return;
    if (btn === 0) {
      if (this.uiClick(x, y)) {
        this.suppressFire = true;
        return;
      }
      this.suppressFire = false;
      this.tryFire();
    } else if (btn === 2) {
      this.castRod(x, y);
    } else if (btn === 1) {
      this.flagAt(x, y);
    }
  }

  uiClick(x, y) {
    for (let i = 0; i < 9; i++) {
      if (inRect(x, y, hotbarSlotRect(i))) {
        this.useItem(i);
        return true;
      }
    }
    for (let i = 0; i < PACKETS.length; i++) {
      if (inRect(x, y, packetRect(i))) {
        this.packet = PACKETS[i];
        Sound.click();
        return true;
      }
    }
    return false;
  }

  clickButtons(x, y) {
    for (const b of this.buttons) {
      if (inRect(x, y, b)) {
        Sound.click();
        b.action();
        return;
      }
    }
    if (this.state === 'title') this.start();
  }

  cyclePacket() {
    const i = PACKETS.indexOf(this.packet);
    this.packet = PACKETS[(i + 1) % PACKETS.length];
    Sound.click();
    const s = DEF_STATS[this.packet];
    this.say(`Посадка: ${s.name} (${s.cost} ☀) — ${s.info}`, '#ffe082');
  }

  // ---------- АК-47 ----------
  get fireRate() {
    return 1 + Math.min(0.6, this.player.level * 0.03);
  }

  updateGun(dt) {
    const gun = this.gun;
    gun.cd = Math.max(0, gun.cd - dt);
    gun.flash = Math.max(0, gun.flash - dt);
    gun.kick = Math.max(0, gun.kick - dt * 8);
    gun.punch = Math.max(0, gun.punch - dt);
    gun.heat = Math.max(0, gun.heat - dt * (Input.lmb ? 0.7 : 2.4));
    if (gun.reload > 0) {
      gun.reload -= dt;
      if (gun.reload <= 0) {
        const take = Math.min(CFG.magSize - gun.mag, gun.reserve);
        gun.mag += take;
        gun.reserve -= take;
        gun.reload = 0;
      }
    }
    if (Input.lmb && !this.suppressFire && !this.jumpscare) this.tryFire();
    // оружие становится прозрачным, если прицел под ним
    const under = Input.x > 900 && Input.y > 430;
    this.gunAlpha = lerp(this.gunAlpha, under ? 0.3 : 1, Math.min(1, dt * 10));
  }

  reload() {
    const gun = this.gun;
    if (gun.reload > 0 || gun.mag >= CFG.magSize || gun.reserve <= 0) return;
    gun.reload = CFG.reloadTime;
    Sound.reload();
  }

  tryFire() {
    const gun = this.gun;
    if (gun.reload > 0 || gun.cd > 0) return;
    if (gun.mag <= 0) {
      if (gun.reserve > 0) this.reload();
      else this.punch();
      return;
    }
    gun.mag--;
    gun.cd = CFG.fireInterval / this.fireRate;
    const spread = 2 + gun.heat * 30;
    const a = rand(0, TAU), d = Math.sqrt(Math.random()) * spread;
    const hx = Input.x + Math.cos(a) * d, hy = Input.y + Math.sin(a) * d;
    gun.heat = Math.min(1, gun.heat + 0.09);
    gun.kick = 1;
    gun.flash = 0.05;
    this.shake = Math.max(this.shake, 1.5);
    Sound.shot();
    const pose = this.gunPose();
    this.tracers.push({ x1: pose.mx, y1: pose.my, x2: hx, y2: hy, t: 0 });
    FX.burst(this, pose.ex, pose.ey, 1, { colors: ['#d4a017'], size: 5, speed: 260, angle: pose.rot - Math.PI / 2 + 0.6, spread: 0.3, grav: 900, life: 0.6 });
    this.hitAt(hx, hy, 1);
    if (gun.mag === 0 && gun.reserve > 0) this.reload();
  }

  punch() {
    const gun = this.gun;
    if (gun.punch > 0) return;
    gun.punch = 0.4;
    gun.cd = 0.4;
    Sound.punch();
    let best = null;
    for (const e of this.enemies) if (e.alive && e.distTo(Input.x, Input.y) < 50 && (!best || e.y > best.y)) best = e;
    if (best) {
      best.damage(1, this, 'fist');
      FX.text(this, Input.x, Input.y - 30, 'БАЦ!', { color: '#fff', font: `bold 22px ${FONT.gta}` });
    } else if (Math.random() < 0.3) {
      FX.text(this, Input.x, Input.y - 30, 'Нет патронов — бей кулаком!', { color: '#ffd54a', font: `bold 14px ${FONT.ui}` });
    }
  }

  // Положение оружия в кадре (общая функция для логики и отрисовки).
  gunPose() {
    const gun = this.gun;
    let px = 1178, py = 655;
    let dir = Math.atan2(Input.y - py, Input.x - px);
    if (dir > 0) dir -= TAU;
    dir = clamp(dir, -3.5, -1.7);
    const base = -2.6;
    let rot = base + (dir - base) * 0.65 + Math.PI;
    const s = 0.86;
    if (gun.reload > 0) {
      const p = 1 - gun.reload / CFG.reloadTime;
      const k = Math.sin(p * Math.PI);
      rot += k * 0.55;
      py += k * 120;
    }
    rot -= gun.kick * 0.05;
    px += Math.cos(rot) * gun.kick * 14;
    py += Math.sin(rot) * gun.kick * 14;
    const cr = Math.cos(rot), sr = Math.sin(rot);
    const lx = AK_MUZZLE.x * s, ly = AK_MUZZLE.y * s;
    const ex = -60 * s, ey = -26 * s;
    return { px, py, rot, s, mx: px + lx * cr - ly * sr, my: py + lx * sr + ly * cr, ex: px + ex * cr - ey * sr, ey: py + ex * sr + ey * cr };
  }

  hitAt(x, y, dmg) {
    for (const cb of this.cannonballs) {
      if (!cb.gone && cb.hit(x, y)) {
        cb.gone = true;
        const p = cb.pos;
        FX.burst(this, p.x, p.y, 16, { colors: ['#ffcc80', '#fff', '#555'], size: 6, speed: 300, grav: 300 });
        FX.text(this, p.x, p.y - 30, 'СБИТО!', { color: '#ffd54a', font: `bold 22px ${FONT.gta}` });
        this.addMoney(25);
        Sound.stone();
        return;
      }
    }
    let best = null;
    for (const e of this.enemies) if (e.alive && e.hit(x, y) && (!best || e.y > best.y)) best = e;
    if (best) {
      best.damage(dmg, this, 'gun');
      const colors = {
        zombie: ['#7fa35c', '#4e6b2f'],
        cone: ['#7fa35c', '#f08a24'],
        freddy: ['#ffd54a', '#c9a92c'],
        snake: ['#4a7cf0', '#9bb8ff'],
      }[best.type] || ['#222', '#555', '#8a8a8a'];
      FX.burst(this, x, y, 5, { colors, size: 5, speed: 200, grav: 600, life: 0.4 });
      Sound.hit();
      return;
    }
    if (!this.tower.dead && inRect(x, y, TOWER_BOX)) {
      this.damageTower(dmg, false);
      FX.burst(this, x, y, 4, { colors: ['#9a9dab', '#6f7282', '#ddd'], size: 5, speed: 180, grav: 600, life: 0.4 });
      Sound.stone();
      return;
    }
    this.decals.push({ x, y, life: 4 });
    if (this.decals.length > 60) this.decals.shift();
    FX.burst(this, x, y, 2, { colors: ['rgba(120,100,70,0.8)'], size: 4, speed: 80, grav: 300, life: 0.3 });
  }

  // ---------- удочка ----------
  castRod(x, y) {
    const rod = this.rod;
    if (rod.state !== 'idle' || rod.cd > 0) return;
    rod.state = 'out';
    rod.t = 0;
    rod.tx = x;
    rod.ty = y;
    Sound.cast();
    if (this.smiley === 'normal') {
      this.smiley = 'o';
      this.smileyT = 0.35;
    }
  }

  updateRod(dt) {
    const rod = this.rod;
    rod.cd = Math.max(0, rod.cd - dt);
    if (rod.state === 'out') {
      rod.t += dt / 0.13;
      if (rod.t >= 1) {
        rod.t = 0;
        rod.state = 'back';
        rod.carry = this.resolveRod(rod.tx, rod.ty);
      }
    } else if (rod.state === 'back') {
      rod.t += dt / 0.22;
      if (rod.t >= 1) {
        rod.state = 'idle';
        rod.cd = 0.08;
        rod.carry = null;
      }
    }
  }

  rodTip() {
    return { x: 318, y: 352 };
  }

  resolveRod(x, y) {
    for (const a of this.airdrops) {
      if (!a.gone && a.hit(x, y)) {
        this.openAirdrop(a);
        return 'crate';
      }
    }
    let best = null, bd = 42 * 42;
    for (const it of this.items) {
      if (it.gone) continue;
      const d = dist2(x, y, it.x, it.y);
      if (d < bd) {
        bd = d;
        best = it;
      }
    }
    if (best) {
      best.gone = true;
      if (best.kind === 'sun') {
        this.sun += CFG.sunValue;
        Sound.sun();
        FX.text(this, best.x, best.y - 26, `+${CFG.sunValue} ☀`, { color: '#ffe066', font: `bold 20px ${FONT.ui}` });
        return 'sun';
      }
      this.giveItem(best.key, 1, best.x, best.y);
      return best.key;
    }
    const m = this.mf.at(x, y);
    if (m && m.cell.pop >= 1) {
      if (this.mf.done) {
        FX.text(this, x, y - 30, 'Поле перестраивается...', { color: '#e0e0e0', font: `bold 14px ${FONT.ui}` });
        return null;
      }
      if (m.cell.s === HIDDEN) this.openCell(m.c, m.r);
      else if (m.cell.s === OPEN) this.chordCell(m.c, m.r);
      else if (m.cell.s === FLAG) {
        FX.text(this, x, y - 30, 'Тут флажок. Снять — F', { color: '#ffcdd2', font: `bold 14px ${FONT.ui}` });
        Sound.empty();
      }
      return null;
    }
    const c = toCol(x), r = toRow(y);
    if (r === PAWN_ROW && c >= 1 && c < COLS) {
      if (!this.def[c]) this.plant(c);
      else FX.text(this, colX(c), rowY(PAWN_ROW) - 46, 'Клетка занята', { color: '#e0e0e0', font: `bold 14px ${FONT.ui}` });
      return null;
    }
    Sound.splash();
    FX.burst(this, x, y, 6, { colors: ['#81d4fa', '#e1f5fe'], size: 4, speed: 120, grav: 500, up: 80, life: 0.4 });
    return null;
  }

  // ---------- сапёр ----------
  flagAt(x, y) {
    const m = this.mf.at(x, y);
    if (!m || m.cell.pop < 1 || this.mf.done) return;
    const s = this.mf.toggleFlag(m.c, m.r);
    if (s === FLAG) {
      Sound.flag();
      const p = this.mf.center(m.c, m.r);
      FX.burst(this, p.x, p.y - 10, 5, { colors: ['#e01b1b', '#fff'], size: 4, speed: 120, up: 60, life: 0.4 });
    } else if (s === HIDDEN) Sound.unflag();
  }

  openCell(c, r) {
    const res = this.mf.open(c, r);
    if (res.mine) this.mineBlast(res.mine.c, res.mine.r, true);
    this.rewardTiles(res.opened);
    this.checkCleared();
  }

  chordCell(c, r) {
    const res = this.mf.chord(c, r);
    if (!res.opened.length && !res.mines.length) {
      Sound.click();
      return;
    }
    for (const m of res.mines) this.mineBlast(m.c, m.r, true);
    this.rewardTiles(res.opened);
    this.checkCleared();
  }

  rewardTiles(list) {
    if (!list.length) return;
    const n = list.length;
    this.tilesOpened += n;
    this.player.money += 10 * n;
    const ammo = Math.min(CFG.maxReserve - this.gun.reserve, CFG.ammoPerTile * n);
    this.gun.reserve += Math.max(0, ammo);
    this.addXp(n * 0.5);
    Sound.reveal(n);
    let drops = 0;
    for (const { c, r } of list) {
      const p = this.mf.center(c, r);
      if (n < 25) FX.burst(this, p.x, p.y, 3, { colors: ['#c3c3c3', '#fff', '#7b7b7b'], size: 6, speed: 150, up: 100, life: 0.45 });
      if (drops < 2 && Math.random() < 0.07) {
        drops++;
        const key = weighted(TILE_LOOT);
        if (key === 'sun') this.items.push(new Loot('sun', null, p.x, p.y - 30, p.y, 120));
        else this.items.push(new Loot('item', key, p.x, p.y - 30, p.y, 120));
      }
    }
    const p0 = this.mf.center(list[0].c, list[0].r);
    FX.text(this, p0.x, p0.y - 30, `+$${10 * n}` + (ammo > 0 ? `  +${ammo} пт.` : ''), { color: '#a5f07a', font: `bold 17px ${FONT.ui}` });
  }

  checkCleared() {
    if (this.mf.done || !this.mf.isCleared()) return;
    this.mf.done = true;
    const live = this.mf.liveMines();
    this.fieldsCleared++;
    this.addMoney(1000, 640, 330);
    this.smiley = 'cool';
    this.smileyT = 3.5;
    this.banner('САПЁР ПРОЙДЕН!', live.length ? `${live.length} мин летят в башню короля!` : 'Все мины уже взорваны ловушками', '#7ee03c');
    live.forEach((m, i) => {
      const cell = this.mf.cell(m.c, m.r);
      cell.s = FLAG;
      const p = this.mf.center(m.c, m.r);
      this.missiles.push({ c: m.c, r: m.r, x0: p.x, y0: p.y, x1: 640 + rand(-70, 70), y1: rand(70, 130), t: -0.6 - i * 0.18, dur: 0.85, dmg: CFG.mineMissileDamage, launched: false, x: p.x, y: p.y });
    });
    this.rebuildT = 2.4 + live.length * 0.18;
  }

  mineBlast(c, r, byPlayer) {
    this.mf.detonate(c, r);
    const p = this.mf.center(c, r);
    this.explode(p.x, p.y, T * 1.45, CFG.trapDamage, 'mine');
    if (byPlayer) {
      this.smiley = 'dead';
      this.smileyT = 1.5;
      this.say('Ты подцепил мину удочкой. Бабах!', '#ff8a80');
      this.takeDamage(CFG.mineDamageToPlayer, 'мина');
    }
  }

  // Флажок, поставленный на настоящую мину, превращается в ловушку.
  checkTrapAt(x, y, enemy) {
    if (enemy && enemy.type === 'freddy') return;
    const m = this.mf.at(x, y);
    if (!m || m.cell.s !== FLAG || !m.cell.mine || m.cell.pop < 1 || this.mf.done) return;
    this.mf.detonate(m.c, m.r);
    const p = this.mf.center(m.c, m.r);
    this.explode(p.x, p.y, T * 1.45, CFG.trapDamage, 'trap');
    FX.text(this, p.x, p.y - 50, 'ЛОВУШКА!', { color: '#ffd54a', font: `24px ${FONT.title}` });
    this.addMoney(50);
  }

  explode(x, y, radius, dmg, src) {
    this.explosions.push({ x, y, r: radius, t: 0 });
    FX.burst(this, x, y, 26, { colors: ['#ffef8a', '#ffb300', '#ff6d00', '#5d4037'], size: 10, speed: 380, grav: 200, life: 0.7 });
    FX.burst(this, x, y, 10, { colors: ['rgba(60,60,60,0.6)', 'rgba(90,90,90,0.5)'], size: 26, speed: 90, grav: -40, life: 1.4, shape: 'circle' });
    Sound.explosion(radius > 120);
    this.shake = Math.max(this.shake, 9);
    for (const e of this.enemies) if (e.alive && e.distTo(x, y) <= radius) e.damage(dmg, this, src);
  }

  // ---------- предметы ----------
  giveItem(key, n = 1, fx, fy) {
    let tx, ty;
    if (key === 'vest') {
      this.player.armor = Math.min(100, this.player.armor + 50);
      tx = 320;
      ty = 690;
    } else {
      this.inv[key] = (this.inv[key] || 0) + n;
      const i = HOTBAR.indexOf(key);
      const r = hotbarSlotRect(i);
      tx = r.x + r.w / 2;
      ty = r.y + r.h / 2;
      this.slotFlash[i] = 0.6;
    }
    Sound.pickup();
    if (fx !== undefined) this.flyers.push({ key, x0: fx, y0: fy, x1: tx, y1: ty, t: 0 });
    FX.text(this, tx, ty - 40, `+${n} ${ITEM_INFO[key].name}`, { color: '#fff', font: `bold 15px ${FONT.ui}`, life: 1.4, vy: -30 });
  }

  useItem(i) {
    if (this.state !== 'play') return;
    this.sel = i;
    const key = HOTBAR[i];
    const p = this.player;
    if (!this.inv[key]) {
      Sound.empty();
      FX.text(this, hotbarSlotRect(i).x + 23, 655, 'пусто', { color: '#bbb', font: `bold 14px ${FONT.ui}`, life: 0.8 });
      return;
    }
    let used = true;
    switch (key) {
      case 'steak':
        if (p.hunger >= 20) {
          FX.text(this, 640, 640, 'Ты не голоден', { color: '#ffe0b2', font: `bold 15px ${FONT.ui}` });
          used = false;
          break;
        }
        p.hunger = Math.min(20, p.hunger + 8);
        this.heal(1);
        Sound.eat();
        break;
      case 'gapple':
        this.heal(6);
        p.hunger = Math.min(20, p.hunger + 4);
        p.armor = Math.min(100, p.armor + 20);
        Sound.eat();
        FX.burst(this, 640, 600, 20, { colors: ['#ffd54a', '#fff6a8'], size: 5, speed: 200, grav: -50, life: 0.9 });
        break;
      case 'potion':
        if (p.hp >= p.maxHp) {
          FX.text(this, 640, 640, 'Здоровье и так полное', { color: '#f8bbd0', font: `bold 15px ${FONT.ui}` });
          used = false;
          break;
        }
        this.heal(10);
        Sound.drink();
        break;
      case 'tnt':
        this.tnts.push({ x0: 640, y0: 760, x1: Input.x, y1: Input.y, t: 0, dur: 0.45, fuse: 0.7, state: 'fly', gone: false });
        Sound.whoosh();
        break;
      case 'dice':
        if (this.dice) {
          used = false;
          break;
        }
        this.rollDice();
        break;
      case 'ammo':
        if (this.gun.reserve >= CFG.maxReserve) {
          FX.text(this, 640, 640, 'Патронов и так полно', { color: '#ffe0b2', font: `bold 15px ${FONT.ui}` });
          used = false;
          break;
        }
        this.gun.reserve = Math.min(CFG.maxReserve, this.gun.reserve + 90);
        Sound.reload();
        break;
      case 'ice':
        this.freezeAll(5);
        break;
      case 'pellet':
        used = this.pacPower();
        break;
      case 'totem':
        this.say('Тотем сработает сам, когда тебя попытаются убить.', '#f2c230');
        used = false;
        break;
    }
    if (used) {
      this.inv[key]--;
      this.slotFlash[i] = 0.4;
    }
  }

  heal(n) {
    const p = this.player;
    const before = p.hp;
    p.hp = Math.min(p.maxHp, p.hp + n);
    if (p.hp > before) FX.text(this, 540, 640, `+${Math.round(p.hp - before)} HP`, { color: '#ff8a80', font: `bold 16px ${FONT.ui}` });
  }

  freezeAll(sec) {
    for (const e of this.enemies) if (e.alive) e.frozen = sec;
    this.frostFx = 1;
    Sound.freeze();
    this.say(`Все враги заморожены на ${sec} сек.`, '#9fd4ff');
  }

  pacPower() {
    const counts = new Array(ROWS).fill(0);
    for (const e of this.enemies) {
      if (!e.alive) continue;
      if (e instanceof Snake) for (const s of e.segs) counts[clamp(s.r, 0, ROWS - 1)]++;
      else counts[clamp(toRow(e.y), 0, ROWS - 1)]++;
    }
    let row = PAWN_ROW, best = -1;
    for (let r = MF.r0; r <= PAWN_ROW; r++) if (counts[r] > best) {
      best = counts[r];
      row = r;
    }
    if (!this.pac.launch(row, true)) {
      this.say('Пак-Ман уже бежит!', '#ffe600');
      return false;
    }
    this.banner('ПАК-МАН НА ОХОТЕ!', `Съедает всё в ряду ${ROWS - row}`, '#ffe600');
    return true;
  }

  rollDice() {
    this.dice = { t: 0, dur: 1.1, face: randi(1, 6), shown: 1, swapT: 0, applied: false };
    Sound.dice();
  }

  updateDice(dt) {
    const d = this.dice;
    d.t += dt;
    if (d.t < d.dur) {
      d.swapT -= dt;
      if (d.swapT <= 0) {
        d.swapT = 0.07;
        d.shown = randi(1, 6);
      }
      return;
    }
    d.shown = d.face;
    if (!d.applied) {
      d.applied = true;
      this.applyDice(d.face);
    }
    if (d.t > d.dur + 1.3) this.dice = null;
  }

  applyDice(face) {
    switch (face) {
      case 1:
        this.bonusStars++;
        this.spawnEnemy(choice(['pawn', 'zombie']));
        this.spawnEnemy(choice(['cone', 'knight']));
        this.banner('1 — НЕУДАЧА!', 'Розыск повышен, враги прибыли', '#ff5252');
        break;
      case 2:
        this.gun.reserve = Math.min(CFG.maxReserve, this.gun.reserve + 90);
        this.banner('2 — ПАТРОНЫ', '+90 патронов к АК-47', '#ffd54a');
        break;
      case 3:
        this.heal(8);
        this.banner('3 — ЛЕЧЕНИЕ', '+8 HP', '#ff8a80');
        break;
      case 4:
        if (!this.pacPower()) {
          this.addMoney(500);
          this.banner('4 — БОНУС', 'Пак-Ман занят, держи $500', '#ffe600');
        }
        break;
      case 5:
        for (let i = 0; i < 3; i++) {
          const sx = rand(300, 980);
          this.missiles.push({ x0: sx, y0: -40, x1: 640 + rand(-80, 80), y1: rand(70, 130), t: -i * 0.25, dur: 0.8, dmg: 40, launched: false, bomb: true, x: sx, y: -40 });
        }
        this.banner('5 — АВИАУДАР!', 'Три бомбы летят в башню', '#40c4ff');
        break;
      case 6:
        this.freezeAll(6);
        this.addMoney(1000, 640, 360);
        this.banner('6 — ДЖЕКПОТ!', 'Заморозка + $1000', '#7ee03c');
        break;
    }
  }

  updateTNT(dt) {
    for (const tn of this.tnts) {
      if (tn.state === 'fly') {
        tn.t += dt / tn.dur;
        if (tn.t >= 1) {
          tn.t = 1;
          tn.state = 'fuse';
          Sound.thud();
        }
      } else {
        tn.fuse -= dt;
        if (tn.fuse <= 0) {
          tn.gone = true;
          this.explodeTNT(tn.x1, tn.y1);
        }
      }
    }
  }

  explodeTNT(x, y) {
    this.explode(x, y, T * 1.6, 15, 'tnt');
    if (this.mf.done) return;
    const cc = toCol(x) - MF.c0, cr = toRow(y) - MF.r0;
    if (!this.mf.inside(cc, cr)) return;
    if (!this.mf.generated) this.mf.generate(cc, cr);
    const opened = [];
    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {
        const c = cc + dc, r = cr + dr;
        const cell = this.mf.cell(c, r);
        if (!cell || cell.pop < 1 || (cell.s !== HIDDEN && cell.s !== FLAG)) continue;
        if (cell.mine) this.mf.detonate(c, r);
        else {
          cell.s = HIDDEN;
          opened.push(...this.mf.open(c, r).opened);
        }
      }
    }
    this.rewardTiles(opened);
    this.checkCleared();
  }

  updateMissiles(dt) {
    for (const m of this.missiles) {
      m.t += dt;
      if (m.t < 0) continue;
      if (!m.launched) {
        m.launched = true;
        Sound.missile();
        if (m.c !== undefined) this.mf.detonate(m.c, m.r);
      }
      const k = Math.min(1, m.t / m.dur);
      const px = m.x, py = m.y;
      m.x = lerp(m.x0, m.x1, k);
      m.y = lerp(m.y0, m.y1, k) - Math.sin(k * Math.PI) * (m.bomb ? 0 : 160);
      m.ang = Math.atan2(m.y - py, m.x - px);
      FX.burst(this, m.x, m.y, 1, { colors: ['rgba(200,200,200,0.6)'], size: 12, speed: 20, grav: -30, life: 0.5, shape: 'circle' });
      if (k >= 1) {
        m.gone = true;
        this.explosions.push({ x: m.x1, y: m.y1, r: 60, t: 0 });
        FX.burst(this, m.x1, m.y1, 14, { colors: ['#ffef8a', '#ff6d00', '#9a9dab'], size: 8, speed: 300, life: 0.6 });
        Sound.explosion(false);
        this.damageTower(m.dmg, true);
      }
    }
  }

  openAirdrop(a) {
    a.gone = true;
    const got = [];
    for (let i = 0; i < 3; i++) {
      let k = weighted(DROP_LOOT);
      if (k === 'totem' && this.inv.totem >= 2) k = 'gapple';
      got.push(k);
      this.giveItem(k, 1, a.x + (i - 1) * 30, a.y);
    }
    this.say('Аирдроп: ' + got.map((k) => ITEM_INFO[k].name).join(', '), '#9ccc65');
    FX.burst(this, a.x, a.y, 20, { colors: ['#b3261e', '#e8e8e8', '#2f62c9'], size: 8, speed: 260, up: 150 });
  }

  // ---------- игрок ----------
  updateBoost(realDt) {
    const p = this.player;
    const want = Input.keys.has('ShiftLeft') || Input.keys.has('ShiftRight');
    if (want && !this.boostLock && p.boost > 0 && !this.jumpscare) {
      if (!this.slowmo) Sound.whoosh();
      this.slowmo = true;
      p.boost = Math.max(0, p.boost - 28 * realDt);
      if (p.boost <= 0) this.boostLock = true;
      this.boostIdle = 0;
    } else {
      this.slowmo = false;
      this.boostIdle += realDt;
      if (this.boostIdle > 1) p.boost = Math.min(100, p.boost + 6 * realDt);
      if (!want) this.boostLock = false;
    }
    this.timeScale = lerp(this.timeScale, this.slowmo ? 0.35 : 1, Math.min(1, realDt * 10));
  }

  updatePlayer(dt) {
    const p = this.player;
    p.hungerT += dt;
    if (p.hungerT >= CFG.hungerTick) {
      p.hungerT = 0;
      p.hunger = Math.max(0, p.hunger - 1);
      if (p.hunger === 6) this.say('Ты проголодался. Съешь стейк (1).', '#ffcc80');
    }
    if (p.hunger >= 16 && p.hp < p.maxHp) {
      p.regenT += dt;
      if (p.regenT >= 4) {
        p.regenT = 0;
        p.hp = Math.min(p.maxHp, p.hp + 1);
        p.hunger = Math.max(0, p.hunger - 0.5);
      }
    } else p.regenT = 0;
    if (p.hunger <= 0) {
      p.starveT += dt;
      if (p.starveT >= 4) {
        p.starveT = 0;
        if (p.hp > 1) {
          p.hp -= 1;
          this.hurtFlash = 0.3;
          Sound.hurt();
        }
      }
    } else p.starveT = 0;
  }

  takeDamage(d, src) {
    if (this.state !== 'play') return;
    const p = this.player;
    const absorb = Math.min(d * 0.5, p.armor / 5);
    p.armor -= absorb * 5;
    p.hp -= d - absorb;
    this.hurtFlash = 0.5;
    this.heartShake = 0.5;
    this.shake = Math.max(this.shake, 10);
    Sound.hurt();
    if (Math.random() < 0.4) this.kingEmote(choice(['Хе-хе-хе!', 'Ха-ха!', 'Получай!']));
    if (p.hp <= 0) {
      if (this.inv.totem > 0) {
        this.inv.totem--;
        p.hp = 10;
        this.totemFx = 1.8;
        Sound.totem();
        this.banner('ТОТЕМ БЕССМЕРТИЯ!', 'Ты спасён. Враги у ворот сметены', '#f2c230');
        for (const e of this.enemies) if (e.alive && e.y > 5 * T) e.damage(999, this, 'totem');
        FX.burst(this, 640, 400, 60, { colors: ['#f2c230', '#2fa84f', '#fff6a8'], size: 7, speed: 420, grav: 100, life: 1.4 });
      } else {
        this.die(src);
      }
    }
  }

  die(src) {
    this.state = 'dead';
    this.deadT = 0;
    this.deathCause = src;
    this.smiley = 'dead';
    Input.lmb = false;
    Sound.wasted();
    this.saveBest();
  }

  win() {
    this.state = 'win';
    this.winT = 0;
    this.player.money += 10000;
    Input.lmb = false;
    Sound.win();
    this.saveBest();
  }

  addMoney(n, x, y, color = '#7ee05a') {
    this.player.money += n;
    if (x !== undefined) FX.text(this, x, y, `+$${n}`, { color, font: `22px ${FONT.gta}` });
    Sound.coin();
  }

  xpNeed() {
    return 10 + this.player.level * 6;
  }

  addXp(n) {
    const p = this.player;
    p.xp += n;
    while (p.xp >= this.xpNeed()) {
      p.xp -= this.xpNeed();
      p.level++;
      Sound.levelUp();
      this.heal(2);
      this.say(`Новый уровень: ${p.level}! Скорострельность +3%`, '#80ff20');
    }
  }

  onKill(e, src) {
    this.kills++;
    if (src !== 'pac') this.addMoney(e.def.bounty, e.x, e.y - 50);
    this.addXp(e.def.xp);
    Sound.xp();
    FX.burst(this, e.x, e.y, 5, { colors: ['#b6ff3c', '#7ee03c'], size: 5, speed: 160, grav: -200, life: 0.8, shape: 'circle' });
    if (e instanceof Snake) {
      for (const s of e.segs) FX.burst(this, colX(s.c), rowY(s.r), 8, { colors: ['#4a7cf0', '#27479f', '#9bb8ff'], size: 9, speed: 240 });
    } else if (e.type === 'freddy') {
      this.staticFx = 0.3;
      Sound.staticNoise();
      this.say('Золотой Фредди растворился в помехах...', '#ffd54a');
    } else {
      const colors = e.type === 'zombie' || e.type === 'cone' ? ['#7fa35c', '#6d4c2f', '#b9c9a5'] : ['#222', '#444', '#777'];
      FX.burst(this, e.x, e.y, 12, { colors, size: 7, speed: 240, up: 100 });
    }
    if ((e.type === 'zombie' || e.type === 'cone') && Math.random() < 0.3) this.items.push(new Loot('sun', null, e.x, e.y - 30, e.y, 120));
    else if (Math.random() < 0.06) this.items.push(new Loot('item', weighted(TILE_LOOT.filter(([k]) => k !== 'sun')), e.x, e.y - 30, e.y, 120));
  }

  // ---------- защитники ----------
  plant(c) {
    const type = this.packet, cost = DEF_STATS[type].cost;
    if (this.sun < cost) {
      FX.text(this, colX(c), rowY(PAWN_ROW) - 46, `Нужно ${cost} ☀`, { color: '#ffd54a', font: `bold 16px ${FONT.ui}` });
      Sound.empty();
      return;
    }
    this.sun -= cost;
    this.def[c] = makeDefender(type);
    Sound.plant();
    FX.burst(this, colX(c), rowY(PAWN_ROW) + 30, 10, { colors: ['#8d6e63', '#5d4037', '#a5d6a7'], size: 5, speed: 160, up: 120, life: 0.5 });
  }

  killDefender(c, by) {
    const d = this.def[c];
    if (!d) return;
    this.def[c] = null;
    FX.burst(this, colX(c), rowY(PAWN_ROW), 14, { colors: ['#fff', '#ddd', '#999'], size: 7, speed: 240, up: 120 });
    Sound.capture();
    if (Math.random() < 0.35) this.say(`Белая ${DEF_STATS[d.type].name.toLowerCase()} потеряна. ПКМ по пустой клетке — посадить новую.`, '#e0e0e0');
  }

  updateDefenders(dt) {
    for (let c = 1; c < COLS; c++) {
      const d = this.def[c];
      if (!d) continue;
      d.pop = Math.min(1, d.pop + dt * 3);
      d.lunge = Math.max(0, d.lunge - dt * 4);
      if (d.hurt > 0) d.hurt -= dt;
      if (d.type === 'rook') continue;
      d.cd -= dt;
      if (d.cd > 0) continue;
      if (d.type === 'pawn') {
        const target = this.enemies.find((e) => e.alive && Math.abs(e.col - c) === 1 && e.y > 6 * T + 10 && e.y < 8 * T + 10);
        if (target) {
          d.cd = DEF_STATS.pawn.cd;
          d.lunge = 1;
          d.lungeDir = Math.sign(target.x - colX(c));
          target.damage(2, this, 'pawn');
          Sound.tok();
        } else d.cd = 0.15;
      } else if (d.type === 'bishop') {
        let best = null, bdy = 99;
        for (const e of this.enemies) {
          if (!e.alive) continue;
          const dy = (rowY(PAWN_ROW) - e.y) / T;
          if (dy < 0.3 || dy > 5.5) continue;
          const dx = Math.abs(e.x - colX(c)) / T;
          if (Math.abs(dx - dy) < 0.5 && dy < bdy) {
            best = e;
            bdy = dy;
          }
        }
        if (best) {
          d.cd = DEF_STATS.bishop.cd;
          best.damage(2, this, 'bishop');
          this.beams.push({ x1: colX(c), y1: rowY(PAWN_ROW) - 30, x2: best.x, y2: best.y, t: 0 });
          Sound.zap();
        } else d.cd = 0.15;
      }
    }
  }

  enemyReached(e) {
    if (!e.alive) return;
    e.remove = true;
    const dmg = e.def.dmg + (e.type === 'pawn' ? 1 : 0);
    FX.text(this, clamp(e.x, 60, W - 60), 610, `−${dmg} HP`, { color: '#ff5252', font: `bold 24px ${FONT.gta}` });
    this.say(`${e.def.name} прорвался и ударил тебя!`, '#ff8a80');
    this.takeDamage(dmg, e.def.name);
  }

  startJumpscare(f) {
    f.remove = true;
    if (this.jumpscare || this.state !== 'play') return;
    this.jumpscare = { t: 0 };
    Sound.jumpscare();
  }

  // ---------- волны врагов ----------
  updateDirector(dt) {
    const target = clamp(1 + Math.floor(this.t / CFG.starEvery) + this.bonusStars, 1, 6);
    if (target > this.stars) {
      this.stars = target;
      this.starFlash = 2.5;
      Sound.star();
      this.say(`Уровень розыска: ${'★'.repeat(this.stars)}`, '#ffd23f');
    }
    const alive = this.enemies.filter((e) => e.alive).length;
    this.spawnT -= dt;
    if (this.spawnT <= 0) {
      const interval = Math.max(1.9, 4.6 - 0.5 * (this.stars - 1)) * (this.tower.hp < this.tower.max * 0.5 ? 0.9 : 1);
      this.spawnT = interval * rand(0.75, 1.25);
      if (alive < 4 + this.stars * 2 && !this.tower.dead) this.spawnEnemy(this.pickEnemy());
    }
    if (this.isFnafTime) {
      this.freddyT -= dt;
      if (this.freddyT <= 0) {
        this.freddyT = rand(9, 15);
        const n = this.enemies.filter((e) => e.alive && e.type === 'freddy').length;
        if (n < (this.stars >= 5 ? 2 : 1)) this.spawnEnemy('freddy');
      }
    }
    if (!this.isNight) {
      this.sunT -= dt;
      if (this.sunT <= 0) {
        this.sunT = rand(7, 11);
        this.items.push(new Loot('sun', null, rand(140, 1140), -30, rand(220, 540), 60));
      }
    }
    this.dropT -= dt;
    if (this.dropT <= 0) {
      this.dropT = rand(CFG.dropEvery[0], CFG.dropEvery[1]);
      this.airdrops.push(new Airdrop());
      Sound.plane();
      this.say('Сброс груза! Подцепи ящик удочкой (ПКМ).', '#9ccc65');
    }
  }

  pickEnemy() {
    const s = this.stars;
    const list = [['pawn', 5], ['zombie', 4]];
    if (s >= 2) list.push(['cone', 3], ['knight', 2]);
    if (s >= 3 && !this.enemies.some((e) => e.alive && e.type === 'snake')) list.push(['snake', 0.8]);
    if (s >= 4) list.push(['rook', 1.6]);
    if (s >= 5) list.push(['bishop', 1.6]);
    return weighted(list);
  }

  spawnEnemy(type) {
    const c = randi(0, COLS - 1);
    let e;
    switch (type) {
      case 'pawn':
      case 'knight':
      case 'rook':
      case 'bishop':
        e = new ChessEnemy(type, c, MF.r0);
        break;
      case 'zombie':
      case 'cone':
        e = new Zombie(type, c);
        break;
      case 'freddy':
        e = new Freddy(randi(1, COLS - 2), randi(MF.r0, MF.r0 + 1));
        break;
      case 'snake':
        e = new Snake(Math.random() < 0.5);
        this.say('Змейка выползла на доску! Она ест предметы и растёт.', '#9bb8ff');
        break;
      default:
        return null;
    }
    this.enemies.push(e);
    if (type !== 'snake') FX.burst(this, e.x, e.y + 20, 8, { colors: ['rgba(60,60,60,0.55)'], size: 18, speed: 60, grav: -20, life: 0.8, shape: 'circle' });
    return e;
  }

  // ---------- башня ----------
  updateTower(dt) {
    const tw = this.tower;
    if (tw.fire > 0) tw.fire -= dt;
    if (tw.laugh > 0) tw.laugh -= dt;
    if (tw.emoteT > 0) tw.emoteT -= dt;
    if (tw.dead) {
      tw.deadT += dt;
      tw.boomT -= dt;
      if (tw.boomT <= 0 && tw.deadT < 2) {
        tw.boomT = 0.16;
        const x = 640 + rand(-120, 120), y = rand(20, 150);
        this.explosions.push({ x, y, r: 70, t: 0 });
        FX.burst(this, x, y, 12, { colors: ['#ffef8a', '#ff6d00', '#9a9dab', '#555'], size: 9, speed: 320, life: 0.8 });
        Sound.explosion(false);
        this.shake = Math.max(this.shake, 8);
      }
      if (tw.deadT > 2.4) this.win();
      return;
    }
    tw.cannonT -= dt;
    if (tw.cannonT <= 0) {
      const ratio = tw.hp / tw.max;
      tw.cannonT = Math.max(4.0, 8.5 - this.stars * 0.5 - (1 - ratio) * 2) * rand(0.85, 1.15);
      this.cannonballs.push(new Cannonball(rand(220, 1060), rand(230, 560)));
      tw.fire = 0.3;
      Sound.cannon();
      FX.burst(this, 640, 100, 8, { colors: ['rgba(80,80,80,0.6)'], size: 20, speed: 80, grav: -30, life: 0.8, shape: 'circle' });
    }
  }

  damageTower(n, big) {
    const tw = this.tower;
    if (tw.dead) return;
    tw.hp = Math.max(0, tw.hp - n);
    tw.hit = big ? 0.3 : 0.06;
    if (big) FX.text(this, 640 + rand(-60, 60), 120, `−${n}`, { color: '#ff5252', font: `30px ${FONT.gta}` });
    const ratio = tw.hp / tw.max;
    if (tw.phase === 0 && ratio <= 0.66) {
      tw.phase = 1;
      this.towerRage();
    } else if (tw.phase === 1 && ratio <= 0.33) {
      tw.phase = 2;
      this.towerRage();
    }
    if (tw.hp <= 0) {
      tw.dead = true;
      tw.deadT = 0;
      this.banner('БАШНЯ ПАЛА!', 'Король повержен', '#ffd54a');
      Sound.explosion(true);
      for (const c of this.cannonballs) c.gone = true;
      for (const e of this.enemies) if (e.alive) e.damage(999, this, 'tower');
    }
  }

  towerRage() {
    this.banner('КОРОЛЬ В ЯРОСТИ!', 'Из башни лезут подкрепления', '#ff5252');
    this.kingEmote('Ррраааа!');
    this.bonusStars++;
    for (let i = 0; i < 4; i++) this.spawnEnemy(choice(['pawn', 'zombie', 'cone', 'knight']));
    if (!this.enemies.some((e) => e.alive && e.type === 'snake')) this.spawnEnemy('snake');
  }

  kingEmote(str) {
    const tw = this.tower;
    if (tw.dead) return;
    tw.emote = str;
    tw.emoteT = 2.2;
    tw.laugh = 1.2;
    this.say(`<Король> ${str}`, '#ff8a65');
  }

  updateCannonballs(dt) {
    for (const cb of this.cannonballs) {
      if (cb.gone) continue;
      cb.t += dt;
      if (cb.t >= cb.dur) {
        cb.gone = true;
        this.cracks.push(makeCrack(cb.tx, cb.ty));
        this.shake = 16;
        Sound.explosion(false);
        FX.burst(this, cb.tx, cb.ty, 18, { colors: ['#e0f7fa', '#b2ebf2', '#fff'], size: 6, speed: 360, grav: 600, life: 0.6 });
        this.takeDamage(CFG.cannonDamage, 'ядро короля');
      }
    }
  }

  // ---------- время суток ----------
  get hours() {
    return (this.clock / 60) % 24;
  }
  get isNight() {
    const h = this.hours;
    return h >= 21 || h < 6;
  }
  get isFnafTime() {
    return this.hours < 6;
  }
  get darkness() {
    const h = this.hours;
    if (h >= 21) return ((h - 21) / 3) * 0.78;
    if (h < 5) return 0.78;
    if (h < 6) return (6 - h) * 0.78;
    return 0;
  }

  updateClock(dt) {
    const prev = this.hours;
    this.clock += dt * CFG.dayMinutesPerSec;
    const h = this.hours;
    if (prev > 23 && h < 1) {
      this.nights++;
      this.banner('12 AM', `Ночь ${this.nights}. Золотой Фредди проснулся...`, '#ffffff');
      Sound.midnight();
      this.staticFx = 0.6;
      this.freddyT = 3;
    }
    if (prev < 6 && h >= 6) {
      this.banner('6 AM', 'Ты пережил ночь! +$2000', '#7ee03c');
      Sound.chime6am();
      this.addMoney(2000);
      for (const e of this.enemies) if (e.alive && e.type === 'freddy') e.remove = true;
    }
    if (prev < 21 && h >= 21) this.say('Темнеет. В полночь просыпается кое-кто золотой...', '#b39ddb');
  }

  // ---------- сообщения ----------
  say(str, color = '#fff') {
    this.chat.push({ text: str, color, t: 0 });
    if (this.chat.length > 5) this.chat.shift();
  }
  banner(title, sub, color = '#ffd54a') {
    this.bannerObj = { title, sub, color, t: 0, dur: 2.8 };
  }
}

function makeCrack(x, y) {
  const lines = [];
  const n = randi(7, 11);
  for (let i = 0; i < n; i++) {
    let a = (i / n) * TAU + rand(-0.2, 0.2);
    let px = x, py = y;
    const pts = [[px, py]];
    const segs = randi(3, 5);
    for (let s = 0; s < segs; s++) {
      a += rand(-0.4, 0.4);
      const len = rand(25, 70);
      px += Math.cos(a) * len;
      py += Math.sin(a) * len;
      pts.push([px, py]);
    }
    lines.push(pts);
  }
  return { x, y, lines, t: 0 };
}

// ---- js/render.js ----
'use strict';
/* Отрисовка кадра: мир → ночь → руки → эффекты → интерфейс → экраны. */

const nightCanvas = document.createElement('canvas');
let nightCtx = null;

function render(ctx, g) {
  const now = performance.now() / 1000;
  const wt = g.state === 'title' ? g.titleT : g.t;
  ctx.setTransform(View.k, 0, 0, View.k, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.filter = 'none';
  ctx.fillStyle = '#0d1208';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  if (g.shake > 0 && g.state !== 'title') ctx.translate(rand(-1, 1) * g.shake, rand(-1, 1) * g.shake);
  drawWorld(ctx, g, wt, now);
  drawNight(ctx, g);
  if (g.state !== 'title') drawHands(ctx, g, now);
  ctx.restore();

  if (g.state !== 'title') {
    drawScreenFx(ctx, g, now);
    drawHUD(ctx, g, now);
  }
  g.buttons = [];
  if (g.state === 'title') drawTitle(ctx, g, now);
  else if (g.state === 'pause') drawPause(ctx, g, now);
  else if (g.state === 'dead') drawDead(ctx, g, now);
  else if (g.state === 'win') drawWin(ctx, g, now);
  if (g.jumpscare) drawJumpscare(ctx, g, now);
  if (g.state === 'play' && !g.jumpscare) drawCrosshair(ctx, g, now);
  else if (!g.jumpscare && !Input.touch) drawPointer(ctx);
}

// ---------- мир ----------
function drawWorld(ctx, g, t, now) {
  ctx.drawImage(Board.get(View), 0, 0, W, H);
  const hover = g.state === 'play' ? g.mf.at(Input.x, Input.y) : null;
  g.mf.draw(ctx, hover, t);

  for (const d of g.decals) {
    ctx.globalAlpha = Math.min(1, d.life);
    circ(ctx, d.x, d.y, 4.5, 'rgba(60,50,40,0.5)');
    circ(ctx, d.x, d.y, 2.5, 'rgba(10,10,10,0.85)');
  }
  ctx.globalAlpha = 1;

  if (g.state === 'title') drawTitleCast(ctx, t);

  for (const it of g.items) if (!it.falling) it.draw(ctx);
  for (let c = 1; c < COLS; c++) if (g.def[c]) drawDefender(ctx, g.def[c], c, t);
  g.pac.draw(ctx, t);
  for (const a of g.airdrops) if (a.state === 'land') a.draw(ctx);

  const es = g.enemies.slice().sort((a, b) => a.y - b.y);
  for (const e of es) e.draw(ctx, t);

  drawTowerState(ctx, g, t);

  for (const b of g.beams) {
    const a = 1 - b.t / 0.22;
    line(ctx, b.x1, b.y1, b.x2, b.y2, `rgba(255,248,200,${a * 0.5})`, 12);
    line(ctx, b.x1, b.y1, b.x2, b.y2, `rgba(255,255,255,${a})`, 4);
  }
  for (const it of g.items) if (it.falling) it.draw(ctx);
  for (const a of g.airdrops) if (a.state === 'fall') a.draw(ctx);

  for (const tn of g.tnts) {
    const k = tn.state === 'fly' ? tn.t : 1;
    const x = lerp(tn.x0, tn.x1, k), y = lerp(tn.y0, tn.y1, k) - Math.sin(k * Math.PI) * 220;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(tn.state === 'fly' ? k * 9 : 0);
    drawTNT(ctx, 0, 0, 36);
    if (tn.state === 'fuse' && Math.floor(tn.fuse * 12) % 2 === 0) {
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.fillRect(-18, -18, 36, 36);
    }
    ctx.restore();
  }

  for (const m of g.missiles) {
    if (m.t < 0) continue;
    if (m.bomb) {
      ctx.save();
      ctx.translate(m.x, m.y);
      ctx.rotate((m.ang || 0) - Math.PI / 2);
      ell(ctx, 0, 0, 9, 16, '#263238');
      poly(ctx, [-9, -12, 9, -12, 0, -22], '#455a64');
      ctx.restore();
    } else {
      circ(ctx, m.x, m.y, 18, 'rgba(255,140,40,0.35)');
      drawMine(ctx, m.x, m.y, 12);
    }
  }

  for (const ex of g.explosions) {
    const k = ex.t / 0.55;
    const r = ex.r * (0.35 + k * 0.75);
    const gr = ctx.createRadialGradient(ex.x, ex.y, 0, ex.x, ex.y, r);
    gr.addColorStop(0, `rgba(255,250,210,${1 - k})`);
    gr.addColorStop(0.4, `rgba(255,170,30,${0.9 * (1 - k)})`);
    gr.addColorStop(1, 'rgba(200,60,0,0)');
    circ(ctx, ex.x, ex.y, r, gr);
    ctx.beginPath();
    ctx.arc(ex.x, ex.y, ex.r * k * 1.25, 0, TAU);
    ctx.strokeStyle = `rgba(255,255,255,${0.6 * (1 - k)})`;
    ctx.lineWidth = 4;
    ctx.stroke();
  }

  for (const p of g.particles) {
    ctx.globalAlpha = Math.min(1, (p.life / p.max) * 1.6);
    ctx.fillStyle = p.color;
    if (p.shape === 'circle') {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * (1.4 - (p.life / p.max) * 0.4), 0, TAU);
      ctx.fill();
    } else {
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
  }
  ctx.globalAlpha = 1;

  for (const cb of g.cannonballs) cb.draw(ctx);

  for (const tx of g.texts) {
    ctx.globalAlpha = Math.min(1, (tx.life / tx.max) * 2);
    text(ctx, tx.str, tx.x, tx.y, { font: tx.font, color: tx.color, stroke: tx.stroke, lw: 4, align: 'center' });
  }
  ctx.globalAlpha = 1;
}

function drawTowerState(ctx, g, t) {
  const tw = g.tower;
  if (!tw.dead || tw.deadT < 1.6) {
    ctx.save();
    if (tw.dead) {
      ctx.globalAlpha = Math.max(0, 1 - tw.deadT / 1.6);
      ctx.translate(0, tw.deadT * 30);
    }
    drawTower(ctx, 640, t, {
      hpRatio: tw.hp / tw.max,
      hp: tw.hp,
      hit: Math.max(0, tw.hit),
      rage: tw.phase > 0 ? 1 : 0,
      fire: Math.max(0, tw.fire),
      laugh: tw.laugh,
    });
    ctx.restore();
  }
  if (tw.dead) {
    // руины
    const k = Math.min(1, tw.deadT / 1.2);
    ctx.globalAlpha = k;
    for (let i = 0; i < 14; i++) {
      const x = 640 - 120 + ((i * 53) % 240), y = 120 + ((i * 37) % 40);
      ell(ctx, x, y, 22 + (i % 3) * 6, 14 + (i % 2) * 5, i % 2 ? '#8e919f' : '#6f7282');
    }
    drawCrown(ctx, 700, 140, 1.6);
    ctx.globalAlpha = 1;
  }
  if (tw.emoteT > 0 && !tw.dead) {
    const a = Math.min(1, tw.emoteT * 3);
    ctx.globalAlpha = a;
    ctx.font = `bold 17px ${FONT.ui}`;
    const w = ctx.measureText(tw.emote).width + 24;
    rr(ctx, 752, 14, w, 36, 12);
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#1b2b5a';
    ctx.stroke();
    poly(ctx, [756, 38, 736, 54, 770, 44], '#fff');
    text(ctx, tw.emote, 752 + w / 2, 38, { font: `bold 17px ${FONT.ui}`, color: '#1b2b5a', align: 'center' });
    ctx.globalAlpha = 1;
  }
}

// Персонажи на заставке, как на той самой картинке.
function drawTitleCast(ctx, t) {
  drawFreddy(ctx, 870, 285, t, { glow: true });
  drawZombie(ctx, 1020, 330, t, { cone: true, walking: true });
  drawSnake(ctx, [{ x: 1180, y: 440 }, { x: 1180, y: 520 }, { x: 1100, y: 520 }, { x: 1020, y: 520 }], 0, -1, t);
  drawAirdrop(ctx, 190, 300 + Math.sin(t) * 10, t, false);
  drawSun(ctx, 470, 470, 22, t);
  drawDice(ctx, 260, 470, 42, 5, -0.3);
}

function lightAt(n, x, y, r, a) {
  const g = n.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(0,0,0,${a})`);
  g.addColorStop(0.6, `rgba(0,0,0,${a * 0.6})`);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  n.fillStyle = g;
  n.fillRect(x - r, y - r, r * 2, r * 2);
}

// Ночь: темнота с «фонариком» вокруг прицела.
function drawNight(ctx, g) {
  const dark = g.state === 'title' ? 0 : g.darkness;
  if (dark <= 0.01) return;
  if (nightCanvas.width !== View.pw || nightCanvas.height !== View.ph || !nightCtx) {
    nightCanvas.width = View.pw;
    nightCanvas.height = View.ph;
    nightCtx = nightCanvas.getContext('2d');
  }
  const n = nightCtx;
  n.setTransform(View.k, 0, 0, View.k, 0, 0);
  n.globalCompositeOperation = 'source-over';
  n.clearRect(0, 0, W, H);
  const a = Math.max(0, dark - (g.gun.flash > 0 ? 0.2 : 0));
  n.fillStyle = `rgba(6,8,26,${a})`;
  n.fillRect(0, 0, W, H);
  n.globalCompositeOperation = 'destination-out';
  lightAt(n, Input.x, Input.y, 190, 1);
  lightAt(n, 640, 70, 150, 0.6);
  for (const ex of g.explosions) lightAt(n, ex.x, ex.y, ex.r * 2.2, 1 - ex.t / 0.55);
  for (const it of g.items) if (it.kind === 'sun') lightAt(n, it.x, it.y, 70, 0.9);
  for (const cb of g.cannonballs) {
    const p = cb.pos;
    lightAt(n, p.x, p.y, 40 + p.s * 30, 0.8);
  }
  n.globalCompositeOperation = 'source-over';
  ctx.drawImage(nightCanvas, 0, 0, W, H);
}

// ---------- руки: удочка и АК ----------
function drawHands(ctx, g, now) {
  const rod = g.rod;
  const tip = g.rodTip();
  let bx, by, sag = 0;
  if (rod.state === 'idle') {
    bx = tip.x + Math.sin(now * 1.7) * 5;
    by = tip.y + 110 + Math.sin(now * 2.3) * 4;
  } else if (rod.state === 'out') {
    const k = rod.t;
    bx = lerp(tip.x, rod.tx, k);
    by = lerp(tip.y, rod.ty, k) - Math.sin(k * Math.PI) * 80;
  } else {
    const k = easeInOut(rod.t);
    bx = lerp(rod.tx, tip.x, k);
    by = lerp(rod.ty, tip.y + 110, k);
    sag = 25;
  }
  drawRod(ctx, { tipX: tip.x, tipY: tip.y, bx, by, sag });
  if (rod.carry && rod.state === 'back') {
    if (rod.carry === 'crate') {
      ctx.save();
      ctx.translate(bx, by + 18);
      ctx.scale(0.5, 0.5);
      drawAirdrop(ctx, 0, 0, 0, true);
      ctx.restore();
    } else drawItemIcon(ctx, rod.carry, bx, by + 16, 30, now);
  }

  for (const tr of g.tracers) {
    line(ctx, tr.x1, tr.y1, tr.x2, tr.y2, `rgba(255,230,150,${0.8 * (1 - tr.t / 0.07)})`, 2);
  }
  const pose = g.gunPose();
  ctx.save();
  ctx.globalAlpha = g.gunAlpha;
  ctx.translate(pose.px, pose.py);
  ctx.rotate(pose.rot);
  ctx.scale(pose.s, pose.s);
  drawAK(ctx, g.gun.flash);
  ctx.restore();
  if (g.gun.punch > 0) {
    const k = g.gun.punch / 0.4;
    drawFist(ctx, Input.x + 10, Input.y + 20 + k * 50, 2.2 - k * 0.8, '#1f1f22');
  }
}

// ---------- экранные эффекты ----------
function vignette(ctx, color, alpha, inner = 260) {
  const g = ctx.createRadialGradient(W / 2, H / 2, inner, W / 2, H / 2, 780);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, color.replace('A', alpha));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function drawScreenFx(ctx, g, now) {
  if (g.timeScale < 0.95) {
    const k = (1 - g.timeScale) / 0.65;
    ctx.fillStyle = `rgba(70,130,255,${0.1 * k})`;
    ctx.fillRect(0, 0, W, H);
    vignette(ctx, 'rgba(10,20,70,A)', 0.55 * k);
  }
  if (g.frostFx > 0) vignette(ctx, 'rgba(200,240,255,A)', 0.8 * g.frostFx, 200);
  if (g.hurtFlash > 0) vignette(ctx, 'rgba(220,0,0,A)', Math.min(0.8, g.hurtFlash * 1.6), 160);
  for (const c of g.cracks) {
    const a = Math.min(1, (2.6 - c.t) / 0.8);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.lineJoin = 'round';
    for (const pts of c.lines) {
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (const [x, y] of pts) ctx.lineTo(x, y);
      ctx.strokeStyle = 'rgba(0,0,0,0.45)';
      ctx.lineWidth = 4;
      ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.9)';
      ctx.lineWidth = 1.6;
      ctx.stroke();
    }
    circ(ctx, c.x, c.y, 14, 'rgba(255,255,255,0.25)');
    ctx.restore();
  }
  if (g.staticFx > 0) {
    ctx.save();
    ctx.globalAlpha = Math.min(0.6, g.staticFx * 2);
    for (let i = 0; i < 70; i++) {
      const v = Math.floor(rand(60, 255));
      ctx.fillStyle = `rgb(${v},${v},${v})`;
      ctx.fillRect(0, rand(0, H), W, rand(1, 4));
    }
    ctx.restore();
  }
  if (g.totemFx > 0) {
    const k = 1 - g.totemFx / 1.8;
    ctx.save();
    ctx.globalAlpha = Math.min(1, g.totemFx);
    const s = 8 + k * 10;
    drawPixel(ctx, PIX.totem, 640 - 6 * s, 340 - 6 * s - k * 80, s);
    ctx.restore();
  }
}

function drawHUD(ctx, g, now) {
  drawGtaHud(ctx, g, now);
  drawPvzBank(ctx, g, now);
  drawMinesPanel(ctx, g);
  drawMinecraftHud(ctx, g, now);
  drawPubgBars(ctx, g);

  drawChat(ctx, g);
  drawBanner(ctx, g);
  if (g.dice) {
    const d = g.dice;
    const rot = d.t < d.dur ? d.t * 14 : 0;
    const sc = d.t < d.dur ? 1 : 1 + Math.sin(Math.min(1, (d.t - d.dur) * 4) * Math.PI) * 0.25;
    ell(ctx, 640, 455, 50, 10, 'rgba(0,0,0,0.3)');
    drawDice(ctx, 640, 400, 90 * sc, d.shown, rot);

    drawItemIcon(ctx, f.key, lerp(f.x0, f.x1, k), lerp(f.y0, f.y1, k) - Math.sin(k * Math.PI) * 90, 30, now);
  }
}

  poly(ctx, [-20, 2, -10, 2, -14, 22, -24, 20], '#7a3a16');

function drawGtaHud(ctx, g, now) {
  const p = g.player, gun = g.gun;
  rr(ctx, 10, 10, 76, 76, 12);
  const wg = ctx.createRadialGradient(48, 44, 5, 48, 48, 50);
  wg.addColorStop(0, '#ffffff');
  wg.addColorStop(1, '#cfcfcf');
  ctx.fillStyle = wg;
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = '#111';
  ctx.stroke();
  if (gun.mag + gun.reserve === 0) drawFist(ctx, 48, 46, 1.2, '#1a1a1a');
  else {
    drawAkIcon(ctx, 50, 40, 0.62);
    text(ctx, `${gun.mag}-${gun.reserve}`, 48, 78, { font: `bold 12px ${FONT.ui}`, color: '#111', align: 'center' });
  }
  const hh = Math.floor(g.hours), mm = Math.floor(g.clock % 60);
  text(ctx, `${pad(hh, 2)}:${pad(mm, 2)}`, 98, 40, { font: `32px ${FONT.gta}`, color: '#e8e8e8', stroke: '#000', lw: 6 });

  ctx.fillStyle = '#000';
  ctx.fillRect(96, 48, 196, 16);
  ctx.fillStyle = '#4d0a0a';
  ctx.fillRect(98, 50, 192, 12);

    ctx.fillStyle = '#d6201f';
    ctx.fillRect(98, 50, 192 * ratio, 12);
    ctx.fillStyle = 'rgba(255,255,255,0.2)';

  for (let i = 0; i < 6; i++) {
    const on = i < g.stars;
    const blink = g.starFlash > 0 && i === g.stars - 1 && Math.floor(now * 8) % 2 === 0;
    drawStar(ctx, 24 + i * 28, 148, 12, on ? (blink ? '#ffffff' : '#ffd23f') : 'rgba(40,40,40,0.35)', on ? '#4a3500' : 'rgba(0,0,0,0.45)');

function drawMinecraftHud(ctx, g, now) {
  const p = g.player;
  const hb = LAYOUT.hotbar;
  const S = hb.slot;
  const x0 = hb.x;
  const ps = 2.5;
  const low = p.hp <= 4;
  for (let i = 0; i < 10; i++) {
    let hx = x0 + i * 19, hy = 649;
    if (g.heartShake > 0 || low) hy += Math.round(rand(-1.5, 1.5));
    drawPixel(ctx, PIX.heartEmpty, hx, hy, ps);
    if (p.hp >= (i + 1) * 2) drawPixel(ctx, PIX.heart, hx, hy, ps);
    else if (p.hp >= i * 2 + 1) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(hx, hy, 3.5 * ps, 8 * ps);
      ctx.clip();
      drawPixel(ctx, PIX.heart, hx, hy, ps);
      ctx.restore();
    }
  }
  for (let i = 0; i < 10; i++) {
    const fx = x0 + 9 * S - (i + 1) * 19 + 1, fy = 649;
    drawPixel(ctx, PIX.foodEmpty, fx, fy, ps);
    if (p.hunger >= (i + 1) * 2) drawPixel(ctx, PIX.food, fx, fy, ps);
    else if (p.hunger >= i * 2 + 1) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(fx + 3.5 * ps, fy, 4 * ps, 8 * ps);
      ctx.clip();
      drawPixel(ctx, PIX.food, fx, fy, ps);
      ctx.restore();
    }
  }
  ctx.fillStyle = '#111';
  ctx.fillRect(x0, 668, 9 * S, 5);
  ctx.fillStyle = '#7ee03c';
  ctx.fillRect(x0, 668, 9 * S * clamp(p.xp / g.xpNeed(), 0, 1), 5);
  if (p.level > 0) text(ctx, String(p.level), 640, 668, { font: `11px ${FONT.pixel}`, color: '#80ff20', stroke: '#000', lw: 4, align: 'center' });
  ctx.fillStyle = 'rgba(15,15,15,0.65)';
  ctx.fillRect(x0 - 3, hb.y - 3, 9 * S + 6, S + 6);
  HOTBAR.forEach((key, i) => {
    const r = hotbarSlotRect(i);
    ctx.fillStyle = 'rgba(139,139,139,0.35)';
    ctx.fillRect(r.x + 2, r.y + 2, S - 4, S - 4);
    ctx.strokeStyle = '#5a5a5a';
    ctx.lineWidth = 2;
    ctx.strokeRect(r.x + 1, r.y + 1, S - 2, S - 2);
    const n = g.inv[key] || 0;
    ctx.save();
    if (!n) ctx.globalAlpha = 0.25;
    drawItemIcon(ctx, key, r.x + S / 2, r.y + S / 2, 32, now);
    ctx.restore();
    if (n > 1) text(ctx, String(n), r.x + S - 3, r.y + S - 3, { font: `11px ${FONT.pixel}`, color: '#fff', align: 'right', shadow: '#3f3f3f', sx: 2, sy: 2 });
    text(ctx, String(i + 1), r.x + 4, r.y + 12, { font: `bold 10px ${FONT.ui}`, color: 'rgba(255,255,255,0.75)' });
    if (g.slotFlash[i] > 0) {
      ctx.fillStyle = `rgba(255,255,255,${g.slotFlash[i]})`;
      ctx.fillRect(r.x + 2, r.y + 2, S - 4, S - 4);
    }
  });
  const sr = hotbarSlotRect(g.sel);
  ctx.lineWidth = 4;
  ctx.strokeStyle = '#000';
  ctx.strokeRect(sr.x - 2, sr.y - 2, S + 4, S + 4);
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#ffffff';
  ctx.strokeRect(sr.x - 2, sr.y - 2, S + 4, S + 4);
  // название предмета под курсором мыши
  for (let i = 0; i < 9; i++) {
    if (inRect(Input.x, Input.y, hotbarSlotRect(i))) {
      const info = ITEM_INFO[HOTBAR[i]];
      const str = `${info.name} — ${info.desc}`;
      ctx.font = `bold 14px ${FONT.ui}`;
      const w = ctx.measureText(str).width + 16;
      const tx = clamp(Input.x - w / 2, 4, W - w - 4);
      rr(ctx, tx, 620, w, 24, 4);
      ctx.fillStyle = 'rgba(16,0,16,0.92)';
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#2b0b5c';
      ctx.stroke();
      text(ctx, str, tx + 8, 637, { font: `bold 14px ${FONT.ui}`, color: '#fff' });
    }
  }
}

    ctx.fill();

  text(ctx, label, x + 5, y + h - 2.5, { font: `bold 9px ${FONT.ui}`, color: '#fff' });

function drawChat(ctx, g) {
  let y = 548;
  ctx.font = `15px ${FONT.ui}`;
  for (let i = g.chat.length - 1; i >= 0; i--) {
    const m = g.chat[i];
    const a = m.t > 6.5 ? Math.max(0, (8 - m.t) / 1.5) : 1;
    ctx.font = `15px ${FONT.ui}`;
    const w = ctx.measureText(m.text).width + 14;
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(8, y - 17, w, 23);
    text(ctx, m.text, 15, y, { font: `15px ${FONT.ui}`, color: m.color, shadow: 'rgba(0,0,0,0.7)', sx: 1, sy: 1 });
    y -= 25;
  }
  ctx.globalAlpha = 1;
}

function drawBanner(ctx, g) {
  const b = g.bannerObj;
  if (!b) return;
  const a = Math.min(1, b.t * 5, (b.dur - b.t) * 3);
  const sc = 1 + Math.max(0, 0.25 - b.t) * 1.6;
  ctx.save();
  ctx.globalAlpha = Math.max(0, a);
  ctx.translate(640, 288);
  ctx.scale(sc, sc);
  text(ctx, b.title, 0, 0, { font: `60px ${FONT.title}`, color: b.color, stroke: '#000', lw: 10, align: 'center' });
  if (b.sub) text(ctx, b.sub, 0, 38, { font: `bold 22px ${FONT.ui}`, color: '#fff', stroke: '#000', lw: 5, align: 'center' });
  ctx.restore();
}

function drawCrosshair(ctx, g) {
  const gun = g.gun;
  const x = Input.x, y = Input.y;
  const gap = 5 + gun.heat * 22, len = 9;
  const segs = [[x - gap - len, y, x - gap, y], [x + gap, y, x + gap + len, y], [x, y - gap - len, x, y - gap], [x, y + gap, x, y + gap + len]];
  for (const s of segs) line(ctx, s[0], s[1], s[2], s[3], 'rgba(0,0,0,0.7)', 4);
  for (const s of segs) line(ctx, s[0], s[1], s[2], s[3], '#39ff14', 2);
  if (gun.reload > 0) {
    const p = 1 - gun.reload / CFG.reloadTime;
    ctx.beginPath();
    ctx.arc(x, y, 24, -Math.PI / 2, -Math.PI / 2 + p * TAU);
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.lineWidth = 3;
    ctx.stroke();
  }
}

function drawPointer(ctx) {
  const x = Input.x, y = Input.y;
  poly(ctx, [x, y, x, y + 20, x + 5, y + 15, x + 9, y + 24, x + 12, y + 22, x + 8, y + 14, x + 15, y + 14], '#fff', '#000', 3);
  poly(ctx, [x, y, x, y + 20, x + 5, y + 15, x + 9, y + 24, x + 12, y + 22, x + 8, y + 14, x + 15, y + 14], '#fff');
}

// ---------- экраны ----------
function mcButton(ctx, g, label, x, y, w, h, action, o = {}) {
  const hov = inRect(Input.x, Input.y, { x, y, w, h });
  ctx.fillStyle = '#000';
  ctx.fillRect(x - 2, y - 2, w + 4, h + 4);
  ctx.fillStyle = hov ? '#8592c9' : o.fill || '#7a7a7a';
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = hov ? '#b9c4f0' : '#a8a8a8';
  ctx.fillRect(x, y, w, 3);
  ctx.fillRect(x, y, 3, h);
  ctx.fillStyle = hov ? '#4f5d99' : '#4a4a4a';
  ctx.fillRect(x, y + h - 4, w, 4);
  ctx.fillRect(x + w - 3, y, 3, h);
  const fs = o.size || 14;
  text(ctx, label, x + w / 2, y + h / 2 + fs * 0.45, { font: `${fs}px ${FONT.pixel}`, color: hov ? '#ffffa0' : '#fff', align: 'center', shadow: '#3f3f3f', sx: 2, sy: 2 });
  g.buttons.push({ x, y, w, h, action });
}

function toggleFullscreen() {
  try {
    const el = document.documentElement;
    if (!document.fullscreenElement) {
      const p = el.requestFullscreen && el.requestFullscreen();
      if (p && p.catch) p.catch(() => {});
    } else if (document.exitFullscreen) {
      document.exitFullscreen();
    }
  } catch (e) {
    /* полноэкранный режим недоступен */
  }
}

function statsLines(g) {
  const p = g.player;
  const mins = Math.floor(g.t / 60), secs = Math.floor(g.t % 60);
  return [
    ['Деньги', `$${p.money}`],
    ['Врагов повержено', String(g.kills)],
    ['Клеток открыто', String(g.tilesOpened)],
    ['Полей сапёра пройдено', String(g.fieldsCleared)],
    ['Уровень', String(p.level)],
    ['Время', `${mins}:${pad(secs, 2)}`],
  ];
}

function drawStats(ctx, g, y) {
  rr(ctx, 440, y, 400, 190, 12);
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fill();
  statsLines(g).forEach(([k, v], i) => {
    text(ctx, k, 464, y + 32 + i * 27, { font: `16px ${FONT.ui}`, color: '#ddd' });
    text(ctx, v, 816, y + 32 + i * 27, { font: `bold 17px ${FONT.ui}`, color: '#fff', align: 'right' });
  });
  if (g.newRecord) text(ctx, 'НОВЫЙ РЕКОРД!', 640, y + 222, { font: `24px ${FONT.title}`, color: '#ffd54a', stroke: '#000', lw: 6, align: 'center' });
}

function drawDead(ctx, g) {
  const k = Math.min(1, g.deadT / 1.2);
  ctx.save();
  ctx.globalCompositeOperation = 'saturation';
  ctx.globalAlpha = k;
  ctx.fillStyle = 'hsl(0,0%,50%)';
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
  ctx.fillStyle = `rgba(0,0,0,${0.35 * k})`;
  ctx.fillRect(0, 0, W, H);
  if (g.deadT > 0.7) {
    const a = Math.min(1, (g.deadT - 0.7) * 3);
    const sc = 1 + Math.max(0, 1 - (g.deadT - 0.7) * 4) * 0.6;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(0, 150, W, 120);
    ctx.translate(640, 245);
    ctx.scale(sc, sc);
    text(ctx, 'WASTED', 0, 0, { font: `112px ${FONT.gta}`, color: '#c62828', stroke: '#000', lw: 8, align: 'center' });
    ctx.restore();
  }
  if (g.deadT > 1.5) {
    text(ctx, `Причина: ${g.deathCause}`, 640, 300, { font: `bold 18px ${FONT.ui}`, color: '#ffcdd2', stroke: '#000', lw: 4, align: 'center' });
    drawStats(ctx, g, 318);
    mcButton(ctx, g, 'ЕЩЁ РАЗ', 640 - 250, 560 + (g.newRecord ? 20 : 0), 240, 46, () => g.start());
    mcButton(ctx, g, 'В МЕНЮ', 640 + 10, 560 + (g.newRecord ? 20 : 0), 240, 46, () => g.toTitle());
  }
}

function drawWin(ctx, g, now) {
  ctx.fillStyle = `rgba(0,0,0,${Math.min(0.55, g.winT * 0.6)})`;
  ctx.fillRect(0, 0, W, H);
  const a = Math.min(1, g.winT * 2);
  ctx.globalAlpha = a;
  text(ctx, 'MISSION PASSED!', 640, 130, { font: `88px ${FONT.gta}`, color: '#f2c230', stroke: '#000', lw: 9, align: 'center' });
  text(ctx, 'RESPECT +', 640, 182, { font: `40px ${FONT.gta}`, color: '#fff', stroke: '#000', lw: 6, align: 'center' });
  for (let i = 0; i < 3; i++) {
    const k = clamp((g.winT - 0.5 - i * 0.35) * 3, 0, 1);
    if (k <= 0) continue;
    const s = 3.2 * (k < 1 ? easeOutCubic(k) * 1.25 : 1) + Math.sin(now * 3 + i) * 0.1;
    drawCrown(ctx, 540 + i * 100, 238, s);
  }
  ctx.globalAlpha = 1;
  if (g.winT > 1.5) {
    text(ctx, 'Башня короля разрушена. +$10000', 640, 300, { font: `bold 18px ${FONT.ui}`, color: '#c8f7a0', stroke: '#000', lw: 4, align: 'center' });
    drawStats(ctx, g, 318);
    mcButton(ctx, g, 'ЕЩЁ РАЗ', 640 - 250, 560 + (g.newRecord ? 20 : 0), 240, 46, () => g.start());
    mcButton(ctx, g, 'В МЕНЮ', 640 + 10, 560 + (g.newRecord ? 20 : 0), 240, 46, () => g.toTitle());
  }
}

function drawJumpscare(ctx, g, now) {
  const k = g.jumpscare.t;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  const sc = 10 + k * 4;
  ctx.save();
  ctx.translate(640 + rand(-18, 18), 380 + 32 * sc + rand(-18, 18));
  drawFreddy(ctx, 0, 0, now, { face: true, scale: sc, scream: true, glow: true });
  ctx.restore();
  if (Math.random() < 0.5) {
    ctx.fillStyle = 'rgba(180,0,0,0.25)';
    ctx.fillRect(0, 0, W, H);
  }
  ctx.globalAlpha = 0.35;
  for (let i = 0; i < 40; i++) {
    const v = Math.floor(rand(80, 255));
    ctx.fillStyle = `rgb(${v},${v},${v})`;
    ctx.fillRect(0, rand(0, H), W, rand(1, 3));
  }
  ctx.globalAlpha = 1;
}

// ---- js/main.js ----
'use strict';
/* Запуск: холст, масштабирование под окно, обработчики ввода, игровой цикл. */

(function boot() {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const game = new Game();
  window.__game = game; // для отладки из консоли

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
    canvas.style.width = Math.floor(W * scale) + 'px';
    canvas.style.height = Math.floor(H * scale) + 'px';
    canvas.width = Math.max(1, Math.round(W * scale * dpr));
    canvas.height = Math.max(1, Math.round(H * scale * dpr));
    View.k = scale * dpr;
    View.pw = canvas.width;
    View.ph = canvas.height;
  }
  window.addEventListener('resize', resize);
  resize();

  function toLogical(clientX, clientY) {
    const r = canvas.getBoundingClientRect();
    return { x: ((clientX - r.left) / r.width) * W, y: ((clientY - r.top) / r.height) * H };
  }

  window.addEventListener('mousemove', (e) => {
    const p = toLogical(e.clientX, e.clientY);
    Input.x = clamp(p.x, 0, W);
    Input.y = clamp(p.y, 0, H);
  });
  canvas.addEventListener('mousedown', (e) => {
    e.preventDefault();
    Sound.init();
    Input.touch = false;
    const p = toLogical(e.clientX, e.clientY);
    Input.x = p.x;
    Input.y = p.y;
    if (e.button === 0) Input.lmb = true;
    if (e.button === 2) Input.rmb = true;
    Input.queue.push({ type: 'down', button: e.button, x: p.x, y: p.y });
  });
  window.addEventListener('mouseup', (e) => {
    if (e.button === 0) Input.lmb = false;
    if (e.button === 2) Input.rmb = false;
    Input.queue.push({ type: 'up', button: e.button });
  });
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  canvas.addEventListener('auxclick', (e) => e.preventDefault());
  canvas.addEventListener(
    'wheel',
    (e) => {
      e.preventDefault();
      if (e.deltaY) Input.queue.push({ type: 'wheel', dy: Math.sign(e.deltaY) });
    },
    { passive: false }
  );
  window.addEventListener('keydown', (e) => {
    if (['Space', 'Tab', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
    Sound.init();
    Input.keys.add(e.code);
    if (!e.repeat) Input.queue.push({ type: 'key', code: e.code });
  });
  window.addEventListener('keyup', (e) => Input.keys.delete(e.code));
  window.addEventListener('blur', () => {
    Input.keys.clear();
    game.onBlur();
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) game.onBlur();
  });

  // Простейшая поддержка касаний: тап = ЛКМ, долгое нажатие = ПКМ (удочка).
  let touchTimer = null;
  canvas.addEventListener(
    'touchstart',
    (e) => {
      e.preventDefault();
      Sound.init();
      Input.touch = true;
      const t = e.changedTouches[0];
      const p = toLogical(t.clientX, t.clientY);
      Input.x = p.x;
      Input.y = p.y;
      if (game.state !== 'play') {
        Input.queue.push({ type: 'down', button: 0, x: p.x, y: p.y });
        return;
      }
      touchTimer = setTimeout(() => {
        touchTimer = null;
        Input.queue.push({ type: 'down', button: 2, x: Input.x, y: Input.y });
      }, 350);
    },
    { passive: false }
  );
  canvas.addEventListener(
    'touchmove',
    (e) => {
      e.preventDefault();
      const t = e.changedTouches[0];
      const p = toLogical(t.clientX, t.clientY);
      Input.x = p.x;
      Input.y = p.y;
    },
    { passive: false }
  );
  canvas.addEventListener('touchend', (e) => {
    e.preventDefault();
    if (touchTimer) {
      clearTimeout(touchTimer);
      touchTimer = null;
      Input.queue.push({ type: 'down', button: 0, x: Input.x, y: Input.y });
      Input.queue.push({ type: 'up', button: 0 });
    }
  });

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now;
    try {
      game.update(dt);
      render(ctx, game);
    } catch (err) {
      console.error(err);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

</script>
